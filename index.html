  <style>
  /* ═══════════════════════════════════════════════════════════════════════
     نظام الجزيرة الميداني — نظام التصميم
     ───────────────────────────────────────────────────────────────────────
     كل لون في هذا الملف مأخوذ من شعار دهانات الجزيرة نفسه:
       • الرمادي الفحمي #3C3C3C   — لون كلمة الشعار، وهو أساس التدرّج الرمادي كله
       • الأحمر  #D91F11          — يعني "الجزيرة" ولا شيء غيرها
       • الأخضر  #2C721F  البرتقالي #B45309  الأزرق #265896 — بتلات الشعار الأربع،
         وهي نفسها الدلالات: نجاح / تحذير / معلومة
     قاعدة واحدة تحكم اللون: إن لم يكن اللون يحمل معنى، فهو رمادي.
     ═══════════════════════════════════════════════════════════════════════ */

  :root{
    color-scheme: light;

    /* ——— الهوية ——— */
    --brand-red:#D91F11;  --brand-red-deep:#B8180C;  --brand-red-bright:#FF3B29;
    --brand-orange:#F97316; --brand-green:#2C721F; --brand-blue:#265896;
    --brand-charcoal:#3C3C3C;

    /* ——— الأسطح ——— */
    --bg:#FAFAF9;          /* أرضية التطبيق */
    --surface:#FFFFFF;     /* البطاقات واللوحات */
    --surface-2:#F5F5F4;   /* الحقول والمساحات الغائرة */
    --surface-3:#EBEBE8;   /* الحالة النشطة والمناطق الأعمق */
    --line:rgba(28,28,26,.10);
    --line-strong:rgba(28,28,26,.19);

    /* ——— النص (كلها تتجاوز WCAG AA) ——— */
    --ink:#1C1C1A;         /* أساسي   ١٧:١ */
    --ink-2:#5B5B55;       /* ثانوي    ٦٫٨:١ */
    --ink-3:#6E6E66;       /* ثالثي    ٥٫١:١ */

    /* ——— اللون الوظيفي الوحيد ——— */
    --accent:#D91F11;
    --accent-hover:#B8180C;
    --accent-soft:#FDECEA;
    --accent-line:rgba(217,31,17,.28);
    --accent-ring:rgba(217,31,17,.22);

    /* ——— الدلالات: بتلات الشعار الأربع ——— */
    --ok:#2C721F;      --ok-soft:rgba(44,114,31,.10);   --ok-line:rgba(44,114,31,.24);
    --warn:#B45309;    --warn-soft:rgba(180,83,9,.10);  --warn-line:rgba(180,83,9,.24);
    --info:#265896;    --info-soft:rgba(38,88,150,.10); --info-line:rgba(38,88,150,.24);
    --danger:#C11B0E;  --danger-soft:rgba(193,27,14,.09);--danger-line:rgba(193,27,14,.26);

    /* ——— الفعل الأساسي: حبر، لا لون ——— */
    --action:#1C1C1A; --action-hover:#000000; --action-ink:#FAFAF9;

    /* ——— الأنصاف: لا شيء فوق ١٦ ——— */
    --r-1:4px; --r-2:6px; --r-3:8px; --r-4:10px; --r-5:12px; --r-6:16px;

    /* ——— الارتفاع: الحد الشعري أولًا، الظل للطبقات العائمة فقط ——— */
    --e-1:0 1px 2px rgba(20,20,18,.04);
    --e-2:0 1px 3px rgba(20,20,18,.06), 0 1px 2px rgba(20,20,18,.04);
    --e-3:0 4px 12px -2px rgba(20,20,18,.07), 0 12px 30px -8px rgba(20,20,18,.10);
    --e-4:0 8px 24px -4px rgba(20,20,18,.09), 0 28px 64px -14px rgba(20,20,18,.20);

    /* ——— السلّم الطباعي ——— */
    --t-chip:11px; --t-2xs:12px; --t-xs:13px; --t-sm:14px; --t-md:15px;
    --t-lg:17px;   --t-xl:20px;
    --t-2xl:clamp(21px,1.1rem + 1.1vw,26px);
    --t-3xl:clamp(25px,1.3rem + 2vw,34px);
    --t-kpi:clamp(24px,1.2rem + 2.2vw,32px);

    /* ——— الإيقاع: أساس ٤ ——— */

  .dark{
    color-scheme: dark;
    --bg:#0B0B0C; --surface:#131315; --surface-2:#1A1A1D; --surface-3:#232328;
    --line:rgba(255,255,255,.085);
    --line-strong:rgba(255,255,255,.17);

    --ink:#F4F4F2; --ink-2:#A3A39B; --ink-3:#8C8C84;

    --accent:#FF5A47; --accent-hover:#FF7A6A;
    --accent-soft:rgba(255,90,71,.13);
    --accent-line:rgba(255,90,71,.32); --accent-ring:rgba(255,90,71,.26);

    --ok:#4FAE38;   --ok-soft:rgba(79,174,56,.14);   --ok-line:rgba(79,174,56,.30);
    --warn:#F59E0B; --warn-soft:rgba(245,158,11,.14);--warn-line:rgba(245,158,11,.30);
    --info:#5F9FD8; --info-soft:rgba(95,159,216,.14);--info-line:rgba(95,159,216,.30);
    --danger:#FF6B57;--danger-soft:rgba(255,107,87,.13);--danger-line:rgba(255,107,87,.30);

    --action:#F4F4F2; --action-hover:#FFFFFF; --action-ink:#131315;

    --e-1:0 1px 2px rgba(0,0,0,.40);
    --e-2:0 1px 3px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.35);
    --e-3:0 4px 14px -2px rgba(0,0,0,.55), 0 14px 34px -10px rgba(0,0,0,.65);
    --e-4:0 10px 28px -6px rgba(0,0,0,.60), 0 32px 70px -16px rgba(0,0,0,.80);
  }

  /* ════════════════ الأساسيات ════════════════ */
  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    font-family:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
    font-size:var(--t-sm);
    font-weight:400;
    line-height:1.75;                 /* العربية تحتاج تنفّسًا رأسيًا أكثر من اللاتينية */
    background:var(--bg); color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
    overflow-wrap:break-word;
  }
  .app-bg{ background:var(--bg); color:var(--ink); }
  ::selection{ background:var(--accent-ring); color:var(--ink); }

  h1,h2,h3,h4,h5{ margin:0; font-weight:600; line-height:1.4; letter-spacing:0; text-wrap:balance; }
  p{ margin:0; text-wrap:pretty; }
  button,input,select,textarea{ font:inherit; color:inherit; }
  button{ background:none; border:0; padding:0; cursor:pointer; }
  a{ color:inherit; }
  img{ max-width:100%; }

  /* الأرقام: عرض ثابت دائمًا، ولاتينية دائمًا — تمنع رقص الأرقام في الجداول والمؤشرات */
  .tnum,.kpi-v,table,.num{
    font-family:'IBM Plex Mono','IBM Plex Sans Arabic',ui-monospace,monospace;
    font-variant-numeric:tabular-nums; font-feature-settings:"tnum";
  }

  /* ════════════════ الطباعة ════════════════ */
  .t-chip{ font-size:var(--t-chip); line-height:1.5; }
  .t-2xs { font-size:var(--t-2xs);  line-height:1.6; }
  .t-xs  { font-size:var(--t-xs);   line-height:1.65; }
  .t-sm  { font-size:var(--t-sm);   line-height:1.7; }
  .t-md  { font-size:var(--t-md);   line-height:1.75; }
  .t-lg  { font-size:var(--t-lg);   line-height:1.5;  font-weight:600; }
  .t-xl  { font-size:var(--t-xl);   line-height:1.4;  font-weight:600; }
  .t-2xl { font-size:var(--t-2xl);  line-height:1.3;  font-weight:600; }
  .t-3xl { font-size:var(--t-3xl);  line-height:1.22; font-weight:600; }

  /* التسمية الفوقية: الوسيلة الوحيدة المسموحة لتمييز عناوين الأقسام الصغيرة */
  .eyebrow{
    font-size:var(--t-chip); font-weight:600; color:var(--ink-3);
    letter-spacing:.06em; text-transform:uppercase;
  }
  .lede{ color:var(--ink-2); font-size:var(--t-xs); line-height:1.7; }

  .txt-muted{ color:var(--ink-2); }
  .txt-dim{ color:var(--ink-3); }
  .txt-accent{ color:var(--accent); }

  /* ════════════════ الشعار ════════════════ */
  .logo-mark{
    background-image:var(--logo-mark);
    background-size:contain; background-repeat:no-repeat; background-position:center;
    flex-shrink:0;
  }
  /* كلمة الشعار قناع، فتتلوّن بلون الحبر وتنقلب تلقائيًا في الوضع الليلي */
  .logo-word{
    background-color:var(--ink);
    -webkit-mask-image:var(--logo-word); mask-image:var(--logo-word);
    -webkit-mask-size:contain; mask-size:contain;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:center; mask-position:center;
    aspect-ratio:460/120;
  }
  .logo-word.on-dark{ background-color:#F4F4F2; }

  /* ════════════════ الأسطح ════════════════ */
  .card{
    container-type:inline-size;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--r-5);
    box-shadow:var(--e-1);
    transition:border-color var(--d-2) var(--ease), box-shadow var(--d-2) var(--ease),
               transform var(--d-2) var(--ease), background var(--d-2) var(--ease);
  }
  .card-flat{ box-shadow:none; }
  .card-raised{ box-shadow:var(--e-3); }
  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-6); }
  .inset{ background:var(--surface-2); border-radius:var(--r-3); }
  .hairline{ border-color:var(--line) !important; }
  .divide-hair>*+*{ border-top:1px solid var(--line); }
  .rule{ height:1px; background:var(--line); border:0; margin:0; }

  /* الشريط العلوي الزجاجي — الاستخدام الوحيد المسموح للضبابية */
  .topbar{
    background:color-mix(in srgb, var(--surface) 82%, transparent);
    backdrop-filter:saturate(150%) blur(16px);
    -webkit-backdrop-filter:saturate(150%) blur(16px);
    border-bottom:1px solid var(--line);
  }
  @supports not (backdrop-filter:blur(1px)){ .topbar{ background:var(--surface); } }

  /* ════════════════ التفاعل ════════════════ */
  .row-hover{ transition:background var(--d-1) var(--ease); }
  .row-hover:hover{ background:var(--surface-2); }
  .lift{ transition:border-color var(--d-2) var(--ease), box-shadow var(--d-2) var(--ease), transform var(--d-2) var(--ease); }
  @media (hover:hover){
    .lift:hover{ transform:translateY(-1px); border-color:var(--line-strong); box-shadow:var(--e-2); }
  }
  .lift:active{ transform:translateY(0); }
  .press{ transition:transform var(--d-1) var(--ease), background var(--d-1) var(--ease),
                     border-color var(--d-1) var(--ease), color var(--d-1) var(--ease),
                     opacity var(--d-1) var(--ease); }
  .press:active{ transform:scale(.985); }

  /* ——— الأزرار ———
     الفعل الأساسي حبر لا أحمر. الأحمر محجوز للهوية وللبيانات.
     الفعل المدمّر شبحي بحدّ أحمر — فلا يلتبس أبدًا بزر أساسي. */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border-radius:var(--r-3); font-weight:500; font-size:var(--t-xs);
    padding:8px 14px; min-height:36px; white-space:nowrap;
    transition:background var(--d-1) var(--ease), color var(--d-1) var(--ease),
               border-color var(--d-1) var(--ease), transform var(--d-1) var(--ease),
               opacity var(--d-1) var(--ease);
    border:1px solid transparent;
  }
  .btn:active{ transform:scale(.985); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }

  .btn-primary{ background:var(--action); color:var(--action-ink); border-color:var(--action); font-weight:600; }
  .btn-primary:hover:not(:disabled){ background:var(--action-hover); border-color:var(--action-hover); }

  .btn-ghost{ background:var(--surface-2); color:var(--ink-2); border-color:transparent; }
  .btn-ghost:hover:not(:disabled){ background:var(--surface-3); color:var(--ink); }

  .btn-outline{ background:transparent; color:var(--ink); border-color:var(--line-strong); }
  .btn-outline:hover:not(:disabled){ background:var(--surface-2); border-color:var(--ink-3); }

  .btn-danger{ background:transparent; color:var(--danger); border-color:var(--danger-line); }
  .btn-danger:hover:not(:disabled){ background:var(--danger-soft); border-color:var(--danger); }

  .btn-sm{ padding:5px 10px; min-height:30px; font-size:var(--t-2xs); border-radius:var(--r-2); }
  .btn-lg{ padding:12px 20px; min-height:46px; font-size:var(--t-sm); border-radius:var(--r-4); }
  .btn-block{ width:100%; }

  /* زر أيقونة */
  .btn-icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:var(--r-3); color:var(--ink-2);
    transition:background var(--d-1) var(--ease), color var(--d-1) var(--ease);
  }
  .btn-icon:hover{ background:var(--surface-2); color:var(--ink); }

  /* ——— الحقول ——— */
  /* لا عرض افتراضي: الحقول داخل النماذج تأخذ w-full صراحةً، وحقول التصفية
     في أشرطة الأدوات يجب أن تتقلّص إلى محتواها بدل أن تملأ السطر */
  .field{
    background:var(--surface-2);
    border:1px solid var(--line); color:var(--ink);
    border-radius:var(--r-3); padding:9px 12px; font-size:var(--t-sm); min-height:38px;
    transition:border-color var(--d-1) var(--ease), box-shadow var(--d-1) var(--ease),
               background var(--d-1) var(--ease);
  }
  .field::placeholder{ color:var(--ink-3); opacity:1; }
  .field:hover:not(:disabled){ border-color:var(--line-strong); }
  .field:focus{
    outline:none; background:var(--surface);
    border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-ring);
  }
  .field:disabled{ opacity:.55; cursor:not-allowed; }
  .field.invalid{ border-color:var(--danger) !important; box-shadow:0 0 0 3px var(--danger-soft) !important; }

  select.field{
    -webkit-appearance:none; -moz-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236E6E66' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat:no-repeat; background-position:left 10px center; background-size:15px;
    padding-left:32px; cursor:pointer;
  }
  .dark select.field{
    background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238C8C84' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  }
  select.field option, select.field optgroup{ background:var(--surface); color:var(--ink); font-weight:400; }

  input.field[type="date"],input.field[type="month"],input.field[type="time"]{ cursor:pointer; }
  input.field::-webkit-calendar-picker-indicator{ opacity:.5; cursor:pointer; transition:opacity var(--d-1); }
  input.field::-webkit-calendar-picker-indicator:hover{ opacity:1; }
  .dark input.field::-webkit-calendar-picker-indicator{ filter:invert(1) brightness(1.3); opacity:.55; }
  input.field[type="number"]{ -moz-appearance:textfield; }
  input.field[type="number"]::-webkit-outer-spin-button,
  input.field[type="number"]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  textarea.field{ resize:vertical; min-height:80px; line-height:1.75; width:100%; }

  .field-wrap{ position:relative; display:block; }
  .field-wrap .field-ico{
    position:absolute; inset-inline-start:auto; right:11px; top:50%; transform:translateY(-50%);
    color:var(--ink-3); pointer-events:none; display:flex;
  }
  .field-wrap .has-ico{ padding-right:34px; }

  .form-label{ display:block; font-size:var(--t-2xs); font-weight:500; color:var(--ink-2); margin-bottom:6px; }
  .req::after{ content:" *"; color:var(--danger); font-weight:600; }
  .form-hint{ display:block; font-size:var(--t-chip); color:var(--ink-3); margin-top:5px; line-height:1.6; }
  .form-err{ display:flex; align-items:center; gap:5px; font-size:var(--t-chip); color:var(--danger); font-weight:500; margin-top:5px; }
  .form-section{
    display:flex; align-items:center; gap:10px; margin:var(--sp-2) 0 var(--sp-3);
    font-size:var(--t-chip); font-weight:600; color:var(--ink-3); letter-spacing:.05em;
  }
  .form-section::after{ content:""; flex:1; height:1px; background:var(--line); }

  /* ════════════════ الشرائح والوسوم ════════════════ */
  .chip{
    display:inline-flex; align-items:center; gap:5px;
    border-radius:var(--r-2); font-size:var(--t-chip); font-weight:500;
    padding:2px 8px; white-space:nowrap; line-height:1.6;
    border:1px solid transparent;
  }
  .chip-dot::before{
    content:""; width:5px; height:5px; border-radius:99px;
    background:currentColor; flex-shrink:0;
  }

  kbd.key{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:10px; font-weight:500; line-height:1;
    background:var(--surface-2); border:1px solid var(--line);
    border-radius:var(--r-1); padding:3px 5px; color:var(--ink-3);
    display:inline-flex; align-items:center; min-width:18px; justify-content:center;
  }

  mark.hl{ background:var(--accent-soft); color:var(--accent); border-radius:2px; padding:0 2px; font-weight:600; }

  /* ════════════════ التنقّل ════════════════ */
  .nav-item{
    position:relative; display:flex; align-items:center; gap:10px;
    width:100%; padding:8px 10px; border-radius:var(--r-3);
    font-size:var(--t-xs); font-weight:450; color:var(--ink-2); text-align:right;
    transition:background var(--d-1) var(--ease), color var(--d-1) var(--ease);
  }
  .nav-item:hover{ background:var(--surface-2); color:var(--ink); }
  .nav-item[aria-current="page"]{ background:var(--surface-2); color:var(--ink); font-weight:600; }
  /* السكّة الحمراء: اللحظة الوحيدة التي يظهر فيها لون العلامة في التنقّل */
  .nav-item[aria-current="page"]::before{
    content:""; position:absolute; right:-6px; top:50%; transform:translateY(-50%);
    width:2px; height:15px; border-radius:99px; background:var(--accent);
  }

  /* ════════════════ الوصولية ════════════════ */
  :focus{ outline:none; }
  :focus-visible{
    outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r-2);
  }
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  .skip-link{
    position:absolute; top:8px; right:8px; z-index:200;
    transform:translateY(-200%);
    background:var(--action); color:var(--action-ink);
    padding:10px 16px; border-radius:var(--r-3); font-size:var(--t-xs); font-weight:600;
    transition:transform var(--d-2) var(--ease-out);
  }
  .skip-link:focus{ transform:translateY(0); }
  /* هدف لمس ٤٤ بكسل على الأجهزة اللمسية — التطبيق يُستخدم في الميدان */
  @media (pointer:coarse){ .tap{ min-height:44px; min-width:44px; } }
  /* يمنع تمرير الخلفية خلف النوافذ المفتوحة */
  body.scroll-locked{ overflow:hidden; }

  /* ════════════════ النوافذ ════════════════ */
  .overlay{
    position:fixed; inset:0; z-index:60;
    background:color-mix(in srgb, #0B0B0C 55%, transparent);
    backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
    animation:fadeIn var(--d-2) var(--ease-out) both;
  }
  /* ورقة ملء الشاشة على الجوال، عمود مركزي على الشاشات الكبيرة */
  .sheet-shell{
    position:fixed; inset:0; z-index:60; display:flex;
    align-items:stretch; justify-content:center;
    background:color-mix(in srgb, #0B0B0C 45%, transparent);
    backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
  }
  .sheet-body{
    width:100%; max-width:760px; height:100%;
    background:var(--surface); overflow-y:auto; overscroll-behavior:contain;
    padding:var(--sp-4);
    animation:sheetIn var(--d-3) var(--ease-out) both;
  }
  @media (min-width:820px){
    .sheet-shell{ align-items:center; padding:var(--sp-6); }
    .sheet-body{
      height:auto; max-height:min(88vh,900px);
      border:1px solid var(--line); border-radius:var(--r-6); box-shadow:var(--e-4);
      padding:var(--sp-5);
    }
  }
  .sheet-head{
    position:sticky; top:0; z-index:6; background:var(--surface);
    margin:calc(var(--sp-4) * -1) calc(var(--sp-4) * -1) var(--sp-4);
    padding:var(--sp-3) var(--sp-4);
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3);
  }
  .sheet-foot{
    position:sticky; bottom:0; z-index:6; background:var(--surface);
    margin:var(--sp-5) calc(var(--sp-4) * -1) calc(var(--sp-4) * -1);
    padding:var(--sp-3) var(--sp-4) calc(var(--sp-3) + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    display:flex; gap:var(--sp-2);
  }
  @media (min-width:820px){
    .sheet-head{ margin:calc(var(--sp-5) * -1) calc(var(--sp-5) * -1) var(--sp-4); padding:var(--sp-3) var(--sp-5); }
    .sheet-foot{ margin:var(--sp-5) calc(var(--sp-5) * -1) calc(var(--sp-5) * -1); padding:var(--sp-3) var(--sp-5); }
  }

  /* ════════════════ الحركة ════════════════ */
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px) } to{ opacity:1; transform:none } }
  @keyframes sheetIn{ from{ opacity:0; transform:translateY(10px) } to{ opacity:1; transform:none } }
  @keyframes popIn{ from{ opacity:0; transform:translateY(-4px) scale(.98) } to{ opacity:1; transform:none } }
  @keyframes shimmer{ 0%{ background-position:100% 0 } 100%{ background-position:-100% 0 } }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  @keyframes pulseDot{ 0%,100%{ opacity:1 } 50%{ opacity:.35 } }
  @keyframes barGrow{ from{ transform:scaleX(0) } to{ transform:scaleX(1) } }
  @keyframes drawIn{ to{ stroke-dashoffset:0 } }

  .fade-in{ animation:fadeIn var(--d-2) var(--ease-out) both; }
  .rise{ animation:rise var(--d-3) var(--ease-out) both; }
  .pop{ animation:popIn var(--d-2) var(--ease-out) both; }
  .sheet{ animation:sheetIn var(--d-3) var(--ease-out) both; }
  .spin{ animation:spin 800ms linear infinite; }
  .live-dot{ animation:pulseDot 2s var(--ease) infinite; }

  /* ظهور متتالٍ — يعطي إحساس بناء الشاشة، ويتوقف بعد العنصر الثامن حتى لا يبطئ القوائم الطويلة */
  .stagger>*{ animation:rise 380ms var(--ease-out) both; }
  .stagger>*:nth-child(1){animation-delay:0ms}    .stagger>*:nth-child(2){animation-delay:30ms}
  .stagger>*:nth-child(3){animation-delay:60ms}   .stagger>*:nth-child(4){animation-delay:90ms}
  .stagger>*:nth-child(5){animation-delay:120ms}  .stagger>*:nth-child(6){animation-delay:150ms}
  .stagger>*:nth-child(7){animation-delay:180ms}  .stagger>*:nth-child(n+8){animation-delay:200ms}

  .sk{
    background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 45%,var(--surface-2) 65%);
    background-size:220% 100%; animation:shimmer 1.4s var(--ease) infinite;
    border-radius:var(--r-2);
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important; animation-iteration-count:1 !important;
      transition-duration:.01ms !important; scroll-behavior:auto !important;
    }
    .lift:hover{ transform:none; }
  }

  /* ════════════════ أشرطة التمرير ════════════════ */
  ::-webkit-scrollbar{ width:10px; height:10px }
  ::-webkit-scrollbar-track{ background:transparent }
  ::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:99px; border:3px solid transparent; background-clip:content-box }
  ::-webkit-scrollbar-thumb:hover{ background:var(--ink-3); background-clip:content-box }
  .no-scrollbar::-webkit-scrollbar{ display:none } .no-scrollbar{ scrollbar-width:none }

  /* شريط أفقي بحوافّ متلاشية — يوضّح أن هناك المزيد للتمرير دون إضافة أزرار */
  .rail{
    display:flex; gap:6px; overflow-x:auto; padding-bottom:4px;
    scrollbar-width:none; scroll-snap-type:x proximity;
    -webkit-mask-image:linear-gradient(to left,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);
            mask-image:linear-gradient(to left,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);
  }
  .rail::-webkit-scrollbar{ display:none }
  .rail>*{ scroll-snap-align:start; flex-shrink:0; }

  /* الشريط السفلي */
  .bottom-nav{ padding-bottom:env(safe-area-inset-bottom); }

  /* ════════════════ لوحة الإشعارات على الجوال ════════════════
     على الشاشات الصغيرة تُثبَّت اللوحة على عرض الشاشة كاملًا بدل تعليقها
     أسفل الزر، فلا يخرج نصفها خارج حدود الشاشة. */
  .notif-pop{ max-height:calc(100vh - 90px); display:flex; flex-direction:column; }
  .notif-list{ overflow-y:auto; -webkit-overflow-scrolling:touch; }
  @media (max-width: 767px){
    .notif-pop{
      position:fixed !important;
      top:63px !important;
      left:10px !important;
      right:10px !important;
      width:auto !important;
      max-width:none !important;
      margin:0 !important;
      max-height:calc(100vh - 150px) !important;
      max-height:calc(100dvh - 150px) !important;
    }
    .notif-list{ max-height:none !important; flex:1 1 auto; }
  }

  /* ════════════════ الجداول ════════════════ */
  .table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table.data{ width:100%; border-collapse:collapse; font-size:var(--t-2xs); }
  table.data th{
    text-align:right; font-weight:600; color:var(--ink-3); font-size:var(--t-chip);
    padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;
    position:sticky; top:0; background:var(--surface); z-index:1;
  }
  table.data td{ padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.data tr:last-child td{ border-bottom:0; }
  table.data tbody tr{ transition:background var(--d-1) var(--ease); }
  table.data tbody tr:hover{ background:var(--surface-2); }

  /* ════════════════ شاشة الإقلاع ════════════════ */
  /* بابل يصرف نحو نصف ثانية في ترجمة الشيفرة قبل أول رسم — هذه تملأ الفراغ بدل الوميض الأبيض */
  #boot{
    position:fixed; inset:0; z-index:999; display:flex;
    flex-direction:column; align-items:center; justify-content:center; gap:18px;
    background:var(--bg);
    transition:opacity 360ms var(--ease-out), visibility 360ms;
  }
  #boot.done{ opacity:0; visibility:hidden; pointer-events:none; }
  #boot .b-mark{ width:52px; height:52px; animation:pulseDot 1.6s var(--ease) infinite; }
  #boot .b-word{ width:150px; opacity:.85; }
  #boot .b-bar{ width:120px; height:2px; border-radius:99px; background:var(--surface-3); overflow:hidden; }
  #boot .b-bar i{ display:block; width:40%; height:100%; border-radius:99px; background:var(--accent);
    animation:bootSlide 1.1s var(--ease) infinite; }
  @keyframes bootSlide{ 0%{ transform:translateX(150%) } 100%{ transform:translateX(-320%) } }

  /* المؤشّر يتكيّف مع عرض حاويته هو، لا مع عرض الشاشة:
     نفس البطاقة تظهر في شبكة رباعية وفي شبكة ثنائية، والسطر السفلي كان يتزاحم. */
  .kpi-foot{ display:flex; align-items:flex-end; justify-content:space-between; gap:8px; min-height:18px; }
  @container (max-width: 210px){
    .kpi-foot{ flex-direction:column; align-items:flex-start; gap:4px; }
    .kpi-foot .kpi-spark{ display:none; }
  }

  /* ════════════════ حارس أدوات العرض ════════════════
     أدوات Tailwind للعرض (hidden / lg:hidden / sm:flex) لها نفس وزن الأولوية
     الذي لكلاسات المكوّنات في هذا الملف، وهذا الملف يأتي بعدها في الترتيب —
     فكان `.btn` و`.btn-icon` بـ display:inline-flex يهزمان `hidden`،
     وتظهر عناصر الجوال على الشاشات الكبيرة. نعيد تأكيدها هنا بعد المكوّنات. */
  .hidden{ display:none; }
  @media (min-width:640px){
    .sm\:hidden{display:none} .sm\:flex{display:flex} .sm\:inline-flex{display:inline-flex}
    .sm\:block{display:block} .sm\:grid{display:grid} .sm\:inline{display:inline}
    .sm\:inline-block{display:inline-block}
  }
  @media (min-width:768px){
    .md\:hidden{display:none} .md\:flex{display:flex} .md\:block{display:block}
    .md\:inline{display:inline} .md\:grid{display:grid}
  }
  @media (min-width:1024px){
    .lg\:hidden{display:none} .lg\:flex{display:flex} .lg\:block{display:block} .lg\:grid{display:grid}
    .lg\:inline{display:inline} .lg\:inline-flex{display:inline-flex}
  }
  @media (min-width:1280px){
    .xl\:hidden{display:none} .xl\:flex{display:flex} .xl\:block{display:block} .xl\:grid{display:grid}
  }

  /* ════════════════ الطباعة الورقية ════════════════ */
  @media print{
    .no-print{ display:none !important; }
    body{ background:#fff; color:#000; }
    .card,.panel{ border-color:#ddd; box-shadow:none; break-inside:avoid; }
  }
  </style>

    /* ===== نظام الجلسة وتسجيل الدخول ===== */
    const SESSION_KEY = "jazeera_session";
    let SESSION = (()=>{ try{ return JSON.parse(localStorage.getItem(SESSION_KEY)||"null"); }catch(e){ return null; } })();
    function setSession(s){ SESSION = s; try{ s ? localStorage.setItem(SESSION_KEY, JSON.stringify(s)) : localStorage.removeItem(SESSION_KEY); }catch(e){} }

    /* ===================================================================
       طبقة العمل بدون إنترنت (Offline Layer)
       - كل عمليات القراءة تُخزَّن في كاش محلي وتُقرأ منه عند انقطاع الشبكة
       - كل عمليات الكتابة تُحفظ في طابور محلي (Outbox) وتُرسل تلقائيًا عند رجوع الشبكة
       ملاحظة: كل الاستدعاءات في التطبيق تستخدم db.from(...) فما احتجنا نغيّر أي مكان
       =================================================================== */
    const CACHE_PREFIX = "jz_cache:";
    const OUTBOX_KEY   = "jz_outbox";
    const FAILED_KEY   = "jz_outbox_failed";
    const WRITE_OPS    = ["insert","update","upsert","delete"];
    const MAX_CACHE_BYTES = 400000;

    const SyncState = {
      online: (typeof navigator!=="undefined" && navigator.onLine!==false),
      pending: 0,
      failed: 0,
      syncing: false,
      lastSync: null,
      listeners: new Set(),
      subscribe(fn){ this.listeners.add(fn); return ()=>this.listeners.delete(fn); },
      emit(){ this.listeners.forEach(fn=>{ try{ fn(); }catch(e){} }); }
    };

    function lsGet(k, dflt){ try{ const s=localStorage.getItem(k); return s?JSON.parse(s):dflt; }catch(e){ return dflt; } }
    function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }

    function readOutbox(){ const a=lsGet(OUTBOX_KEY,[]); return Array.isArray(a)?a:[]; }
    function readFailed(){ const a=lsGet(FAILED_KEY,[]); return Array.isArray(a)?a:[]; }
    function writeOutbox(arr){ lsSet(OUTBOX_KEY,arr); SyncState.pending=arr.length; SyncState.emit(); }
    function writeFailed(arr){ lsSet(FAILED_KEY,arr); SyncState.failed=arr.length; SyncState.emit(); }

    function setOnline(v){ if(SyncState.online!==v){ SyncState.online=v; SyncState.emit(); } }

    function isNetErr(e){
      if(typeof navigator!=="undefined" && navigator.onLine===false) return true;
      const m = String((e && (e.message||e.details||e.hint)) || e || "").toLowerCase();
      return m.includes("failed to fetch") || m.includes("networkerror") || m.includes("load failed")
          || m.includes("network request failed") || m.includes("fetch failed") || m.includes("err_internet")
          || m.includes("timeout") || m.includes("aborted") || m.includes("offline");
    }

    /* ---- كاش القراءة ---- */
    function cacheKey(ctx){ return ctx.table + "|" + JSON.stringify(ctx.chain); }
    function cacheGet(key){ return lsGet(CACHE_PREFIX+key, null); }
    function cacheSet(key, data){
      try{
        const body = JSON.stringify({ t: Date.now(), d: data });
        if(body.length > MAX_CACHE_BYTES) return;
        localStorage.setItem(CACHE_PREFIX+key, body);
      }catch(e){ pruneCache(); }
    }
    function pruneCache(){
      try{
        const keys = Object.keys(localStorage).filter(k=>k.indexOf(CACHE_PREFIX)===0);
        keys.map(k=>({k, t:(lsGet(k,{t:0})||{t:0}).t||0}))
            .sort((a,b)=>a.t-b.t).slice(0, Math.ceil(keys.length/2))
            .forEach(x=>{ try{ localStorage.removeItem(x.k); }catch(e){} });
      }catch(e){}
    }
    function clearSyncCache(){
      try{ Object.keys(localStorage).filter(k=>k.indexOf(CACHE_PREFIX)===0).forEach(k=>localStorage.removeItem(k)); }catch(e){}
    }

    /* ---- طابور الكتابة ---- */
    function queueOp(ctx){
      const box = readOutbox();
      box.push({
        id: "op_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
        table: ctx.table, op: ctx.op, payload: ctx.payload, opts: ctx.opts || null,
        chain: (ctx.chain||[]).filter(c=>c[0]!=="select"),
        ts: new Date().toISOString(), user: currentUserName()
      });
      writeOutbox(box);
    }

    /* الصفوف المحفوظة محليًا وما اتزامنت بعد — تُدمج مع الكاش حتى ما تختفي من الشاشة */
    function pendingRowsFor(table){
      const out = [];
      readOutbox().forEach((o,oi)=>{
        if(o.table!==table || o.op!=="insert") return;
        const rows = Array.isArray(o.payload) ? o.payload : [o.payload];
        rows.forEach((r,ri)=>{ if(r && typeof r==="object") out.push({ ...r, id: r.id!=null ? r.id : ("pending_"+oi+"_"+ri), _pending:true }); });
      });
      return out;
    }

    async function runQuery(raw, ctx){
      /* ===== كتابة ===== */
      if(ctx.op){
        if(!SyncState.online){ queueOp(ctx); return { data:null, error:null, queued:true }; }
        try{
          const res = await raw;
          if(res && res.error && isNetErr(res.error)){ setOnline(false); queueOp(ctx); return { data:null, error:null, queued:true }; }
          if(res && !res.error) setOnline(true);
          return res;
        }catch(e){
          if(isNetErr(e)){ setOnline(false); queueOp(ctx); return { data:null, error:null, queued:true }; }
          return { data:null, error:{ message:String((e&&e.message)||e) } };
        }
      }
      /* ===== قراءة ===== */
      const key = cacheKey(ctx);
      const fallback = ()=>{
        const c = cacheGet(key);
        if(!c) return null;
        const base = Array.isArray(c.d) ? c.d.slice() : c.d;
        const merged = Array.isArray(base) ? base.concat(pendingRowsFor(ctx.table)) : base;
        return { data: merged, error: null, fromCache: true, cachedAt: c.t };
      };
      try{
        const res = await raw;
        if(res && res.error){
          if(isNetErr(res.error)){ setOnline(false); const f=fallback(); if(f) return f; }
          return res;
        }
        setOnline(true);
        if(res) cacheSet(key, res.data);
        return res;
      }catch(e){
        if(isNetErr(e)){ setOnline(false); const f=fallback(); if(f) return f; }
        return { data:null, error:{ message:String((e&&e.message)||e) } };
      }
    }

    /* غلاف شفاف حول باني استعلامات Supabase: يسجّل السلسلة ثم يتصرّف عند التنفيذ */
    function wrapBuilder(raw, ctx){
      let promise = null;
      return new Proxy(raw, {
        get(target, prop){
          if((prop==="then"||prop==="catch"||prop==="finally") && typeof target.then==="function"){
            if(!promise) promise = runQuery(target, ctx);
            return promise[prop].bind(promise);
          }
          const v = target[prop];
          if(typeof v === "function"){
            return function(...args){
              if(WRITE_OPS.indexOf(prop)>=0){ ctx.op = prop; ctx.payload = args[0]; ctx.opts = args[1] || null; }
              else { try{ JSON.stringify(args); ctx.chain.push([prop, args]); }catch(e){} }
              const out = v.apply(target, args);
              return (out && typeof out==="object" && typeof out.then==="function") ? wrapBuilder(out, ctx) : out;
            };
          }
          return v;
        }
      });
    }

    /* كائن db المستخدم في كل التطبيق */
    const db = {
      from(table){ return wrapBuilder(_rawDb.from(table), { table, chain:[], op:null, payload:null, opts:null }); },
      rpc(...a){ return _rawDb.rpc(...a); },
      get storage(){ return _rawDb.storage; },
      get auth(){ return _rawDb.auth; },
      raw: _rawDb
    };

    /* ---- إعادة إرسال الطابور ---- */
    async function flushOutbox(){
      if(SyncState.syncing) return 0;
      let box = readOutbox();
      if(!box.length) return 0;
      if(typeof navigator!=="undefined" && navigator.onLine===false) return 0;

      SyncState.syncing = true; SyncState.emit();
      let sent = 0;
      const failed = readFailed();
      try{
        while(box.length){
          const item = box[0];
          let res = null, threw = null;
          try{
            let q = _rawDb.from(item.table)[item.op](item.payload, item.opts || undefined);
            (item.chain||[]).forEach(([m,a])=>{ if(q && typeof q[m]==="function") q = q[m].apply(q, a); });
            res = await q;
          }catch(e){ threw = e; }

          if(threw){
            if(isNetErr(threw)){ setOnline(false); break; }        // الشبكة رجعت تقطع → نوقف ونحفظ الباقي
            failed.push({ ...item, error:String(threw.message||threw) }); box.shift();
          }else if(res && res.error){
            if(isNetErr(res.error)){ setOnline(false); break; }
            failed.push({ ...item, error:String(res.error.message||"خطأ من قاعدة البيانات") }); box.shift();
          }else{
            box.shift(); sent++;
          }
          writeOutbox(box);
        }
      } finally {
        writeOutbox(box);
        writeFailed(failed);
        if(sent){ SyncState.lastSync = new Date().toISOString(); clearSyncCache(); }
        SyncState.syncing = false; SyncState.emit();
      }
      return sent;
    }

    async function retryFailed(){
      const failed = readFailed();
      if(!failed.length) return;
      const box = readOutbox().concat(failed.map(f=>{ const c={...f}; delete c.error; return c; }));
      writeFailed([]); writeOutbox(box);
      return flushOutbox();
    }
    function dropFailed(){ writeFailed([]); }

    /* ---- مراقبة الشبكة ---- */
    SyncState.pending = readOutbox().length;
    SyncState.failed  = readFailed().length;
    if(typeof window !== "undefined"){
      window.addEventListener("online",  ()=>{ setOnline(true);  flushOutbox(); });
      window.addEventListener("offline", ()=>{ setOnline(false); });
    }

    function cardTags(table, r){

    const NOTIF_KEY="jazeera_notif_enabled", NOTIF_SENT_KEY="jazeera_notif_sent";
    function notifEnabled(){ return localStorage.getItem(NOTIF_KEY)==="1" && ("Notification" in window) && Notification.permission==="granted"; }
    async function enableNotifications(){
      if(!("Notification" in window)){ toast("متصفّحك لا يدعم الإشعارات — أضِف التطبيق إلى الشاشة الرئيسية للحصول على التنبيهات","warn"); return false; }

      let sent={}; try{ sent=JSON.parse(localStorage.getItem(NOTIF_SENT_KEY)||"{}"); }catch(e){}

    /* ═══════════ ملء الشاشة على الجوال ═══════════
       عند فتح الملف من كروم يبقى شريط المتصفّح ظاهرًا. واجهة Fullscreen تخفيه
       تمامًا فيظهر النظام كتطبيق. التفضيل يُحفظ ويُعاد تطبيقه عند أول لمسة
       بعد فتح الصفحة (المتصفّح لا يسمح بملء الشاشة إلا بعد تفاعل المستخدم). */
    const FS_KEY="jazeera_fullscreen";
    function fsSupported(){
      const d=document.documentElement;
      return !!(d.requestFullscreen||d.webkitRequestFullscreen||d.webkitRequestFullScreen);
    }
    function isFullscreen(){
      return !!(document.fullscreenElement||document.webkitFullscreenElement||window.matchMedia("(display-mode: fullscreen)").matches);
    }
    async function enterFullscreen(silent){
      const d=document.documentElement;
      const req=d.requestFullscreen||d.webkitRequestFullscreen||d.webkitRequestFullScreen;
      if(!req){ if(!silent) toast("متصفّحك لا يدعم ملء الشاشة","warn"); return false; }
      try{
        await req.call(d,{navigationUI:"hide"});
        try{ localStorage.setItem(FS_KEY,"1"); }catch(e){}
        try{ screen.orientation && screen.orientation.lock && screen.orientation.lock("portrait").catch(()=>{}); }catch(e){}
        return true;
      }catch(e){ if(!silent) toast("تعذّر تفعيل ملء الشاشة","warn"); return false; }
    }
    function leaveFullscreen(){
      const ex=document.exitFullscreen||document.webkitExitFullscreen||document.webkitCancelFullScreen;
      try{ ex && ex.call(document); }catch(e){}
      try{ localStorage.setItem(FS_KEY,"0"); }catch(e){}
    }
    /* إعادة الدخول التلقائي لملء الشاشة عند أول لمسة بعد فتح التطبيق */
    (function armFullscreen(){
      let want=false; try{ want=localStorage.getItem(FS_KEY)==="1"; }catch(e){}
      if(!want) return;
      const once=()=>{
        document.removeEventListener("pointerdown",once,true);
        document.removeEventListener("touchstart",once,true);
        if(!isFullscreen()) enterFullscreen(true);
      };
      document.addEventListener("pointerdown",once,true);
      document.addEventListener("touchstart",once,true);
    })();

    /* بيان التطبيق كـ blob بدل data: — كروم يتجاهل بيانات data: فلا يفتح
       الاختصار بوضع standalone. blob من نفس الأصل يُقبل عند تشغيل الملف من خادم. */
    (function upgradeManifest(){
      try{
        if(location.protocol==="file:") return;   // لا فائدة من البيان مع ملف محلي
        const mf={ name:"نظام الجزيرة الميداني", short_name:"الجزيرة", display:"fullscreen",
          display_override:["fullscreen","standalone"], orientation:"portrait",
          background_color:"#0B0B0C", theme_color:"#0B0B0C", scope:"./", start_url:"./" };
        const url=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:"application/manifest+json"}));
        const link=document.querySelector('link[rel="manifest"]')||document.createElement("link");
        link.rel="manifest"; link.href=url;
        if(!link.parentNode) document.head.appendChild(link);
      }catch(e){}
    })();

    const daysAgo = s=>s?Math.round((Date.now()-new Date(s).getTime())/86400000):9999;
    const mapsUrl = (lat,lng)=>`https://www.google.com/maps?q=${lat},${lng}`;
    const toArr = v=>Array.isArray(v)?v:(v?(()=>{try{const x=JSON.parse(v);return Array.isArray(x)?x:[];}catch(e){return [];}})():[]);

    /* ===== واتساب: تطبيع رقم الجوال وبناء روابط المحادثة (عادي / بزنس) ===== */
    function normalizePhone(phone){
      let d=String(phone||"").replace(/[^\d]/g,"");
      if(!d) return "";
      if(d.startsWith("00")) d=d.slice(2);
      if(d.startsWith("0")) d="966"+d.slice(1);
      else if(!d.startsWith("966") && d.length===9) d="966"+d;
      return d;
    }
    const isAndroid = ()=>/Android/i.test(navigator.userAgent||"");
    /* ملاحظة مهمة: نسخ "المضاعف/Dual Messenger" في سامسونج بتستخدم نفس اسم حزمة واتساب الأصلي (com.whatsapp)
       فمفيش طريقة نفتح بيها نسخة بعينها منها برابط. الحل العملي: نسيب رابط "واتساب عادي" عام بدون
       تحديد حزمة، عشان نظام أندرويد نفسه يعرض قائمة اختيار كل نسخ واتساب المثبتة (الأصلية + المضاعفة)
       بشرط إن مفيش تطبيق افتراضي متحدد لفتح روابط واتساب (نوضّح ده للمستخدم في القائمة).
       "واتساب بزنس" بس هو اللي له حزمة مستقلة فعلاً (com.whatsapp.w4b) فبنستهدفها مباشرة وبثقة. */
    function waLinks(phone, text){
      const n=normalizePhone(phone);
      if(!n) return null;
      const t=text?("&text="+encodeURIComponent(text)):"";
      const web=`https://wa.me/${n}`+(text?("?text="+encodeURIComponent(text)):"");
      if(isAndroid()){
        return {
          regular: web, // بدون تحديد حزمة، حتى يظهر اختيار أندرويد بين كل نسخ واتساب المثبتة
          business:`intent://send?phone=${n}${t}#Intent;scheme=smsto;package=com.whatsapp.w4b;end`,
        };
      }
      return { regular:web, business:web };
    }
    function waLink(phone, text){ const l=waLinks(phone,text); return l?l.regular:null; }

    /* زر واتساب بخيار تحديد أي تطبيق (عادي / بزنس) عند الضغط
       className: كلاسات إضافية تُدمج مع شكل الزر (نفس شكل باقي العلامات المجاورة له بالظبط)
       btnClassName: تصميم مخصّص كامل للزر (اختياري، وإلا يُستخدم شكل افتراضي حسب iconOnly) */
    function WhatsAppButton({ phone, className, btnClassName, size=14, label, iconOnly }) {
      const [open,setOpen]=useState(false);
      const ref=useRef(null);
      useEffect(()=>{ if(!open) return; const h=e=>{ if(ref.current&&!ref.current.contains(e.target)) setOpen(false); }; document.addEventListener("mousedown",h); return ()=>document.removeEventListener("mousedown",h); },[open]);
      if(!phone) return null;
      const links=waLinks(phone);
      const defaultBtn = iconOnly
        ? "w-8 h-8 rounded-[7px] flex items-center justify-center transition-colors"
        : "btn btn-outline btn-sm";
      return (
        <span ref={ref} role="button" tabIndex={0} onClick={e=>{e.stopPropagation();setOpen(o=>!o);}} onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();e.stopPropagation();setOpen(o=>!o);}}}
          aria-label={label||"فتح واتساب"} aria-haspopup="menu" aria-expanded={open}
          className={"relative cursor-pointer select-none align-middle "+(btnClassName||defaultBtn)+" "+(className||"")}
          style={iconOnly&&!btnClassName?{color:"var(--ok)",background:"var(--ok-soft)"}:undefined}>
          <Icon n="whatsapp" s={size}/>{!iconOnly&&(label||"واتساب")}
          {open&&(
            <div dir="rtl" onClick={e=>e.stopPropagation()} className="card card-raised absolute z-40 mt-1.5 top-full right-0 w-64 overflow-hidden text-right pop">
              <a href={links.regular} target="_blank" onClick={()=>setOpen(false)} className={"flex items-center gap-2 px-3 py-2.5 t-2xs font-bold txt-muted  "+cHover}><Icon n="whatsapp" s={14} c="text-[color:var(--ok)]"/> واتساب (سيسألك اختَر أي نسخة)</a>
              <a href={links.business} target="_blank" onClick={()=>setOpen(false)} className={"flex items-center gap-2 px-3 py-2.5 t-2xs font-bold border-t txt-muted  "+cBorder+" "+cHover}><Icon n="whatsapp" s={14} c="text-[color:var(--ok)]"/> واتساب بزنس</a>
              <div className="px-3.5 py-2.5 t-chip leading-relaxed txt-dim" style={{borderTop:"1px solid var(--line)"}}>لو الخيار الأول بيفتح نسخة واحدة على طول بدون ما يسألك: امسح التطبيق الافتراضي من إعدادات الأندرويد (إعدادات ← التطبيقات ← واتساب ← فتح افتراضيًا ← مسح الإعدادات الافتراضية)، وبعدها هيسألك تختار أي نسخة (المصري/السعودي Dual) في كل مرة.</div>
            </div>
          )}
        </span>
      );
    }

    /* تزامن الزيارة مع الدهان/المقاول/المشروع وضخ المنتجات المرصودة في المكان الصحيح */
    /* تزامن الزيارة الرئيسية مع كل الدهانين والمواقع المرتبطين بها (زيارة واحدة قد تشمل أكثر من دهان وأكثر من موقع) */
    async function syncVisit(visit, mode){
      try{
        const today=TODAY(); const findings=parseFindings(visit.products);
        const safeInsert=async(tbl,row)=>{ let body={...row}; for(let i=0;i<6;i++){ const r=await db.from(tbl).insert([body]); if(!r.error) return; const m=(r.error.message||"")+" "+(r.error.details||""); const col=(m.match(/'([a-z_]+)' column/i)||m.match(/column "?([a-z_]+)"? of/i)||m.match(/column ([a-z_]+)/i)||[])[1]; if(col&&col in body){delete body[col];continue;} return; } };
        const upd=async (tbl,name,patch)=>{ if(!name) return null; const {data}=await db.from(tbl).select("id,products").ilike("name",name).limit(1);
          if(data&&data[0]){ const id=data[0].id; let p={...patch}; if(patch.__mergeProducts){ delete p.__mergeProducts; p.products=encodeFindings(mergeFindings(data[0].products,findings)); }
            for(let i=0;i<6;i++){ const r=await db.from(tbl).update(p).eq("id",id); if(!r.error) break; const m=(r.error.message||"")+" "+(r.error.details||""); const col=(m.match(/'([a-z_]+)' column/i)||m.match(/column "?([a-z_]+)"? of/i)||m.match(/column ([a-z_]+)/i)||[])[1]; if(col&&col in p){delete p[col];continue;} break; }
            return id; } return null; };
        const fu = visit.next_followup?{next_followup:visit.next_followup,followup_status:"مجدولة"}:{};

        // الدهانون: زيارة واحدة قد تشمل عدة دهانين (نفس منطق المواقع المتعددة)
        const painterNames=String(visit.painter||"").split(",").map(s=>s.trim()).filter(Boolean);
        if(visit.type==="دهان" && painterNames.length===0 && visit.target) painterNames.push(visit.target);
        for(const nm of painterNames){
          await upd("painters", nm, {last_visit:visit.date||today,last_contact:visit.date||today,contact_method:"زيارة ميدانية", ...fu});
          // تُسجَّل كتفاعل "زيارة ميدانية" في سجل الدهان فقط عند إنشاء الزيارة لأول مرة (تفادياً للتكرار عند التعديل)
          if(mode==="add"){
            try{ await db.from("interactions").insert([{ painter:nm, type:"زيارة ميدانية", notes:visit.target||visit.goals||null, date:visit.date||today, user_name:currentUserName() }]); }catch(e){}
          }
        }

        if(isDevVisit(visit.type)){ await upd("contractors", visit.contractor||visit.target, {...fu}); }
        // المواقع المرتبطة (قد تكون عدّة مواقع مفصولة بفواصل) — تُضخّ المنتجات لكلٍّ منها، وتُنشأ إن لم توجد
        const sites=String(visit.project||"").split(",").map(s=>s.trim()).filter(Boolean);
        if(isSiteVisit(visit.type) && sites.length===0 && visit.target) sites.push(visit.target);
        for(const nm of sites){ const got=await upd("projects",nm,{__mergeProducts:true,city:visit.location||null, ...fu});
          if(!got){ await safeInsert("projects",{name:nm,status:"قيد المتابعة",city:visit.location||null,products:encodeFindings(findings),notes:"أُنشئ تلقائياً من زيارة ميدانية", ...(visit.lat?{lat:visit.lat,lng:visit.lng}:{})}); } }
      }catch(e){ /* تجاهل أخطاء التزامن */ }
    }

    function getGeo(){
      return new Promise(resolve=>{
        if(!navigator.geolocation){ resolve(null); return; }
        navigator.geolocation.getCurrentPosition(
          p=>resolve({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)}),
          ()=>resolve(null), { enableHighAccuracy:true, timeout:6000 }
        );
      });
    }
    async function uploadImages(files, folder){
      const urls=[];
      for(const f of files){
        const ext=(f.name.split(".").pop()||"jpg").toLowerCase();
        const path=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
        const { error } = await db.storage.from(STORAGE_BUCKET).upload(path, f, { upsert:false });
        if(error){ toast("تعذّر رفع الصورة: "+error.message,"err"); continue; }
        const { data } = db.storage.from(STORAGE_BUCKET).getPublicUrl(path);
        urls.push(data.publicUrl);
      }
      return urls;
    }
    /* التقييم التلقائي للدهان */
    function autoRating(p, stats){
      const rate=Number(p.rating)||0, proj=stats.projects||0, won=stats.won||0, vis=stats.visits||0, gap=daysAgo(stats.lastVisit||p.last_visit);
      if(p.status==="منافس") return "يحتاج متابعة";
      if(rate>=4 && (won>=1||proj>=2) && p.status==="نشط") return "VIP";
      if((proj>=1||vis>=2||rate>=3) && p.status!=="متوقف") return "واعد";
      if(gap>45 || p.status==="متوقف" || (p.next_followup && p.next_followup<TODAY() && p.followup_status!=="تمت")) return "يحتاج متابعة";
      return "عادي";
    }

    /* ═══════════ الشعار ═══════════
       الأصول حقيقية من ملف الشعار الرسمي: البتلات تبقى بألوانها، وكلمة الشعار قناع

    /* ════════════════════════════════════════════════════════════
       أساسيات نظام التصميم: حركة، أرقام متحرّكة، تنبيهات، حالات
       ════════════════════════════════════════════════════════════ */


    /* ═══════════ نظام النوافذ ═══════════
       يحبس التركيز داخل النافذة، ويقفل تمرير الخلفية، ويعيد التركيز لمصدره عند الإغلاق —
       ثلاثة أشياء كانت ناقصة وتكسر التجربة على الكيبورد وقارئ الشاشة. */
    let _lockDepth=0;
    function useModalBehaviour(active, onClose){
      const ref=useRef(null);
      const restore=useRef(null);
      useEffect(()=>{
        if(!active) return;
        restore.current=document.activeElement;
        _lockDepth++; document.body.classList.add("scroll-locked");
        const node=ref.current;
        /* أول عنصر قابل للتركيز، أو الحاوية نفسها */
        const focusables=()=> node? [...node.querySelectorAll(
          'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'
        )].filter(el=>el.offsetParent!==null||el===document.activeElement) : [];
        const t=setTimeout(()=>{ const f=focusables(); (f[0]||node)&&(f[0]||node).focus({preventScroll:true}); },50);
        const onKey=e=>{
          if(e.key==="Escape"){ e.stopPropagation(); onClose&&onClose(); return; }
          if(e.key!=="Tab") return;
          const f=focusables(); if(!f.length) return;
          const first=f[0], last=f[f.length-1];
          if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
          else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
        };
        document.addEventListener("keydown",onKey,true);
        return ()=>{
          clearTimeout(t);
          document.removeEventListener("keydown",onKey,true);
          if(--_lockDepth<=0){ _lockDepth=0; document.body.classList.remove("scroll-locked"); }
          try{ restore.current && restore.current.focus({preventScroll:true}); }catch(e){}
        };
      },[active,onClose]);
      return ref;
    }

    /* ورقة/نافذة موحّدة — تحلّ محل كل التكرارات المتفرّقة في التطبيق */
    function Sheet({ open, onClose, title, subtitle, children, footer, size }){
      const ref=useModalBehaviour(open, onClose);
      if(!open) return null;
      return (
        <div className="sheet-shell no-print" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose&&onClose(); }}>
          <div dir="rtl" ref={ref} tabIndex={-1} role="dialog" aria-modal="true" aria-label={title}
            className="sheet-body" style={size?{maxWidth:size}:undefined}>
            {(title||onClose)&&(
              <div className="sheet-head">
                <div className="min-w-0">
                  {title&&<h2 className="t-md font-semibold truncate">{title}</h2>}
                  {subtitle&&<p className="t-chip txt-dim mt-0.5 truncate">{subtitle}</p>}
                </div>
                <button onClick={onClose} aria-label="إغلاق" className="btn-icon shrink-0"><Icon n="close" s={17}/></button>
              </div>)}
            {children}
            {footer&&<div className="sheet-foot">{footer}</div>}
          </div>
        </div>
      );
    }

    /* بديل confirm() الأصلي — مربّع النظام يقطع الإحساس بأن هذا تطبيق مصمَّم،
       ولا يمكن تنسيقه ولا ترجمة أزراره ولا جعله يتّجه من اليمين لليسار. */
    const ConfirmBus={ req:null, listeners:new Set(),
      subscribe(fn){ this.listeners.add(fn); return ()=>this.listeners.delete(fn); },
      emit(){ this.listeners.forEach(f=>{ try{ f(); }catch(e){} }); },
      ask(opts){ return new Promise(res=>{ this.req={...opts, resolve:res}; this.emit(); }); },
      close(v){ const r=this.req; this.req=null; this.emit(); r&&r.resolve(v); } };
    const confirmDialog = (message, opts={}) =>
      ConfirmBus.ask({ message, title:opts.title||"تأكيد الإجراء",
        confirmLabel:opts.confirmLabel||"تأكيد", cancelLabel:opts.cancelLabel||"إلغاء",
        danger:opts.danger!==false, detail:opts.detail });

    function ConfirmHost(){
      const [,force]=useState(0);
      useEffect(()=>ConfirmBus.subscribe(()=>force(x=>x+1)),[]);
      const r=ConfirmBus.req;
      const close=useMemo(()=>()=>ConfirmBus.close(false),[]);
      const ref=useModalBehaviour(!!r, close);
      if(!r) return null;
      return (
        <div className="overlay flex items-center justify-center p-4 no-print" style={{zIndex:90}}
          onMouseDown={e=>{ if(e.target===e.currentTarget) close(); }}>
          <div dir="rtl" ref={ref} tabIndex={-1} role="alertdialog" aria-modal="true" aria-label={r.title}
            className="card card-raised sheet w-full max-w-[400px] p-5">
            <div className="flex gap-3.5">
              <span className="w-9 h-9 rounded-[9px] flex items-center justify-center shrink-0"
                style={{color:r.danger?"var(--danger)":"var(--info)",background:r.danger?"var(--danger-soft)":"var(--info-soft)"}}>
                <Icon n={r.danger?"alert":"bell"} s={17}/>
              </span>
              <div className="min-w-0 flex-1">
                <h2 className="t-md font-semibold">{r.title}</h2>
                <p className="t-xs txt-muted mt-1.5">{r.message}</p>
                {r.detail&&<p className="t-2xs txt-dim mt-2">{r.detail}</p>}
              </div>
            </div>
            <div className="flex gap-2 mt-5">
              <button onClick={()=>ConfirmBus.close(true)}
                className={"btn flex-1 "+(r.danger?"btn-danger":"btn-primary")}>{r.confirmLabel}</button>
              <button onClick={close} className="btn btn-ghost px-5">{r.cancelLabel}</button>
            </div>
          </div>
        </div>
      );
    }

    /* يحترم تفضيل النظام "تقليل الحركة" */
    function useReducedMotion(){
      const [r,setR]=useState(()=>{ try{ return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } });
      useEffect(()=>{ try{
        const m=window.matchMedia("(prefers-reduced-motion: reduce)");
        const h=()=>setR(m.matches);
        m.addEventListener ? m.addEventListener("change",h) : m.addListener(h);
        return ()=>{ m.removeEventListener ? m.removeEventListener("change",h) : m.removeListener(h); };
      }catch(e){} },[]);
      return r;
    }

    /* عدّاد تصاعدي — يعطي الأرقام إحساس "الحياة" عند تحميل الشاشة */
    function AnimatedNumber({ value, dur=850 }){
      const raw=String(value==null?"":value);
      const m=raw.match(/^(\s*-?[\d,]*\.?\d+)(.*)$/);
      const reduce=useReducedMotion();
      const target=m?Number(m[1].replace(/,/g,"")):0;
      const suffix=m?m[2]:"";
      const [n,setN]=useState(()=> (m&&!reduce)?0:target );
      const ref=useRef(0);
      useEffect(()=>{
        if(!m||reduce){ setN(target); return; }
        const t0=(window.performance&&performance.now)?performance.now():Date.now();
        const tick=()=>{
          const now=(window.performance&&performance.now)?performance.now():Date.now();
          const p=Math.min(1,(now-t0)/dur);
          setN(target*(1-Math.pow(1-p,3)));
          if(p<1) ref.current=requestAnimationFrame(tick);
        };
        ref.current=requestAnimationFrame(tick);
        return ()=>cancelAnimationFrame(ref.current);
      },[target,suffix,reduce,dur]);
      if(!m) return <span>{raw}</span>;
      const dec=(m[1].indexOf(".")>-1)?1:0;
      return <span>{n.toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec})}{suffix}</span>;
    }

    /* خط اتجاه مصغّر */
    /* معرّف ثابت لتدرّجات SVG — Math.random داخل الرسم كان يولّد معرّفًا جديدًا في كل إطار */
    let _uidSeq=0;
    function useUid(p){ const r=useRef(null); if(r.current===null) r.current=p+(++_uidSeq); return r.current; }

    function Sparkline({ points, color="currentColor", w=64, h=22 }){
      const id=useUid("sp");
      const d=(points||[]).map(Number).filter(x=>!isNaN(x));
      if(d.length<2) return null;
      const mn=Math.min(...d), mx=Math.max(...d), rg=(mx-mn)||1;
      const step=w/(d.length-1);
      const y=v=>h-((v-mn)/rg)*(h-5)-2.5;
      const pts=d.map((v,i)=>`${(i*step).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
      return (
        <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} className="overflow-visible shrink-0" aria-hidden="true">
          <defs><linearGradient id={id} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity=".18"/><stop offset="100%" stopColor={color} stopOpacity="0"/>
          </linearGradient></defs>
          <polygon points={`0,${h} ${pts} ${w},${h}`} fill={`url(#${id})`}/>
          <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" opacity=".8"/>
          <circle cx={w} cy={y(d[d.length-1])} r="2" fill={color}/>
        </svg>
      );
    }

    /* مؤشّر اتجاه — سهم ونصّ، فالمعنى لا يقع على اللون وحده */
    function Trend({ value, invert }){
      if(value==null||isNaN(Number(value))) return null;
      const v=Number(value), up=v>0, flat=v===0;
      const good=invert?!up:up;
      const col=flat?"var(--ink-3)":(good?"var(--ok)":"var(--danger)");
      return (
        <span className="chip tnum" title={flat?"بلا تغيير":(up?"ارتفاع":"انخفاض")}
          style={{color:col,background:flat?"var(--surface-2)":(good?"var(--ok-soft)":"var(--danger-soft)")}}>
          <Icon n={flat?"minus":(up?"arrowUp":"arrowDown")} s={10}/>{Math.abs(v)}%
        </span>
      );
    }

    /* ═══════════ نظام التنبيهات (Toasts) ═══════════ */
    const ToastBus = {
      items:[], seq:0, listeners:new Set(),
      subscribe(fn){ this.listeners.add(fn); return ()=>this.listeners.delete(fn); },
      emit(){ this.listeners.forEach(f=>{ try{ f(); }catch(e){} }); },
      push(msg, kind, action){
        const id=++this.seq;
        this.items=[...this.items,{ id, msg, kind:kind||"info", action }];
        this.emit();
        setTimeout(()=>this.dismiss(id), action?7000:4200);
        return id;
      },
      dismiss(id){ this.items=this.items.filter(t=>t.id!==id); this.emit(); }
    };
    function toast(msg, kind, action){ return ToastBus.push(msg,kind,action); }

    function ToastHost(){
      const [,force]=useState(0);
      useEffect(()=>ToastBus.subscribe(()=>force(x=>x+1)),[]);
      const KIND={ ok:{i:"check",c:"var(--ok)",b:"var(--ok-soft)"}, err:{i:"alert",c:"var(--danger)",b:"var(--danger-soft)"},
                   warn:{i:"bell",c:"var(--warn)",b:"var(--warn-soft)"}, info:{i:"bolt",c:"var(--info)",b:"var(--info-soft)"} };
      if(!ToastBus.items.length) return null;
      return (
        <div className="fixed z-[70] bottom-0 left-0 right-0 sm:left-auto sm:right-6 sm:bottom-6 p-3 sm:p-0 flex flex-col gap-2 items-stretch sm:items-end pointer-events-none no-print"
          role="status" aria-live="polite">
          {ToastBus.items.map(t=>{
            const k=KIND[t.kind]||KIND.info;
            return (
              <div key={t.id} className="card card-raised sheet pointer-events-auto flex items-center gap-3 px-3.5 py-3 sm:min-w-[320px] sm:max-w-[440px]">
                <span className="w-7 h-7 rounded-[7px] flex items-center justify-center shrink-0" style={{color:k.c,background:k.b}}>
                  <Icon n={k.i} s={15}/>
                </span>
                <span className="t-xs flex-1 min-w-0">{t.msg}</span>
                {t.action && (
                  <button onClick={()=>{ try{ t.action.fn(); }catch(e){} ToastBus.dismiss(t.id); }}
                    className="t-2xs font-semibold shrink-0 px-2 py-1 rounded-[6px] txt-accent row-hover">{t.action.label}</button>
                )}
                <button onClick={()=>ToastBus.dismiss(t.id)} aria-label="إغلاق التنبيه"
                  className="btn-icon shrink-0" style={{width:26,height:26}}><Icon n="close" s={13}/></button>
              </div>
            );
          })}
        </div>
      );
    }

    /* ═══════════ الحالات: تحميل / فراغ / خطأ ═══════════ */

    /* الحالة الفارغة: تلميح لسطور غائبة، مرسوم بحدود شعرية لا بأشكال ملوّنة */
    function EmptyArt(){
      return (
        <svg width="104" height="72" viewBox="0 0 104 72" fill="none" className="mx-auto mb-4" aria-hidden="true">
          <rect x="12.5" y="8.5" width="79" height="55" rx="7" fill="var(--surface-2)" stroke="var(--line-strong)"/>
          <path d="M12.5 22.5h79" stroke="var(--line-strong)"/>
          <circle cx="20" cy="15.5" r="1.6" fill="var(--ink-3)" opacity=".5"/>
          <circle cx="26" cy="15.5" r="1.6" fill="var(--ink-3)" opacity=".35"/>
          <rect x="22" y="32" width="42" height="4" rx="2" fill="var(--line-strong)"/>
          <rect x="22" y="42" width="58" height="4" rx="2" fill="var(--line-strong)" opacity=".6"/>
          <rect x="22" y="52" width="30" height="4" rx="2" fill="var(--line-strong)" opacity=".4"/>
        </svg>
      );
    }

    function ReportSkeleton(){
      return (<div className="space-y-4">
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
          {Array.from({length:4}).map((_,i)=>(
            <div key={i} className="card p-4">
              <div className="sk h-3 w-20 mb-3"/><div className="sk h-7 w-24 mb-2"/><div className="sk h-2.5 w-16"/>
            </div>))}
        </div>
        <div className="card p-4 space-y-3">
          <div className="sk h-4 w-32"/>
          {Array.from({length:5}).map((_,i)=>(
            <div key={i} className="flex items-center gap-3">
              <div className="sk h-9 w-9" style={{borderRadius:"10px"}}/>
              <div className="flex-1 space-y-1.5"><div className="sk h-3" style={{width:(70-i*7)+"%"}}/><div className="sk h-2.5 w-24"/></div>
              <div className="sk h-6 w-14"/>
            </div>))}
        </div>
      </div>);
    }

    function ReportError({ msg, onRetry }){
      return (<div className="card p-8 sm:p-10 text-center rise" role="alert">
        <div className="w-12 h-12 rounded-[10px] flex items-center justify-center mx-auto mb-4"
          style={{color:"var(--danger)",background:"var(--danger-soft)"}}><Icon n="alert" s={22}/></div>
        <h3 className="t-md font-semibold mb-1.5">تعذّر تحميل البيانات</h3>
        <p className="t-xs txt-muted mb-5 max-w-sm mx-auto">{msg}</p>
        <div className="flex items-center justify-center gap-2 flex-wrap">
          <button onClick={onRetry} className="btn btn-primary press"><Icon n="refresh" s={14}/> إعادة المحاولة</button>
          <button onClick={()=>window.location.reload()} className="btn btn-ghost press">تحديث الصفحة</button>
        </div>
      </div>);
    }

    function ReportEmpty({ text, action, actionLabel, secondary, secondaryLabel, tips }){
      return (<div className="card p-8 sm:p-12 text-center rise">
        <EmptyArt/>
        <h3 className="t-md font-semibold mb-1.5">{text}</h3>
        <p className="t-xs txt-muted mb-6 max-w-sm mx-auto">
          ما فيه شيء يُعرض هنا بعد. أضف أول سجل أو خفّف التصفية لتشوف نتائج أكثر.
        </p>
        {(action||secondary) && (
          <div className="flex items-center justify-center gap-2 flex-wrap">
            {action && <button onClick={action} className="btn btn-primary press"><Icon n="plus" s={14}/> {actionLabel||"إضافة"}</button>}
            {secondary && <button onClick={secondary} className="btn btn-ghost press">{secondaryLabel||"مسح التصفية"}</button>}
          </div>
        )}
        {tips && tips.length>0 && (
          <div className="mt-8 pt-5 border-t hairline max-w-sm mx-auto text-right">
            <div className="eyebrow mb-2.5">نصائح سريعة</div>
            <ul className="space-y-2">
              {tips.map((t,i)=>(<li key={i} className="t-2xs txt-muted flex gap-2.5">
                <span className="txt-dim shrink-0 mt-px">—</span><span>{t}</span></li>))}
            </ul>
          </div>
        )}
      </div>);
    }

    /* ═══════════ ترويسة الشاشة ═══════════
       طباعية لا لافتة ملوّنة: العنوان والشرح وأي إجراءات على خطّ شعري.
       اللافتات المتدرّجة كانت تُغرق كل شاشة بلون لا يحمل أي معلومة. */
    function PageHeader({ title, lede, actions, stats, children }){
      return (
        <header className="pb-4 mb-5" style={{borderBottom:"1px solid var(--line)"}}>
          <div className="flex items-start justify-between gap-4 flex-wrap">
            <div className="min-w-0">
              <h1 className="t-xl">{title}</h1>
              {lede&&<p className="lede mt-1.5 max-w-2xl">{lede}</p>}
            </div>
            {actions&&<div className="flex items-center gap-2 flex-wrap shrink-0">{actions}</div>}
          </div>
          {stats&&(
            <div className="flex items-stretch gap-6 sm:gap-10 mt-5 flex-wrap">
              {stats.map((st,i)=>(
                <div key={i} className="min-w-0">
                  <div className="tnum leading-none" style={{fontSize:"var(--t-3xl)",fontWeight:600,color:st.tone||"var(--ink)"}}>{st.value}</div>
                  <div className="t-2xs txt-muted mt-2">{st.label}</div>
                </div>))}
            </div>)}
          {children}
        </header>
      );
    }

    /* الحرف الأول كبديل للصورة — سطح رمادي وحدّ شعري، ولون الحالة في نقطة صغيرة فقط.
       التدرّجات الملوّنة على كل صفّ كانت تصنع ضجيجًا لا هوية. */
    function Avatar({ text, color, size=38, dot }){
      const ch=String(text||"؟").trim().charAt(0)||"؟";
      return (
        <span className="relative shrink-0 inline-flex items-center justify-center rounded-[9px] font-semibold"
          style={{width:size,height:size,background:"var(--surface-2)",border:"1px solid var(--line)",
                  color:"var(--ink-2)",fontSize:Math.round(size*0.38)}}>
          {ch}
          {dot&&color&&<span className="absolute -bottom-0.5 -left-0.5 w-2.5 h-2.5 rounded-full"
            style={{background:color,border:"2px solid var(--surface)"}}/>}
        </span>
      );
    }

    /* ═══════════ مكونات مشتركة ═══════════ */
    /* التقييم: نجوم مصمتة + قيمة نصّية لقارئ الشاشة */
    function Stars({ n, size=12 }) {
      const v=Number(n)||0;
      return (<span className="inline-flex items-center gap-px align-middle" role="img" aria-label={`التقييم ${v} من ٥`}>
        {[1,2,3,4,5].map(i=>(
          <svg key={i} width={size} height={size} viewBox="0 0 24 24" aria-hidden="true"
            fill={i<=v?"var(--warn)":"var(--line-strong)"}>
            <path d="M12 2.6l2.9 6 6.5.9-4.7 4.5 1.1 6.5L12 17.4 6.2 20.5l1.1-6.5L2.6 9.5l6.5-.9z"/>
          </svg>))}
      </span>);
    }
    function Badge({ status }) { if(!status) return null; const c=STATUS_COLORS[status];
      return <span className="chip chip-dot" style={{color:c,background:`color-mix(in srgb, ${c} 12%, transparent)`,borderColor:`color-mix(in srgb, ${c} 26%, transparent)`}}>{status}</span>; }
    function Pill({ text, color }) { const c=color||"var(--ink-3)";
      return <span className="chip" style={{color:c,background:`color-mix(in srgb, ${c} 11%, transparent)`,borderColor:`color-mix(in srgb, ${c} 22%, transparent)`}}>{text}</span>; }
    /* شريط أفقي — الرقم يقود، والشريط يدعمه.
       بلا تدرّجات: مساحة اللون هي الترميز، فتشويهها بتدرّج يشوّه القراءة. */
    function Bars({ data, unit }) {
      const max=Math.max(1,...data.map(d=>d.value));
      /* لون واحد افتراضًا: سلسلة واحدة لا تحتاج ألوانًا مختلفة، والتلوين بلا معنى ترميز كاذب.
         الألوان تأتي فقط حين تحمل الصفوف فئات حقيقية (شركات مثلًا). */
      return (<div className="space-y-2.5">{data.map((d,i)=>{
        const c=d.color||"var(--ink-2)";
        const pct=d.value/max*100;
        return (<div key={i}>
          <div className="flex items-baseline justify-between gap-3 mb-1.5">
            <span className="t-2xs truncate">{d.label}</span>
            <span className="t-2xs font-semibold tnum shrink-0">{Number(d.value).toLocaleString("en-US")}{unit?<span className="txt-dim"> {unit}</span>:null}</span>
          </div>
          <div className="h-1.5 rounded-full overflow-hidden" style={{background:"var(--surface-2)"}}>
            <div className="h-full rounded-full" style={{width:Math.max(pct,1.5)+"%",background:c,
              transformOrigin:"right",animation:`barGrow 520ms var(--ease-out) ${Math.min(i,8)*35}ms both`}}/>
          </div>
        </div>);})}</div>);
    }

    /* المؤشّر: الرقم هو البطل. لا شريط علوي ملوّن ولا دائرة زخرفية —
       اللون يظهر في الأيقونة فقط، والباقي حبر ورمادي. */
    function Kpi({ label, value, color, icon, sub, trend, spark, onClick, tone }) {
      const c=color||"var(--ink-3)";
      const Tag=onClick?"button":"div";
      return (
        <Tag {...(onClick?{onClick,type:"button"}:{})}
          className={"card p-3.5 sm:p-4 text-right w-full "+(onClick?"lift press cursor-pointer":"")}>
          <div className="flex items-start justify-between gap-2 mb-2.5">
            <span className="t-2xs txt-muted truncate min-w-0">{label}</span>
            {icon && (
              <span className="w-6 h-6 rounded-[6px] flex items-center justify-center shrink-0"
                style={{color:c,background:`color-mix(in srgb, ${c} 12%, transparent)`}}>
                <Icon n={icon} s={13}/>
              </span>
            )}
          </div>
          <div className="kpi-v font-semibold leading-none" style={{fontSize:"var(--t-kpi)",color:tone||"var(--ink)"}}>
            <AnimatedNumber value={value}/>
          </div>
          <div className="kpi-foot mt-2">
            {sub ? <span className="t-chip txt-dim truncate min-w-0">{sub}</span> : <span/>}
            <span className="flex items-center gap-2 shrink-0">
              <Trend value={trend}/>
              {spark ? <span className="kpi-spark flex"><Sparkline points={spark} color={c}/></span> : null}
            </span>
          </div>
        </Tag>);
    }

    function Inp({ label, v, on, type="text", icon, hint, required, placeholder, autoFocus, invalid, dir }) {
      const id=useUid("in");
      return (<div>
        <label className={"form-label"+(required?" req":"")} htmlFor={id}>{label}</label>
        <span className="field-wrap">
          {icon?<span className="field-ico"><Icon n={icon} s={14}/></span>:null}
          <input id={id} type={type} value={v==null?"":v} onChange={e=>on(e.target.value)} dir={dir}
            placeholder={placeholder} autoFocus={autoFocus} inputMode={type==="number"?"decimal":undefined}
            aria-invalid={invalid?"true":undefined} aria-required={required?"true":undefined}
            aria-describedby={(invalid||hint)?id+"-d":undefined}
            className={"field w-full "+(icon?"has-ico ":"")+(invalid?"invalid":"")}/>
        </span>
        {invalid?<span className="form-err" id={id+"-d"}><Icon n="alert" s={11}/> هذا الحقل مطلوب</span>
                :(hint?<span className="form-hint" id={id+"-d"}>{hint}</span>:null)}
      </div>); }

    /* ═══════════ الرسوم البيانية ═══════════
       بلا تدرّجات ولا ظلال ولا حشو — نسبة الحبر إلى البيانات هي المقياس. */
    function Donut({ data, size=140, centerLabel="الإجمالي" }) {
      const total=data.reduce((a,d)=>a+(d.value||0),0);
      const stroke=13, r=(size-stroke)/2-1, C=2*Math.PI*r, cx=size/2, cy=size/2;
      let off=0;
      return (<div className="flex items-center gap-5 flex-wrap">
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="shrink-0" role="img"
          aria-label={`${centerLabel}: ${total}`}>
          <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--surface-2)" strokeWidth={stroke}/>
          <g transform={`rotate(-90 ${cx} ${cy})`}>
            {total>0&&data.map((d,i)=>{ const len=(d.value/total)*C;
              const el=(<circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={d.color} strokeWidth={stroke}
                strokeDasharray={`${len} ${C-len}`} strokeDashoffset={-off}/>); off+=len; return el; })}
          </g>
          <text x={cx} y={cy+1} textAnchor="middle" fill="var(--ink)"
            style={{fontSize:size*0.19,fontWeight:600,fontFamily:"'IBM Plex Mono',monospace"}}>{total.toLocaleString("en-US")}</text>
          <text x={cx} y={cy+size*0.14} textAnchor="middle" fill="var(--ink-3)" style={{fontSize:10}}>{centerLabel}</text>
        </svg>
        <div className="flex-1 min-w-[140px] divide-hair">
          {data.map((d,i)=>(
            <div key={i} className="flex items-center justify-between gap-3 py-1.5 t-2xs">
              <span className="flex items-center gap-2 min-w-0">
                <span className="w-2 h-2 rounded-[2px] shrink-0" style={{background:d.color}}/>
                <span className="truncate">{d.label}</span>
              </span>
              <span className="tnum shrink-0 txt-muted">
                {Number(d.value).toLocaleString("en-US")}
                <span className="txt-dim"> · {total?Math.round(d.value/total*100):0}%</span>
              </span>
            </div>))}
        </div>
      </div>);
    }

    /* يقيس عرض الحاوية فعليًا — الرسم يتمدّد أفقيًا بدل أن يتضخّم كله على الشاشات العريضة */
    function useMeasure(){
      const ref=useRef(null);
      const [w,setW]=useState(0);
      useEffect(()=>{
        const el=ref.current; if(!el) return;
        const set=()=>setW(el.clientWidth||0);
        set();
        if(typeof ResizeObserver==="undefined"){ window.addEventListener("resize",set); return ()=>window.removeEventListener("resize",set); }
        const ro=new ResizeObserver(set); ro.observe(el); return ()=>ro.disconnect();
      },[]);
      return [ref,w];
    }

    /* منحنى الاتجاه — يملأ حاويته أفقيًا بارتفاع ثابت، وتُخفّف تسمياته على الشاشات الضيقة */
    function TrendArea({ points, color, height=150 }) {
      const gid=useUid("ta");
      const col=color||"var(--ink-2)";
      const [box,bw]=useMeasure();
      const W=Math.max(260, bw||340), H=height, padX=14, padT=22, padB=24;
      const max=Math.max(1,...points.map(p=>p.value));
      const n=points.length;
      const X=i=> n<=1?W/2 : padX+(i*(W-2*padX)/(n-1));
      const Y=v=> H-padB-(v/max*(H-padT-padB));
      const line=points.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(p.value).toFixed(1)}`).join(" ");
      const area=`M${X(0).toFixed(1)},${H-padB} `+points.map((p,i)=>`L${X(i).toFixed(1)},${Y(p.value).toFixed(1)}`).join(" ")+` L${X(n-1).toFixed(1)},${H-padB} Z`;
      const peak=points.reduce((a,p,i)=>p.value>points[a].value?i:a,0);
      /* على العرض الضيّق نُظهر تسمية بعد أخرى حتى لا تتراكب */
      const skip = W<300 ? 2 : 1;
      return (<div ref={box} style={{width:"100%"}}>
        <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{display:"block",overflow:"visible"}} role="img"
        aria-label="منحنى النشاط">
        <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={col} stopOpacity=".14"/><stop offset="100%" stopColor={col} stopOpacity="0"/>
        </linearGradient></defs>
        {[0,0.5,1].map((g,i)=>(
          <line key={i} x1={padX} x2={W-padX} y1={Y(max*g)} y2={Y(max*g)} stroke="var(--line)" strokeWidth="1"/>))}
        <path d={area} fill={`url(#${gid})`}/>
        <path d={line} fill="none" stroke={col} strokeWidth="1.75" strokeLinejoin="round" strokeLinecap="round"/>
        {points.map((p,i)=>(<g key={i}>
          <circle cx={X(i)} cy={Y(p.value)} r={i===peak?3:2} fill={i===peak?col:"var(--surface)"}
            stroke={col} strokeWidth="1.5"/>
          {i===peak&&p.value?<text x={X(i)} y={Y(p.value)-9} textAnchor="middle" fill={col}
            style={{fontSize:10,fontWeight:600,fontFamily:"'IBM Plex Mono',monospace"}}>{p.value}</text>:null}
          {i%skip===0&&<text x={X(i)} y={H-7} textAnchor="middle" fill="var(--ink-3)" style={{fontSize:10}}>{p.label}</text>}
        </g>))}
        </svg>
      </div>);
    }

    /* القمع — عرض الشريط يحمل النسبة، والرقم خارجه ليبقى مقروءًا مهما ضاق الشريط */
    function Funnel({ stages }) {
      const top=Math.max(1,...stages.map(s=>s.value));
      return (<div className="space-y-2">{stages.map((s,i)=>{ const pct=Math.round(s.value/top*100); return (
        <div key={i} className="flex items-center gap-3">
          <span className="t-2xs truncate w-24 sm:w-28 shrink-0">{s.label}</span>
          <div className="flex-1 h-6 rounded-[6px] overflow-hidden" style={{background:"var(--surface-2)"}}>
            <div className="h-full rounded-[6px]" style={{width:Math.max(pct,2)+"%",background:s.color,
              transformOrigin:"right",animation:`barGrow 520ms var(--ease-out) ${i*45}ms both`}}/>
          </div>
          <span className="t-2xs tnum shrink-0 w-16 text-left txt-muted">{s.value} · {pct}%</span>
        </div>);})}</div>);
    }
    function Sel({ label, v, on, opts, hint, required, autoFocus }) {
      const id=useUid("sl");
      return (<div>
        <label className={"form-label"+(required?" req":"")} htmlFor={id}>{label}</label>
        <select id={id} value={v==null?"":v} onChange={e=>on(e.target.value)} autoFocus={autoFocus}
          aria-required={required?"true":undefined} aria-describedby={hint?id+"-d":undefined}
          className="field w-full">
          {opts.map(o=><option key={o} value={o}>{o===""?"\u2014 \u0627\u0644\u0643\u0644 \u2014":o}</option>)}
        </select>
        {hint?<span className="form-hint" id={id+"-d"}>{hint}</span>:null}
      </div>); }

    /* حقل اختيار مرجعي من جدول آخر */
    function RefField({ label, v, on, options }) {
      const id=useUid("rf");
      return (<div><label className="form-label" htmlFor={id}>{label}</label>
        <span className="field-wrap">
          <span className="field-ico"><Icon n="search" s={13}/></span>
          <input id={id} list={id+"-l"} value={v||""} onChange={e=>on(e.target.value)}
            placeholder="\u0627\u0643\u062a\u0628 \u0623\u0648 \u0627\u062e\u062a\u0631 \u0645\u0646 \u0627\u0644\u0642\u0627\u0626\u0645\u0629\u2026"
            className="field has-ico w-full" autoComplete="off"/>
        </span>
        <datalist id={id+"-l"}>{options.map(o=><option key={o} value={o}/>)}</datalist>
        {options.length>0?<span className="form-hint tnum">{options.length} \u062e\u064a\u0627\u0631\u064b\u0627 \u0645\u062a\u0627\u062d\u064b\u0627</span>:null}
      </div>);
    }
    /* حقل مرجعي متعدد: اختيار/إضافة أكثر من عنصر (مثلاً عدة مواقع لزيارة واحدة) */
    function RefsField({ label, v, on, options }) {
      const sel = String(v||"").split(",").map(s=>s.trim()).filter(Boolean);
      const [txt,setTxt]=useState("");
      const add=n=>{ const name=(n||txt).trim(); if(!name) return; if(!sel.includes(name)) on([...sel,name].join(", ")); setTxt(""); };
      const removeAt=i=>on(sel.filter((_,j)=>j!==i).join(", "));
      const sugg=txt.trim()?options.filter(o=>o.includes(txt.trim())&&!sel.includes(o)).slice(0,6):options.filter(o=>!sel.includes(o)).slice(0,6);
      return (<div className="sm:col-span-2">

    /* منتج مرصود — اسم الشركة يقود والمنتج يتبعه، ومنتجات الجزيرة تأخذ حدًّا أقوى */
    function FindingPill({ f, onRemove }) {
