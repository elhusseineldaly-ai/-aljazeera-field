    /* ===== مكونات مشتركة ===== */
    function Stars({ n }) { return <span>{[1,2,3,4,5].map(i=><span key={i} style={{color:i<=n?"#D4A017":"#d1d5db"}}>★</span>)}</span>; }
    function Badge({ status }) { if(!status) return null; const c=STATUS_COLORS[status]||"#888"; return <span className="text-xs font-bold px-2 py-0.5 rounded-full" style={{color:c,background:c+"22"}}>{status}</span>; }
    function Bars({ data }) { const max=Math.max(1,...data.map(d=>d.value)); return (<div className="space-y-2">{data.map((d,i)=>(<div key={i} className="text-xs"><div className="flex justify-between mb-0.5"><span>{d.label}</span><span className="font-bold">{Number(d.value).toLocaleString()}</span></div><div className={"h-2.5 rounded-full overflow-hidden "+cTrack}><div className="h-2.5 rounded-full" style={{width:(d.value/max*100)+"%",background:d.color||COLORS[i%COLORS.length]}}/></div></div>))}</div>); }
    function Kpi({ label, value, color }) { return (<div className={"rounded-2xl p-3 "+cCard}><div className={"text-xs "+cMuted}>{label}</div><div className="text-lg font-extrabold" style={{color}}>{value}</div></div>); }
    function Inp({ label, v, on, type="text" }) { return (<label className="block"><span className={"text-xs "+cMuted}>{label}</span><input type={type} value={v} onChange={e=>on(e.target.value)} className={"w-full rounded-lg px-3 py-2 text-sm outline-none focus:border-emerald-500 "+cInput}/></label>); }
    function Sel({ label, v, on, opts }) { return (<label className="block"><span className={"text-xs "+cMuted}>{label}</span><select value={v} onChange={e=>on(e.target.value)} className={"w-full rounded-lg px-3 py-2 text-sm outline-none focus:border-emerald-500 "+cInput}>{opts.map(o=><option key={o} value={o}>{o}</option>)}</select></label>); }

    function exportCSV(cfg, rows) {
      const headers=cfg.fields.map(f=>f.label);
      const lines=rows.map(r=>cfg.fields.map(f=>'"'+String(r[f.key]??"").replace(/"/g,'""')+'"').join(","));
      const csv="\uFEFF"+[headers.join(","),...lines].join("\n");
      const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=cfg.title+".csv"; a.click(); URL.revokeObjectURL(a.href);
    }

    /* ===== قسم عام ===== */
    function Section({ cfg }) {
      const [rows,setRows]=useState([]); const [loading,setLoading]=useState(true); const [error,setError]=useState("");
      const [q,setQ]=useState(""); const [view,setView]=useState("list"); const [selId,setSelId]=useState(null);
      const [editor,setEditor]=useState(null); const [saving,setSaving]=useState(false);
      async function load(){ setLoading(true);setError("");
        const {data,error}=await db.from(cfg.table).select("*").order("created_at",{ascending:false});
        if(error)setError("تعذّر تحميل البيانات: "+error.message); else setRows(data||[]); setLoading(false);
      }
      useEffect(()=>{load()},[]);
      const selected=rows.find(r=>r.id===selId)||null;
      function emptyData(){ const o={}; cfg.fields.forEach(f=>o[f.key]=f.type==="number"?0:(f.type==="select"?(f.opts[0]||""):"")); return o; }
      function openAdd(){ setEditor({mode:"add",id:null,data:emptyData()}); }
      function openEdit(r){ const o={}; cfg.fields.forEach(f=>o[f.key]=r[f.key]??(f.type==="number"?0:"")); setEditor({mode:"edit",id:r.id,data:o}); }
      function setField(k,v){ setEditor(e=>({...e,data:{...e.data,[k]:v}})); }
      async function save(){ if(!String(editor.data[cfg.fields[0].key]||"").trim()){alert("اكتب "+cfg.fields[0].label+" أولاً");return;}
        setSaving(true); const payload={...editor.data};
        cfg.fields.forEach(f=>{ if(f.type==="number")payload[f.key]=Number(payload[f.key]||0); if(f.type==="date"&&!payload[f.key])payload[f.key]=null; });
        let res; if(editor.mode==="add")res=await db.from(cfg.table).insert([payload]); else res=await db.from(cfg.table).update(payload).eq("id",editor.id);
        setSaving(false); if(res.error){alert("خطأ في الحفظ: "+res.error.message);return;} setEditor(null); await load();
      }

        setNotifs(list);

      useEffect(()=>{ if(gq.trim().length<2){setResults([]);return;} const t=setTimeout(async()=>{
        const [p,pr,c]=await Promise.all([db.from("painters").select("id,name").ilike("name","%"+gq+"%").limit(5),db.from("projects").select("id,name").ilike("name","%"+gq+"%").limit(5),db.from("contractors").select("id,name").ilike("name","%"+gq+"%").limit(5)]);

      },300); return ()=>clearTimeout(t); },[gq]);

      const go=id=>{ setTab(id); setSideOpen(false); setNotifOpen(false); setGq(""); setResults([]); window.scrollTo(0,0); };

              <div><div className="text-white font-extrabold text-sm">نظام الجزيرة الميداني</div><div className="text-emerald-100 text-xs">Jazeera Field System</div></div>

              {NAV.map(([k,label])=>(<button key={k} onClick={()=>go(k)} className={"w-full flex items-center gap-2 px-3 py-2.5 rounded-xl text-xs font-bold transition text-right "+(tab===k?"bg-emerald-700 text-white shadow":cMuted+" "+cHover)}>{label}</button>))}
            </nav>
            <div className={"p-3 border-t text-xs "+cBorder+" "+cMuted}>المستخدم: أبو فيصل</div>
          </aside>
          {sideOpen&&<div className="fixed inset-0 bg-black/40 z-30 lg:hidden" onClick={()=>setSideOpen(false)}/>}

          <div className="lg:mr-64">
            <header className={"sticky top-0 z-20 backdrop-blur px-4 py-3 flex items-center gap-3 border-b bg-white/90 dark:bg-slate-900/90 border-gray-200 dark:border-slate-800"}>
              <button onClick={()=>setSideOpen(true)} className={"lg:hidden p-2 rounded-xl "+cHover}>☰</button>
              <h1 className="font-extrabold text-sm whitespace-nowrap hidden sm:block">{TITLES[tab]}</h1>
              <div className="relative flex-1 max-w-md">
                <div className={"flex items-center gap-2 rounded-xl px-3 py-2 "+cInput}><span className={cMuted}>🔍</span><input value={gq} onChange={e=>setGq(e.target.value)} placeholder="بحث شامل: دهان، مشروع، مقاول..." className="bg-transparent outline-none text-xs w-full"/>{gq&&<button onClick={()=>setGq("")} className={cMuted}>✕</button>}</div>
                {results.length>0&&(<div className={"absolute top-full mt-1 w-full rounded-xl shadow-xl overflow-hidden z-30 "+cCard}>{results.map((r,i)=>(<button key={i} onClick={()=>go(r.go)} className={"w-full flex items-center justify-between px-3 py-2.5 text-xs text-right "+cHover}><span className="font-bold">{r.n}</span><Badge status={r.t}/></button>))}</div>)}
              </div>
              <div className="mr-auto flex items-center gap-2">
                <div className="relative">
                  <button onClick={()=>setNotifOpen(!notifOpen)} className={"p-2 rounded-xl relative "+cHover}>🔔{highCount>0&&<span className="absolute -top-0.5 -left-0.5 w-4 h-4 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center">{highCount}</span>}</button>
                  {notifOpen&&(<div className={"absolute top-full left-0 mt-1 w-72 rounded-2xl shadow-xl overflow-hidden z-30 "+cCard}><div className={"p-3 font-extrabold text-xs border-b "+cBorder}>🔔 الإشعارات الذكية</div><div className="max-h-72 overflow-y-auto">{notifs.length===0?<div className={"p-3 text-xs "+cMuted}>لا توجد تنبيهات</div>:notifs.map((n,i)=>(<div key={i} className={"p-3 border-b flex gap-2 "+cBorder}><span className="w-2 h-2 rounded-full mt-1.5 shrink-0" style={{background:n.level==="high"?"#E2574C":"#D4A017"}}/><div><div className="text-xs font-bold">{n.title}</div><div className={"text-xs "+cMuted}>{n.text}</div></div></div>))}</div></div>)}
                </div>
                <button onClick={()=>setDark(!dark)} className={"p-2 rounded-xl "+cHover}>{dark?"☀️":"🌙"}</button>
              </div>
            </header>
            <main className="p-4 max-w-5xl mx-auto">
              {tab==="dashboard"&&<Dashboard key="dash"/>}
              {tab==="products"&&<ProductsPage/>}
              {tab==="insights"&&<InsightsPage key="ins"/>}
              {tab==="reports"&&<ReportsPage key="rep"/>}
              {CONFIG[tab]&&<Section key={tab} cfg={CONFIG[tab]}/>}
              <div className={"text-center text-xs py-4 "+cMuted}>نظام الجزيرة الميداني • مربوط بقاعدة بيانات Supabase</div>
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
