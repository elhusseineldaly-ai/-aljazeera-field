        const addC=(city,prods)=>{ if(cityAgg[city]==null)return; parseFindings(prods).forEach(f=>{ if(!f.c)return; cityAgg[city].tot++; if(f.c===OWN_COMPANY)cityAgg[city].own++; }); };
        data.projects.forEach(p=>addC(p.city,p.products)); data.visits.forEach(v=>addC(v.location,v.products));
        const cityRows=Object.entries(cityAgg).filter(([,o])=>o.tot>0).map(([c,o])=>[c,o.tot,Math.round(o.own/o.tot*100)+"%"]).sort((a,b)=>b[1]-a[1]);
        let body=kpisHtml([["حصة الجزيرة",ownPct+"%"],["ترتيب الجزيرة","#"+(rank||"-")],["إجمالي الرصدات",ms.total],["عدد الشركات",overall.length]]);
        body+="<h2>الحصة الإجمالية بين الشركات</h2>"+overall.map(([l,v])=>barRow(l,v)).join("");
        body+="<h2>حصة الجزيرة حسب المدينة</h2>"+tableHtml(["المدينة","إجمالي الرصدات","حصة الجزيرة"],cityRows);
        CATALOG.forEach(fam=>{ const m=ms.perFamily[fam.family]||{}; const tot=Object.values(m).reduce((a,b)=>a+b,0); if(!tot) return;
          const rows=Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([c,v])=>[c+(c===OWN_COMPANY?" ★":""),v,Math.round(v/tot*100)+"%"]);
          body+=`<h2 style="border-right-color:${famColor(fam)};color:${famColor(fam)}">${fam.family} (${tot} رصدة)</h2>`+tableHtml(["الشركة","عدد الرصدات","الحصة"],rows); });
        printReport("تقرير الحصة السوقية", body);
      }

      async function dl(id){ const {data:d}=await db.from(CONFIG[id].table).select("*"); exportCSV(CONFIG[id],d||[]); }
      const counts=data?Object.fromEntries(Object.keys(CONFIG).map(id=>[id,(data[CONFIG[id].table]||[]).length])):null;
      const repBtn="btn btn-outline w-full justify-center py-3";

      return (
        <div className="space-y-4">
          <div className={"rounded-2xl p-5 "+cCard}>
            <div className="flex items-center gap-3 pb-4 mb-4 border-b hairline"><span className="logo-mark" style={{width:34,height:34}}/><div><h2 className="t-md font-semibold">تقارير دورية وتصدير عام</h2><p className="t-chip txt-dim mt-0.5">{new Date().toLocaleDateString("ar-SA",{day:"numeric",month:"long",year:"numeric"})}</p></div></div>
            {!counts?<div className={"t-sm "+cMuted}>جاري التحضير...</div>:(
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">{Object.keys(CONFIG).map(id=>(<div key={id} className={"rounded-xl p-3 "+cTrack}><div className={"t-2xs "+cMuted}>{CONFIG[id].title}</div><div className={"t-xl font-semibold "+cAccent}>{counts[id]??"—"}</div></div>))}</div>
            )}
          </div>

          <div className={"rounded-2xl p-4 "+cCard}>
            <div className="flex items-center gap-2.5 mb-4"><Icon n="printer" s={16} c="txt-dim"/><h3 className="t-sm font-semibold">تقارير جاهزة للطباعة</h3></div>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
              <button onClick={()=>periodReport("التقرير الأسبوعي",7)} className={repBtn}><Icon n="clock" s={14}/> تقرير أسبوعي</button>
              <button onClick={()=>periodReport("التقرير الشهري",30)} className={repBtn}><Icon n="clock" s={14}/> تقرير شهري</button>
              <button onClick={paintersReport} className={repBtn}>نشاط الدهانين</button>
              <button onClick={sitesReport} className={repBtn}>تقرير المواقع</button>
              <button onClick={developersReport} className={repBtn}>المطوّرون العقاريون</button>
              <button onClick={marketMonitorReport} className={repBtn}>رصد السوق (المنافسون)</button>
              <button onClick={marketReport} className={repBtn}><Icon n="trophy" s={14}/> الحصة السوقية</button>
            </div>
            <p className={"t-2xs mt-3 "+cMuted}>يفتح التقرير في نافذة جديدة منسّقة، استخدم "طباعة / حفظ PDF" لحفظه.</p>
          </div>

          <div className={"rounded-2xl p-4 "+cCard}>
            <h3 className="font-bold t-sm mb-3">تصدير البيانات (Excel/CSV)</h3>
            <div className="flex flex-wrap gap-2">{Object.keys(CONFIG).map(id=>(<button key={id} onClick={()=>dl(id)} className={"px-3 py-2 rounded-lg t-2xs font-bold "+cAccent+" "+cTrack+" "+cHover}>{CONFIG[id].title}</button>))}</div>
          </div>
        </div>
      );
    }

    /* ===== مركز التقارير: غلاف يجمع التقرير اليومي، تقرير متابعة الدهانين، والتقارير الدورية ===== */
    function ReportsPage({ onGo }) {
      const [sub,setSub]=useState("daily");
      const tabs=[
        ["daily","التقرير اليومي","clock"],
        ["followup","متابعة الدهانين","user"],
        ["legacy","تقارير دورية وتصدير","printer"],
      ];
      return (
        <div className="space-y-4">
          <div className={"rounded-2xl p-2 flex items-center gap-1.5 overflow-x-auto no-scrollbar "+cCard}>

              <button key={k} onClick={()=>setSub(k)} className={"flex items-center gap-1.5 shrink-0 px-4 py-2.5 rounded-xl t-2xs font-bold transition "+(sub===k?cBtn:cMuted+" "+cHover)}>
                <Icon n={icon} s={14}/> {label}
              </button>
            ))}
          </div>
          {sub==="daily"&&<DailyActivityReport onGo={onGo}/>}

    /* ===== شريط حالة المزامنة (العمل بدون إنترنت) ===== */
    const TABLE_LABELS = {
      painters:"الدهانين", projects:"المواقع", contractors:"المطوّرون العقاريون", visits:"الزيارات",
      trainings:"التدريبات", interactions:"التفاعلات", activity_log:"سجل النشاط",
      product_catalog:"كتالوج المنتجات", weekly_plan:"الخطة الأسبوعية"
    };
    const OP_LABELS = { insert:"إضافة", update:"تعديل", upsert:"حفظ", delete:"حذف" };

    function useSync(){
      const [, force] = useState(0);
      useEffect(()=> SyncState.subscribe(()=>force(x=>x+1)), []);
      return SyncState;
    }

    function FailedModal({ open, onClose, onChanged }){
      const dlgRef=useModalBehaviour(open, onClose);
      if(!open) return null;
      const items = readFailed();
      return (
        <div role="dialog" aria-modal="true" className="sheet-shell" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
          <div ref={dlgRef} tabIndex={-1} className="sheet-body" style={{maxWidth:560}} onClick={e=>e.stopPropagation()}>
            <div className="sheet-head">
              <h3 className="font-semibold t-sm text-[color:var(--danger)]">عمليات لم تُحفظ في السحابة</h3>
              <button onClick={onClose} className="btn-icon"><Icon n="close" s={16}/></button>
            </div>
            <p className={"t-2xs mb-3 "+cMuted}>
              هذه عمليات رفضتها قاعدة البيانات (وليست مشكلة إنترنت). راجع السبب، ثم أعد المحاولة أو احذفها.
            </p>
            <div className="space-y-2">
              {items.length===0 ? <div className={"t-2xs "+cMuted}>لا يوجد شيء هنا.</div> : items.map((f,i)=>(
                <div key={f.id||i} className={"rounded-xl p-3 "+cTrack}>
                  <div className="flex items-center gap-2 flex-wrap mb-1">
                    <Pill text={OP_LABELS[f.op]||f.op} color={tok("danger")}/>
                    <span className="t-2xs font-bold">{TABLE_LABELS[f.table]||f.table}</span>
                    <span className={"t-2xs mr-auto "+cMuted}>{fmtDateTime(f.ts)}</span>
                  </div>
                  <div className="t-2xs text-[color:var(--danger)] break-words">{f.error}</div>
                </div>
              ))}
            </div>
            {items.length>0 && (
              <div className="sheet-foot flex gap-2">
                <button onClick={async()=>{ await retryFailed(); onChanged&&onChanged(); onClose(); }}
                  className={"flex-1 rounded-xl py-2.5 t-2xs font-bold flex items-center justify-center gap-1.5 "+cBtn}>
                  <Icon n="refresh" s={14}/> إعادة المحاولة للكل
                </button>
                <button onClick={async()=>{ if(await confirmDialog("ستُحذف هذه العمليات نهائيًا، والبيانات التي بداخلها ستُفقد.",{confirmLabel:"حذف العمليات"})){ dropFailed(); onChanged&&onChanged(); onClose(); } }}
                  className="px-4 rounded-xl py-2.5 t-2xs font-bold text-[color:var(--danger)] border border-[color:var(--danger-line)] hover:bg-[color:var(--danger-soft)] transition">
                  حذف
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function SyncBar(){
      const s = useSync();
      const [showFailed,setShowFailed] = useState(false);

      const offline = !s.online;
      const pending = s.pending;
      const failed  = s.failed;
      if(!offline && !pending && !failed && !s.syncing) return null;

      const bar = (bg, border, text, children) => (
        <div className={"px-4 sm:px-6 py-2.5 t-2xs font-bold flex items-center gap-2 flex-wrap fade-in "+bg+" "+border+" "+text}
          style={{borderBottom:"1px solid var(--line)"}}>{children}</div>
      );

      return (
        <>
          {offline && bar("bg-[color:var(--warn-soft)] ","border-[color:var(--warn-line)] ","text-[color:var(--warn)] ", <>
            <span className="w-2 h-2 rounded-full bg-[color:var(--warn)] shrink-0"/>
            <span>لا يوجد اتصال — الحفظ يتم على جهازك</span>
            {pending>0 && <span className="px-2 py-0.5 rounded-full bg-[color:var(--warn-soft)]">{pending} عملية بالانتظار</span>}
            <span className={"mr-auto font-medium "+cMuted}>سترسل تلقائيًا عند رجوع الشبكة</span>
          </>)}

          {!offline && s.syncing && bar("bg-[color:var(--surface-2)] ","border-[color:var(--line)] ","text-[color:var(--accent)] ", <>
            <Icon n="refresh" s={14}/>
            <span>جاري مزامنة {pending} عملية...</span>
          </>)}

          {!offline && !s.syncing && pending>0 && bar("bg-[color:var(--surface-2)] ","border-[color:var(--line)] ","text-[color:var(--accent)] ", <>
            <span className="w-2 h-2 rounded-full bg-[color:var(--accent)] shrink-0"/>
            <span>{pending} عملية محفوظة محليًا لم تُرسل بعد</span>
            <button onClick={()=>flushOutbox()} className={"mr-auto px-3 py-1 rounded-lg t-2xs font-bold flex items-center gap-1.5 "+cBtn}>
              <Icon n="refresh" s={13}/> مزامنة الآن
            </button>
          </>)}

          {failed>0 && bar("bg-[color:var(--danger-soft)] ","border-[color:var(--danger-line)] ","text-[color:var(--danger)] ", <>
            <span className="w-2 h-2 rounded-full bg-[color:var(--danger)] shrink-0"/>
            <span>{failed} عملية فشل حفظها في السحابة</span>
            <button onClick={()=>setShowFailed(true)} className="btn btn-danger btn-sm mr-auto">
              عرض التفاصيل
            </button>
          </>)}

          <FailedModal open={showFailed} onClose={()=>setShowFailed(false)} onChanged={()=>{}}/>
        </>
      );
    }

    /* ===================================================================
       متابعة عملاء المعرض — Pipeline / CRM
       مبني على منهجية: مرحلة + احتمال إغلاق مرجّح + درجة أولوية + استهداف
       =================================================================== */
    const SR_TABLE = "showroom_customers";

    /* المراحل مع احتمال الإغلاق (Weighted Pipeline) */
    /* المراحل: تدرّج واحد من الرمادي إلى الأخضر يقرأ كتقدّم، والخسارة وحدها خارج المسار */
    const SR_STAGES = [
      { k:"زائر جديد",      get color(){return tok("faint")},  p:0.10, icon:"user",   hint:"دخل المعرض وسأل — لسه ما تحدّد احتياجه" },
      { k:"تحديد الاحتياج", get color(){return tok("info")},   p:0.25, icon:"target", hint:"عرفنا المساحة والمرحلة والمنتجات" },
      { k:"عرض سعر",        get color(){return tok("accent")}, p:0.50, icon:"doc",    hint:"استلم عرض سعر مكتوب" },
      { k:"تفاوض",          get color(){return tok("warn")},   p:0.70, icon:"bolt",   hint:"يقارن الأسعار أو يطلب تعديلًا" },
      { k:"تم البيع",       get color(){return tok("ok")},     p:1.00, icon:"trophy", hint:"أتمّ الشراء" },
      { k:"خسارة",          get color(){return tok("danger")}, p:0.00, icon:"close",  hint:"ما اكتمل البيع — سجّل السبب" },
    ];
    const SR_STAGE_KEYS  = SR_STAGES.map(s=>s.k);
    const SR_STAGE_MAP   = Object.fromEntries(SR_STAGES.map(s=>[s.k,s]));
    const SR_OPEN_STAGES = ["زائر جديد","تحديد الاحتياج","عرض سعر","تفاوض"];

    const SR_TYPES  = ["مالك فيلا","مالك عمارة","مقاول","مؤسسة","دهان","مطوّر عقاري","محل/تجاري","أخرى"];
    const SR_SOURCES= ["زيارة المعرض","واتساب","إحالة دهان","إحالة مقاول","إحالة مطوّر","إعلان/لوحة","عميل سابق"];
    const SR_BUILD  = ["عظم","لياسة","جاهز للدهان","تشطيب نهائي","تجديد/صيانة"];
    const SR_LOSS   = ["السعر أعلى","اختار منافس","تأجيل المشروع","قرار الدهان","لم يرد/انقطع","لون أو منتج غير متوفر","أخرى"];
    const SR_COMPETITORS = ["جوتن","سافيتو","سيكا","اوسكار","هيمبل","سيجما","777","يو اس جي","ساف","أخرى","لا يوجد"];

    /* المرحلة الإنشائية = أقوى مؤشر على توقيت الشراء */
    const SR_BUILD_WEIGHT = { "جاهز للدهان":30, "تشطيب نهائي":25, "لياسة":20, "تجديد/صيانة":15, "عظم":5 };
    const SR_TYPE_WEIGHT  = { "مقاول":10, "مؤسسة":10, "مطوّر عقاري":10, "مالك عمارة":8, "محل/تجاري":7, "مالك فيلا":5, "دهان":6, "أخرى":3 };

    const SR_TARGET_KEY = "jz_showroom_target";
    const SR_COLD_DAYS  = 7;   /* بعدها يُعدّ العميل بارد */

    function srDaysSince(d){
      if(!d) return 999;
      const t=new Date(String(d).slice(0,10)+"T00:00:00");
      if(isNaN(t.getTime())) return 999;
      return Math.floor((new Date(new Date().toISOString().slice(0,10)+"T00:00:00")-t)/86400000);
    }
    function srMoney(v){ return (Number(v)||0).toLocaleString("en-US"); }
    /* تقدير سريع: لتر يغطي ~10م² للوجه، وجهين ⇒ المساحة÷5 لتر × ~45 ريال للتر */
    function srEstimate(area){ const a=Number(area)||0; return a?Math.round(a/5*45):0; }

    /* درجة الأولوية 0-100 مع تفسير — التفسير هو اللي يخلي المندوب يتحرك */
    function srScore(c){
      const R=[]; let s=0;
      const bw=SR_BUILD_WEIGHT[c.build_stage]||0;
      if(bw){ s+=bw; R.push({ good:bw>=20, t:"مرحلة البناء: "+c.build_stage, v:"+"+bw }); }
      const area=Number(c.area_m2)||0;
      const aw = area>=1000?20 : area>=500?14 : area>=200?8 : area>0?3 : 0;
      if(aw){ s+=aw; R.push({ good:aw>=14, t:"المساحة: "+srMoney(area)+" م²", v:"+"+aw }); }
      const val=Number(c.quote_value)||0;
      const vw = val>=50000?20 : val>=20000?14 : val>=5000?8 : val>0?4 : 0;
      if(vw){ s+=vw; R.push({ good:vw>=14, t:"قيمة العرض: "+srMoney(val)+" ريال", v:"+"+vw }); }
      const tw=SR_TYPE_WEIGHT[c.customer_type]||0;
      if(tw){ s+=tw; R.push({ good:tw>=8, t:"نوع العميل: "+c.customer_type, v:"+"+tw }); }
      if(c.linked_painter||c.linked_contractor){ s+=15; R.push({ good:true, t:"مرتبط بشبكة الـ٥ نجوم", v:"+15" }); }
      const gap=srDaysSince(c.last_contact);
      if(gap<=3){ s+=5; R.push({ good:true, t:"تواصل حديث ("+gap+" يوم)", v:"+5" }); }
      else if(gap>SR_COLD_DAYS && gap<900){ s-=10; R.push({ good:false, t:"بارد — "+gap+" يوم بلا تواصل", v:"−10" }); }
      else if(gap>=900){ s-=8; R.push({ good:false, t:"ما سُجّل أي تواصل", v:"−8" }); }
      if(c.competitor && c.competitor!=="لا يوجد" && c.competitor!=="أخرى"){ s-=5; R.push({ good:false, t:"يقارن مع "+c.competitor, v:"−5" }); }
      if(c.next_followup && c.next_followup < TODAY() && c.followup_status!=="تمت" && c.followup_status!=="ملغاة"){
        s-=8; R.push({ good:false, t:"متابعة متأخرة عن "+c.next_followup, v:"−8" });
      }
      s=Math.max(0,Math.min(100,s));
      const tier = s>=70?"ساخن" : s>=45?"واعد" : "بارد";
      return { score:s, tier, reasons:R };
    }
    const SR_TIER_COLORS = new Proxy({},{ get:(_,k)=>({ "ساخن":tok("danger"), "واعد":tok("warn"), "بارد":tok("faint") })[k] });

    /* رسائل واتساب جاهزة لكل مرحلة — نص بيعي لا يحتاج تعديل */
    function srScript(c){
      const first=(c.name||"").trim().split(/\s+/)[0]||"عميلنا الكريم";
      const me=currentUserName()!=="—"?currentUserName():"فريق الجزيرة";
      const place=c.showroom?(" — "+c.showroom):"";
      const prods=findingsText(c.products);
      const q=Number(c.quote_value)||0;
      const pl=prods?("\nالأنظمة المقترحة: "+prods):"";
      switch(c.stage){
        case "زائر جديد":
          return `السلام عليكم ${first} 🌿\nمعك ${me} من معرض دهانات الجزيرة${place}.\nشرف لنا زيارتك اليوم. سجّلت ملاحظاتي عن مشروعك${pl}\nمتى يناسبك أجهّز لك الكميات والسعر بالتفصيل؟`;
        case "تحديد الاحتياج":
          return `السلام عليكم ${first}\nراجعت مشروعك (${c.project_type||"المشروع"}${c.area_m2?" — "+srMoney(c.area_m2)+" م²":""}) وحسبت الكميات المطلوبة.${pl}\nأرسل لك عرض السعر الرسمي اليوم؟ العرض يشمل النظام كامل من المعجون للوجه الأخير حتى تضمن النتيجة ولا تتفاجأ بتكاليف إضافية.`;
        case "عرض سعر":
          return `السلام عليكم ${first}\nمتابعة لعرض السعر المرسل${q?(" بقيمة "+srMoney(q)+" ريال"):""}.\nحابب أطمّن: وصلك العرض واضح؟ ولو فيه أي بند تحب نراجعه أنا جاهز.\nملاحظة مهمة: الكميات محسوبة على أساس مساحتك الفعلية، فأي تعديل بالمساحة يغيّر السعر — أفضل نثبّته قبل بداية الدهان.`;
        case "تفاوض":
          return `السلام عليكم ${first}\nفهمت أنك تقارن بين أكثر من خيار، وهذا حقك 👍\nخلني أوضح الفرق بشكل عملي: تكلفة اللتر مو هي التكلفة الحقيقية — التكلفة الحقيقية هي كم متر يغطي اللتر وكم سنة يصبر قبل يحتاج إعادة دهان. أنظمتنا تغطي مساحة أكبر لكل لتر، فالتكلفة على المتر تطلع أقل.\nأقدر أرتّب لك دهان معتمد بتقييم ٥ نجوم ينفّذ المشروع بإشرافنا. تحب أرسل لك الاسم؟`;
        case "تم البيع":
          return `مبروك عليك ${first} 🎉\nشكرًا لثقتك في دهانات الجزيرة.${pl}\nنصيحة للتنفيذ: التزم بزمن الجفاف بين الأوجه، وتجنّب الدهان في الرطوبة العالية — هذا اللي يضمن ثبات اللون.\nطلب صغير: لو النتيجة عجبتك، أسعدني بترشيح شخص واحد تعرف أنه في مرحلة الدهان الآن — وأنا أتكفّل بخدمته مثلك تمامًا.`;
        case "خسارة":
          return `السلام عليكم ${first}\nأتفهّم قرارك تمامًا وما فيه أي مشكلة 🌿\nخليت ملفك مفتوح عندي، ولو احتجت أي استشارة عن الألوان أو الكميات — حتى لو ما شريت منّا — راسلني وأنا أساعدك.\nودّي أعرف بصراحة: أكبر سبب خلاك تختار غيرنا كان إيش؟ ملاحظتك تفيدني فعلًا.`;
        default:
          return `السلام عليكم ${first}\nمعك ${me} من دهانات الجزيرة${place}. أتابع معك بخصوص مشروعك.`;
      }
    }

    /* اقتراح الخطوة التالية — يمنع "شنو أسوي الآن؟" */
    function srNextAction(c){
      if(c.stage==="تم البيع")  return { t:"اطلب إحالة وصورة للمشروع بعد التنفيذ", c:"var(--ink-2)" };
      if(c.stage==="خسارة")     return { t:"اسأل عن سبب الخسارة واحفظه، وأعد التواصل بعد ٣٠ يومًا", c:"var(--danger)" };
      if(!c.phone)              return { t:"ما فيه رقم جوال — العميل مفقود بدونه", c:"var(--danger)", warn:true };
      if(c.stage==="زائر جديد") return { t:"اتصل خلال ٢٤ ساعة وحدّد المساحة ومرحلة البناء", c:"var(--ink-2)" };
      if(c.stage==="تحديد الاحتياج") return { t:"أرسل عرض السعر — لا تتأخر أكثر من ٤٨ ساعة", c:"var(--ink-2)" };
      if(c.stage==="عرض سعر"){
        const g=srDaysSince(c.last_contact);
        return g>3 ? { t:"مرّ "+g+" يومًا على آخر تواصل — تابع العرض الآن", c:"var(--danger)" }
                   : { t:"تأكد أن العرض وصل وواضح، وثبّت موعد القرار", c:"var(--ink-2)" };
      }
      if(c.stage==="تفاوض")     return { t:"اربطه بدهان ٥ نجوم وأغلق البيع — لا تنزل السعر أولًا", c:"var(--ink-2)" };
      return { t:"حدّد الخطوة التالية", c:"var(--ink-3)" };
    }

    /* ===== شبكة الـ٥ نجوم: الدهانون والمؤسسات والمطوّرون بتقييم ٥ فقط ===== */
    function SrElite({ elite, onRefer }){
      const [tab,setTab]=useState("painters");
      const groups={
        painters:{ label:"دهانون ٥ نجوم", rows:elite.painters, color:"var(--info)" },
        orgs:{ label:"مؤسسات ٥ نجوم", rows:elite.orgs, color:"var(--ink-2)" },
        contractors:{ label:"مطوّرون ٥ نجوم", rows:elite.contractors, color:"var(--accent)" },
      };
      const g=groups[tab];
      return (
        <div className={"rounded-2xl p-4 "+cCard}>
          <div className="flex items-center gap-2 mb-1">
            <Icon n="star" s={16} c="text-[color:var(--warn)]"/>
            <h3 className="font-semibold t-sm">شبكة الخمس نجوم</h3>
            <span className={"t-2xs mr-auto "+cMuted}>{elite.painters.length+elite.orgs.length+elite.contractors.length} جهة</span>
          </div>
          <p className={"t-2xs mb-3 "+cMuted}>
            اربط العميل بجهة من هنا. الربط يرفع أولوية العميل ويُسجّل تلقائيًا كإحالة في ملف الجهة.
          </p>
          <div className="flex gap-1.5 mb-3 overflow-x-auto no-scrollbar">
            {Object.keys(groups).map(k=>(
              <button key={k} onClick={()=>setTab(k)}
                className={"shrink-0 px-3 py-1.5 rounded-xl t-2xs font-bold transition "+(tab===k?cBtn:cMuted+" "+cTrack+" "+cHover)}>
                {groups[k].label} ({groups[k].rows.length})
              </button>
            ))}
          </div>
          {g.rows.length===0 ? (
            <div className={"t-2xs rounded-xl p-3 "+cTrack+" "+cMuted}>
              ما فيه جهة بتقييم ٥ نجوم في هذا القسم. ارفع تقييم أفضل تعاملاتك إلى ٥ من صفحتهم وسيظهرون هنا.
            </div>
          ) : (
            <div className="space-y-2 max-h-72 overflow-y-auto">
              {g.rows.map(r=>(
                <div key={r.id} className={"rounded-xl p-3 flex items-center gap-2 "+cTrack}>
                  <div className="min-w-0 flex-1">
                    <div className="font-bold t-2xs truncate">{r.name}</div>
                    <div className={"t-chip truncate "+cMuted}>{r.city||"—"}{r.showroom?" · "+r.showroom:""}</div>
                    <Stars n={5}/>
                  </div>
                  <WhatsAppButton phone={r.phone} iconOnly size={14}/>
                  <button onClick={()=>onRefer(r,tab)} title="إحالة عميل إلى هذه الجهة"
                    className={"px-2.5 py-1.5 rounded-lg t-chip font-bold shrink-0 "+cBtn}>إحالة</button>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    /* ===== لوحة الاستهداف (التصفية المتقدمة) ===== */
    function SrTargeting({ f, setF, rows, open, setOpen }){
      const set=(k,v)=>setF(x=>({...x,[k]:v}));
      const uniq=k=>[...new Set(rows.map(r=>r[k]).filter(Boolean))];
      const Toggle=({k,label,color,icon})=>{
        const on_=!!f[k];
        return (
          <button onClick={()=>set(k,!on_)} aria-pressed={on_} className={"btn btn-sm "+(on_?"":"btn-ghost")}
            style={on_?{color,background:`color-mix(in srgb, ${color} 12%, transparent)`,borderColor:`color-mix(in srgb, ${color} 34%, transparent)`}:{}}>
            {icon&&<Icon n={icon} s={12}/>}{label}
          </button>);
      };
      const active=["onlyDue","onlyHot","onlyQuoted","onlyCold","onlyReady","onlyLinked","onlyUnlinked"].filter(k=>f[k]).length
        + ["city","showroom","type","stage","build","competitor","source"].filter(k=>f[k]).length
        + (Number(f.minValue)>0?1:0);
      return (
        <div className={"rounded-2xl p-3 "+cCard}>
          <div className="flex items-center gap-2">
            <Icon n="filter" s={15} c="txt-dim"/>
            <span className="font-semibold t-sm">لوحة الاستهداف</span>
            {active>0 && <span className="t-chip font-bold px-2 py-0.5 rounded-full bg-[color:var(--action)] text-white">{active} مُطبَّق</span>}
            <div className="mr-auto flex items-center gap-1.5">
              {active>0 && (
                <button onClick={()=>setF(srEmptyFilters())} className="btn btn-ghost btn-sm">مسح</button>
              )}
              <button onClick={()=>setOpen(!open)} aria-expanded={open} className="btn btn-ghost btn-sm">
                {open?"إخفاء":"تحكّم"}
              </button>
            </div>
          </div>

          <div className="field mt-3 flex items-center gap-2 px-3" style={{paddingTop:0,paddingBottom:0,height:38}}>
            <Icon n="search" s={15} c={cMuted}/>
            <input value={f.q} onChange={e=>set("q",e.target.value)} placeholder="ابحث بالاسم أو الجوال أو الملاحظات..."
              className="bg-transparent outline-none t-sm w-full min-w-0 h-full"/>
            {f.q && <button onClick={()=>set("q","")} aria-label="مسح البحث" className="btn-icon shrink-0" style={{width:26,height:26}}><Icon n="close" s={13}/></button>}
          </div>

          <div className="mt-2.5 flex gap-1.5 flex-wrap">
            <Toggle k="onlyDue"      label="متابعة مستحقة"  icon="clock"  color="var(--danger)"/>
            <Toggle k="onlyHot"      label="ساخن فقط"       icon="bolt"   color="var(--warn)"/>
            <Toggle k="onlyQuoted"   label="عرض بلا إغلاق"   icon="doc"    color="var(--accent)"/>
            <Toggle k="onlyReady"    label="جاهز للدهان"     icon="brush"  color="var(--ok)"/>
            <Toggle k="onlyCold"     label={"بارد +"+f.coldDays+" يوم"} icon="minus" color="var(--info)"/>
            <Toggle k="onlyLinked"   label="مرتبط بالشبكة"   icon="star"   color="var(--ink-2)"/>
            <Toggle k="onlyUnlinked" label="بلا ربط"           color={tok("neutral")}/>
          </div>

          {open && (
            <div className="mt-3 grid grid-cols-2 sm:grid-cols-3 gap-2.5 fade">
              <Sel label="المعرض"     v={f.showroom}   on={v=>set("showroom",v)}   opts={["", ...SHOWROOMS_OPTS]}/>
              <Sel label="المدينة"    v={f.city}       on={v=>set("city",v)}       opts={["", ...CITIES]}/>
              <Sel label="نوع العميل" v={f.type}       on={v=>set("type",v)}       opts={["", ...SR_TYPES]}/>
              <Sel label="المرحلة"    v={f.stage}      on={v=>set("stage",v)}      opts={["", ...SR_STAGE_KEYS]}/>
              <Sel label="مرحلة البناء" v={f.build}    on={v=>set("build",v)}      opts={["", ...SR_BUILD]}/>
              <Sel label="المنافس"    v={f.competitor} on={v=>set("competitor",v)} opts={["", ...SR_COMPETITORS]}/>
              <Sel label="المصدر"     v={f.source}     on={v=>set("source",v)}     opts={["", ...SR_SOURCES]}/>
              <Inp label="أقل قيمة عرض (ريال)" type="number" v={f.minValue} on={v=>set("minValue",v)}/>
              <Inp label="حد البرودة (يوم)"    type="number" v={f.coldDays} on={v=>set("coldDays",v)}/>
            </div>
          )}
        </div>
      );
    }

    function srEmptyFilters(){
      return { q:"", city:"", showroom:"", type:"", stage:"", build:"", competitor:"", source:"",
        onlyDue:false, onlyHot:false, onlyQuoted:false, onlyCold:false, onlyReady:false,
        onlyLinked:false, onlyUnlinked:false, minValue:0, coldDays:SR_COLD_DAYS };
    }

    /* ===== كرت العميل ===== */
    function SrCard({ c, onOpen, onMove }){
      const st=SR_STAGE_MAP[c.stage]||SR_STAGES[0];
      const sc=srScore(c);
      const due=c.next_followup && c.next_followup<=TODAY() && c.followup_status!=="تمت" && c.followup_status!=="ملغاة";
      const late=c.next_followup && c.next_followup<TODAY() && c.followup_status!=="تمت" && c.followup_status!=="ملغاة";
      const val=Number(c.quote_value)||Number(c.deal_value)||0;
      const idx=SR_STAGE_KEYS.indexOf(c.stage);
      return (
        <div className={"rounded-xl p-3 border-r-4 "+cCard+" "+cHover} style={{borderRightColor:st.color}}>
          <button onClick={()=>onOpen(c)} className="w-full text-right">
            <div className="flex items-start gap-2">
              <div className="min-w-0 flex-1">
                <div className="font-semibold t-2xs truncate">{c.name||"بلا اسم"}</div>
                <div className={"t-chip truncate mt-0.5 "+cMuted}>
                  {c.customer_type||"—"}{c.city?" · "+c.city:""}{c.area_m2?" · "+srMoney(c.area_m2)+"م²":""}
                </div>
              </div>
              <span className="t-chip font-semibold px-1.5 py-0.5 rounded-md shrink-0"
                style={{color:SR_TIER_COLORS[sc.tier],background:SR_TIER_COLORS[sc.tier]+"1f"}}>{sc.score}</span>
            </div>
            <div className="flex flex-wrap gap-1 mt-2">
              {c._pending && <Pill text="بانتظار المزامنة" color="var(--warn)"/>}
              {val>0 && <Pill text={srMoney(val)+" ريال"} color={tok("ok")}/>}
              {c.build_stage && <Pill text={c.build_stage} color={SR_BUILD_WEIGHT[c.build_stage]>=20?tok("ok"):tok("neutral")}/>}
              {late ? <Pill text="متابعة متأخرة" color={tok("danger")}/> : due ? <Pill text="متابعة اليوم" color={tok("warn")}/> : null}
              {(c.linked_painter||c.linked_contractor) && <Pill text={c.linked_painter||c.linked_contractor} color="var(--ink-2)"/>}
              {c.competitor && c.competitor!=="لا يوجد" && <Pill text={"ضد "+c.competitor} color={tok("danger")}/>}
            </div>
          </button>
          <div className={"flex items-center gap-1 mt-2.5 pt-2 border-t "+cBorder}>
            <WhatsAppButton phone={c.phone} iconOnly size={14}/>
            {idx>0 && idx<4 && (
              <button onClick={()=>onMove(c,SR_STAGE_KEYS[idx-1])} title="إرجاع مرحلة"
                className="btn-icon tap shrink-0"><Icon n="chevron" s={14} c="rotate-180"/></button>
            )}
            {idx<4 && (
              <button onClick={()=>onMove(c,SR_STAGE_KEYS[idx+1])}
                className="tap mr-auto px-2.5 py-1.5 rounded-[6px] t-chip font-semibold text-white shrink-0"
                style={{background:SR_STAGE_MAP[SR_STAGE_KEYS[idx+1]].color}}>
                {SR_STAGE_KEYS[idx+1]} ←
              </button>
            )}
          </div>
        </div>
      );
    }

    /* ===== تفاصيل العميل + الإجراءات السريعة ===== */
    function SrDetail({ c, onClose, onEdit, onDelete, onPatch, elite }){
      const srDetailRef=useModalBehaviour(!!c, onClose);
      /* كل الـ hooks قبل أي خروج مبكر — وإلا ينهار React عند إغلاق النافذة وفتحها */
      const [msg,setMsg]=useState("");
      const [copied,setCopied]=useState(false);
      useEffect(()=>{ if(c){ setMsg(srScript(c)); setCopied(false); } },[c&&c.id, c&&c.stage]);
      if(!c) return null;
      const sc=srScore(c);
      const na=srNextAction(c);
      const st=SR_STAGE_MAP[c.stage]||SR_STAGES[0];
      const link=waLink(c.phone,msg);
      const prods=findingsText(c.products);
      const gap=srDaysSince(c.last_contact);

      return (
