                      className="chip tap transition-colors"
                      style={ planned ? {color:"var(--accent)",background:"var(--accent-soft)",borderColor:"var(--accent-line)",fontWeight:600,padding:"5px 10px"}
                            : n ? {color:"var(--ink-2)",background:"var(--surface-2)",borderColor:"var(--line)",padding:"5px 10px"}
                                : {color:"var(--ink-3)",background:"transparent",borderColor:"var(--line)",padding:"5px 10px"}}>
                      {city}{n?<span className="tnum opacity-70"> {n}</span>:null}
                    </button>);
                })}
              </div>
            </div>
          </section>

          {/* ═══ الزخم الأسبوعي ═══ */}
          <section className="grid grid-cols-2 lg:grid-cols-4 gap-2.5 sm:gap-3">
            <Kpi label="زياراتك هذا الأسبوع" value={thisWeekVisits} icon="pin" color="var(--ink-2)"
              trend={delta(thisWeekVisits,lastWeekVisits)} spark={daySeries.map(x=>x.value)}
              sub={"الأسبوع الماضي "+lastWeekVisits}/>
            <Kpi label="تفاعلاتك هذا الأسبوع" value={thisWeekInter} icon="bolt" color="var(--ink-2)"
              trend={delta(thisWeekInter,lastWeekInter)} sub={"الأسبوع الماضي "+lastWeekInter}/>
            <Kpi label="متأخرة" value={overdue.length} icon="alert"
              color={overdue.length?"var(--danger)":"var(--ok)"} tone={overdue.length?"var(--danger)":undefined}
              sub={overdue.length?"تحتاج تحرّكًا الآن":"لا شيء متأخر"}/>
            <Kpi label="فرص مفتوحة في المعرض" value={hot.length?(showroom||[]).filter(c=>SR_OPEN_STAGES.includes(c.stage)).length:0}
              icon="target" color="var(--ink-2)" onClick={()=>onGo&&onGo("showroom")}
              sub={hot.length?"أقربها "+hot[0].c.name:null}/>
          </section>

          {/* ═══ يحتاج تحرّكًا الآن ═══ */}
          <section className="card p-4 sm:p-5">
            <header className="flex items-center justify-between gap-3 mb-4">
              <h2 className="t-md font-semibold flex items-center gap-2">
                يحتاج تحرّكًا الآن
                <span className="chip tnum" style={tasks.length
                  ? {color:"var(--danger)",background:"var(--danger-soft)",borderColor:"var(--danger-line)"}
                  : {color:"var(--ink-3)",background:"var(--surface-2)",borderColor:"var(--line)"}}>{tasks.length}</span>
              </h2>
              <button onClick={()=>onGo&&onGo("tasks")} className="btn btn-ghost btn-sm shrink-0">كل المتابعات</button>
            </header>

            {tasks.length===0 ? (
              <div className="text-center py-10">
                <span className="w-12 h-12 rounded-[11px] flex items-center justify-center mx-auto mb-3"
                  style={{background:"var(--ok-soft)",color:"var(--ok)"}}><Icon n="check" s={22}/></span>
                <p className="t-sm font-medium">ما فيه متابعة متأخرة أو مستحقّة</p>
                <p className="t-2xs txt-muted mt-1">وقت جيد لزيارة ميدانية أو لفتح فرصة جديدة.</p>
              </div>
            ) : (
              <div className="divide-hair">
                {tasks.slice(0,8).map(t=>(
                  <div key={t.tbl+t.id} className="flex items-center gap-3 py-2.5">
                    <span className="w-1.5 h-1.5 rounded-full shrink-0"
                      style={{background:t.overdue?"var(--danger)":"var(--warn)"}}/>
                    <button onClick={()=>onGo&&onGo(t.tbl)} className="min-w-0 flex-1 text-right rounded-[6px]">
                      <div className="t-2xs font-medium truncate">{t.name}</div>
                      <div className="t-chip txt-dim truncate mt-0.5">
                        {t.label} · {t.city||"—"} ·{" "}
                        <span className="tnum" style={t.overdue?{color:"var(--danger)"}:undefined}>
                          {t.overdue?`متأخرة ${daysAgo(t.date)} يوم`:"اليوم"}
                        </span>
                      </div>
                    </button>
                    <div className="flex items-center gap-1.5 shrink-0">
                      {t.phone&&<a href={"tel:"+t.phone} aria-label={"اتصال بـ"+t.name} title="اتصال"
                        className="tap w-8 h-8 rounded-[7px] flex items-center justify-center"
                        style={{color:"var(--ink-2)",background:"var(--surface-2)"}}><Icon n="target" s={14}/></a>}
                      {t.phone&&waLink(t.phone)&&<a href={waLink(t.phone)} target="_blank" rel="noopener noreferrer"
                        aria-label={"واتساب إلى "+t.name} title="واتساب"
                        className="tap w-8 h-8 rounded-[7px] flex items-center justify-center"
                        style={{color:"var(--ok)",background:"var(--ok-soft)"}}><Icon n="whatsapp" s={14}/></a>}
                      <SnoozeMenu compact onSnooze={days=>snooze(t,days)}/>
                      <button onClick={()=>markDone(t)} disabled={busy===t.tbl+t.id}
                        aria-label={"تمّت متابعة "+t.name} title="تمّت"
                        className="tap w-8 h-8 rounded-[7px] flex items-center justify-center disabled:opacity-50"
                        style={{color:"var(--ok)",background:"var(--ok-soft)"}}>
                        {busy===t.tbl+t.id?<Icon n="refresh" s={13} c="spin"/>:<Icon n="check" s={15}/>}
                      </button>
                    </div>
                  </div>))}
                {tasks.length>8 && (
                  <button onClick={()=>onGo&&onGo("tasks")} className="btn btn-ghost btn-sm btn-block mt-2.5">
                    و{tasks.length-8} متابعة أخرى</button>)}
              </div>
            )}
          </section>

          {/* ═══ أقرب الفرص للإغلاق ═══ */}
          {hot.length>0 && (
            <section className="card p-4 sm:p-5">
              <header className="flex items-center justify-between gap-3 mb-4">
                <h2 className="t-md font-semibold">أقرب الفرص للإغلاق</h2>
                <button onClick={()=>onGo&&onGo("showroom")} className="btn btn-ghost btn-sm shrink-0">الأنبوب</button>
              </header>
              <div className="divide-hair">
                {hot.map(({c,s})=>{
                  const na=srNextAction(c);
                  return (
                    <button key={c.id} onClick={()=>onGo&&onGo("showroom")}
                      className="w-full flex items-center gap-3 py-2.5 text-right rounded-[6px] row-hover px-1 -mx-1">
                      <span className="chip tnum shrink-0"
                        style={{color:SR_TIER_COLORS[s.tier],background:`color-mix(in srgb, ${SR_TIER_COLORS[s.tier]} 12%, transparent)`,
                                borderColor:`color-mix(in srgb, ${SR_TIER_COLORS[s.tier]} 26%, transparent)`}}>{s.score}</span>
                      <span className="min-w-0 flex-1">
                        <span className="block t-2xs font-medium truncate">{c.name}
                          <span className="txt-dim font-normal"> · {c.stage}</span></span>
                        <span className="block t-chip truncate mt-0.5" style={{color:na.c}}>{na.t}</span>
                      </span>
                      <span className="t-2xs tnum shrink-0 txt-muted">{srMoney(c.quote_value)} <span className="txt-dim">ريال</span></span>
                    </button>);
                })}
              </div>
            </section>
          )}

          {/* ═══ الأداء — الأرقام الإجمالية، بعد العمل لا قبله ═══ */}
          <section>
            <div className="flex items-baseline justify-between gap-3 mb-3 pt-2">
              <h2 className="t-md font-semibold">الأداء</h2>
              <span className="t-chip txt-dim">صورة عامة عن قاعدتك وحصّتك</span>
            </div>
            <Dashboard onGo={onGo} preloaded={d}/>
          </section>

          <CallMode open={callOpen} tasks={tasks} onClose={()=>setCallOpen(false)}
            onDone={markDone} onSnooze={snooze}/>
        </div>
      );
    }

    /* ===== حساب الحصة السوقية (يقرأ المنتجات المرصودة في المشاريع والزيارات بالتزامن) ===== */
    function computeMarketShare(projects, visits){
      const all=[...(projects||[]),...(visits||[])];
      const perFamily={};   // family -> {company -> count}
      const overall={};     // company -> count
      let total=0;
      CATALOG.forEach(f=>perFamily[f.family]={});
      all.forEach(rec=>{ parseFindings(rec.products).forEach(x=>{ const fam=x.f|| (PIDX[x.p]&&PIDX[x.p].family) ||"غير مصنّف"; const co=x.c||"أخرى (تجاري)";
        if(!perFamily[fam]) perFamily[fam]={}; perFamily[fam][co]=(perFamily[fam][co]||0)+1; overall[co]=(overall[co]||0)+1; total++; }); });
      return { perFamily, overall, total };
    }

    /* ===== تبويب المنتجات (كتالوج قابل للتعديل بالكامل) ===== */
    function ProductsPage() {
      const [, force]=useState(0); const rerender=()=>force(x=>x+1);
      const [openFam,setOpenFam]=useState(CATALOG[0]?CATALOG[0].id:null);
      const [editor,setEditor]=useState(null); // {famId, idx|null, c, p}
      const [famEditor,setFamEditor]=useState(null);
      const prodRef=useModalBehaviour(!!editor, ()=>setEditor(null));
      const famRef=useModalBehaviour(!!famEditor, ()=>setFamEditor(null)); // {idx|null, family, color, icon}
      const [q,setQ]=useState("");
      function saveProduct(){ const {famId,idx,c,p}=editor; if(!p.trim()||!c.trim()){toast("اكتب اسم المنتج والشركة","warn");return;}
        const next=JSON.parse(JSON.stringify(CATALOG)); const fam=next.find(f=>f.id===famId);
        if(idx==null) fam.items.push({c:c.trim(),p:p.trim()}); else fam.items[idx]={c:c.trim(),p:p.trim()};
        persistCatalog(next); setEditor(null); rerender(); }
      async function delProduct(famId,idx){ if(!await confirmDialog("سيُحذف هذا المنتج من الكتالوج.",{confirmLabel:"حذف المنتج"}))return; const next=JSON.parse(JSON.stringify(CATALOG)); next.find(f=>f.id===famId).items.splice(idx,1); persistCatalog(next); rerender(); }
      function saveFam(){ const {idx,family,color,icon}=famEditor; if(!family.trim()){toast("اكتب اسم العائلة","warn");return;}
        const next=JSON.parse(JSON.stringify(CATALOG));
        if(idx==null) next.push({id:"f"+Date.now(),family:family.trim(),color,icon:icon||"layers",items:[]}); else { next[idx].family=family.trim(); next[idx].color=color; next[idx].icon=icon||next[idx].icon; }
        persistCatalog(next); setFamEditor(null); rerender(); }
      async function delFam(idx){ if(!await confirmDialog("ستُحذف العائلة وكل المنتجات داخلها.",{confirmLabel:"حذف العائلة"}))return; const next=JSON.parse(JSON.stringify(CATALOG)); next.splice(idx,1); persistCatalog(next); rerender(); }
      async function resetCatalog(){ if(!await confirmDialog("سيُستبدل الكتالوج الحالي بالكتالوج الأصلي، وتُفقد كل تعديلاتك عليه.",{title:"استرجاع الكتالوج الأصلي",confirmLabel:"استرجاع"}))return; persistCatalog(JSON.parse(JSON.stringify(DEFAULT_CATALOG))); rerender(); }

      const ICONS=["layers","shield","brush","home","drop","umbrella","building","star"];
      const PALETTE=[tok("info"),tok("ok"),tok("accent"),tok("warn"),tok("info"),tok("danger"),tok("accent"),tok("accent"),tok("warn"),tok("info")];
      return (
        <div className="space-y-4">
          <PageHeader title="كتالوج المنتجات"
            lede={`${CATALOG.length} عائلة · ${CATALOG.reduce((a,f)=>a+f.items.length,0)} منتج · قابل للتعديل بالكامل`}
            actions={<>
              <button onClick={()=>setFamEditor({idx:null,family:"",color:PALETTE[0],icon:"layers"})} className="btn btn-primary btn-sm"><Icon n="plus" s={13}/> عائلة</button>
              <button onClick={resetCatalog} className="btn btn-ghost btn-sm">استرجاع الأصلي</button>
            </>}/>
          <div className="field flex items-center gap-2 px-3" style={{paddingTop:0,paddingBottom:0,height:40}}><Icon n="search" s={15} c="txt-dim shrink-0"/><input value={q} onChange={e=>setQ(e.target.value)} placeholder="ابحث عن منتج أو شركة" aria-label="بحث في الكتالوج" className="bg-transparent outline-none t-sm w-full min-w-0 h-full"/></div>

          {CATALOG.map((fam,fi)=>{ const items=fam.items.filter(it=>!q.trim()||(it.p+" "+it.c).includes(q.trim())); if(q.trim()&&items.length===0) return null; const open=openFam===fam.id||q.trim();
            const byCo={}; items.forEach(it=>{ (byCo[it.c]=byCo[it.c]||[]).push(it); });
            return (<div key={fam.id} className={"overflow-hidden "+cCard}>
              <button onClick={()=>setOpenFam(open&&!q.trim()?null:fam.id)} className="w-full flex items-center justify-between gap-2 p-4 text-right">
                <div className="flex items-center gap-3"><span className="w-10 h-10 rounded-[10px] flex items-center justify-center shrink-0" style={{background:famColor(fam)+"18",color:famColor(fam)}}><Icon n={fam.icon} s={19}/></span>
                  <div><div className="font-semibold t-sm">{fam.family}</div><div className={"t-chip "+cMuted}>{fam.items.length} منتج · {new Set(fam.items.map(x=>x.c)).size} شركة</div></div></div>
                <div className="flex items-center gap-1">
                  <button type="button" onClick={e=>{e.stopPropagation();setFamEditor({idx:fi,family:fam.family,color:famColor(fam),icon:fam.icon});}} aria-label={"تعديل عائلة "+fam.family} className="btn-icon tap"><Icon n="edit" s={15}/></button>
                  <button type="button" onClick={e=>{e.stopPropagation();delFam(fi);}} aria-label={"حذف عائلة "+fam.family} className="btn-icon tap" style={{color:"var(--danger)"}}><Icon n="trash" s={15}/></button>
                  <Icon n="chevron" s={16} c={cMuted+(open?" rotate-90":"")}/>
                </div>
              </button>
              {open&&(<div className="px-4 pb-4 space-y-3 fade">
                {Object.keys(byCo).map(co=>(<div key={co}>
                  <div className="flex items-center gap-1.5 mb-1.5"><span className="w-2.5 h-2.5 rounded-full" style={{background:companyColor(co)}}/><span className="t-2xs font-semibold" style={{color:companyColor(co)}}>{co}{isOwn(co)?" — شركتنا":""}</span></div>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-1.5">
                    {byCo[co].map(it=>{ const realIdx=fam.items.indexOf(it); const col=companyColor(co);
                      return (<div key={realIdx} className="group flex items-center justify-between gap-1 rounded-xl px-2.5 py-2 t-2xs font-bold" style={{background:col+"10",color:col,border:"1px solid "+col+"2e"}}>
                        <span className="truncate">{it.p}</span>
                        <span className="flex items-center gap-0.5 opacity-0 group-hover:opacity-100 transition">
                          <button onClick={()=>setEditor({famId:fam.id,idx:realIdx,c:it.c,p:it.p})} aria-label={"تعديل "+it.p} className="tap p-1.5 rounded-[5px]"><Icon n="edit" s={13}/></button>
                          <button onClick={()=>delProduct(fam.id,realIdx)} aria-label={"حذف "+it.p} className="tap p-1.5 rounded-[5px] text-[color:var(--danger)]"><Icon n="trash" s={13}/></button>
                        </span></div>);})}
                  </div></div>))}
                <button onClick={()=>setEditor({famId:fam.id,idx:null,c:OWN_COMPANY,p:""})} className="btn btn-ghost btn-sm btn-block mt-2"><Icon n="plus" s={14}/> إضافة منتج لهذه العائلة</button>
              </div>)}
            </div>);})}

          {editor&&(<div role="dialog" aria-modal="true" className="sheet-shell" onMouseDown={e=>{ if(e.target===e.currentTarget) setEditor(null); }}>
            <div dir="rtl" onClick={e=>e.stopPropagation()} ref={prodRef} tabIndex={-1} className="sheet-body" style={{maxWidth:440}}>
              <div className="sheet-head"><div className="font-semibold t-sm">{editor.idx==null?"إضافة منتج":"تعديل منتج"}</div><button onClick={()=>setEditor(null)} aria-label="إغلاق" className="btn-icon tap shrink-0"><Icon n="close" s={17}/></button></div>
              <div className="space-y-3">
                <label className="block"><span className={"t-2xs font-bold "+cMuted}>الشركة</span>
                  <div className="flex flex-wrap gap-1.5 mt-1.5">{Object.keys(COMPANY_COLORS).map(c=>(<button key={c} onClick={()=>setEditor({...editor,c})} className="px-2.5 py-1 rounded-lg t-2xs font-bold" style={editor.c===c?{background:companyColor(c),color:"#fff"}:{background:companyColor(c)+"18",color:companyColor(c)}}>{c}</button>))}</div></label>
                <Inp label="اسم المنتج" v={editor.p} on={v=>setEditor({...editor,p:v})}/>
              </div>
              <button onClick={saveProduct} className="btn btn-primary btn-lg btn-block mt-6 press"><Icon n="save" s={15}/> حفظ</button>
            </div></div>)}

          {famEditor&&(<div role="dialog" aria-modal="true" className="sheet-shell" onMouseDown={e=>{ if(e.target===e.currentTarget) setFamEditor(null); }}>
            <div dir="rtl" onClick={e=>e.stopPropagation()} ref={famRef} tabIndex={-1} className="sheet-body" style={{maxWidth:440}}>
              <div className="sheet-head"><div className="font-semibold t-sm">{famEditor.idx==null?"عائلة جديدة":"تعديل العائلة"}</div><button onClick={()=>setFamEditor(null)} aria-label="إغلاق" className="btn-icon tap shrink-0"><Icon n="close" s={17}/></button></div>
              <div className="space-y-3">
                <Inp label="اسم العائلة" v={famEditor.family} on={v=>setFamEditor({...famEditor,family:v})}/>
                <div><span className={"t-2xs font-bold "+cMuted}>اللون</span><div className="flex flex-wrap gap-1.5 mt-1.5">{PALETTE.map(c=><button key={c} onClick={()=>setFamEditor({...famEditor,color:c})} className="w-7 h-7 rounded-lg" style={{background:c,outline:famEditor.color===c?"2px solid #000":"none",outlineOffset:"2px"}}/>)}</div></div>
                <div><span className={"t-2xs font-bold "+cMuted}>الأيقونة</span><div className="flex flex-wrap gap-1.5 mt-1.5">{ICONS.map(ic=><button key={ic} onClick={()=>setFamEditor({...famEditor,icon:ic})} className={"w-9 h-9 rounded-lg flex items-center justify-center "+(famEditor.icon===ic?"text-white":cTrack+" "+cMuted)} style={famEditor.icon===ic?{background:famEditor.color}:{}}><Icon n={ic} s={16}/></button>)}</div></div>
              </div>
              <button onClick={saveFam} className="btn btn-primary btn-lg btn-block mt-6 press"><Icon n="save" s={15}/> حفظ</button>
            </div></div>)}
        </div>
      );
    }

    /* ===== تبويب الحصة السوقية ===== */
    function MarketSharePage() {
      const [data,setData]=useState(null); const [famSel,setFamSel]=useState("الكل"); const [citySel,setCitySel]=useState("كل المدن");
      useEffect(()=>{(async()=>{ const [pr,v]=await Promise.all([db.from("projects").select("*"),db.from("visits").select("*")]); setData({projects:pr.data||[],visits:v.data||[]}); })()},[]);
      if(!data) return <ReportSkeleton/>;
      const fProjects = citySel==="كل المدن"? data.projects : data.projects.filter(p=>p.city===citySel);
      const fVisits   = citySel==="كل المدن"? data.visits   : data.visits.filter(v=>v.location===citySel);
      const ms=computeMarketShare(fProjects,fVisits);
      const overallArr=Object.entries(ms.overall).map(([label,value])=>({label,value,color:companyColor(label)})).sort((a,b)=>b.value-a.value);
      const ownShare=ms.total?Math.round((ms.overall[OWN_COMPANY]||0)/ms.total*100):0;
      const rank=overallArr.findIndex(x=>x.label===OWN_COMPANY)+1;
      const fams=ms.total===0?[]:CATALOG.filter(f=>famSel==="الكل"||f.family===famSel);
      const Card=({children,cls=""})=>(<div className={"p-4 "+cCard+" "+cls}>{children}</div>);
      /* الحصة لكل مدينة تُحسب من كامل البيانات لا من المصفّاة، وإلا انهار الجدول عند التصفية */
      const cityRows=CITIES.map(city=>{
        const pj=data.projects.filter(p=>p.city===city);
        const vs=data.visits.filter(v=>v.location===city);
        const m=computeMarketShare(pj,vs);
        const own=m.overall[OWN_COMPANY]||0;
        return { city, tot:m.total, share:m.total?Math.round(own/m.total*100):0 };
      }).filter(r=>r.tot>0).sort((a,b)=>a.share-b.share||b.tot-a.tot);

      const famShare=fam=>{ const m=ms.perFamily[fam.family]||{}; const tot=Object.values(m).reduce((a,b)=>a+b,0);
        const arr=Object.entries(m).map(([label,value])=>({label,value,color:companyColor(label)})).sort((a,b)=>b.value-a.value); return {tot,arr}; };

      if(ms.total===0) return (<div className="space-y-4">
        <PageHeader title="الحصة السوقية" lede="تُحسب آليًا من المنتجات المرصودة في زياراتك الميدانية."/>
        <div className={"rounded-2xl p-10 text-center "+cCard}><div className={"t-sm "+cMuted}>لا توجد منتجات مرصودة بعد.</div><p className={"t-2xs mt-2 "+cMuted}>سجّل المنتجات التي تجدها في المشاريع أثناء الزيارات الميدانية من شريط الزيارة السريعة، وستُحتسب الحصة تلقائيًا.</p></div>
      </div>);

      return (<div className="space-y-4">
        <PageHeader title="الحصة السوقية"
          lede={(citySel==="كل المدن"?"كل مدن إقليم جازان":("مدينة "+citySel))+" · "+ms.total+" رصدة منتج"}
          stats={[
            { value:ownShare+"%", label:"حصة الجزيرة", tone:"var(--accent)" },
            { value:"#"+(rank||"-"), label:"ترتيب الجزيرة بين الشركات" },
            { value:ms.total, label:"إجمالي الرصدات" },
          ]}/>

        {/* أين نكسب وأين نخسر — السؤال الأول */}
        <Card>
          <div className="flex items-baseline justify-between gap-3 mb-4">
            <div className="t-sm font-semibold">حصّتنا في كل مدينة</div>
            <span className="t-chip txt-dim">الأضعف أولًا — وهي وجهة الأسبوع القادم</span>
          </div>
          <CityShareMap rows={cityRows} onPick={setCitySel} selected={citySel}/>
        </Card>

        <Card><div className="t-sm font-semibold mb-4">الحصة الإجمالية بين الشركات</div>
          <Donut data={overallArr} centerLabel="رصدة"/></Card>

        <Card><div className="t-sm font-semibold mb-4">ترتيب الشركات</div>
          <div className="space-y-2.5">{overallArr.map((c,i)=>{ const pct=Math.round(c.value/ms.total*100); const own=c.label===OWN_COMPANY;
            return (<div key={c.label} className={own?"rounded-xl p-2 -m-2 bg-[color:var(--surface-2)] ":""}>
              <div className="flex justify-between mb-1 t-2xs"><span className="font-bold flex items-center gap-1.5"><span className="w-5 h-5 rounded-[5px] t-chip tnum flex items-center justify-center shrink-0" style={{background:"var(--surface-2)",color:"var(--ink-3)",border:"1px solid var(--line)"}}>{i+1}</span>{c.label}{own?<span className="txt-dim font-normal"> · نحن</span>:null}</span><span className="font-semibold tnum" style={{color:c.color}}>{pct}% · {c.value}</span></div>
              <div className={"h-2.5 rounded-full overflow-hidden "+cTrack}><div className="h-2.5 rounded-full" style={{width:pct+"%",background:c.color}}/></div></div>);})}</div></Card>

        <div className="space-y-2.5 pt-2">
          <div>
            <div className="eyebrow mb-2">المدينة</div>
            <div className="rail">
              {["كل المدن",...CITIES].map(c=>(
                <button key={c} onClick={()=>setCitySel(c)} aria-pressed={citySel===c}
                  className={"btn btn-sm "+(citySel===c?"btn-primary":"btn-ghost")}>{c}</button>))}
            </div>
          </div>
          <div>
            <div className="eyebrow mb-2">عائلة المنتج</div>
            <div className="rail">
              {["الكل",...CATALOG.map(f=>f.family)].map(f=>(
                <button key={f} onClick={()=>setFamSel(f)} aria-pressed={famSel===f}
                  className={"btn btn-sm "+(famSel===f?"btn-primary":"btn-ghost")}>{f}</button>))}
            </div>
          </div>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          {fams.map(fam=>{ const {tot,arr}=famShare(fam); if(tot===0) return (<Card key={fam.id}><div className="flex items-center gap-2 mb-2"><span className="w-7 h-7 rounded-[7px] flex items-center justify-center" style={{background:famColor(fam)+"18",color:famColor(fam)}}><Icon n={fam.icon} s={15}/></span><div className="t-sm font-semibold">{fam.family}</div></div><div className={"t-2xs py-3 text-center "+cMuted}>لا رصدات بعد</div></Card>);
            return (<Card key={fam.id}>
              <div className="flex items-center gap-2 mb-3"><span className="w-7 h-7 rounded-[7px] flex items-center justify-center" style={{background:famColor(fam)+"18",color:famColor(fam)}}><Icon n={fam.icon} s={15}/></span><div><div className="t-sm font-semibold">{fam.family}</div><div className={"t-chip "+cMuted}>{tot} رصدة</div></div></div>
              <div className="space-y-2">{arr.map(c=>{ const pct=Math.round(c.value/tot*100); const own=c.label===OWN_COMPANY;
                return (<div key={c.label}><div className="flex justify-between t-chip mb-0.5"><span className={own?"font-semibold":""}>{c.label}{own?<span className="txt-dim font-normal"> · نحن</span>:null}</span><span className="font-bold" style={{color:c.color}}>{pct}%</span></div><div className={"h-2 rounded-full overflow-hidden "+cTrack}><div className="h-2 rounded-full" style={{width:pct+"%",background:c.color}}/></div></div>);})}</div>
            </Card>);})}
        </div>
      </div>);
    }

    /* ===== رصد منتجات المنافسين في السوق ===== */
    function MarketMonitorPage() {
      const [data,setData]=useState(null); const [city,setCity]=useState("كل المدن"); const [fam,setFam]=useState("الكل");
      useEffect(()=>{(async()=>{ const [pr,v]=await Promise.all([db.from("projects").select("*"),db.from("visits").select("*")]); setData({projects:pr.data||[],visits:v.data||[]}); })()},[]);
      if(!data) return <div className={"text-center py-10 t-sm "+cMuted}>جاري تجهيز رصد السوق...</div>;
      // اجمع كل الرصدات مع سياق (مدينة/موقع)
      const recs=[];
      data.projects.forEach(p=>parseFindings(p.products).forEach(f=>recs.push({...f, where:p.name, city:p.city||"—", src:"موقع"})));
      data.visits.forEach(v=>parseFindings(v.products).forEach(f=>recs.push({...f, where:v.project||v.target, city:v.location||"—", src:"زيارة"})));
      const comp=recs.filter(r=>r.c&&r.c!==OWN_COMPANY);
      const fComp=comp.filter(r=>(city==="كل المدن"||r.city===city)&&(fam==="الكل"||r.f===fam));
      const byCompany={}; fComp.forEach(r=>byCompany[r.c]=(byCompany[r.c]||0)+1);
      const ranked=Object.entries(byCompany).map(([label,value])=>({label,value,color:companyColor(label)})).sort((a,b)=>b.value-a.value);
      const total=fComp.length;
      return (<div className="space-y-4">
        <PageHeader title="رصد منتجات المنافسين"
          lede="ما الذي يستخدمه السوق فعلًا، ومن أين نستردّ الحصة."
          stats={[
            { value:total, label:"منتج منافس مرصود" },
            { value:new Set(fComp.map(r=>r.where)).size, label:"موقعًا رُصد فيه منافس" },
            { value:ranked.length, label:"شركة منافسة حاضرة" },
          ]}/>
        <div><div className={"t-2xs font-bold mb-1.5 "+cMuted}>المدينة</div><div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">{["كل المدن",...CITIES].map(c=>(<button key={c} onClick={()=>setCity(c)} className={"shrink-0 px-3 py-1.5 rounded-xl t-2xs font-bold "+(city===c?cBtn:cTrack+" "+cMuted)}>{c}</button>))}</div></div>
        <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">{["الكل",...CATALOG.map(f=>f.family)].map(f=>(<button key={f} onClick={()=>setFam(f)} className={"shrink-0 px-3 py-1.5 rounded-xl t-2xs font-bold "+(fam===f?cBtn:cTrack+" "+cMuted)}>{f}</button>))}</div>
        {total===0?<div className={"rounded-2xl p-10 text-center t-sm "+cCard+" "+cMuted}>لا توجد منتجات منافسين مرصودة بهذه التصفية. سجّل المنتجات التي تراها في المواقع أثناء الزيارات.</div>:(<>
          <div className={"p-4 "+cCard}><div className="t-sm font-bold mb-3">المنافسون الأكثر حضوراً</div>
            <div className="space-y-2.5">{ranked.map(c=>{ const pct=Math.round(c.value/total*100);
              return (<div key={c.label}><div className="flex justify-between t-2xs mb-1"><span className="font-bold">{c.label}</span><span className="font-semibold" style={{color:c.color}}>{pct}% · {c.value}</span></div><div className={"h-2.5 rounded-full overflow-hidden "+cTrack}><div className="h-2.5 rounded-full" style={{width:pct+"%",background:c.color}}/></div></div>);})}</div></div>
          <div className={"p-4 "+cCard}><div className="t-sm font-bold mb-3">سجلّ الرصدات ({fComp.length})</div>
            <div className="space-y-2 max-h-96 overflow-y-auto">{fComp.slice().reverse().map((r,i)=>(<div key={i} className="flex items-center justify-between gap-2 rounded-xl px-3 py-2" style={{background:companyColor(r.c)+"12"}}>
              <div className="min-w-0"><div className="t-2xs font-semibold truncate" style={{color:companyColor(r.c)}}>{r.c} · {r.p}</div><div className={"t-chip "+cMuted+" truncate"}>{r.f} · {r.where} · {r.city}</div></div>
              <span className="t-chip font-bold px-2 py-0.5 rounded-full shrink-0" style={{background:companyColor(r.c)+"22",color:companyColor(r.c)}}>{r.src}</span>
            </div>))}</div></div>
        </>)}
      </div>);
    }

    /* ===== الخطة الأسبوعية بالمدن ===== */
    const PLAN_KEY="jazeera_weekplan";
    function loadPlan(){ try{ return JSON.parse(localStorage.getItem(PLAN_KEY)||"{}"); }catch(e){ return {}; } }
    function savePlan(p){ try{ localStorage.setItem(PLAN_KEY, JSON.stringify(p)); }catch(e){} db.from("weekly_plan").upsert([{id:1,data:p}]).then(()=>{}).catch(()=>{}); }
    function nextDays(n){ const out=[]; const d=new Date(); for(let i=0;i<n;i++){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+i); out.push(x.toISOString().slice(0,10)); } return out; }
    function dayName(iso){ return new Date(iso+"T00:00:00").toLocaleDateString("ar",{weekday:"long"}); }
    function WeeklyPlanPage({ onGo }) {
      const [plan,setPlan]=useState(loadPlan()); const [data,setData]=useState(null); const [pick,setPick]=useState(null);
      useEffect(()=>{(async()=>{ const [p,c]=await Promise.all([db.from("painters").select("*"),db.from("contractors").select("*")]); setData({painters:p.data||[],contractors:c.data||[]});
        try{ const {data:wp}=await db.from("weekly_plan").select("data").eq("id",1).limit(1); if(wp&&wp[0]&&wp[0].data){ setPlan(wp[0].data); localStorage.setItem(PLAN_KEY,JSON.stringify(wp[0].data)); } }catch(e){} })()},[]);
      const days=nextDays(7); const today=TODAY();
      const setCity=(iso,city)=>{ const p={...plan}; if(city) p[iso]=city; else delete p[iso]; setPlan(p); savePlan(p); setPick(null); };
      const recoFor=city=>{ if(!data) return {painters:[],devs:[]};
        const score=p=>(Number(p.rating)||0)+( {"عالية":3,"متوسطة":2,"منخفضة":1}[p.priority]||0 )+(p.status==="نشط"?2:0)+(p.status==="مستقطب"?1:0);
        const painters=data.painters.filter(p=>p.city===city).sort((a,b)=>score(b)-score(a)).slice(0,5);
        const devs=data.contractors.filter(c=>c.city===city).sort((a,b)=>(Number(b.rating)||0)+({"عالية":3,"متوسطة":2,"منخفضة":1}[b.priority]||0)-((Number(a.rating)||0)+({"عالية":3,"متوسطة":2,"منخفضة":1}[a.priority]||0))).slice(0,5);
        return {painters,devs}; };
      return (<div className="space-y-4">
        <PageHeader title="الخطة الأسبوعية"
          lede="حدّد مدينة كل يوم، ويذكّرك النظام ليلًا بزيارة الغد مع ترشيح أبرز الدهانين والمطوّرين هناك."/>
        {days.map(iso=>{ const city=plan[iso]; const isToday=iso===today; const reco=city?recoFor(city):null;
          return (<div key={iso} className="card overflow-hidden" style={isToday?{borderColor:"var(--accent-line)",boxShadow:"0 0 0 1px var(--accent-line)"}:undefined}>
            <div className="flex items-center justify-between gap-2 p-4">
              <div className="flex items-center gap-3"><div className="w-[52px] h-[52px] rounded-[10px] flex flex-col items-center justify-center gap-0.5 shrink-0"
                style={city?{background:"var(--action)",color:"var(--action-ink)"}
                           :{background:"var(--surface-2)",color:"var(--ink-3)",border:"1px solid var(--line)"}}>
                <span className="t-chip leading-none">{dayName(iso)}</span>
                <span className="t-2xs font-semibold leading-none tnum">{iso.slice(8)}/{iso.slice(5,7)}</span></div>
                <div><div className="font-semibold t-sm flex items-center gap-1.5">{city||"بدون تخطيط"}{isToday&&<span className="chip" style={{color:"var(--accent)",background:"var(--accent-soft)",borderColor:"var(--accent-line)"}}>اليوم</span>}</div>{city?<div className={"t-chip "+cMuted}>{reco.painters.length} دهان · {reco.devs.length} مطوّر مرشّح</div>:<div className={"t-chip "+cMuted}>اضغط لاختيار المدينة</div>}</div></div>
              <button onClick={()=>setPick(pick===iso?null:iso)} aria-expanded={pick===iso}
                className={"btn btn-sm shrink-0 "+(city?"btn-ghost":"btn-outline")}>{city?"تغيير":"تحديد مدينة"}</button>
            </div>
            {pick===iso&&(<div className="px-4 pb-3 flex flex-wrap gap-1.5 fade">{CITIES.map(c=><button key={c} onClick={()=>setCity(iso,c)} aria-pressed={city===c}
              className={"btn btn-sm "+(city===c?"btn-primary":"btn-ghost")}>{c}</button>)}
            {city&&<button onClick={()=>setCity(iso,null)} className="btn btn-danger btn-sm"><Icon n="close" s={11}/> إزالة</button>}</div>)}
            {city&&reco&&(reco.painters.length+reco.devs.length>0)&&(<div className="px-4 pb-4 space-y-3 fade">
              {reco.painters.length>0&&<div><div className="eyebrow mb-2 flex items-center gap-1.5"><Icon n="brush" s={12}/> أبرز الدهانين في {city}</div><div className="space-y-1.5">{reco.painters.map(p=>(<button key={p.id} onClick={()=>onGo&&onGo("painters")} className="w-full flex items-center justify-between gap-2 rounded-[7px] px-3 py-2 row-hover" style={{background:"var(--surface-2)"}}><span className="t-2xs truncate">{p.name}</span><span className="shrink-0"><Stars n={Number(p.rating)||0}/></span></button>))}</div></div>}
              {reco.devs.length>0&&<div><div className="eyebrow mb-2 flex items-center gap-1.5"><Icon n="target" s={12}/> مطوّرون للتواصل في {city}</div><div className="space-y-1.5">{reco.devs.map(c=>(<button key={c.id} onClick={()=>onGo&&onGo("contractors")} className="w-full flex items-center justify-between gap-2 rounded-[7px] px-3 py-2 row-hover" style={{background:"var(--surface-2)"}}><span className="t-2xs truncate">{c.name}</span>{c.phone?<a href={"tel:"+c.phone} onClick={e=>e.stopPropagation()} className="t-chip tnum txt-muted shrink-0" dir="ltr">{c.phone}</a>:null}</button>))}</div></div>}
            </div>)}
          </div>);})}
      </div>);
    }

    /* ===== الرؤى الذكية ===== */
    function InsightsPage({ onGo }) {
      const [d,setD]=useState(null);
      useEffect(()=>{(async()=>{
        const [p,pr,v]=await Promise.all([db.from("painters").select("*"),db.from("projects").select("*"),db.from("visits").select("*")]);
        setD({painters:p.data||[],projects:pr.data||[],visits:v.data||[]});
      })()},[]);
      if(!d) return <div className={"text-center py-10 t-sm "+cMuted}>جاري تحليل البيانات...</div>;
      const today=TODAY();
      const withF=d.painters.filter(p=>p.next_followup&&p.followup_status!=="تمت");
      const overdue=withF.filter(p=>p.next_followup<today).sort((a,b)=>a.next_followup.localeCompare(b.next_followup));
      const competitorP=d.painters.filter(p=>p.status==="منافس");
      const notContacted=d.painters.filter(p=>p.status!=="متوقف"&&daysAgo(p.last_visit||p.last_contact)>45);
      const active=d.painters.filter(p=>p.status==="نشط").length;
      // مواقع بلا دهان مسؤول (فرصة ربط)
      const sitesNoPainter=d.projects.filter(p=>!p.painter||p.painter==="-"||p.painter==="");
      // المدن الأقل تغطية (دهانون + زيارات لكل مدينة)
      const cityScore={}; CITIES.forEach(c=>cityScore[c]=0);
      d.painters.forEach(p=>{if(cityScore[p.city]!=null)cityScore[p.city]+=1;});
      d.visits.forEach(v=>{if(cityScore[v.location]!=null)cityScore[v.location]+=1;});
      const leastCities=Object.entries(cityScore).map(([city,n])=>({city,n})).sort((a,b)=>a.n-b.n).slice(0,5);
      // حصة الجزيرة لكل مدينة من المنتجات المرصودة — المدن التي يتفوّق فيها المنافسون (فرص استرداد)
      const cityShare={}; CITIES.forEach(c=>cityShare[c]={own:0,tot:0});
      const addRec=(city,prods)=>{ if(cityShare[city]==null) return; parseFindings(prods).forEach(f=>{ if(!f.c) return; cityShare[city].tot++; if(f.c===OWN_COMPANY)cityShare[city].own++; }); };
      d.projects.forEach(p=>addRec(p.city,p.products));
      d.visits.forEach(v=>addRec(v.location,v.products));
      const competitorCities=Object.entries(cityShare).map(([city,o])=>({city,share:o.tot?Math.round(o.own/o.tot*100):null,tot:o.tot}))
        .filter(x=>x.tot>=3&&x.share!=null&&x.share<50).sort((a,b)=>a.share-b.share);
      // المنتجات (الجزيرة) الأقل رصداً
      const prodCount={};
      [...d.visits,...d.projects].forEach(x=>parseFindings(x.products).forEach(f=>{ if(f.c===OWN_COMPANY) prodCount[f.p]=(prodCount[f.p]||0)+1; }));
      const leastProducts=Object.entries(prodCount).sort((a,b)=>a[1]-b[1]).slice(0,6);

      const card="rounded-2xl p-4 "+cCard;
      const Block=({title,color,items,render,empty,go})=>(
        <section className="card p-4 sm:p-5">
          <header className="flex items-center justify-between gap-3 mb-4">
            <h3 className="t-sm font-semibold flex items-center gap-2">
              {title}
              <span className="chip tnum" style={{background:items.length?`color-mix(in srgb, ${color} 12%, transparent)`:"var(--surface-2)",
                color:items.length?color:"var(--ink-3)",borderColor:items.length?`color-mix(in srgb, ${color} 26%, transparent)`:"var(--line)"}}>{items.length}</span>
            </h3>
            {go&&<button onClick={()=>onGo&&onGo(go)} className="btn btn-ghost btn-sm shrink-0">عرض</button>}
          </header>
          {items.length?<div className="divide-hair">{items.slice(0,8).map((x,i)=>render(x,i))}</div>
                       :<div className="t-2xs txt-dim py-4">{empty}</div>}
        </section>
      );
      const line=(a,b,bc)=>(
        <div className="flex items-center justify-between gap-3 py-2">
          <div className="t-2xs truncate">{a}</div>
          <div className="t-chip truncate shrink-0" style={{color:bc||"var(--ink-3)"}}>{b}</div>
        </div>);
      return (
        <div className="space-y-4">
          <PageHeader title="الرؤى" lede="تحليلات مستخرجة آليًا من بياناتك الفعلية، مرتّبة بحسب ما يستحقّ تحرّكًا اليوم."/>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <Block title="دهانون غير متابَعين" color={tok("danger")} items={notContacted} go="painters" empty="كل الدهانين تمت متابعتهم مؤخراً."
              render={(p,i)=><div key={i}>{line(p.name,`${p.city||"—"} · منذ ${daysAgo(p.last_visit||p.last_contact)} يوم`,tok("danger"))}</div>}/>
            <Block title="متابعات متأخرة" color={tok("danger")} items={overdue} go="tasks" empty="لا متابعات متأخرة، أحسنت."
              render={(p,i)=><div key={i}>{line(p.name,`موعدها ${p.next_followup}`,tok("danger"))}</div>}/>
            <Block title="مدن يتفوّق فيها المنافسون" color={tok("danger")} items={competitorCities} go="marketshare" empty="حصة الجزيرة جيدة في كل المدن المرصودة."
              render={(c,i)=><div key={i}>{line(c.city,`حصة الجزيرة ${c.share}% · ${c.tot} رصدة`,tok("danger"))}</div>}/>
            <Block title="مواقع بلا دهان مسؤول" color={tok("warn")} items={sitesNoPainter} go="projects" empty="كل المواقع مرتبطة بدهان."
              render={(p,i)=><div key={i}>{line(p.name,`${p.city||"—"} · ${p.type||"—"}`,tok("warn"))}</div>}/>
            <Block title="المدن الأقل تغطية" color={tok("info")} items={leastCities} go="plan" empty="—"
              render={(c,i)=><div key={i}>{line(c.city,`نشاط: ${c.n}`,tok("info"))}</div>}/>
            <Block title="منتجات الجزيرة الأقل رصداً" color={tok("accent")} items={leastProducts} go="products" empty="—"
              render={(x,i)=><div key={i}>{line(x[0],`رُصد ${x[1]} مرة`,tok("accent"))}</div>}/>
          </div>
          <div className="card p-4 sm:p-5"><h4 className="t-sm font-semibold mb-2">صحة قاعدة الدهانين</h4><p className="t-2xs leading-relaxed">{active} دهان نشط من أصل {d.painters.length}، و{competitorP.length} مصنّفون كمنافس يمثّلون فرص تحويل. لديك {sitesNoPainter.length} موقع دون دهان مسؤول.</p></div>
        </div>
      );
    }

    /* ===== التقارير الاحترافية ===== */
    function printReport(title, bodyHtml, opts){
      opts=opts||{};
      const w=window.open("","_blank");
      /* الورق يحمل هوية الشركة الحقيقية: الشعار الرسمي، وحبر فحمي، وأحمر الجزيرة كخطّ توقيع */
      const css=`@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap');
        *{box-sizing:border-box;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
        body{margin:0;padding:30px;color:#1C1C1A;direction:rtl;line-height:1.7;font-size:13px}
        .h{display:flex;align-items:center;gap:14px;border-bottom:1px solid #E4E4E1;padding-bottom:16px;margin-bottom:8px}
        .h::after{content:"";position:absolute}
        .rule{height:2px;background:#D91F11;width:56px;margin-bottom:22px}
        .logo{width:46px;height:46px;background-image:url("${MARK_URI}");background-size:contain;background-repeat:no-repeat;background-position:center;flex:0 0 auto}
        h1{font-size:19px;margin:0;font-weight:600}.sub{color:#6E6E66;font-size:11.5px;margin-top:3px}
        h2{font-size:14px;color:#1C1C1A;margin:26px 0 8px;font-weight:600;border-right:2px solid #D91F11;padding-right:9px}
        table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px}
        th,td{border-bottom:1px solid #E4E4E1;padding:8px 9px;text-align:right}
        th{color:#6E6E66;font-weight:600;font-size:10.5px;border-bottom:1px solid #C9C9C4}
        .kpis{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
        .kpi{flex:1;min-width:130px;border:1px solid #E4E4E1;border-radius:8px;padding:12px 14px}
        .kpi .l{font-size:10.5px;color:#6E6E66}.kpi .v{font-size:22px;font-weight:600;margin-top:4px}
        .foot{margin-top:30px;border-top:1px solid #E4E4E1;padding-top:12px;color:#8A8A82;font-size:10.5px;text-align:center}
        @media print{.noprint{display:none} @page{margin:12mm}}`;
      w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${title}</title><style>${css}</style></head><body>
        ${opts.noHeader?"":`<div class="h"><div class="logo"></div><div><h1>${title}</h1><div class="sub">نظام الجزيرة الميداني · ${new Date().toLocaleDateString("ar-SA",{day:"numeric",month:"long",year:"numeric"})}</div></div></div><div class="rule"></div>`}
        ${bodyHtml}
        <div class="foot">تقرير مُنشأ آليًا من نظام الجزيرة الميداني</div>
        <div class="noprint" style="text-align:center;margin-top:20px"><button onclick="window.print()" style="background:#1C1C1A;color:#fff;border:0;padding:11px 24px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit">طباعة / حفظ PDF</button></div>
        </body></html>`);
      w.document.close(); setTimeout(()=>{try{w.print();}catch(e){}}, 600);
    }
    function tableHtml(headers, rows){
      return `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
        rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c==null?"—":c}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${headers.length}" style="text-align:center;color:#94a3b8">لا توجد بيانات</td></tr>`
      }</tbody></table>`;
    }
    function kpisHtml(items){ return `<div class="kpis">${items.map(([l,v])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("")}</div>`; }

    /* ===== طباعة/PDF التقرير اليومي بنفس الهوية البصرية للتطبيق (بانر متدرّج، كروت KPI ملوّنة، أقسام مصنّفة) ===== */
    function escHtml(s){ return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
    function dailyReportPrintBody(kpis, groups, totalActivities, dateLabel){
      const hero = `
        <div style="border:1px solid #E4E4E1;border-radius:12px;padding:22px 24px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px">
          <div>
            <div style="font-size:12px;font-weight:700;opacity:.85">التقرير اليومي</div>
            <div style="font-size:19px;font-weight:900;margin-top:3px">${escHtml(dateLabel)}</div>
          </div>
          <div style="text-align:center">
            <div style="font-size:38px;font-weight:900;line-height:1">${totalActivities}</div>
            <div style="font-size:11px;font-weight:700;opacity:.85;margin-top:3px">نشاط مُسجَّل اليوم</div>
          </div>
        </div>`;
      const kpisBlock = `<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px">${kpis.map(k=>`
        <div style="flex:1;min-width:150px;border:1px solid #E4E4E1;border-radius:10px;padding:13px 15px">
          <div style="font-size:11px;font-weight:700;opacity:.9">${escHtml(k.label)}</div>
          <div style="font-size:24px;font-weight:900;margin-top:4px">${k.value}</div>
        </div>`).join("")}</div>`;
      const groupsBlock = groups.map(g=>`
        <div style="border:1px solid #e2e8f0;border-radius:16px;padding:16px 18px;margin-bottom:14px;border-right:5px solid ${g.color};page-break-inside:avoid">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
            <div style="display:flex;align-items:center;gap:9px">
              <span style="width:11px;height:11px;border-radius:50%;background:${g.color};display:inline-block"></span>
              <span style="font-weight:800;font-size:14px;color:${g.color}">${escHtml(g.title)}</span>
            </div>
            <span style="font-size:12px;font-weight:900;color:${g.color};background:${g.color}1a;padding:3px 12px;border-radius:999px">${g.items.length}</span>
          </div>
          ${g.items.map(it=>`
            <div style="display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-top:1px solid #f1f5f9;font-size:12px">
              <div>
                <b>${escHtml(it.title)}</b>${it.badge?` <span style="font-size:10px;font-weight:800;color:${it.badgeColor||tok("neutral")};background:${(it.badgeColor||tok("neutral"))}1a;padding:2px 8px;border-radius:999px;margin-right:4px">${escHtml(it.badge)}</span>`:""}
                ${it.subtitle?`<div style="color:#64748b;margin-top:2px">${escHtml(it.subtitle)}</div>`:""}
              </div>
              ${it.user?`<span style="color:#94a3b8;font-size:11px;white-space:nowrap">${escHtml(it.user)}</span>`:""}
            </div>`).join("")}
        </div>`).join("");
      return hero + kpisBlock + (groups.length?groupsBlock:`<div style="text-align:center;color:#94a3b8;padding:30px 0;font-size:13px">لا توجد أنشطة مسجّلة اليوم بعد.</div>`);
    }

    /* ===== سكيليتون تحميل عام للتقارير ===== */

    /* ===== التقرير اليومي: ملخص كل ما حدث اليوم تلقائياً ===== */
    function DailyActivityReport({ onGo }) {
      const [data,setData]=useState(null);
      const [error,setError]=useState("");
      const [loading,setLoading]=useState(true);
      const today = TODAY();

      async function load(){
        setLoading(true); setError("");
        try{
          const [p,pr,it,vi] = await Promise.all([
            db.from("painters").select("id,name,city,created_at").gte("created_at", today),
            db.from("projects").select("id,name,city,created_at").gte("created_at", today),
            db.from("interactions").select("*").eq("date", today),
            db.from("visits").select("*").eq("date", today),
          ]);
          if(p.error) throw new Error(p.error.message);
          if(pr.error) throw new Error(pr.error.message);
          if(it.error) throw new Error("تأكد من إنشاء جدول interactions: "+it.error.message);
          if(vi.error) throw new Error(vi.error.message);
          let activity=[];
          try{ const al=await db.from("activity_log").select("*").gte("created_at", today).order("created_at",{ascending:false}).limit(500); activity=al.data||[]; }catch(e){ activity=[]; }
          setData({ painters:p.data||[], projects:pr.data||[], interactions:it.data||[], visits:vi.data||[], activity });
        }catch(e){ setError(e.message||"تعذّر تحميل نشاط اليوم"); }
        finally{ setLoading(false); }
      }
      useEffect(()=>{ load(); },[]);

      if(loading) return <ReportSkeleton/>;
      if(error) return <ReportError msg={error} onRetry={load}/>;
      if(!data) return null;

      const calls=data.interactions.filter(x=>x.type==="مكالمة");
      const wa=data.interactions.filter(x=>x.type==="واتساب");
      const quotes=data.interactions.filter(x=>x.type==="عرض سعر");
      const notesRows=data.interactions.filter(x=>x.notes&&String(x.notes).trim());
      const completedFollowups=data.activity.filter(a=>a.action==="تعديل"&&a.entity_label==="متابعة");
      const otherActivity=data.activity.filter(a=> a.action!=="تفاعل" && !(a.action==="إضافة"&&["painters","projects","visits"].includes(a.entity)) && !(a.action==="تعديل"&&a.entity_label==="متابعة") );
      const totalActivities = data.painters.length+data.projects.length+data.interactions.length+data.visits.length+completedFollowups.length+otherActivity.length;

      const kpis=[
        {label:"دهانون جدد",value:data.painters.length,color:tok("ok"),icon:"brush"},
        {label:"مواقع جديدة",value:data.projects.length,color:tok("warn"),icon:"building"},
        {label:"تفاعلات مسجّلة",value:data.interactions.length,color:tok("info"),icon:"bolt"},
        {label:"عروض أسعار",value:quotes.length,color:tok("accent"),icon:"trophy"},
        {label:"متابعات مكتملة",value:completedFollowups.length,color:tok("info"),icon:"check"},
        {label:"مكالمات هاتفية",value:calls.length,color:tok("info"),icon:"target"},
        {label:"محادثات واتساب",value:wa.length,color:tok("ok"),icon:"whatsapp"},
        {label:"ملاحظات مضافة",value:notesRows.length,color:tok("accent"),icon:"doc"},
        {label:"زيارات منجزة",value:data.visits.length,color:tok("danger"),icon:"pin"},
        {label:"أنشطة أخرى",value:otherActivity.length,color:tok("neutral"),icon:"layers"},
      ];

      // تجميع الأنشطة في أقسام واضحة بدل جدول زمني مسطّح — بدون أي عرض للتوقيت
      const groups=[
        {key:"painters",title:"دهانون جدد",color:tok("ok"),icon:"brush",go:"painters",
          items:data.painters.map(p=>({title:p.name,subtitle:p.city||"",user:null}))},
        {key:"projects",title:"مواقع جديدة",color:tok("warn"),icon:"building",go:"projects",
          items:data.projects.map(p=>({title:p.name,subtitle:p.city||"",user:null}))},
        {key:"interactions",title:"تفاعلات مع الدهانين",color:tok("info"),icon:"bolt",go:"painters",
          items:data.interactions.map(x=>({title:x.painter||"—",subtitle:(x.notes?x.notes:"")+(x.quote_amount?(" · "+Number(x.quote_amount).toLocaleString()+" ر.س"):""),user:x.user_name,badge:x.type,badgeColor:STATUS_COLORS[x.type],badgeIcon:INTERACTION_ICON[x.type]}))},
        {key:"visits",title:"زيارات ميدانية",color:tok("danger"),icon:"pin",go:"visits",
          items:data.visits.map(v=>({title:v.target||v.type||"زيارة",subtitle:[v.location,[v.painter,v.contractor].filter(Boolean).join(" · ")].filter(Boolean).join(" · "),user:null}))},
        {key:"followups",title:"متابعات مكتملة",color:tok("info"),icon:"check",go:null,
          items:completedFollowups.map(a=>({title:a.record_name||"—",subtitle:"تمّت متابعتها اليوم",user:a.user_name}))},
        {key:"other",title:"أنشطة أخرى",color:tok("neutral"),icon:"layers",go:null,
          items:otherActivity.map(a=>({title:(a.entity_label||a.entity||"—"),subtitle:(a.action||"—")+(a.record_name?(" · "+a.record_name):""),user:a.user_name}))},
      ].filter(g=>g.items.length>0);

      const donutData=groups.map(g=>({label:g.title,value:g.items.length,color:g.color}));

      // أكثر الدهانين تفاعلاً اليوم
      const byPainter={}; data.interactions.forEach(x=>{ if(x.painter) byPainter[x.painter]=(byPainter[x.painter]||0)+1; });
      const topPainters=Object.entries(byPainter).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([label,value])=>({label,value}));

      const exportHeaders=["التصنيف","العنصر","التفاصيل","المستخدم"];
      const exportRows=groups.flatMap(g=>g.items.map(it=>[g.title,it.title,it.subtitle||"—",it.user||"—"]));
      const doPrint=()=>{
        const dateLabel=new Date().toLocaleDateString("ar-SA",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
        const body=dailyReportPrintBody(kpis, groups, totalActivities, dateLabel);
        printReport("التقرير اليومي — "+dateLabel, body, {noHeader:true});
      };

      return (
        <div className="space-y-4">
          {/* بانر رئيسي بصري */}
          <div className="relative card p-5 sm:p-6 overflow-hidden">
            <div className="absolute -left-10 -bottom-10 w-52 h-52 rounded-full bg-white/10"/>
            <div className="absolute left-16 -top-10 w-28 h-28 rounded-full bg-white/10"/>
            <div className="relative flex items-center justify-between flex-wrap gap-4">
              <div className="flex items-center gap-4">
                <div className="w-14 h-14 rounded-2xl bg-white/20 backdrop-blur flex items-center justify-center"><Icon n="bolt" s={26}/></div>
                <div>
                  <div className="t-2xs font-bold text-white/80">التقرير اليومي</div>
                  <div className="t-xl font-semibold">{new Date().toLocaleDateString("ar-SA",{weekday:"long",day:"2-digit",month:"long",year:"numeric"})}</div>
                </div>
              </div>
              <div className="text-center">
                <div className="text-4xl font-semibold leading-none">{totalActivities}</div>
                <div className="t-chip font-bold text-white/80 mt-1">نشاط مُسجَّل اليوم</div>
              </div>
              <div className="flex items-center gap-2 flex-wrap">
                <button onClick={load} className="btn btn-ghost btn-sm"><Icon n="refresh" s={13}/> تحديث</button>
                <button onClick={doPrint} className="btn btn-ghost btn-sm"><Icon n="printer" s={13}/> طباعة / PDF</button>
                <button onClick={()=>exportRowsXLSX("التقرير اليومي","اليوم",exportHeaders,exportRows)} className="btn btn-ghost btn-sm"><Icon n="download" s={13}/> Excel</button>
                <button onClick={()=>exportRowsCSV("التقرير_اليومي",exportHeaders,exportRows)} className="btn btn-ghost btn-sm"><Icon n="download" s={13}/> CSV</button>
              </div>
            </div>
          </div>

          {/* كروت KPI */}
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
            {kpis.map((k,i)=>(<Kpi key={i} label={k.label} value={k.value} color={k.color} icon={k.icon}/>))}
          </div>

          {totalActivities===0?(
            <ReportEmpty text="لا توجد أنشطة مسجّلة اليوم بعد. أول نشاط يُسجَّل هيظهر هنا فورًا."/>
          ):(
            <>
              {/* توزيع الأنشطة + الأكثر تفاعلاً */}
              <div className="grid grid-cols-1 lg:grid-cols-5 gap-4">
                <div className={"lg:col-span-2 rounded-2xl p-5 "+cCard}>
                  <div className="flex items-center gap-2 mb-4"><Icon n="chart" s={16} c={cAccent}/><h3 className="font-bold t-sm">توزيع أنشطة اليوم</h3></div>
                  <Donut data={donutData} size={150} centerLabel="نشاط"/>
                </div>
                <div className={"lg:col-span-3 rounded-2xl p-5 "+cCard}>
                  <div className="flex items-center gap-2 mb-4"><Icon n="trophy" s={16} c={tok("accent")}/><h3 className="font-bold t-sm">الأكثر تفاعلاً اليوم</h3></div>
                  {topPainters.length?<Bars data={topPainters}/>:<ReportEmpty text="لا توجد تفاعلات مرتبطة بدهانين بعد اليوم."/>}
                </div>
              </div>

              {/* أقسام الأنشطة */}
              <div className="grid grid-cols-1 xl:grid-cols-2 gap-4">
                {groups.map(g=>(
                  <div key={g.key} className={"relative rounded-2xl p-5 overflow-hidden fade "+cCard}>
                    <div className="absolute top-0 right-0 h-full w-1.5" style={{background:g.color}}/>
                    <div className="flex items-center justify-between mb-3">
                      <div className="flex items-center gap-2.5">
                        <div className="w-8 h-8 rounded-[8px] flex items-center justify-center shrink-0" style={{background:`color-mix(in srgb, ${g.color} 13%, transparent)`,color:g.color}}><Icon n={g.icon} s={15}/></div>
                        <h3 className="font-bold t-sm">{g.title}</h3>
                      </div>
                      <span className="t-2xs font-semibold rounded-full px-2.5 py-1" style={{color:g.color,background:g.color+"1a"}}>{g.items.length}</span>
                    </div>
                    <div className="space-y-1.5 max-h-72 overflow-y-auto no-scrollbar">
                      {g.items.map((it,i)=>(
                        <div key={i} onClick={()=>g.go&&onGo&&onGo(g.go)} className={"flex items-center justify-between gap-2 rounded-xl px-3 py-2.5 "+(g.go?"cursor-pointer "+cHover:"")+" "+cTrack}>
                          <div className="min-w-0 flex-1">
                            <div className="flex items-center gap-2 min-w-0">
                              <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{background:g.color}}/>
                              <span className="font-bold t-2xs truncate">{it.title}</span>
                              {it.badge&&<Pill text={it.badge} color={it.badgeColor}/>}
                            </div>
                            {it.subtitle&&<div className={"t-chip mt-0.5 truncate "+cMuted}>{it.subtitle}</div>}
                          </div>
                          {it.user&&<span className={"t-chip font-bold shrink-0 rounded-full px-2 py-1 "+cTrack+" "+cMuted}>{it.user}</span>}
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </>
          )}
        </div>
      );
    }

    /* ===== تقرير متابعة الدهانين: سجل تفاعل كامل لكل دهان مع فلاتر وبحث وفرز وتصدير ===== */
    const FOLLOWUP_TYPES=[...INTERACTION_TYPES,"تحديث بيانات"];
    function PainterFollowupReport() {
      const cutDate=days=>{ const d=new Date(); d.setDate(d.getDate()-days); return d.toISOString().slice(0,10); };
      const [range,setRange]=useState({from:cutDate(180),to:TODAY()});
      const [painters,setPainters]=useState(null);
      const [rows,setRows]=useState(null);
      const [error,setError]=useState("");
      const [loading,setLoading]=useState(true);
      const [f,setF]=useState({painter:"الكل",city:"الكل",employee:"الكل",type:"الكل",status:"الكل"});
      const [q,setQ]=useState("");
      const [sortBy,setSortBy]=useState("date_desc");
      const [page,setPage]=useState(1);
      const PAGE_SIZE=25;

      async function load(){
        setLoading(true); setError("");
        try{
          const [p,it]=await Promise.all([
            db.from("painters").select("name,city,status,priority"),
            db.from("interactions").select("*").gte("date",range.from).lte("date",range.to).order("date",{ascending:false}).limit(4000),
          ]);
          if(p.error) throw new Error(p.error.message);
          if(it.error) throw new Error("تأكد من إنشاء جدول interactions: "+it.error.message);
          let al=[];
          try{ const r=await db.from("activity_log").select("*").eq("entity","painters").eq("action","تعديل").gte("created_at",range.from).lte("created_at",range.to+"T23:59:59").order("created_at",{ascending:false}).limit(1500); al=r.data||[]; }catch(e){ al=[]; }
          const merged=[
            ...(it.data||[]).map(x=>({ id:"it_"+x.id, date:x.date||"", ts:x.created_at||x.date, painter:x.painter||"—", type:x.type||"—", summary:x.notes||"", result:x.quote_amount?("قيمة العرض: "+Number(x.quote_amount).toLocaleString()+" ر.س"):"", next_followup:null, user:x.user_name||"—" })),
            ...al.filter(x=>x.entity_label!=="متابعة").map(x=>({ id:"al_"+x.id, date:String(x.created_at||"").slice(0,10), ts:x.created_at, painter:x.record_name||"—", type:"تحديث بيانات", summary:x.entity_label||"تعديل بيانات الدهان", result:"", next_followup:null, user:x.user_name||"—" })),
          ];
          setPainters(p.data||[]); setRows(merged);
        }catch(e){ setError(e.message||"تعذّر تحميل تقرير المتابعة"); }
        finally{ setLoading(false); }
      }
      useEffect(()=>{ load(); },[range.from,range.to]);
      useEffect(()=>{ setPage(1); },[f,q,sortBy]);

      const painterInfo=useMemo(()=>{ const m={}; (painters||[]).forEach(p=>m[p.name]={city:p.city,status:p.status}); return m; },[painters]);
      const employees=useMemo(()=>Array.from(new Set((rows||[]).map(r=>r.user).filter(x=>x&&x!=="—"))).sort((a,b)=>a.localeCompare(b,"ar")),[rows]);
      const painterNames=useMemo(()=>Array.from(new Set((painters||[]).map(p=>p.name).filter(Boolean))).sort((a,b)=>a.localeCompare(b,"ar")),[painters]);

      const filtered=useMemo(()=>{
        if(!rows) return [];
        const ql=q.trim().toLowerCase();
        let out=rows.filter(r=>{
          if(f.painter!=="الكل"&&r.painter!==f.painter) return false;
          if(f.employee!=="الكل"&&r.user!==f.employee) return false;
          if(f.type!=="الكل"&&r.type!==f.type) return false;
          if(f.city!=="الكل"&&(painterInfo[r.painter]?.city!==f.city)) return false;
          if(f.status!=="الكل"&&(painterInfo[r.painter]?.status!==f.status)) return false;
          if(ql&&!(r.painter+" "+r.summary+" "+r.type+" "+r.user).toLowerCase().includes(ql)) return false;
          return true;
        });
        out=[...out].sort((a,b)=>{
          if(sortBy==="date_asc") return String(a.date).localeCompare(String(b.date))||String(a.ts||"").localeCompare(String(b.ts||""));
          if(sortBy==="painter") return String(a.painter).localeCompare(String(b.painter),"ar");
          if(sortBy==="type") return String(a.type).localeCompare(String(b.type),"ar");
          return String(b.date).localeCompare(String(a.date))||String(b.ts||"").localeCompare(String(a.ts||""));
        });
        return out;
      },[rows,f,q,sortBy,painterInfo]);

      const totalPages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));
      const pageRows=filtered.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);

      const kQuotes=filtered.filter(r=>r.type==="عرض سعر").length;
      const kCalls=filtered.filter(r=>r.type==="مكالمة").length;
      const kWa=filtered.filter(r=>r.type==="واتساب").length;
      const kPainters=new Set(filtered.map(r=>r.painter)).size;
      const typeDonut=Object.entries(filtered.reduce((m,r)=>{m[r.type]=(m[r.type]||0)+1;return m;},{})).map(([label,value])=>({label,value,color:STATUS_COLORS[label]||tok("neutral")})).sort((a,b)=>b.value-a.value);

      const exportHeaders=["التاريخ","الوقت","الدهان","المدينة","الحالة","نوع التفاعل","الملخص","النتيجة","الموظف"];
      const exportRows=filtered.map(r=>[r.date||"—",fmtTime(r.ts),r.painter,painterInfo[r.painter]?.city||"—",painterInfo[r.painter]?.status||"—",r.type,r.summary||"—",r.result||"—",r.user]);
      const doPrint=()=>{
        let body=kpisHtml([["سجلات مطابقة",filtered.length],["دهانون مشمولون",kPainters],["مكالمات",kCalls],["محادثات واتساب",kWa],["عروض أسعار",kQuotes]]);
        body+="<h2>سجل التفاعلات</h2>"+tableHtml(exportHeaders,exportRows);
        printReport("تقرير متابعة الدهانين", body);
      };

      const selCls="rounded-lg px-2.5 py-2 t-2xs font-semibold outline-none "+cInput;

      return (
        <div className="space-y-4">
          <div className={"rounded-2xl p-5 "+cCard}>
            <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-[9px] flex items-center justify-center shrink-0" style={{background:"var(--surface-2)",border:"1px solid var(--line)",color:"var(--ink-2)"}}><Icon n="user" s={18}/></div>
                <div><h2 className="font-semibold">تقرير متابعة الدهانين</h2><p className={"t-2xs "+cMuted}>سجل تفاعل كامل لكل دهان — مكالمات، واتساب، عروض أسعار، زيارات وملاحظات</p></div>
              </div>
              <div className="flex items-center gap-2 flex-wrap">
                <button onClick={load} className="btn btn-ghost btn-sm"><Icon n="refresh" s={13}/> تحديث</button>
                <button onClick={doPrint} disabled={!rows} className="btn btn-ghost btn-sm"><Icon n="printer" s={13}/> طباعة / PDF</button>
                <button onClick={()=>exportRowsXLSX("تقرير متابعة الدهانين","المتابعة",exportHeaders,exportRows)} disabled={!rows} className="btn btn-ghost btn-sm"><Icon n="download" s={13}/> Excel</button>
                <button onClick={()=>exportRowsCSV("تقرير_متابعة_الدهانين",exportHeaders,exportRows)} disabled={!rows} className="btn btn-ghost btn-sm"><Icon n="download" s={13}/> CSV</button>
              </div>
            </div>

            {/* الفلاتر */}
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 gap-2 mb-2">
              <label className="block col-span-1"><span className={"t-chip font-bold "+cMuted}>من تاريخ</span><input type="date" value={range.from} onChange={e=>setRange({...range,from:e.target.value})} className={"w-full "+selCls}/></label>
              <label className="block col-span-1"><span className={"t-chip font-bold "+cMuted}>إلى تاريخ</span><input type="date" value={range.to} onChange={e=>setRange({...range,to:e.target.value})} className={"w-full "+selCls}/></label>
              <label className="block"><span className={"t-chip font-bold "+cMuted}>الدهان</span><select value={f.painter} onChange={e=>setF({...f,painter:e.target.value})} className={"w-full "+selCls}><option value="الكل">الكل</option>{painterNames.map(n=><option key={n} value={n}>{n}</option>)}</select></label>
              <label className="block"><span className={"t-chip font-bold "+cMuted}>المدينة</span><select value={f.city} onChange={e=>setF({...f,city:e.target.value})} className={"w-full "+selCls}><option value="الكل">الكل</option>{CITIES.map(n=><option key={n} value={n}>{n}</option>)}</select></label>
              <label className="block"><span className={"t-chip font-bold "+cMuted}>الموظف</span><select value={f.employee} onChange={e=>setF({...f,employee:e.target.value})} className={"w-full "+selCls}><option value="الكل">الكل</option>{employees.map(n=><option key={n} value={n}>{n}</option>)}</select></label>
              <label className="block"><span className={"t-chip font-bold "+cMuted}>نوع التفاعل</span><select value={f.type} onChange={e=>setF({...f,type:e.target.value})} className={"w-full "+selCls}><option value="الكل">الكل</option>{FOLLOWUP_TYPES.map(n=><option key={n} value={n}>{n}</option>)}</select></label>
              <label className="block"><span className={"t-chip font-bold "+cMuted}>حالة الدهان</span><select value={f.status} onChange={e=>setF({...f,status:e.target.value})} className={"w-full "+selCls}><option value="الكل">الكل</option>{PAINTER_STATUSES.map(n=><option key={n} value={n}>{n}</option>)}</select></label>
            </div>
            <div className="flex items-center gap-2 flex-wrap">
              <div className="relative flex-1 min-w-[180px]">
                <Icon n="search" s={14} c={"absolute top-1/2 -translate-y-1/2 right-3 "+cMuted}/>
                <input value={q} onChange={e=>setQ(e.target.value)} placeholder="بحث بالاسم أو الملخص..." className={"w-full rounded-lg pr-9 pl-3 py-2 t-2xs outline-none "+cInput}/>
              </div>
              <select value={sortBy} onChange={e=>setSortBy(e.target.value)} className={selCls}>
                <option value="date_desc">الأحدث أولاً</option>
                <option value="date_asc">الأقدم أولاً</option>
                <option value="painter">حسب اسم الدهان</option>
                <option value="type">حسب نوع التفاعل</option>
              </select>
              {(f.painter!=="الكل"||f.city!=="الكل"||f.employee!=="الكل"||f.type!=="الكل"||f.status!=="الكل"||q)&&(
                <button onClick={()=>{setF({painter:"الكل",city:"الكل",employee:"الكل",type:"الكل",status:"الكل"});setQ("");}} className={"t-2xs font-bold px-3 py-2 rounded-lg "+cTrack+" "+cHover}>مسح الفلاتر</button>
              )}
            </div>
          </div>

          {loading?<ReportSkeleton/>:error?<ReportError msg={error} onRetry={load}/>:(
            <>
              <div className={"rounded-2xl p-5 "+cCard}>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
                  <Kpi label="سجلات مطابقة" value={filtered.length} color={tok("accent")} icon="doc"/>
                  <Kpi label="دهانون مشمولون" value={kPainters} color={tok("ok")} icon="brush"/>
                  <Kpi label="مكالمات" value={kCalls} color={tok("info")} icon="target"/>
                  <Kpi label="عروض أسعار" value={kQuotes} color={tok("accent")} icon="trophy"/>
                </div>
                {typeDonut.length>0&&(<div className="max-w-xs mx-auto sm:mx-0"><div className={"t-2xs font-bold mb-2 "+cMuted}>توزيع التفاعلات حسب النوع</div><Donut data={typeDonut} size={130} centerLabel="سجل"/></div>)}
              </div>

              <div className={"rounded-2xl p-5 "+cCard}>
                <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
                  <h3 className="font-bold t-sm">سجل التفاعلات</h3>
                  <span className={"t-2xs "+cMuted}>{filtered.length?`عرض ${(page-1)*PAGE_SIZE+1}–${Math.min(page*PAGE_SIZE,filtered.length)} من ${filtered.length}`:""}</span>
                </div>
                {filtered.length===0?<ReportEmpty text="لا توجد سجلات مطابقة لهذه الفلاتر."/>:(
                  <>
                    <div className="overflow-x-auto -mx-1">
                      <table className="w-full t-2xs min-w-[860px]">
                        <thead><tr className={"text-right "+cMuted}>
                          <th className="px-2 py-2 font-bold">التاريخ / الوقت</th>
                          <th className="px-2 py-2 font-bold">الدهان</th>
                          <th className="px-2 py-2 font-bold">المدينة</th>
                          <th className="px-2 py-2 font-bold">الحالة</th>
                          <th className="px-2 py-2 font-bold">النوع</th>
                          <th className="px-2 py-2 font-bold">الملخص</th>
                          <th className="px-2 py-2 font-bold">النتيجة</th>
                          <th className="px-2 py-2 font-bold">الموظف</th>
                        </tr></thead>
                        <tbody>
                          {pageRows.map(r=>(
                            <tr key={r.id} className={"border-t "+cBorder+" "+cHover}>
                              <td className="px-2 py-2.5 whitespace-nowrap"><div className="font-semibold">{r.date||"—"}</div><div className={cMuted}>{fmtTime(r.ts)}</div></td>
                              <td className="px-2 py-2.5 font-bold whitespace-nowrap">{r.painter}</td>
                              <td className="px-2 py-2.5 whitespace-nowrap">{painterInfo[r.painter]?.city||"—"}</td>
                              <td className="px-2 py-2.5 whitespace-nowrap">{painterInfo[r.painter]?.status?<Badge status={painterInfo[r.painter].status}/>:"—"}</td>
                              <td className="px-2 py-2.5 whitespace-nowrap"><Pill text={r.type} color={STATUS_COLORS[r.type]}/></td>
                              <td className="px-2 py-2.5 max-w-[220px] truncate" title={r.summary}>{r.summary||"—"}</td>
                              <td className="px-2 py-2.5 max-w-[180px] truncate" title={r.result}>{r.result||"—"}</td>
                              <td className="px-2 py-2.5 whitespace-nowrap">{r.user}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                    {totalPages>1&&(
                      <div className="flex items-center justify-center gap-2 mt-4">
                        <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1} className={"px-3 py-1.5 rounded-lg t-2xs font-bold disabled:opacity-30 "+cTrack+" "+cHover}>السابق</button>
                        <span className={"t-2xs font-bold "+cMuted}>صفحة {page} من {totalPages}</span>
                        <button onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={page===totalPages} className={"px-3 py-1.5 rounded-lg t-2xs font-bold disabled:opacity-30 "+cTrack+" "+cHover}>التالي</button>
                      </div>
                    )}
                  </>
                )}
              </div>
            </>
          )}
        </div>
      );
    }

    function LegacyReportsOverview() {
      const [data,setData]=useState(null);
      useEffect(()=>{(async()=>{
        const [p,pr,c,v,t]=await Promise.all([db.from("painters").select("*"),db.from("projects").select("*"),db.from("contractors").select("*"),db.from("visits").select("*"),db.from("trainings").select("*")]);
        setData({painters:p.data||[],projects:pr.data||[],contractors:c.data||[],visits:v.data||[],trainings:t.data||[]});
      })()},[]);
      const cut=days=>{ const dt=new Date(); dt.setDate(dt.getDate()-days); return dt.toISOString().slice(0,10); };
      // كل الرصدات (منتجات) مع سياق المدينة/الموقع
      function allFindings(){ const recs=[];
        (data.projects||[]).forEach(p=>parseFindings(p.products).forEach(f=>recs.push({...f,where:p.name,city:p.city||"—",src:"موقع"})));
        (data.visits||[]).forEach(v=>parseFindings(v.products).forEach(f=>recs.push({...f,where:v.project||v.target,city:v.location||"—",src:"زيارة"})));
        return recs; }

      function periodReport(label,days){ if(!data)return; const since=cut(days);
        const v=data.visits.filter(x=>String(x.date||"")>=since);
        const pr=data.projects.filter(x=>String(x.created_at||"").slice(0,10)>=since);
        const recs=allFindings(); const comp=recs.filter(r=>r.c&&r.c!==OWN_COMPANY);
        const cities=new Set(v.map(x=>x.location).filter(Boolean));
        let body=kpisHtml([["زيارات الفترة",v.length],["مواقع جديدة",pr.length],["مدن تمّت تغطيتها",cities.size],["منتجات منافسين مرصودة",comp.length]]);
        body+="<h2>زيارات الفترة</h2>"+tableHtml(["عنوان الزيارة","النوع","المدينة","التاريخ","النتيجة"],v.map(x=>[x.target,x.type,x.location,x.date,x.results]));
        body+="<h2>مواقع جديدة في الفترة</h2>"+tableHtml(["الموقع","المدينة","النوع","الدهان","المطوّر"],pr.map(x=>[x.name,x.city,x.type,x.painter,x.contractor]));
        printReport(label, body);
      }
      function paintersReport(){ if(!data)return;
        const projByPainter={}; data.projects.forEach(p=>{if(p.painter)projByPainter[p.painter]=(projByPainter[p.painter]||0)+1;});
        const visByPainter={}; data.visits.forEach(v=>{const k=v.painter||v.target; if(k)visByPainter[k]=(visByPainter[k]||0)+1;});
        const rows=data.painters.map(p=>[p.name,p.city,p.status,p.contact_method||"—",projByPainter[p.name]||0,visByPainter[p.name]||0,p.rating||0,p.last_visit||p.last_contact||"—"]);
        let body=kpisHtml([["الدهانين",data.painters.length],["النشطون",data.painters.filter(p=>p.status==="نشط").length],["تمّت متابعتهم",data.painters.filter(p=>p.contact_method).length],["منافسون",data.painters.filter(p=>p.status==="منافس").length]]);
        body+="<h2>نشاط الدهانين</h2>"+tableHtml(["الاسم","المدينة","الحالة","طريقة المتابعة","المواقع","الزيارات","التقييم","آخر تواصل"],rows);
        printReport("تقرير نشاط الدهانين", body);
      }
      function sitesReport(){ if(!data)return;
        const rows=data.projects.map(p=>[p.name,p.type,p.city,p.owner||"—",p.contractor||"—",p.painter||"—",p.stage||"—"]);
        const byCity={}; data.projects.forEach(p=>{const k=p.city||"غير محدد"; byCity[k]=(byCity[k]||0)+1;});
        let body=kpisHtml([["المواقع",data.projects.length],["مرتبطة بدهان",data.projects.filter(p=>p.painter&&p.painter!=="-").length],["مرتبطة بمطوّر",data.projects.filter(p=>p.contractor&&p.contractor!=="-").length],["مدن",Object.keys(byCity).length]]);
        body+="<h2>المواقع حسب المدينة</h2>"+tableHtml(["المدينة","عدد المواقع"],Object.entries(byCity).sort((a,b)=>b[1]-a[1]));
        body+="<h2>تفاصيل المواقع</h2>"+tableHtml(["الموقع","النوع","المدينة","المالك","المطوّر","الدهان","المرحلة"],rows);
        printReport("تقرير المواقع", body);
      }
      function developersReport(){ if(!data)return;
        const rows=data.contractors.map(c=>[c.name,c.city||"—",c.phone||"—",c.contact||"—",c.projects_count||0,c.priority||"—",c.followup_status||"—"]);
        const byCity={}; data.contractors.forEach(c=>{const k=c.city||"غير محدد"; byCity[k]=(byCity[k]||0)+1;});
        let body=kpisHtml([["المطوّرون العقاريون",data.contractors.length],["مدن",Object.keys(byCity).length],["أولوية عالية",data.contractors.filter(c=>c.priority==="عالية").length]]);
        body+="<h2>التوزيع حسب المدينة</h2>"+tableHtml(["المدينة","العدد"],Object.entries(byCity).sort((a,b)=>b[1]-a[1]));
        body+="<h2>تفاصيل المطوّرين العقاريين</h2>"+tableHtml(["الاسم","المدينة","الجوال","المسؤول","عدد المواقع","الأولوية","حالة المتابعة"],rows);
        printReport("تقرير المطوّرين العقاريين", body);
      }
      function marketMonitorReport(){ if(!data)return;
        const comp=allFindings().filter(r=>r.c&&r.c!==OWN_COMPANY);
        if(comp.length===0){ toast("لا توجد منتجات منافسين مرصودة بعد","info"); return; }
        const byCompany={}; comp.forEach(r=>byCompany[r.c]=(byCompany[r.c]||0)+1);
        const ranked=Object.entries(byCompany).sort((a,b)=>b[1]-a[1]);
        const total=comp.length;
        const barRow=(label,val)=>{ const pct=Math.round(val/total*100); const col=companyColor(label);
          return `<div style="margin:7px 0"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><b>${label}</b><b style="color:${col}">${pct}% · ${val}</b></div><div style="height:12px;border-radius:7px;background:#eef2f7;overflow:hidden"><div style="height:12px;width:${pct}%;background:${col};border-radius:7px"></div></div></div>`; };
        let body=kpisHtml([["رصدات المنافسين",total],["عدد المنافسين",ranked.length],["مواقع مرصودة",new Set(comp.map(r=>r.where)).size],["مدن",new Set(comp.map(r=>r.city)).size]]);
        body+="<h2>المنافسون الأكثر حضوراً</h2>"+ranked.map(([l,v])=>barRow(l,v)).join("");
        body+="<h2>سجلّ الرصدات</h2>"+tableHtml(["المنافس","المنتج","العائلة","الموقع","المدينة","المصدر"],comp.map(r=>[r.c,r.p,r.f,r.where,r.city,r.src]));
        printReport("تقرير رصد السوق", body);
      }
      function marketReport(){ if(!data)return; const ms=computeMarketShare(data.projects,data.visits);
        if(ms.total===0){ toast("لا توجد منتجات مرصودة بعد لحساب الحصة السوقية","info"); return; }
        const overall=Object.entries(ms.overall).sort((a,b)=>b[1]-a[1]);
        const ownPct=Math.round((ms.overall[OWN_COMPANY]||0)/ms.total*100);
        const rank=overall.findIndex(x=>x[0]===OWN_COMPANY)+1;
        const barRow=(label,val)=>{ const pct=Math.round(val/ms.total*100); const col=companyColor(label); const own=label===OWN_COMPANY;
          return `<div style="margin:7px 0"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><b style="${own?'color:'+col:''}">${label}${own?' ★':''}</b><b style="color:${col}">${pct}% · ${val}</b></div><div style="height:12px;border-radius:7px;background:#eef2f7;overflow:hidden"><div style="height:12px;width:${pct}%;background:${col};border-radius:7px"></div></div></div>`; };
        // حصة الجزيرة لكل مدينة
        const cityAgg={}; CITIES.forEach(c=>cityAgg[c]={own:0,tot:0});
