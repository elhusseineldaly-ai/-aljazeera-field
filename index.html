    /* ===== شاشة إعداد الجدول (تظهر لو الجدول غير موجود في Supabase) ===== */
    function SrSetup({ onRetry }){
      const sql=`create table if not exists showroom_customers (
  id bigserial primary key,
  name text, phone text, city text, showroom text,
  customer_type text, source text,
  project_type text, build_stage text, area_m2 numeric,
  stage text default 'زائر جديد',
  products text, competitor text,
  quote_value numeric default 0, deal_value numeric default 0,
  loss_reason text,
  linked_painter text, linked_contractor text,
  visit_date date, last_contact date, next_followup date,
  followup_status text, contact_method text,
  notes text, user_name text,
  created_at timestamptz default now()
);
alter table showroom_customers enable row level security;
create policy "read"  on showroom_customers for select using (true);
create policy "write" on showroom_customers for insert with check (true);
create policy "edit"  on showroom_customers for update using (true);
create policy "del"   on showroom_customers for delete using (true);`;
      const [copied,setCopied]=useState(false);
      return (
        <div className={"rounded-2xl p-5 "+cCard}>
          <div className="flex items-center gap-2 mb-2">
            <Icon n="shield" s={18} c="text-[color:var(--warn)]"/>
            <h3 className="font-semibold t-sm">خطوة واحدة قبل الاستخدام</h3>
          </div>
          <p className={"t-2xs leading-relaxed mb-3 "+cMuted}>
            جدول <b>showroom_customers</b> غير موجود في قاعدة بياناتك. افتح Supabase ← SQL Editor ← الصق الكود التالي ← Run، ثم اضغط «إعادة المحاولة».
          </p>
          <pre className={"rounded-xl p-3 t-chip leading-relaxed overflow-x-auto text-left "+cTrack} dir="ltr">{sql}</pre>
          <div className="flex gap-2 mt-3">
            <button onClick={()=>{ try{ navigator.clipboard.writeText(sql); setCopied(true); setTimeout(()=>setCopied(false),1800); }catch(e){} }}
              className={"flex-1 rounded-xl py-2.5 t-2xs font-bold "+cBtn}>{copied?"✓ تم نسخ الكود":"نسخ كود SQL"}</button>
            <button onClick={onRetry} className={"px-5 rounded-xl py-2.5 t-2xs font-bold "+cAccent+" "+cTrack+" "+cHover}>إعادة المحاولة</button>
          </div>
        </div>
      );
    }

    /* ===== حفظ مرن: يتجاوز أي عمود ناقص في الجدول بدل ما تفشل العملية كلها ===== */
    async function srWrite(mode, id, body){
      const b={...body};
      for(let i=0;i<10;i++){
        const r = mode==="add" ? await db.from(SR_TABLE).insert([b])
                               : await db.from(SR_TABLE).update(b).eq("id",id);
        if(!r.error) return { ok:true };
        const m=(r.error.message||"")+" "+(r.error.details||"");
        const col=(m.match(/'([a-z_0-9]+)' column/i)||m.match(/column "?([a-z_0-9]+)"? of/i)||m.match(/column ([a-z_0-9]+)/i)||[])[1];
        if(col && (col in b)){ delete b[col]; continue; }
        return { ok:false, error:r.error.message||"خطأ غير متوقع" };
      }
      return { ok:false, error:"تعذّر الحفظ بعد عدة محاولات" };
    }
    function srIsMissingTable(err){
      const m=String((err&&(err.message||err.details||err.code))||"").toLowerCase();
      return m.includes("does not exist") || m.includes("could not find the table") || m.includes("42p01") || m.includes("pgrst205");
    }

    /* ===================== الصفحة الرئيسية ===================== */
    function ShowroomPage({ onGo }){
      const [rows,setRows]=useState(null);
      const [err,setErr]=useState("");
      const [needSetup,setNeedSetup]=useState(false);
      const [elite,setElite]=useState({ painters:[], orgs:[], contractors:[] });
      const [view,setView]=useState("board");
      const [f,setF]=useState(srEmptyFilters());
      const [panelOpen,setPanelOpen]=useState(false);
      const [editor,setEditor]=useState(null);
      const [saving,setSaving]=useState(false);
      const [detailId,setDetailId]=useState(null);
      const [target,setTarget]=useState(()=>Number(localStorage.getItem(SR_TARGET_KEY)||0));

      async function load(){
        setErr(""); setNeedSetup(false);
        const r=await db.from(SR_TABLE).select("*").order("created_at",{ascending:false});
        if(r.error){
          if(srIsMissingTable(r.error)){ setNeedSetup(true); setRows([]); return; }
          setErr(r.error.message||"تعذّر تحميل البيانات"); setRows([]); return;
        }
        setRows(r.data||[]);
      }
      async function loadElite(){
        const [p,c]=await Promise.all([
          db.from("painters").select("id,name,phone,city,showroom,rating,work_type").gte("rating",5),
          db.from("contractors").select("id,name,phone,city,rating").gte("rating",5),
        ]);
        const pr=p.data||[];
        setElite({
          painters: pr.filter(x=>x.work_type!=="مؤسسة"),
          orgs:     pr.filter(x=>x.work_type==="مؤسسة"),
          contractors: c.data||[],
        });
      }
      useEffect(()=>{ load(); loadElite(); },[]);

      /* ---------- التصفية ---------- */
      const filtered=useMemo(()=>{
        const list=rows||[];
        const q=(f.q||"").trim().toLowerCase();
        const cold=Number(f.coldDays)||SR_COLD_DAYS;
        const minV=Number(f.minValue)||0;
        return list.filter(c=>{
          if(q){
            const hay=[c.name,c.phone,c.notes,c.linked_painter,c.linked_contractor].join(" ").toLowerCase();
            if(!hay.includes(q)) return false;
          }
          if(f.city && c.city!==f.city) return false;
          if(f.showroom && c.showroom!==f.showroom) return false;
          if(f.type && c.customer_type!==f.type) return false;
          if(f.stage && c.stage!==f.stage) return false;
          if(f.build && c.build_stage!==f.build) return false;
          if(f.competitor && c.competitor!==f.competitor) return false;
          if(f.source && c.source!==f.source) return false;
          if(minV && (Number(c.quote_value)||0)<minV) return false;
          if(f.onlyDue){
            const due=c.next_followup && c.next_followup<=TODAY() && c.followup_status!=="تمت" && c.followup_status!=="ملغاة";
            if(!due) return false;
          }
          if(f.onlyHot   && srScore(c).score<70) return false;
          if(f.onlyReady && c.build_stage!=="جاهز للدهان") return false;
          if(f.onlyQuoted && !(["عرض سعر","تفاوض"].includes(c.stage))) return false;
          if(f.onlyCold  && srDaysSince(c.last_contact)<=cold) return false;
          if(f.onlyLinked   && !(c.linked_painter||c.linked_contractor)) return false;
          if(f.onlyUnlinked &&  (c.linked_painter||c.linked_contractor)) return false;
          return true;
        });
      },[rows,f]);

      /* ---------- المؤشرات ---------- */
      const stats=useMemo(()=>{
        const list=rows||[];
        const mk=new Date().toISOString().slice(0,7);
        const inMonth=list.filter(c=>String(c.visit_date||c.created_at||"").slice(0,7)===mk);
        const won=inMonth.filter(c=>c.stage==="تم البيع");
        const lost=inMonth.filter(c=>c.stage==="خسارة");
        const achieved=won.reduce((a,c)=>a+(Number(c.deal_value)||Number(c.quote_value)||0),0);
        const open=list.filter(c=>SR_OPEN_STAGES.includes(c.stage));
        const weighted=open.reduce((a,c)=>a+((Number(c.quote_value)||0)*((SR_STAGE_MAP[c.stage]||{p:0}).p)),0);
        const due=list.filter(c=>c.next_followup && c.next_followup<=TODAY() && c.followup_status!=="تمت" && c.followup_status!=="ملغاة" && SR_OPEN_STAGES.includes(c.stage));
        return {
          visitors:inMonth.length, won:won.length, lost:lost.length, achieved,
          avg: won.length?Math.round(achieved/won.length):0,
          conv: inMonth.length?Math.round(won.length/inMonth.length*100):0,
          openCount:open.length, weighted:Math.round(weighted), due:due.length,
          hot:open.filter(c=>srScore(c).score>=70).length,
        };
      },[rows]);

      const closeToday=useMemo(()=>
        filtered.filter(c=>SR_OPEN_STAGES.includes(c.stage))
                .map(c=>({c,s:srScore(c).score}))
                .sort((a,b)=>b.s-a.s).slice(0,5)
      ,[filtered]);

      /* ---------- عمليات ---------- */
      function blank(extra){
        return { name:"", phone:"", customer_type:SR_TYPES[0], source:SR_SOURCES[0], city:"", showroom:"",
          project_type:PROJECT_TYPES[0], build_stage:"جاهز للدهان", area_m2:"", competitor:"لا يوجد",
          products:"[]", stage:"زائر جديد", quote_value:"", deal_value:"", loss_reason:"",
          linked_painter:"", linked_contractor:"", visit_date:TODAY(), last_contact:TODAY(),
          next_followup:srAddDays(2), followup_status:"مجدولة", contact_method:"زيارة ميدانية", notes:"", ...(extra||{}) };
      }
      async function save(){
        const d=editor.data;
        if(!String(d.name||"").trim()){ toast("اكتب اسم العميل أولاً","warn"); return; }
        setSaving(true);
        const body={ ...d,
          area_m2:Number(d.area_m2)||0, quote_value:Number(d.quote_value)||0, deal_value:Number(d.deal_value)||0,
          user_name:currentUserName() };
        ["visit_date","last_contact","next_followup"].forEach(k=>{ if(!body[k]) body[k]=null; });
        const res=await srWrite(editor.mode, editor.id, body);
        setSaving(false);
        if(!res.ok){ toast("تعذّر الحفظ: "+res.error,"err"); return; }
        logActivity(editor.mode==="add"?"إضافة":"تعديل", SR_TABLE, "عملاء المعرض", d.name);
        const link=d.linked_painter||d.linked_contractor;
        if(link && (editor.mode==="add" || link!==(editor.original||{})[d.linked_painter?"linked_painter":"linked_contractor"])){
          logActivity("إحالة عميل", d.linked_painter?"painters":"contractors", "شبكة ٥ نجوم", link+" ← "+d.name);
        }
        setEditor(null); load();
      }
      async function patch(c, body){
        if(c._pending){ toast("هذا السجل لم يتزامن بعد — انتظر رجوع الإنترنت ثم عدّله","warn"); return; }
        const res=await srWrite("edit", c.id, body);
        if(!res.ok){ toast("تعذّر التحديث: "+res.error,"err"); return; }
        if(body.stage) logActivity("نقل مرحلة → "+body.stage, SR_TABLE, "عملاء المعرض", c.name);
        setRows(rs=>(rs||[]).map(x=>x.id===c.id?{...x,...body}:x));
      }
      async function remove(c){
        if(!await confirmDialog("سيُحذف العميل «"+(c.name||"")+"» من الأنبوب نهائيًا.",{confirmLabel:"حذف العميل"})) return;
        await db.from(SR_TABLE).delete().eq("id",c.id);
        logActivity("حذف", SR_TABLE, "عملاء المعرض", c.name);
        setDetailId(null); load();
      }
      function exportRows(){
        const H=["الاسم","الجوال","النوع","المصدر","المدينة","المعرض","المرحلة","مرحلة البناء","المساحة م²",
                 "قيمة العرض","قيمة الصفقة","المنافس","سبب الخسارة","دهان/مؤسسة ٥★","مطوّر ٥★",
                 "المتابعة القادمة","آخر تواصل","الدرجة","التصنيف","ملاحظات"];
        const R=filtered.map(c=>{ const s=srScore(c); return [c.name,c.phone,c.customer_type,c.source,c.city,c.showroom,
          c.stage,c.build_stage,Number(c.area_m2)||0,Number(c.quote_value)||0,Number(c.deal_value)||0,c.competitor,
          c.loss_reason,c.linked_painter,c.linked_contractor,c.next_followup,c.last_contact,s.score,s.tier,c.notes]; });
        exportRowsXLSX("عملاء_المعرض_"+TODAY(),"عملاء المعرض",H,R);
      }
      function printList(){
        const kp=kpisHtml([["زوار الشهر",stats.visitors],["صفقات مغلقة",stats.won],["معدل التحويل",stats.conv+"%"],
          ["القيمة المحققة",srMoney(stats.achieved)+" ر.س"],["متوسط الفاتورة",srMoney(stats.avg)+" ر.س"],
          ["الأنبوب المرجّح",srMoney(stats.weighted)+" ر.س"]]);
        const rowsH=filtered.map(c=>{ const s=srScore(c);
          return [c.name||"—",c.phone||"—",c.stage||"—",c.build_stage||"—",srMoney(c.quote_value),
            (c.linked_painter||c.linked_contractor||"—"),c.next_followup||"—",s.score+" · "+s.tier]; });
        printReport("متابعة عملاء المعرض", kp+tableHtml(
          ["الاسم","الجوال","المرحلة","مرحلة البناء","قيمة العرض","مرتبط بـ","المتابعة القادمة","الأولوية"], rowsH));
      }

      const detail=(rows||[]).find(c=>String(c.id)===String(detailId))||null;
      const Card=({children,cls=""})=>(<div className={"rounded-2xl p-4 "+cCard+" "+cls}>{children}</div>);

      if(rows===null) return <ReportSkeleton/>;
      if(needSetup)  return <SrSetup onRetry={()=>{ setRows(null); load(); }}/>;
      if(err)        return <ReportError msg={err} onRetry={()=>{ setRows(null); load(); }}/>;

      const pct = target>0 ? Math.min(100, Math.round(stats.achieved/target*100)) : 0;
      const remaining = Math.max(0, target-stats.achieved);
      const daysLeft = (()=>{ const d=new Date(); return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate()+1; })();

      return (
        <div className="space-y-4">

          {/* ===== الترويسة ===== */}
          <PageHeader title="عملاء المعرض"
            lede={`${(rows||[]).length} عميل · ${stats.openCount} في الأنبوب · ${stats.due} متابعة مستحقة`}
            actions={<>
              <div className="flex rounded-[7px] overflow-hidden" style={{border:"1px solid var(--line)"}} role="group" aria-label="طريقة العرض">
                {[["board","الأنبوب"],["list","قائمة"]].map(([k,l])=>(
                  <button key={k} onClick={()=>setView(k)} aria-pressed={view===k}
                    className="px-3 py-1.5 t-2xs transition-colors"
                    style={view===k?{background:"var(--surface-3)",color:"var(--ink)",fontWeight:600}:{color:"var(--ink-3)"}}>{l}</button>
                ))}
              </div>
              <button onClick={exportRows} title="تصدير Excel" aria-label="تصدير Excel" className="btn-icon"><Icon n="download" s={16}/></button>
              <button onClick={printList} title="طباعة / PDF" aria-label="طباعة أو حفظ PDF" className="btn-icon"><Icon n="printer" s={16}/></button>
              <button onClick={()=>setEditor({mode:"add",id:null,data:blank()})} className="btn btn-primary btn-sm press">
                <Icon n="plus" s={13}/> عميل جديد
              </button>
            </>}/>

          {/* ===== هدف الشهر ===== */}
          <Card>
            <div className="flex items-center gap-2 mb-2 flex-wrap">
              <Icon n="trophy" s={15} c="txt-dim"/>
              <span className="font-semibold t-sm">هدف الشهر</span>
              <div className="mr-auto flex items-center gap-1.5">
                <input type="number" value={target||""} placeholder="اكتب هدفك بالريال"
                  onChange={e=>{ const v=Number(e.target.value)||0; setTarget(v); try{ localStorage.setItem(SR_TARGET_KEY,String(v)); }catch(err){} }}
                  className="field w-full sm:w-40 t-2xs" style={{minHeight:34,padding:"6px 10px"}}/>
                <span className={"t-2xs "+cMuted}>ريال</span>
              </div>
            </div>
            {target>0 ? (
              <>
                <div className="h-2 rounded-full overflow-hidden" style={{background:"var(--surface-2)"}}
                  role="progressbar" aria-valuenow={pct} aria-valuemin={0} aria-valuemax={100}
                  aria-label="التقدّم نحو هدف الشهر">
                  <div className="h-full rounded-full transition-all"
                    style={{width:Math.min(pct,100)+"%",background:pct>=100?"var(--ok)":"var(--accent)"}}/>
                </div>
                <div className="flex items-center justify-between mt-2.5 t-2xs flex-wrap gap-2">
                  <span className="font-semibold tnum">{srMoney(stats.achieved)} / {srMoney(target)} ريال · {pct}%</span>
                  {remaining>0 ? (
                    <span className={cMuted}>باقي <b>{srMoney(remaining)}</b> ريال في <b>{daysLeft}</b> يوم
                      {stats.avg>0 && <> — أي ما يعادل <b>{Math.ceil(remaining/stats.avg)}</b> صفقة بمتوسط فاتورتك الحالي</>}</span>
                  ) : <span className="inline-flex items-center gap-1.5 font-semibold" style={{color:"var(--ok)"}}><Icon n="check" s={14}/> تحقّق الهدف</span>}
                </div>
              </>
            ) : (
              <p className={"t-2xs "+cMuted}>حدّد رقمًا تستهدفه هذا الشهر، وسيحسب لك النظام كم صفقة تحتاج بمتوسط فاتورتك الفعلي.</p>
            )}
          </Card>

          {/* ===== المؤشرات ===== */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <Kpi label="زوار الشهر" value={stats.visitors} color={tok("info")} icon="user" sub={stats.hot+" عميل ساخن"}/>
            <Kpi label="معدل التحويل" value={stats.conv+"%"} color={tok("ok")} icon="chart" sub={stats.won+" بيع · "+stats.lost+" خسارة"}/>
            <Kpi label="القيمة المحققة" value={srMoney(stats.achieved)} color={tok("warn")} icon="trophy" sub={"متوسط الفاتورة "+srMoney(stats.avg)}/>
            <Kpi label="الأنبوب المرجّح" value={srMoney(stats.weighted)} color={tok("accent")} icon="bolt" sub={stats.openCount+" فرصة مفتوحة"}/>
          </div>

          {/* ===== لوحة الاستهداف ===== */}
          <SrTargeting f={f} setF={setF} rows={rows||[]} open={panelOpen} setOpen={setPanelOpen}/>

          {/* ===== أولويات الإغلاق ===== */}
          {closeToday.length>0 && (
            <Card>
              <div className="flex items-center gap-2 mb-3">
                <Icon n="bolt" s={16} c="txt-dim"/>
                <h3 className="font-semibold t-sm">أغلق هذه أولًا</h3>
                <span className="t-chip txt-dim mr-auto">أعلى ٥ بالأولوية</span>
              </div>
              <div className="space-y-2">
                {closeToday.map(({c,s},i)=>{
                  const na=srNextAction(c);
                  return (
                    <button key={c.id} onClick={()=>setDetailId(c.id)} className="w-full text-right rounded-[8px] p-3 flex items-center gap-3 row-hover" style={{background:"var(--surface-2)"}}>
                      <span className="w-6 h-6 rounded-[6px] t-chip tnum font-semibold flex items-center justify-center shrink-0" style={{background:"var(--surface)",color:"var(--ink-3)",border:"1px solid var(--line)"}}>{i+1}</span>
                      <div className="min-w-0 flex-1">
                        <div className="t-2xs font-semibold truncate">{c.name} <span className={"font-medium "+cMuted}>· {c.stage}</span></div>
                        <div className="t-chip mt-0.5 truncate" style={{color:na.c}}>{na.t}</div>
                      </div>
                      <div className="text-left shrink-0">
                        <div className="t-2xs font-semibold tnum">{srMoney(c.quote_value)}</div>
                        <div className="t-chip txt-dim">ريال</div>
                      </div>
                    </button>
                  );
                })}
              </div>
            </Card>
          )}

          {/* ===== الأنبوب / القائمة ===== */}
          {filtered.length===0 ? (
            <ReportEmpty text={(rows||[]).length===0?"ابدأ بإضافة أول عميل زار المعرض اليوم.":"ما فيه عميل يطابق التصفية الحالية."}/>
          ) : view==="board" ? (
            <div className="flex gap-3 overflow-x-auto pb-2 no-scrollbar">
              {SR_STAGES.map(s=>{
                const col=filtered.filter(c=>c.stage===s.k).sort((a,b)=>srScore(b).score-srScore(a).score);
                const sum=col.reduce((a,c)=>a+(Number(c.quote_value)||Number(c.deal_value)||0),0);
                return (
                  <div key={s.k} className="w-[268px] shrink-0">
                    <div className="rounded-[8px] p-2.5 mb-2" style={{background:"var(--surface-2)",borderTop:`2px solid ${s.color}`}}>
                      <div className="flex items-center gap-2">
                        <Icon n={s.icon} s={14} c="txt-dim"/>
                        <span className="t-2xs font-semibold">{s.k}</span>
                        <span className="mr-auto chip tnum" style={{background:"var(--surface)",color:"var(--ink-2)",borderColor:"var(--line)"}}>{col.length}</span>
                      </div>
                      <div className="t-chip txt-dim mt-1.5 tnum">{srMoney(sum)} ريال · احتمال {Math.round(s.p*100)}%</div>
                    </div>
                    <div className="space-y-2">
                      {col.length===0
                        ? <div className={"rounded-xl p-3 t-chip text-center "+cTrack+" "+cMuted}>فارغة</div>
                        : col.map(c=><SrCard key={c.id} c={c} onOpen={x=>setDetailId(x.id)} onMove={(x,st)=>patch(x,{stage:st})}/>)}
                    </div>
                  </div>
                );
              })}
            </div>
          ) : (
            <div className="space-y-2">
              {filtered.map(c=><SrCard key={c.id} c={c} onOpen={x=>setDetailId(x.id)} onMove={(x,st)=>patch(x,{stage:st})}/>)}
            </div>
          )}

          {/* ===== التحليلات ===== */}
          <div className="grid lg:grid-cols-2 gap-3">
            <Card>
              <h3 className="font-semibold t-sm mb-3">قمع البيع</h3>
              <Funnel stages={SR_STAGES.filter(s=>s.k!=="خسارة").map(s=>({label:s.k,value:filtered.filter(c=>c.stage===s.k).length,color:s.color}))}/>
            </Card>
            <Card>
              <h3 className="font-semibold t-sm mb-3">أسباب الخسارة</h3>
              {(()=>{ const lost=(rows||[]).filter(c=>c.stage==="خسارة");
                const d=SR_LOSS.map((r,i)=>({label:r,value:lost.filter(c=>c.loss_reason===r).length,color:COLORS[i%COLORS.length]})).filter(x=>x.value>0);
                return d.length? <><Bars data={d}/><p className={"t-chip mt-3 "+cMuted}>أكبر سبب هو أول شيء تعالجه في نصّك البيعي.</p></>
                                : <div className={"t-2xs "+cMuted}>ما فيه خسائر مسجّلة. سجّل سبب كل خسارة — هذي أهم بيانات عندك.</div>; })()}
            </Card>
            <Card>
              <h3 className="font-semibold t-sm mb-3">المنافسون في المعرض</h3>
              {(()=>{ const d=SR_COMPETITORS.filter(x=>x!=="لا يوجد").map((r,i)=>({label:r,value:(rows||[]).filter(c=>c.competitor===r).length,color:COMPANY_COLORS[r]||COLORS[i%COLORS.length]})).filter(x=>x.value>0);
                return d.length? <Bars data={d}/> : <div className={"t-2xs "+cMuted}>ما سُجّل أي منافس بعد.</div>; })()}
            </Card>
            <Card>
              <h3 className="font-semibold t-sm mb-3">أداء المعارض</h3>
              {(()=>{ const d=SHOWROOMS_OPTS.map((r,i)=>({label:r,value:(rows||[]).filter(c=>c.showroom===r&&c.stage==="تم البيع").reduce((a,c)=>a+(Number(c.deal_value)||Number(c.quote_value)||0),0),color:COLORS[i%COLORS.length]})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value).slice(0,8);
                return d.length? <Bars data={d}/> : <div className={"t-2xs "+cMuted}>لا توجد مبيعات مسجّلة بعد.</div>; })()}
            </Card>
          </div>

          {/* ===== شبكة الـ٥ نجوم ===== */}
          <SrElite elite={elite} onRefer={(r,kind)=>{
            setEditor({ mode:"add", id:null, data: blank(
              kind==="contractors"
                ? { linked_contractor:r.name, source:"إحالة مطوّر", city:r.city||"" }
                : { linked_painter:r.name, source:"إحالة دهان", city:r.city||"", showroom:r.showroom||"" }
            )});
          }}/>

          <SrEditor editor={editor} setEditor={setEditor} onSave={save} elite={elite} saving={saving}/>
          <SrDetail c={detail} elite={elite} onClose={()=>setDetailId(null)}
            onEdit={c=>{ setDetailId(null); setEditor({mode:"edit",id:c.id,original:c,data:{...blank(),...c}}); }}
            onDelete={remove} onPatch={patch}/>
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════
       هيكل التطبيق: قائمة جانبية مجموعة + شريط علوي + لوحة أوامر + تنقّل سفلي
       ════════════════════════════════════════════════════════════ */

    /* تجميع التبويبات في أقسام منطقية بدل قائمة مسطّحة من ١٥ عنصرًا */
    /* تجميع التبويبات في أقسام منطقية — تسع وجهات فقط */
    const NAV_GROUPS = [
      { title:"يومي", items:[["dashboard","اليوم","home"],["plan","الخطة الأسبوعية","clock"]] },
      { title:"البيع الميداني", items:[["showroom","عملاء المعرض","target"],["painters","الدهانين","brush"],["projects","المواقع","building"],["contractors","المطوّرون العقاريون","layers"],["field","النشاط الميداني","pin"]] },
      { title:"السوق والتحليل", items:[["market","السوق","trophy"],["analysis","التحليل","chart"]] },
    ];
    const NAV_ICON = Object.fromEntries([
      ...NAV_GROUPS.flatMap(g=>g.items.map(([k,,ic])=>[k,ic])),
      ["tasks","check"],["visits","pin"],["trainings","star"],["marketshare","trophy"],
      ["products","drop"],["insights","bolt"],["timeline","list"],["reports","printer"],
    ]);
    const RECENT_KEY="jz_recent_tabs", PINS_KEY="jz_pinned_tabs";

    function pushRecent(tab){
      try{
        const a=JSON.parse(localStorage.getItem(RECENT_KEY)||"[]").filter(x=>x!==tab);
        a.unshift(tab); localStorage.setItem(RECENT_KEY, JSON.stringify(a.slice(0,5)));
      }catch(e){}
    }
    function getRecent(){ try{ return JSON.parse(localStorage.getItem(RECENT_KEY)||"[]"); }catch(e){ return []; } }
    function getPins(){ try{ return JSON.parse(localStorage.getItem(PINS_KEY)||"[]"); }catch(e){ return []; } }
    function togglePin(tab){
      const p=getPins(); const n=p.includes(tab)?p.filter(x=>x!==tab):[...p,tab];
      try{ localStorage.setItem(PINS_KEY, JSON.stringify(n)); }catch(e){}
      return n;
    }

    /* ═══════════ القائمة الجانبية ═══════════ */
    function Sidebar({ tab, go, open, setOpen, rail, setRail }){
      const [pins,setPins]=useState(getPins());
      const recent=getRecent().filter(t=>t!==tab && TITLES[t]).slice(0,3);
      const W = rail ? "var(--sidebar-rail)" : "var(--sidebar-w)";

      /* التثبيت بالضغط المطوّل أو بزر يظهر عند المرور — بلا نجمة دائمة تشوّش الصفّ */
      const Item=({k,label,icon})=>{
        const pinned=pins.includes(k);
        return (
          <div className="relative group">
            <button onClick={()=>go(k)} aria-current={tab===k?"page":undefined} title={rail?label:undefined}
              className={"nav-item tap press "+(rail?"justify-center":"")}>
              <Icon n={icon} s={16}/>
              {!rail && <span className="truncate flex-1">{label}</span>}
              {!rail && pinned && <Icon n="star" s={10} c="txt-accent shrink-0"/>}
            </button>
            {!rail && (
              <button onClick={()=>setPins(togglePin(k))}
                aria-label={(pinned?"إزالة من":"إضافة إلى")+" المفضّلة"}
                className="tap absolute left-1 top-1/2 -translate-y-1/2 w-7 h-7 rounded-[6px] flex items-center justify-center opacity-0 group-hover:opacity-100 focus-visible:opacity-100 transition-opacity txt-dim hover:txt-accent"
                style={pinned?{opacity:0}:undefined}>
                <Icon n="star" s={12}/>
              </button>)}
          </div>
        );
      };

      const GroupLabel=({children})=> rail
        ? <div className="mx-auto w-5 mb-2 mt-1" style={{borderTop:"1px solid var(--line)"}}/>
        : <div className="eyebrow px-2.5 mb-1.5">{children}</div>;

      return (
        <aside dir="rtl" aria-label="القائمة الرئيسية" id="sidebar"
          className={"fixed top-0 right-0 h-full z-40 flex flex-col lg:translate-x-0 no-print "+(open?"translate-x-0":"translate-x-full")}
          style={{ width:W, background:"var(--surface)", borderLeft:"1px solid var(--line)",
                   transition:"transform var(--d-3) var(--ease), width var(--d-3) var(--ease)" }}>

          {/* الهوية — الشعار الحقيقي، والعلامة وحدها حين تنطوي القائمة */}
          <div className={"flex items-center shrink-0 h-[57px] "+(rail?"px-3 justify-center":"px-4 gap-3")}
            style={{borderBottom:"1px solid var(--line)"}}>
            <button onClick={()=>go("dashboard")} className="flex items-center gap-2.5 min-w-0 press rounded-[8px]"
              aria-label="الذهاب إلى اللوحة الرئيسية">
              <span className="logo-mark" style={{width:30,height:30}}/>
              {!rail && <span className="logo-word" style={{width:104}} role="img" aria-label="دهانات الجزيرة"/>}
            </button>
            <button onClick={()=>setOpen(false)} aria-label="إغلاق القائمة"
              className="lg:hidden mr-auto btn-icon tap"><Icon n="close" s={17}/></button>
          </div>

          {/* التبويبات */}
          <nav className="flex-1 overflow-y-auto no-scrollbar px-2.5 py-3 space-y-4">
            {pins.length>0 && !rail && (
              <div>
                <GroupLabel>المفضّلة</GroupLabel>
                <div className="space-y-px">
                  {pins.filter(k=>TITLES[k]).map(k=><Item key={k} k={k} label={TITLES[k]} icon={NAV_ICON[k]||"grid"}/>)}
                </div>
              </div>
            )}
            {NAV_GROUPS.map(g=>(
              <div key={g.title}>
                <GroupLabel>{g.title}</GroupLabel>
                <div className="space-y-px">
                  {g.items.map(([k,label,icon])=><Item key={k} k={k} label={label} icon={icon}/>)}
                </div>
              </div>
            ))}
            {recent.length>0 && !rail && (
              <div>
                <GroupLabel>آخر ما زرته</GroupLabel>
                <div className="space-y-px">
                  {recent.map(k=>(
                    <button key={k} onClick={()=>go(k)} className="nav-item t-2xs">
                      <Icon n="clock" s={13} c="txt-dim"/><span className="truncate flex-1">{TITLES[k]}</span>
                    </button>))}
                </div>
              </div>
            )}
          </nav>

          {/* التذييل */}
          <div className="shrink-0 px-2.5 py-2.5" style={{borderTop:"1px solid var(--line)"}}>
            {!rail ? (
              <div className="flex items-center gap-2.5 px-1.5 py-1">
                <span className="w-7 h-7 rounded-full flex items-center justify-center t-chip font-semibold shrink-0"
                  style={{background:"var(--surface-2)",color:"var(--ink-2)",border:"1px solid var(--line)"}}>
                  {String(currentUserName()||"—").trim().charAt(0)}
                </span>
                <div className="min-w-0 flex-1">
                  <div className="t-2xs font-medium truncate">{currentUserName()}</div>
                  <div className="t-chip txt-dim">مندوب ميداني</div>
                </div>
                <button onClick={async()=>{ if(await confirmDialog("سيُغلق النظام وستحتاج لتسجيل الدخول مرة أخرى.",{title:"تسجيل الخروج",confirmLabel:"تسجيل الخروج"})){ setSession(null); window.location.reload(); } }}
                  aria-label="تسجيل الخروج" title="تسجيل الخروج" className="btn-icon shrink-0"><Icon n="logout" s={15}/></button>
              </div>
            ) : (
              <div className="flex justify-center py-1">
                <span className="w-7 h-7 rounded-full flex items-center justify-center t-chip font-semibold"
                  title={currentUserName()}
                  style={{background:"var(--surface-2)",color:"var(--ink-2)",border:"1px solid var(--line)"}}>
                  {String(currentUserName()||"—").trim().charAt(0)}
                </span>
              </div>
            )}
            <button onClick={()=>setRail(!rail)} title={rail?"توسيع القائمة":"تصغير القائمة"}
              aria-label={rail?"توسيع القائمة":"تصغير القائمة"}
              className="hidden lg:flex w-full items-center justify-center gap-1.5 mt-1.5 py-1.5 rounded-[8px] t-chip txt-dim row-hover">
              <Icon n="chevron" s={13} c={rail?"":"rotate-180"}/>{!rail && <span>تصغير</span>}
            </button>
          </div>
        </aside>
      );
    }

    /* ═══════════ الشريط العلوي ═══════════ */
    function TopBar({ tab, gq, setGq, results, go, onMenu, onQuick, onPalette, dark, setDark,
                     notifs, notifOpen, setNotifOpen, unseen, onAck, notifOn, onEnableNotif, pushPhone }){
      const [profileOpen,setProfileOpen]=useState(false);
      const [fs,setFs]=useState(()=>isFullscreen());
      useEffect(()=>{
        const h=()=>setFs(isFullscreen());
        document.addEventListener("fullscreenchange",h);
        document.addEventListener("webkitfullscreenchange",h);
        return ()=>{ document.removeEventListener("fullscreenchange",h); document.removeEventListener("webkitfullscreenchange",h); };
      },[]);
      const wrap=useRef(null);
      useEffect(()=>{
        if(!profileOpen) return;
        const h=e=>{ if(wrap.current && !wrap.current.contains(e.target)) setProfileOpen(false); };
        document.addEventListener("mousedown",h); return ()=>document.removeEventListener("mousedown",h);
      },[profileOpen]);
      const isMac=(()=>{ try{ return /Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent); }catch(e){ return false; } })();

      return (
        <header className="topbar sticky top-0 z-30 px-3 sm:px-5 h-[57px] flex items-center gap-2 sm:gap-3 no-print">
          <button onClick={onMenu} aria-label="فتح القائمة" aria-controls="sidebar"
            className="lg:hidden btn-icon tap"><Icon n="menu" s={19}/></button>

          {/* علامة الشعار على الجوال حيث القائمة الجانبية مخفية */}
          <span className="logo-mark lg:hidden" style={{width:26,height:26}} aria-hidden="true"/>

          <h1 className="t-xs font-semibold whitespace-nowrap hidden md:block">{TITLES[tab]}</h1>
          <span className="hidden md:block w-px h-4" style={{background:"var(--line)"}}/>

          {/* البحث — زر يفتح لوحة الأوامر، لا حقل وهمي */}
          <div className="flex-1 max-w-[420px] min-w-0">
            <button onClick={onPalette} aria-label="بحث شامل ولوحة أوامر"
              className="w-full flex items-center gap-2 rounded-[8px] px-3 h-9 text-right press transition-colors"
              style={{background:"var(--surface-2)",border:"1px solid var(--line)"}}>
              <Icon n="search" s={14} c="txt-dim"/>
              <span className="t-2xs txt-dim flex-1 truncate">ابحث أو نفّذ أمرًا</span>
              <span className="hidden sm:flex items-center gap-1" dir="ltr">
                <kbd className="key">{isMac?"⌘":"Ctrl"}</kbd><kbd className="key">K</kbd>
              </span>
            </button>
          </div>

          <div className="mr-auto flex items-center gap-0.5">
            <button onClick={onQuick} title="زيارة سريعة" aria-label="تسجيل زيارة سريعة"
              className="btn-icon tap hidden sm:flex"><Icon n="bolt" s={17}/></button>

            {/* الإشعارات */}
            <div className="relative">
              <button onClick={()=>setNotifOpen(o=>{ const nv=!o; if(nv) onAck(); return nv; })}
                aria-label={"الإشعارات"+(unseen>0?` (${unseen} جديدة)`:"")}
                aria-expanded={notifOpen} className="btn-icon tap relative">
                <Icon n="bell" s={17}/>
                {unseen>0 && (
                  <span className="absolute top-1 left-1 min-w-[15px] h-[15px] px-1 rounded-full tnum text-[9px] font-semibold flex items-center justify-center"
                    style={{background:"var(--danger)",color:"#fff"}}>{unseen}</span>
                )}
              </button>
              {notifOpen && (
                <div className="notif-pop card card-raised absolute top-full left-0 mt-2 w-[330px] max-w-[calc(100vw-24px)] overflow-hidden z-40 pop">
                  <div className="px-3.5 py-2.5 flex items-center justify-between" style={{borderBottom:"1px solid var(--line)"}}>
                    <span className="t-xs font-semibold">الإشعارات</span>
                    <span className="chip tnum" style={{background:"var(--surface-2)",color:"var(--ink-2)"}}>{notifs.length}</span>
                  </div>
                  {!notifOn && (
                    <div className="px-3 py-2.5" style={{borderBottom:"1px solid var(--line)"}}>
                      <button onClick={onEnableNotif} className="btn btn-primary btn-sm btn-block">
                        <Icon n="bell" s={13}/> تفعيل تنبيهات الجوال</button>
                    </div>)}
                  <div className="notif-list max-h-[min(380px,60vh)] overflow-y-auto">
                    {notifs.length===0 ? (
                      <div className="px-4 py-10 text-center">
                        <Icon n="check" s={20} c="txt-dim"/>
                        <div className="t-2xs txt-muted mt-2">كل شيء تحت السيطرة</div>
                      </div>
                    ) : notifs.map((n,i)=>{
                      const col=n.level==="high"?"var(--danger)":"var(--warn)";
                      return (
                        <button key={i} onClick={()=>{ if(n.go) go(n.go); }}
                          className="w-full px-3.5 py-2.5 flex gap-2.5 text-right row-hover"
                          style={{borderTop:i?"1px solid var(--line)":"none"}}>
                          <span className="w-1.5 h-1.5 rounded-full mt-2 shrink-0" style={{background:col}}/>
                          <div className="min-w-0">
                            <div className="t-2xs font-medium">{n.title}</div>
                            <div className="t-chip txt-muted mt-0.5">{n.text}</div>
                          </div>
                        </button>);
                    })}
                  </div>
                </div>
              )}
            </div>

            {/* ملء الشاشة — يخفي شريط كروم على الجوال */}
            {fsSupported() && (
              <button onClick={()=>{ if(isFullscreen()) leaveFullscreen(); else enterFullscreen(); }}
                title={fs?"الخروج من ملء الشاشة":"ملء الشاشة"}
                aria-label={fs?"الخروج من ملء الشاشة":"ملء الشاشة"}
                className="btn-icon tap lg:hidden"><Icon n={fs?"shrink":"expand"} s={17}/></button>
            )}

            <button onClick={()=>setDark(!dark)} aria-label={dark?"التبديل إلى الوضع النهاري":"التبديل إلى الوضع الليلي"}
              className="btn-icon tap"><Icon n={dark?"sun":"moon"} s={17}/></button>

            {/* الملف الشخصي */}
            <div className="relative" ref={wrap}>
              <button onClick={()=>setProfileOpen(o=>!o)} aria-label="الحساب" aria-expanded={profileOpen}
                className="tap w-8 h-8 rounded-full flex items-center justify-center t-chip font-semibold press mr-1"
                style={{background:"var(--surface-2)",color:"var(--ink-2)",border:"1px solid var(--line)"}}>
                {String(currentUserName()||"—").trim().charAt(0)}
              </button>
              {profileOpen && (
                <div className="card card-raised absolute top-full left-0 mt-2 w-56 overflow-hidden z-40 pop">
                  <div className="px-3.5 py-2.5" style={{borderBottom:"1px solid var(--line)"}}>
                    <div className="t-2xs font-medium truncate">{currentUserName()}</div>
                    <div className="t-chip txt-dim mt-0.5">مندوب ميداني</div>
                  </div>
                  <button onClick={()=>{ setProfileOpen(false); onPalette(); }}
                    className="w-full px-3.5 py-2.5 flex items-center gap-2.5 t-2xs text-right row-hover">
                    <Icon n="search" s={14} c="txt-dim"/> لوحة الأوامر
                    <span className="mr-auto flex gap-1" dir="ltr"><kbd className="key">{isMac?"⌘":"Ctrl"}</kbd><kbd className="key">K</kbd></span>
                  </button>
                  <button onClick={()=>{ setProfileOpen(false); setDark(!dark); }}
                    className="w-full px-3.5 py-2.5 flex items-center gap-2.5 t-2xs text-right row-hover">
                    <Icon n={dark?"sun":"moon"} s={14} c="txt-dim"/> {dark?"الوضع النهاري":"الوضع الليلي"}
                  </button>
                  <button onClick={async()=>{ if(await confirmDialog("سيُغلق النظام وستحتاج لتسجيل الدخول مرة أخرى.",{title:"تسجيل الخروج",confirmLabel:"تسجيل الخروج"})){ setSession(null); window.location.reload(); } }}
                    className="w-full px-3.5 py-2.5 flex items-center gap-2.5 t-2xs text-right row-hover"
                    style={{color:"var(--danger)",borderTop:"1px solid var(--line)"}}>
                    <Icon n="logout" s={14}/> تسجيل الخروج
                  </button>
                </div>
              )}
            </div>
          </div>
        </header>
      );
    }

    /* ═══════════ التنقّل السفلي للجوال ═══════════ */
    function BottomNav({ tab, go, onQuick, onMenu }){
      const items=[["dashboard","اليوم","home"],["painters","الدهانين","brush"],["__fab","تسجيل زيارة","bolt"],["showroom","المعرض","target"],["__more","المزيد","menu"]];
      return (
        <nav className="bottom-nav lg:hidden fixed bottom-0 inset-x-0 z-30 topbar no-print" aria-label="التنقّل السريع">
          <div className="flex items-stretch justify-around px-1 pt-1 pb-1">
            {items.map(([k,label,icon])=>{
              /* زر الزيارة السريعة: الفعل الأساسي في الميدان، فيأخذ الوزن الأكبر */
              if(k==="__fab") return (
                <button key={k} onClick={onQuick} aria-label={label}
                  className="btn btn-primary tap -mt-4 rounded-[14px] flex items-center justify-center press shrink-0 mx-1"
                  style={{width:50,height:50,padding:0,boxShadow:"var(--e-3)"}}><Icon n={icon} s={21}/></button>
              );
              const active = k==="__more" ? false : tab===k;
              return (
                <button key={k} onClick={()=>k==="__more"?onMenu():go(k)}
                  aria-current={active?"page":undefined}
                  className="tap flex-1 flex flex-col items-center justify-center gap-1 py-1.5 rounded-[8px] press transition-colors"
                  style={{color:active?"var(--ink)":"var(--ink-3)"}}>
                  <span className="relative flex items-center justify-center">
                    <Icon n={icon} s={18}/>
                    {active&&<span className="absolute -bottom-[7px] w-1 h-1 rounded-full" style={{background:"var(--accent)"}}/>}
                  </span>
                  <span className="t-chip font-medium">{label}</span>
                </button>
              );
            })}
          </div>
        </nav>
      );
    }

    /* ═══════════ لوحة الأوامر (Ctrl/⌘ + K) ═══════════ */
    function CommandPalette({ open, onClose, go, onQuick, onAddShowroom, dark, setDark }){
      const [q,setQ]=useState("");
      const [recs,setRecs]=useState([]);
      const [sel,setSel]=useState(0);
      const [busy,setBusy]=useState(false);
      const inputRef=useRef(null);
      const listRef=useRef(null);

      useEffect(()=>{ if(open){ setQ(""); setSel(0); setRecs([]); setTimeout(()=>{ try{ inputRef.current&&inputRef.current.focus(); }catch(e){} },40); } },[open]);

      /* بحث في السجلات (نفس الجداول الموجودة — لا منطق جديد) */
      useEffect(()=>{
        if(!open || q.trim().length<2){ setRecs([]); return; }
        let dead=false; setBusy(true);
        const t=setTimeout(async()=>{
          const like="%"+q.trim()+"%";
          const [p,pr,c,sr]=await Promise.all([
            db.from("painters").select("id,name,city").ilike("name",like).limit(4),
            db.from("projects").select("id,name,city").ilike("name",like).limit(4),
            db.from("contractors").select("id,name,city").ilike("name",like).limit(4),
            db.from("showroom_customers").select("id,name,stage").ilike("name",like).limit(4),
          ]);
          if(dead) return;
          const out=[];
          (p.data||[]).forEach(x=>out.push({kind:"دهان",label:x.name,sub:x.city||"",go:"painters",icon:"brush",color:tok("info")}));
          (pr.data||[]).forEach(x=>out.push({kind:"موقع",label:x.name,sub:x.city||"",go:"projects",icon:"building",color:tok("warn")}));
          (c.data||[]).forEach(x=>out.push({kind:"مطوّر",label:x.name,sub:x.city||"",go:"contractors",icon:"layers",color:tok("info")}));
          (sr.data||[]).forEach(x=>out.push({kind:"عميل معرض",label:x.name,sub:x.stage||"",go:"showroom",icon:"target",color:tok("accent")}));
          setRecs(out); setBusy(false);
        },260);
        return ()=>{ dead=true; clearTimeout(t); setBusy(false); };
      },[q,open]);

      const ACTIONS=[
        { label:"تسجيل زيارة سريعة", icon:"bolt", run:()=>onQuick(), hint:"إنشاء" },
        { label:"إضافة عميل معرض جديد", icon:"plus", run:()=>onAddShowroom(), hint:"إنشاء" },
        { label:(dark?"تبديل إلى الوضع النهاري":"تبديل إلى الوضع الليلي"), icon:(dark?"sun":"moon"), run:()=>setDark(!dark), hint:"إعداد" },
      ];

      const ql=q.trim().toLowerCase();
      const navHits=NAV_GROUPS.flatMap(g=>g.items.map(([k,label,icon])=>({k,label,icon,group:g.title})))
        .filter(x=>!ql||x.label.toLowerCase().includes(ql));
      const actHits=ACTIONS.filter(a=>!ql||a.label.toLowerCase().includes(ql));

      const rows=[
        ...(ql?[]:getRecent().filter(k=>TITLES[k]).slice(0,3).map(k=>({type:"nav",section:"آخر ما زرته",k,label:TITLES[k],icon:NAV_ICON[k]||"grid"}))),
        ...navHits.map(x=>({type:"nav",section:"التنقّل",k:x.k,label:x.label,icon:x.icon,sub:x.group})),
        ...actHits.map(a=>({type:"act",section:"إجراءات",label:a.label,icon:a.icon,run:a.run,sub:a.hint})),
        ...recs.map(r=>({type:"rec",section:"السجلات",label:r.label,icon:r.icon,sub:r.kind+(r.sub?" · "+r.sub:""),go:r.go,color:r.color})),
      ];

      useEffect(()=>{ setSel(0); },[q,recs.length]);
      useEffect(()=>{
        if(!open) return;
        const h=e=>{
          if(e.key==="Escape"){ e.preventDefault(); onClose(); }
          else if(e.key==="ArrowDown"){ e.preventDefault(); setSel(i=>Math.min(rows.length-1,i+1)); }
          else if(e.key==="ArrowUp"){ e.preventDefault(); setSel(i=>Math.max(0,i-1)); }
          else if(e.key==="Enter"){ e.preventDefault(); const r=rows[sel]; if(r) fire(r); }
        };
        window.addEventListener("keydown",h); return ()=>window.removeEventListener("keydown",h);
      },[open,rows,sel]);
      /* التمرير محسوب يدويًا: scrollIntoView يعبث بتمرير الإطار الخارجي في بيئات المعاينة */
      useEffect(()=>{
        try{
          const box=listRef.current; if(!box) return;
          const el=box.querySelector('[data-sel="1"]'); if(!el) return;
          const top=el.offsetTop, bottom=top+el.offsetHeight;
          if(top < box.scrollTop) box.scrollTop=top-8;
          else if(bottom > box.scrollTop+box.clientHeight) box.scrollTop=bottom-box.clientHeight+8;
        }catch(e){}
      },[sel]);

      function fire(r){
        onClose();
        if(r.type==="nav") go(r.k);
        else if(r.type==="rec") go(r.go);
        else if(r.type==="act") setTimeout(()=>r.run(),60);
      }
      function hl(text){
        if(!ql) return text;
        const i=String(text).toLowerCase().indexOf(ql);
        if(i<0) return text;
        return (<>{String(text).slice(0,i)}<mark className="hl">{String(text).slice(i,i+ql.length)}</mark>{String(text).slice(i+ql.length)}</>);
      }

      if(!open) return null;
      let lastSection=null;
      return (
        <div className="fixed inset-0 z-[80] flex items-start justify-center px-3 pt-[8vh] sm:pt-[12vh] no-print"
          style={{background:"color-mix(in srgb, #0B0B0C 55%, transparent)",backdropFilter:"blur(3px)",WebkitBackdropFilter:"blur(3px)"}}
          onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }} role="dialog" aria-modal="true" aria-label="لوحة الأوامر">
          <div className="card card-raised w-full max-w-xl overflow-hidden sheet">
            <div className="flex items-center gap-2.5 px-4 h-[52px]" style={{borderBottom:"1px solid var(--line)"}}>
              <Icon n="search" s={16} c="txt-dim"/>
              <input ref={inputRef} value={q} onChange={e=>setQ(e.target.value)}
                placeholder="اكتب للتنقّل أو للبحث في الدهانين والمواقع والعملاء"
                className="flex-1 bg-transparent outline-none t-sm min-w-0" aria-label="بحث"
                role="combobox" aria-expanded="true" aria-controls="palette-list" autoComplete="off"/>
              {busy && <Icon n="refresh" s={14} c="txt-dim spin"/>}
              <kbd className="key">Esc</kbd>
            </div>

            <div ref={listRef} id="palette-list" role="listbox" className="max-h-[52vh] overflow-y-auto py-1.5">
              {rows.length===0 ? (
                <div className="px-4 py-12 text-center">
                  <Icon n="search" s={22} c="txt-dim"/>
                  <div className="t-xs font-medium mt-2.5">ما فيه نتيجة لـ «{q}»</div>
                  <div className="t-chip txt-dim mt-1">جرّب اسم دهان، موقع، أو اسم تبويب</div>
                </div>
              ) : rows.map((r,i)=>{
                const head = r.section!==lastSection ? (lastSection=r.section) : null;
                return (
                  <div key={i}>
                    {head && <div className="eyebrow px-4 pt-3 pb-1.5">{head}</div>}
                    <button data-sel={i===sel?"1":"0"} role="option" aria-selected={i===sel}
                      onMouseEnter={()=>setSel(i)} onClick={()=>fire(r)}
                      className="w-full flex items-center gap-3 px-3 py-2 rounded-[8px] text-right transition-colors"
                      style={i===sel?{background:"var(--surface-2)"}:{}}>
                      <span className="w-7 h-7 rounded-[7px] flex items-center justify-center shrink-0"
                        style={{color:r.color||"var(--ink-2)",background:`color-mix(in srgb, ${r.color||"var(--ink-2)"} 11%, transparent)`}}>
                        <Icon n={r.icon} s={14}/>
                      </span>
                      <span className="min-w-0 flex-1">
                        <span className="block t-2xs font-medium truncate">{hl(r.label)}</span>
                        {r.sub && <span className="block t-chip txt-dim truncate">{r.sub}</span>}
                      </span>
                      {i===sel && <kbd className="key shrink-0">↵</kbd>}
                    </button>
                  </div>
                );
              })}
            </div>

            <div className="px-4 py-2 flex items-center gap-3 t-chip txt-dim" style={{borderTop:"1px solid var(--line)"}}>
              <span className="flex items-center gap-1.5"><kbd className="key">↑</kbd><kbd className="key">↓</kbd> تنقّل</span>
              <span className="flex items-center gap-1.5"><kbd className="key">↵</kbd> تنفيذ</span>
              <span className="flex items-center gap-1.5 mr-auto"><kbd className="key">Esc</kbd> إغلاق</span>
            </div>
          </div>
        </div>
      );
    }

    /* ===== التطبيق ===== */
    /* شريط التبويبات الفرعية داخل الشاشات المجمّعة */
    function SubTabs({ screen, sub, onSub }){
      const cfg=SCREENS[screen]; if(!cfg) return null;
      return (
        <div className="rail mb-5 -mt-1" role="tablist" aria-label={cfg.title}>
          {cfg.subs.map(([k,label])=>{
            const on_=sub===k;
            return (
              <button key={k} role="tab" aria-selected={on_} onClick={()=>onSub(k)}
                className="relative px-3.5 py-2 t-2xs whitespace-nowrap transition-colors"
                style={{color:on_?"var(--ink)":"var(--ink-3)",fontWeight:on_?600:450}}>
                {label}
                {on_&&<span className="absolute inset-x-2 -bottom-px h-[2px] rounded-full" style={{background:"var(--accent)"}}/>}
              </button>);
          })}
          <span className="flex-1" style={{borderBottom:"1px solid var(--line)",minWidth:8}}/>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════
       التنقّل: تسع وجهات بدل خمس عشرة.
       لم تُحذف أي شاشة — الشاشات المتقاربة صارت تبويبات داخل وجهة واحدة.
       كل نداء go("marketshare") القديم لا يزال يعمل عبر جدول المرادفات أدناه.
       ═══════════════════════════════════════════════════════════════════ */
    const SCREENS = {
      market:   { title:"السوق",   subs:[["marketshare","الحصة السوقية"],["market","رصد المنافسين"],["products","الكتالوج"]] },
      analysis: { title:"التحليل", subs:[["insights","الرؤى"],["reports","التقارير"],["timeline","سجل النشاط"]] },
      field:    { title:"النشاط الميداني", subs:[["visits","الزيارات"],["trainings","التدريبات"]] },
    };
    /* وجهة كل تبويب فرعي ← الشاشة التي تحتويه */
    const SUB_OF = {};
    Object.entries(SCREENS).forEach(([k,v])=>v.subs.forEach(([sub])=>{ SUB_OF[sub]=k; }));

    const NAV=[["dashboard","اليوم"],["plan","الخطة الأسبوعية"],["showroom","عملاء المعرض"],
      ["painters","الدهانين"],["projects","المواقع"],["contractors","المطوّرون العقاريون"],
      ["field","النشاط الميداني"],["market","السوق"],["analysis","التحليل"],
      /* عناوين التبويبات الفرعية تبقى معروفة للوحة الأوامر والبحث */
      ["tasks","المتابعات"],["visits","الزيارات"],["trainings","التدريبات"],
      ["marketshare","الحصة السوقية"],["products","الكتالوج"],
      ["insights","الرؤى"],["timeline","سجل النشاط"],["reports","التقارير"]];
    const TITLES=Object.fromEntries(NAV);
    TITLES.market="السوق";

    /* يفكّ أي وجهة (قديمة أو جديدة) إلى {tab, sub} */
    function resolveRoute(id){
      if(SCREENS[id]) return { tab:id, sub:SCREENS[id].subs[0][0] };
      if(SUB_OF[id])  return { tab:SUB_OF[id], sub:id };
      return { tab:id, sub:null };
    }

    /* تفضيل الوضع محفوظ، ويتبع النظام أول مرة */
    const THEME_KEY="jz_theme";
    function initialDark(){
      try{ const v=localStorage.getItem(THEME_KEY); if(v==="dark") return true; if(v==="light") return false; }catch(e){}
      try{ return window.matchMedia("(prefers-color-scheme: dark)").matches; }catch(e){ return false; }
    }

    function App() {
      const [tab,setTab]=useState("dashboard"); const [sub,setSub]=useState(null);
      const [dark,setDark]=useState(initialDark);
      /* يُضبط أثناء العرض لا في تأثير جانبي، فتلتقط الرسوم البيانية اللون الصحيح من أول إطار */
      THEME = dark ? "dark" : "light";
      const [sideOpen,setSideOpen]=useState(false); const [notifOpen,setNotifOpen]=useState(false);
      const [gq,setGq]=useState(""); const [results,setResults]=useState([]); const [notifs,setNotifs]=useState([]);
      const [quickOpen,setQuickOpen]=useState(false); const [prefill,setPrefill]=useState(null);
      const [notifOn,setNotifOn]=useState(notifEnabled()); const [ack,setAck]=useState(0);
      const sync=useSync();
      const [paletteOpen,setPaletteOpen]=useState(false);
      const [rail,setRail]=useState(()=>{ try{ return localStorage.getItem("jz_rail")==="1"; }catch(e){ return false; } });
      useEffect(()=>{ try{ localStorage.setItem("jz_rail", rail?"1":"0"); }catch(e){} },[rail]);
      useEffect(()=>{ pushRecent(tab); },[tab]);

      /* ═══════════ زر الرجوع في الجوال ═══════════
         الضغط على "رجوع" كان يخرج من الصفحة كليًّا. الآن يُستهلك أولًا في إغلاق
         أي نافذة/قائمة مفتوحة، ثم الرجوع للشاشة السابقة داخل النظام، ولا يُغلق
         التطبيق إلا بضغطتين متتاليتين خلال ثانيتين. */
      const navStack=useRef([]);
      const backRef=useRef({});
      backRef.current={ tab, sub, notifOpen, sideOpen, paletteOpen, quickOpen,
                        setTab, setSub, setNotifOpen, setSideOpen, setPaletteOpen, setQuickOpen };
      useEffect(()=>{
        let exiting=false, lastAsk=0;
        const arm=()=>{ try{ history.pushState({jz:1},""); }catch(e){} };
        try{ history.replaceState({jz:0},""); }catch(e){}
        arm();

        const closeTopLayer=()=>{
          const s=backRef.current;
          /* أي نافذة أو ورقة مفتوحة تُغلق كما لو ضُغط Esc */
          if(document.querySelector(".sheet-shell, .overlay")){
            try{ document.dispatchEvent(new KeyboardEvent("keydown",{key:"Escape",bubbles:true,cancelable:true})); }catch(e){}
            return true;
          }
          if(s.paletteOpen){ s.setPaletteOpen(false); return true; }
          if(s.quickOpen){ s.setQuickOpen(false); return true; }
          if(s.notifOpen){ s.setNotifOpen(false); return true; }
          if(s.sideOpen){ s.setSideOpen(false); return true; }
          /* قائمة الحساب المنسدلة تُغلق بمحاكاة نقرة خارجها */
          if(document.querySelector("header .card-raised")){
            try{ document.dispatchEvent(new MouseEvent("mousedown",{bubbles:true})); }catch(e){}
            return true;
          }
          return false;
        };

        const onPop=()=>{
          if(exiting) return;
          if(closeTopLayer()){ arm(); return; }
          const s=backRef.current;
          const prev=navStack.current.pop();
          if(prev){ s.setTab(prev.tab); s.setSub(prev.sub); window.scrollTo(0,0); arm(); return; }
          if(s.tab!=="dashboard"){ s.setTab("dashboard"); s.setSub(null); window.scrollTo(0,0); arm(); return; }
          const now=Date.now();
          if(now-lastAsk<2200){ exiting=true; setTimeout(()=>{ try{ history.back(); }catch(e){} },0); return; }
          lastAsk=now; toast("اضغط رجوع مرة أخرى للخروج","info"); arm();
        };
        window.addEventListener("popstate",onPop);
        return ()=>window.removeEventListener("popstate",onPop);
      },[]);

      /* اختصار لوحة الأوامر */
      useEffect(()=>{
        const h=e=>{ if((e.ctrlKey||e.metaKey) && String(e.key).toLowerCase()==="k"){ e.preventDefault(); setPaletteOpen(o=>!o); } };
        window.addEventListener("keydown",h); return ()=>window.removeEventListener("keydown",h);
      },[]);

      useEffect(()=>{
        document.documentElement.classList.toggle("dark",dark);
        try{ localStorage.setItem(THEME_KEY, dark?"dark":"light"); }catch(e){}
        const m=document.querySelector('meta[name="theme-color"]:not([media])');
        if(m) m.setAttribute("content", dark?"#0B0B0C":"#FAFAF9");
      },[dark]);

      /* يخفي شاشة الإقلاع بعد أن يرسم React أول شاشة فعلية */
      useEffect(()=>{ const b=document.getElementById("boot"); if(b) b.classList.add("done"); },[]);

      /* مزامنة الطابور: عند الفتح، كل دقيقة، وعند رجوع التطبيق للمقدمة */
      useEffect(()=>{
        const run=()=>{ if(navigator.onLine!==false) flushOutbox(); };
        const t=setTimeout(run,1500);
        const iv=setInterval(run,60*1000);
        const onVis=()=>{ if(document.visibilityState==="visible") run(); };
        document.addEventListener("visibilitychange",onVis);
        return ()=>{ clearTimeout(t); clearInterval(iv); document.removeEventListener("visibilitychange",onVis); };
      },[]);
      async function loadNotifs(){
        const today=TODAY();
        const [pr,t,p,c]=await Promise.all([db.from("projects").select("*"),db.from("trainings").select("*"),db.from("painters").select("*"),db.from("contractors").select("*")]);
        const list=[];
        // خطة الغد
        try{ const plan=JSON.parse(localStorage.getItem("jazeera_weekplan")||"{}"); const tm=new Date(); tm.setDate(tm.getDate()+1); const tIso=tm.toISOString().slice(0,10);
          if(plan[tIso]) list.push({level:"high",title:"زيارة الغد",text:`غداً مخطّط لزيارة مدينة ${plan[tIso]}`,go:"plan"}); }catch(e){}
        const allF=[...(p.data||[]),...(pr.data||[]),...(c.data||[])].filter(x=>x.next_followup&&x.next_followup<today&&x.followup_status!=="تمت"&&x.followup_status!=="ملغاة");
        allF.forEach(x=>list.push({level:"high",title:"متابعة متأخرة",text:`${x.name} — كان موعدها ${x.next_followup}`,go:"tasks"}));
        // عملاء المعرض المستحقّون
        try{
          const sr=await db.from("showroom_customers").select("name,stage,next_followup,followup_status,quote_value");
          (sr.data||[]).filter(x=>x.next_followup&&x.next_followup<=today&&x.followup_status!=="تمت"&&x.followup_status!=="ملغاة"&&SR_OPEN_STAGES.includes(x.stage))
            .forEach(x=>list.push({level:x.next_followup<today?"high":"mid",title:"عميل معرض يحتاج متابعة",
              text:`${x.name} — ${x.stage}${Number(x.quote_value)?" · "+srMoney(x.quote_value)+" ريال":""}`,go:"showroom"}));
        }catch(e){}
        (t.data||[]).filter(x=>x.date&&x.date>=today).forEach(x=>list.push({level:"mid",title:"تدريب قادم",text:`${x.name} — ${x.date}`,go:"trainings"}));
        setNotifs(list);
      }
      // إطلاق إشعارات الجوال للمهام المستحقّة + فحص دوري
      function pushPhoneNotifications(){ if(!notifEnabled()) return;
        const today=TODAY();
        // تذكير خطة الغد بالمدينة
        try{ const plan=JSON.parse(localStorage.getItem("jazeera_weekplan")||"{}"); const tm=new Date(); tm.setDate(tm.getDate()+1); const tIso=tm.toISOString().slice(0,10);
          if(plan[tIso]) fireNotification("📍 زيارة الغد", `غداً مخطّط لزيارة مدينة ${plan[tIso]} — راجع أبرز الدهانين والمطوّرين هناك.`, "plan-tomorrow"); }catch(e){}
        Promise.all([db.from("painters").select("name,next_followup,followup_status"),db.from("projects").select("name,next_followup,followup_status"),db.from("contractors").select("name,next_followup,followup_status"),db.from("trainings").select("name,date")]).then(([p,pr,c,t])=>{
          const due=[...(p.data||[]),...(pr.data||[]),...(c.data||[])].filter(x=>x.next_followup&&x.next_followup<=today&&x.followup_status!=="تمت"&&x.followup_status!=="ملغاة");
          if(due.length){ const overdue=due.filter(x=>x.next_followup<today).length;
            fireNotification("📋 مهامك الميدانية اليوم", `لديك ${due.length} متابعة مستحقّة${overdue?` · منها ${overdue} متأخرة` : ""}.`, "tasks-due"); }
          (t.data||[]).filter(x=>x.date===today).forEach(x=>fireNotification("🎓 تدريب اليوم", x.name, "training-"+x.name));
        }).catch(()=>{});
      }
      useEffect(()=>{ loadNotifs(); cloudLoadCatalog();
        const run=()=>pushPhoneNotifications();
        const t=setTimeout(run,3000);                       // عند الفتح
        const iv=setInterval(run, 30*60*1000);               // كل نصف ساعة أثناء فتح التطبيق
        const onVis=()=>{ if(document.visibilityState==="visible") run(); };
        document.addEventListener("visibilitychange",onVis);
        return ()=>{ clearTimeout(t); clearInterval(iv); document.removeEventListener("visibilitychange",onVis); };
      },[]);
      useEffect(()=>{ if(gq.trim().length<2){setResults([]);return;} const tm=setTimeout(async()=>{
        const [p,pr,c]=await Promise.all([db.from("painters").select("id,name").ilike("name","%"+gq+"%").limit(5),db.from("projects").select("id,name").ilike("name","%"+gq+"%").limit(5),db.from("contractors").select("id,name").ilike("name","%"+gq+"%").limit(5)]);
        const r=[]; (p.data||[]).forEach(x=>r.push({t:"دهان",n:x.name,go:"painters"})); (pr.data||[]).forEach(x=>r.push({t:"موقع",n:x.name,go:"projects"})); (c.data||[]).forEach(x=>r.push({t:"مطور عقاري",n:x.name,go:"contractors"})); setResults(r);
      },300); return ()=>clearTimeout(tm); },[gq]);

      /* أي وجهة قديمة تُفكّ تلقائيًا إلى شاشتها وتبويبها الفرعي */
      const go=(id,pre)=>{
        const r=resolveRoute(id);
        if(r.tab!==tab || r.sub!==sub){
          navStack.current.push({tab,sub});
          if(navStack.current.length>25) navStack.current.shift();
        }
        setTab(r.tab); setSub(r.sub);
        setSideOpen(false); setNotifOpen(false); setGq(""); setResults([]);
        if(pre) setPrefill({tab:id,data:pre});
        window.scrollTo(0,0);
      };
      const highCount=notifs.filter(n=>n.level==="high").length;
      const unseen=Math.max(0, highCount-ack);
      const prefillFor=t=> (prefill&&prefill.tab===t)?prefill.data:null;

      return (
        <div className="min-h-screen app-bg">
          <Sidebar tab={tab} go={go} open={sideOpen} setOpen={setSideOpen} rail={rail} setRail={setRail}/>
          {sideOpen&&<div className="fixed inset-0 z-30 lg:hidden fade-in no-print"
            style={{background:"color-mix(in srgb, #0B0B0C 50%, transparent)",backdropFilter:"blur(2px)",WebkitBackdropFilter:"blur(2px)"}}
            onClick={()=>setSideOpen(false)} aria-hidden="true"/>}

          <div style={{transition:"margin var(--d-3) var(--ease)"}}
               className={rail?"lg:mr-[var(--sidebar-rail)]":"lg:mr-[var(--sidebar-w)]"}>
            <TopBar tab={tab} gq={gq} setGq={setGq} results={results} go={go}
              onMenu={()=>setSideOpen(true)} onQuick={()=>setQuickOpen(true)} onPalette={()=>setPaletteOpen(true)}
              dark={dark} setDark={setDark} notifs={notifs} notifOpen={notifOpen} setNotifOpen={setNotifOpen}
              unseen={unseen} onAck={()=>setAck(highCount)} notifOn={notifOn}
              onEnableNotif={async()=>{ if(await enableNotifications()){ setNotifOn(true); pushPhoneNotifications(); toast("تم تفعيل تنبيهات الجوال","ok"); } }}
              pushPhone={pushPhoneNotifications}/>
            <SyncBar/>
            <main id="main" className="px-4 sm:px-6 lg:px-8 py-5 sm:py-7 w-full max-w-[1360px] mx-auto pb-28 lg:pb-12">
              <div key={"ver"+(sync.lastSync||"")} className="fade-in">
              {tab==="dashboard"&&<TodayPage key="today" onGo={go}/>}
              {tab==="tasks"&&<TasksToday key="tasks" onGo={go}/>}
              {tab==="showroom"&&<ShowroomPage key="sr" onGo={go}/>}
              {tab==="plan"&&<WeeklyPlanPage key="plan" onGo={go}/>}

              {/* الشاشات المجمّعة: عنوان واحد وشريط تبويبات، والمحتوى كما هو دون أي حذف */}
              {SCREENS[tab]&&(
                <>
                  <PageHeader title={SCREENS[tab].title}
                    lede={tab==="market"?"حصّتك، ومن ينافسك، وبأي منتج."
                        :tab==="analysis"?"ما تقوله بياناتك، وما يستحقّ تحرّكًا."
                        :"زياراتك وتدريباتك الميدانية."}/>
                  <SubTabs screen={tab} sub={sub} onSub={setSub}/>
                  {sub==="market"&&<MarketMonitorPage key="mon"/>}
                  {sub==="products"&&<ProductsPage key="prod"/>}
                  {sub==="marketshare"&&<MarketSharePage key="ms"/>}
                  {sub==="insights"&&<InsightsPage key="ins" onGo={go}/>}
                  {sub==="timeline"&&<Timeline key="tl"/>}
                  {sub==="reports"&&<ReportsPage key="rep" onGo={go}/>}
                  {CONFIG[sub]&&<Section key={sub} cfg={CONFIG[sub]} onGo={go} prefill={prefillFor(sub)} clearPrefill={()=>setPrefill(null)}/>}
                </>
              )}

              {!SCREENS[tab]&&CONFIG[tab]&&<Section key={tab} cfg={CONFIG[tab]} onGo={go} prefill={prefillFor(tab)} clearPrefill={()=>setPrefill(null)}/>}
              </div>
              <footer className="flex items-center justify-center gap-3 pt-10 pb-2 t-chip txt-dim">
                <span className="logo-mark" style={{width:14,height:14,opacity:.55}}/>
                <span>نظام الجزيرة الميداني</span>
              </footer>
            </main>
          </div>

          <BottomNav tab={tab} go={go} onQuick={()=>setQuickOpen(true)} onMenu={()=>setSideOpen(true)}/>

          <CommandPalette open={paletteOpen} onClose={()=>setPaletteOpen(false)} go={go}
            onQuick={()=>setQuickOpen(true)} onAddShowroom={()=>go("showroom")} dark={dark} setDark={setDark}/>

          <QuickVisit open={quickOpen} onClose={()=>setQuickOpen(false)} onSaved={()=>{ loadNotifs(); toast("تم حفظ الزيارة","ok"); if(tab==="visits")go("visits"); }}/>
          <ConfirmHost/>
          <ToastHost/>
        </div>
      );
    }

    /* ===== شاشة تسجيل الدخول ===== */
    function Login({ onSuccess }){
      const [username,setUsername]=useState(""); const [password,setPassword]=useState("");
      const [show,setShow]=useState(false); const [busy,setBusy]=useState(false); const [err,setErr]=useState("");

      async function submit(e){
        if(e) e.preventDefault();
        const u=username.trim();
        if(!u || !password){ setErr("اكتب اسم المستخدم وكلمة المرور"); return; }
        setBusy(true); setErr("");
        try{
          const { data, error } = await db.rpc("app_login", { p_username: u, p_password: password });
          if(error){ setErr("تعذّر الاتصال: "+error.message); setBusy(false); return; }
          const row = Array.isArray(data) ? data[0] : data;
          if(!row || !row.id){ setErr("اسم المستخدم أو كلمة المرور غير صحيحة"); setBusy(false); return; }
          const s={ id:row.id, username:row.username, name:row.name||row.username };
          setSession(s); onSuccess(s);
        }catch(ex){ setErr("حدث خطأ غير متوقع. حاول مرة أخرى."); setBusy(false); }
      }

      return (
        <div className="min-h-screen lg:grid lg:grid-cols-[1.05fr_1fr]">

          {/* اللوحة اليمنى: هوية العلامة.
              خلفية فحمية بلون كلمة الشعار نفسه، وبتلات الشعار مكبّرة ومقصوصة كنسيج —
              لا تدرّج بنفسجي مستعار ولا نقاط زخرفية. */}
          <div className="relative hidden lg:flex flex-col justify-between p-12 xl:p-16 overflow-hidden"
            style={{background:"#232322"}}>
            <div aria-hidden="true" className="absolute pointer-events-none logo-mark"
              style={{width:"128%",height:"128%",top:"-18%",right:"-46%",opacity:.10}}/>
            <div aria-hidden="true" className="absolute inset-0 pointer-events-none"
              style={{background:"linear-gradient(to left, rgba(35,35,34,0) 30%, rgba(35,35,34,.92) 100%)"}}/>

            <div className="relative">
              <span className="logo-mark inline-block" style={{width:44,height:44}}/>
              <span className="logo-word on-dark block mt-6" style={{width:196}} role="img" aria-label="دهانات الجزيرة"/>
            </div>

            <div className="relative max-w-md">
              <p style={{color:"#F4F4F2",fontSize:"clamp(24px,2vw,30px)",lineHeight:1.45,fontWeight:300}}>
                الميدان يُدار بالبيانات،<br/>
                <span style={{fontWeight:600}}>لا بالذاكرة.</span>
              </p>
              <p className="mt-5" style={{color:"rgba(244,244,242,.55)",fontSize:14,lineHeight:1.8}}>
                كل زيارة، وكل منتج مرصود، وكل متابعة مؤجّلة — في مكان واحد،
                ويشتغل حتى بلا إنترنت.
              </p>
            </div>

            <div className="relative flex items-center gap-6" style={{color:"rgba(244,244,242,.4)",fontSize:12}}>
              <span>نظام الجزيرة الميداني</span>
              <span className="w-px h-3.5" style={{background:"rgba(244,244,242,.2)"}}/>
              <span dir="ltr" className="tnum">Jazeera Field System</span>
            </div>
          </div>

          {/* اللوحة اليسرى: النموذج */}
          <div className="flex items-center justify-center p-6 sm:p-10 app-bg min-h-screen lg:min-h-0">
            <div className="w-full max-w-[368px] rise">

              {/* الهوية على الجوال، حيث اللوحة اليمنى مخفيّة */}
              <div className="lg:hidden flex flex-col items-center mb-9">
                <span className="logo-mark" style={{width:46,height:46}}/>
                <span className="logo-word mt-4" style={{width:168}} role="img" aria-label="دهانات الجزيرة"/>
              </div>

              <h1 className="t-2xl">تسجيل الدخول</h1>
              <p className="lede mt-1.5 mb-7">أدخل بياناتك للوصول إلى لوحة الميدان.</p>

              <form onSubmit={submit} className="space-y-4" noValidate>
                <div>
                  <label className="form-label" htmlFor="lg-user">اسم المستخدم</label>
                  <input id="lg-user" value={username} onChange={e=>setUsername(e.target.value)} autoFocus
                    autoComplete="username" autoCapitalize="off" autoCorrect="off" spellCheck={false} dir="ltr"
                    aria-invalid={err?"true":undefined}
                    className="field w-full text-right" placeholder="اكتب اسم المستخدم"/>
                </div>
                <div>
                  <label className="form-label" htmlFor="lg-pass">كلمة المرور</label>
                  <div className="relative">
                    <input id="lg-pass" value={password} onChange={e=>setPassword(e.target.value)}
                      type={show?"text":"password"} autoComplete="current-password"
                      aria-invalid={err?"true":undefined}
                      className="field w-full" style={{paddingLeft:64}} placeholder="••••••••"/>
                    <button type="button" onClick={()=>setShow(!show)}
                      aria-label={show?"إخفاء كلمة المرور":"إظهار كلمة المرور"} aria-pressed={show}
                      className="absolute left-2 top-1/2 -translate-y-1/2 t-chip font-medium px-2 py-1 rounded-[5px] txt-muted row-hover">
                      {show?"إخفاء":"إظهار"}
                    </button>
                  </div>
                </div>

                {err&&(
                  <div className="rise flex items-start gap-2.5 rounded-[8px] px-3 py-2.5 t-2xs" role="alert"
                    style={{color:"var(--danger)",background:"var(--danger-soft)",border:"1px solid var(--danger-line)"}}>
                    <Icon n="alert" s={14} c="shrink-0 mt-0.5"/><span>{err}</span>
                  </div>)}

                <button type="submit" disabled={busy} className="btn btn-primary btn-lg btn-block press mt-1">
                  {busy&&<Icon n="refresh" s={15} c="spin"/>}{busy?"جارٍ التحقق…":"دخول"}
                </button>
              </form>

              <p className="t-chip txt-dim text-center mt-7">للحصول على حساب، تواصل مع مسؤول النظام.</p>
            </div>
          </div>
        </div>
      );
    }

    /* ===== الجذر: يقرر عرض الدخول أو التطبيق ===== */
    function Root(){
      const [authed,setAuthed]=useState(!!(SESSION && SESSION.id));
      if(!authed) return <Login onSuccess={()=>setAuthed(true)}/>;
      return <App/>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
  </script>
</body>
</html>
