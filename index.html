    function normalizePhone(phone){

      if(!d) return "";
      if(d.startsWith("00")) d=d.slice(2);
      if(d.startsWith("0")) d="966"+d.slice(1);

    /* ملاحظة مهمة: نسخ "المضاعف/Dual Messenger" في سامسونج بتستخدم نفس اسم حزمة واتساب الأصلي (com.whatsapp)
       فمفيش طريقة نفتح بيها نسخة بعينها منها برابط. الحل العملي: نسيب رابط "واتساب عادي" عام بدون
       تحديد حزمة، عشان نظام أندرويد نفسه يعرض قائمة اختيار كل نسخ واتساب المثبتة (الأصلية + المضاعفة)

       "واتساب بزنس" بس هو اللي له حزمة مستقلة فعلاً (com.whatsapp.w4b) فبنستهدفها مباشرة وبثقة. */
    function waLinks(phone, text){
      const n=normalizePhone(phone);
      if(!n) return null;
      const t=text?("&text="+encodeURIComponent(text)):"";
      const web=`https://wa.me/${n}`+(text?("?text="+encodeURIComponent(text)):"");
      if(isAndroid()){
        return {
          regular: web, // بدون تحديد حزمة، حتى يظهر اختيار أندرويد بين كل نسخ واتساب المثبتة
          business:`intent://send?phone=${n}${t}#Intent;scheme=smsto;package=com.whatsapp.w4b;end`,
        };
      }
      return { regular:web, business:web };
    }
    function waLink(phone, text){ const l=waLinks(phone,text); return l?l.regular:null; }

    async function syncVisit(visit, mode){
      try{
        const today=TODAY(); const findings=parseFindings(visit.products);
        const safeInsert=async(tbl,row)=>{ let body={...row}; for(let i=0;i<6;i++){ const r=await db.from(tbl).insert([body]); if(!r.error) return; const m=(r.error.message||"")+" "+(r.error.details||""); const col=(m.match(/'([a-z_]+)' column/i)||m.match(/column "?([a-z_]+)"? of/i)||m.match(/column ([a-z_]+)/i)||[])[1]; if(col&&col in body){delete body[col];continue;} return; } };
        const upd=async (tbl,name,patch)=>{ if(!name) return null; const {data}=await db.from(tbl).select("id,products").ilike("name",name).limit(1);
          if(data&&data[0]){ const id=data[0].id; let p={...patch}; if(patch.__mergeProducts){ delete p.__mergeProducts; p.products=encodeFindings(mergeFindings(data[0].products,findings)); }
            for(let i=0;i<6;i++){ const r=await db.from(tbl).update(p).eq("id",id); if(!r.error) break; const m=(r.error.message||"")+" "+(r.error.details||""); const col=(m.match(/'([a-z_]+)' column/i)||m.match(/column "?([a-z_]+)"? of/i)||m.match(/column ([a-z_]+)/i)||[])[1]; if(col&&col in p){delete p[col];continue;} break; }
            return id; } return null; };
        const fu = visit.next_followup?{next_followup:visit.next_followup,followup_status:"مجدولة"}:{};

        // الدهانون: زيارة واحدة قد تشمل عدة دهانين (نفس منطق المواقع المتعددة)
        const painterNames=String(visit.painter||"").split(",").map(s=>s.trim()).filter(Boolean);
        if(visit.type==="دهان" && painterNames.length===0 && visit.target) painterNames.push(visit.target);
        for(const nm of painterNames){
          await upd("painters", nm, {last_visit:visit.date||today,last_contact:visit.date||today,contact_method:"زيارة ميدانية", ...fu});
          // تُسجَّل كتفاعل "زيارة ميدانية" في سجل الدهان فقط عند إنشاء الزيارة لأول مرة (تفادياً للتكرار عند التعديل)
          if(mode==="add"){
            try{ await db.from("interactions").insert([{ painter:nm, type:"زيارة ميدانية", notes:visit.target||visit.goals||null, date:visit.date||today, user_name:currentUserName() }]); }catch(e){}
          }
        }

        if(isDevVisit(visit.type)){ await upd("contractors", visit.contractor||visit.target, {...fu}); }
        // المواقع المرتبطة (قد تكون عدّة مواقع مفصولة بفواصل) — تُضخّ المنتجات لكلٍّ منها، وتُنشأ إن لم توجد
        const sites=String(visit.project||"").split(",").map(s=>s.trim()).filter(Boolean);
        if(isSiteVisit(visit.type) && sites.length===0 && visit.target) sites.push(visit.target);
        for(const nm of sites){ const got=await upd("projects",nm,{__mergeProducts:true,city:visit.location||null, ...fu});
          if(!got){ await safeInsert("projects",{name:nm,status:"قيد المتابعة",city:visit.location||null,products:encodeFindings(findings),notes:"أُنشئ تلقائياً من زيارة ميدانية", ...(visit.lat?{lat:visit.lat,lng:visit.lng}:{})}); } }
      }catch(e){ /* تجاهل أخطاء التزامن */ }
    }

        const { data } = db.storage.from(STORAGE_BUCKET).getPublicUrl(path);

      if(FILL_ICONS[n]) return <svg width={s} height={s} viewBox="0 0 24 24" fill="currentColor" className={c}>{FILL_ICONS[n]}</svg>;

        search:<g><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></g>,
        bell:<g><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></g>,
        sun:<g><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g>,
        moon:<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>,
        menu:<path d="M3 6h18M3 12h18M3 18h18"/>,
        close:<path d="M18 6 6 18M6 6l12 12"/>,
        grid:<g><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></g>,
        list:<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>,
        chevron:<path d="M15 18l-6-6 6-6"/>,
        filter:<path d="M22 3H2l8 9.5V19l4 2v-8.5L22 3z"/>,
        pin:<g><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></g>,
        camera:<g><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></g>,
        clock:<g><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g>,
        check:<path d="M20 6 9 17l-5-5"/>,
        bolt:<path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/>,
        link:<g><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></g>,
        printer:<g><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></g>,
        plus:<path d="M12 5v14M5 12h14"/>,
        star:<path d="M12 2l3 6.5 7 .9-5 4.8 1.3 7L12 18l-6.3 3.2L7 14.2l-5-4.8 7-.9z"/>,
        layers:<g><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></g>,
        shield:<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>,
        brush:<g><path d="M9.06 11.9 18 3a2.1 2.1 0 0 1 3 3l-8.9 8.94"/><path d="M7 14a3 3 0 0 0-3 3c0 1.3-1 2-2 3 1.4 1 4 1.5 6 0a3 3 0 0 0-1-6z"/></g>,
        home:<g><path d="M3 10 12 3l9 7"/><path d="M5 9v11h14V9"/></g>,
        drop:<path d="M12 2.7S5 10 5 14a7 7 0 0 0 14 0c0-4-7-11.3-7-11.3z"/>,
        umbrella:<g><path d="M12 2a9 9 0 0 0-9 9h18a9 9 0 0 0-9-9z"/><path d="M12 11v8a2 2 0 0 0 4 0"/></g>,
        building:<g><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h.01M15 7h.01M9 11h.01M15 11h.01M9 15h.01M15 15h.01"/></g>,
        chart:<g><path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="6"/><rect x="12" y="7" width="3" height="10"/><rect x="17" y="13" width="3" height="4"/></g>,
        trophy:<g><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M5 5H3v2a3 3 0 0 0 3 3M19 5h2v2a3 3 0 0 1-3 3"/></g>,
        edit:<g><path d="M11 4H4v16h16v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></g>,
        trash:<g><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></g>,
        save:<g><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></g>,
        target:<g><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></g>,
        doc:<g><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h8M8 9h2"/></g>,
        user:<g><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></g>,
        download:<g><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 21h16"/></g>,
        refresh:<g><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></g>,
      }[n];
      return <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}>{ic}</svg>;
    }

    /* ===== مكونات مشتركة ===== */
    function Stars({ n }) { return <span className="whitespace-nowrap">{[1,2,3,4,5].map(i=><span key={i} style={{color:i<=n?"#D97706":"#cbd5e1"}}>★</span>)}</span>; }
    function Badge({ status }) { if(!status) return null; const c=STATUS_COLORS[status]||"#64748B"; return <span className="text-xs font-semibold px-2.5 py-0.5 rounded-full whitespace-nowrap" style={{color:c,background:c+"1f"}}>{status}</span>; }
    function Pill({ text, color }) { const c=color||"#64748B"; return <span className="text-xs font-bold px-2 py-0.5 rounded-full whitespace-nowrap" style={{color:c,background:c+"1f"}}>{text}</span>; }
    function Bars({ data }) { const max=Math.max(1,...data.map(d=>d.value)); return (<div className="space-y-2.5">{data.map((d,i)=>(<div key={i} className="text-xs"><div className="flex justify-between mb-1"><span className="font-medium">{d.label}</span><span className="font-bold">{Number(d.value).toLocaleString()}</span></div><div className={"h-2 rounded-full overflow-hidden "+cTrack}><div className="h-2 rounded-full" style={{width:(d.value/max*100)+"%",background:d.color||COLORS[i%COLORS.length]}}/></div></div>))}</div>); }
    function Kpi({ label, value, color, icon, sub }) {
      return (<div className="relative rounded-2xl p-4 overflow-hidden text-white lift" style={{background:`linear-gradient(135deg, ${color} 0%, ${color}cc 100%)`,boxShadow:`0 10px 26px -12px ${color}cc`}}>
        <div className="absolute -left-5 -bottom-6 w-24 h-24 rounded-full bg-white/10"/>
        <div className="absolute -left-1 -top-3 w-14 h-14 rounded-full bg-white/10"/>
        {icon&&<div className="absolute left-3 top-3 opacity-35"><Icon n={icon} s={26}/></div>}
        <div className="relative">
          <div className="text-[11px] font-bold text-white/85">{label}</div>
          <div className="text-2xl font-black mt-1 leading-tight">{value}</div>
          {sub?<div className="text-[10px] text-white/75 mt-0.5">{sub}</div>:null}
        </div>
      </div>);
    }
    function Inp({ label, v, on, type="text" }) { return (<label className="block"><span className={"text-xs font-medium "+cMuted}>{label}</span><input type={type} value={v} onChange={e=>on(e.target.value)} className={"w-full rounded-lg px-3 py-2 text-sm outline-none mt-1 "+cInput}/></label>); }

    /* ===== رسوم بيانية ذكية (SVG) ===== */
    function Donut({ data, size=148, centerLabel="الإجمالي" }) {
      const total=data.reduce((a,d)=>a+(d.value||0),0);
      const r=54, C=2*Math.PI*r, cx=size/2, cy=size/2; let off=0;
      return (<div className="flex items-center gap-4 flex-wrap">
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="shrink-0">
          <circle cx={cx} cy={cy} r={r} fill="none" stroke="currentColor" strokeOpacity="0.08" strokeWidth="16"/>
          <g transform={`rotate(-90 ${cx} ${cy})`}>
            {total>0&&data.map((d,i)=>{ const len=(d.value/total)*C; const el=(<circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={d.color} strokeWidth="16" strokeLinecap="butt" strokeDasharray={`${len} ${C-len}`} strokeDashoffset={-off}/>); off+=len; return el; })}
          </g>
          <text x={cx} y={cy-2} textAnchor="middle" className="fill-current" style={{fontSize:24,fontWeight:800}}>{total}</text>
          <text x={cx} y={cy+15} textAnchor="middle" style={{fontSize:10,fill:"#94a3b8"}}>{centerLabel}</text>
        </svg>
        <div className="space-y-1.5 flex-1 min-w-[130px]">
          {data.map((d,i)=>(<div key={i} className="flex items-center justify-between gap-2 text-xs"><div className="flex items-center gap-1.5 min-w-0"><span className="w-2.5 h-2.5 rounded-sm shrink-0" style={{background:d.color}}/><span className="truncate">{d.label}</span></div><span className={"font-bold whitespace-nowrap "+cMuted}>{Number(d.value).toLocaleString()} · {total?Math.round(d.value/total*100):0}%</span></div>))}
        </div>
      </div>);
    }

    function TrendArea({ points, color="#4F46E5", height=140 }) {
      const gid=useRef("g"+Math.random().toString(36).slice(2,8)).current;
      const W=320, H=height, pad=22;
      const max=Math.max(1,...points.map(p=>p.value));
      const n=points.length;
      const X=i=> n<=1?W/2 : pad+(i*(W-2*pad)/(n-1));
      const Y=v=> H-pad-(v/max*(H-2*pad-10));
      const line=points.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(p.value).toFixed(1)}`).join(" ");
      const area=`M${X(0).toFixed(1)},${H-pad} `+points.map((p,i)=>`L${X(i).toFixed(1)},${Y(p.value).toFixed(1)}`).join(" ")+` L${X(n-1).toFixed(1)},${H-pad} Z`;
      return (<svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}}>
        <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.28"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs>
        {[0,0.5,1].map((g,i)=>(<line key={i} x1={pad} x2={W-pad} y1={Y(max*g)} y2={Y(max*g)} stroke="currentColor" strokeOpacity="0.1" strokeWidth="1" strokeDasharray="3 3"/>))}
        <path d={area} fill={`url(#${gid})`}/>
        <path d={line} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
        {points.map((p,i)=>(<g key={i}><circle cx={X(i)} cy={Y(p.value)} r="3.5" fill={color}/>{p.value?<text x={X(i)} y={Y(p.value)-8} textAnchor="middle" style={{fontSize:10,fontWeight:700}} fill={color}>{p.value}</text>:null}<text x={X(i)} y={H-5} textAnchor="middle" style={{fontSize:9,fill:"#94a3b8"}}>{p.label}</text></g>))}
      </svg>);
    }

    function Funnel({ stages }) {
      const top=Math.max(1,...stages.map(s=>s.value));
      return (<div className="space-y-2.5">{stages.map((s,i)=>{ const pct=Math.round(s.value/top*100); return (
        <div key={i}>
          <div className="flex justify-between text-xs mb-1"><span className="font-medium">{s.label}</span><span className={"font-bold "+cMuted}>{s.value} · {pct}%</span></div>
          <div className={"h-7 rounded-lg overflow-hidden "+cTrack}><div className="h-7 rounded-lg flex items-center justify-end px-2 text-white text-[11px] font-bold transition-all" style={{width:Math.max(pct,7)+"%",background:s.color}}>{s.value||""}</div></div>
        </div>);})}</div>);
    }
    function Sel({ label, v, on, opts }) { return (<label className="block"><span className={"text-xs font-medium "+cMuted}>{label}</span><select value={v} onChange={e=>on(e.target.value)} className={"w-full rounded-lg px-3 py-2 text-sm outline-none mt-1 "+cInput}>{opts.map(o=><option key={o} value={o}>{o}</option>)}</select></label>); }

    /* حقل اختيار مرجعي من جدول آخر */
    function RefField({ label, v, on, options }) {
      return (<label className="block"><span className={"text-xs font-medium "+cMuted}>{label}</span>
        <input list={"ref-"+label} value={v||""} onChange={e=>on(e.target.value)} placeholder="اكتب أو اختر..." className={"w-full rounded-lg px-3 py-2 text-sm outline-none mt-1 "+cInput}/>
        <datalist id={"ref-"+label}>{options.map(o=><option key={o} value={o}/>)}</datalist>
      </label>);
    }
    /* حقل مرجعي متعدد: اختيار/إضافة أكثر من عنصر (مثلاً عدة مواقع لزيارة واحدة) */
    function RefsField({ label, v, on, options }) {
      const sel = String(v||"").split(",").map(s=>s.trim()).filter(Boolean);
      const [txt,setTxt]=useState("");
      const add=n=>{ const name=(n||txt).trim(); if(!name) return; if(!sel.includes(name)) on([...sel,name].join(", ")); setTxt(""); };
      const removeAt=i=>on(sel.filter((_,j)=>j!==i).join(", "));
      const sugg=txt.trim()?options.filter(o=>o.includes(txt.trim())&&!sel.includes(o)).slice(0,6):options.filter(o=>!sel.includes(o)).slice(0,6);
      return (<div className="sm:col-span-2"><span className={"text-xs font-bold "+cMuted}>{label}</span>
        {sel.length>0&&<div className="flex flex-wrap gap-1.5 mt-1.5 mb-1.5">{sel.map((s,i)=>(<span key={i} className="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs font-bold" style={{background:"#D9770618",color:"#D97706",border:"1px solid #D9770644"}}>{s}<button type="button" onClick={()=>removeAt(i)} className="w-4 h-4 rounded-full bg-amber-600 text-white text-[10px] flex items-center justify-center">×</button></span>))}</div>}
        <div className="flex gap-1.5 mt-1">
          <input value={txt} onChange={e=>setTxt(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();add();}}} placeholder="اكتب اسم موقع ثم أضف..." className={"flex-1 rounded-lg px-3 py-2 text-sm outline-none "+cInput}/>
          <button type="button" onClick={()=>add()} className={"rounded-lg px-3 text-sm font-bold "+cBtn}>+</button>
        </div>
        {sugg.length>0&&<div className="flex flex-wrap gap-1.5 mt-1.5">{sugg.map(o=><button type="button" key={o} onClick={()=>add(o)} className={"px-2.5 py-1 rounded-lg text-xs font-bold "+cTrack+" "+cMuted+" "+cHover}>{o}</button>)}</div>}
      </div>);
    }
    /* بطاقة منتج مرصود ملوّنة */
    function FindingPill({ f, onRemove }) {
      const col=companyColor(f.c);
      return (<span className="inline-flex items-center gap-1.5 rounded-full pl-1.5 pr-2.5 py-1 text-xs font-bold pop" style={{background:col+"18",color:col,border:"1px solid "+col+"55"}}>
        <span className="opacity-70 font-extrabold">{f.c}</span><span>{f.p}</span>
        {onRemove&&<button type="button" onClick={onRemove} className="w-4 h-4 rounded-full flex items-center justify-center text-white text-[10px]" style={{background:col}}>×</button>}
      </span>);
    }
    /* الحقل السريع: عائلة ← شركة ← منتج (بنقرات قليلة، مناسب للزيارات الميدانية) */
    function FindingsField({ label, v, on, compact }) {
      const findings=parseFindings(v);
      const [fam,setFam]=useState(CATALOG[0]); const [comp,setComp]=useState(null); const [qq,setQq]=useState("");
      const add=(c,p)=>{ if(findings.some(x=>x.c===c&&x.p===p)) return; on(encodeFindings([...findings,{f:fam.family,c,p}])); };
      const removeAt=i=>on(encodeFindings(findings.filter((_,j)=>j!==i)));
      const companies=[...new Set((fam.items||[]).map(it=>it.c))];
      let prods=(fam.items||[]).filter(it=>(!comp||it.c===comp));
      if(qq.trim()) prods=prods.filter(it=>(it.p+" "+it.c).includes(qq.trim()));
      return (<div className="sm:col-span-2">
        <div className="flex items-center justify-between mb-1.5"><span className={"text-xs font-bold "+cMuted}>{label}</span>{findings.length>0&&<span className="text-[11px] font-bold text-indigo-500">{findings.length} منتج مرصود</span>}</div>
        {findings.length>0&&<div className="flex flex-wrap gap-1.5 mb-2.5 p-2 rounded-xl bg-slate-50 dark:bg-slate-800/60">{findings.map((f,i)=><FindingPill key={i} f={f} onRemove={()=>removeAt(i)}/>)}</div>}
        {/* تبويبات العائلات */}
        <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
          {CATALOG.map(fm=>(<button type="button" key={fm.id} onClick={()=>{setFam(fm);setComp(null);}} className={"shrink-0 inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-bold transition "+(fam.id===fm.id?"text-white shadow-md":cTrack+" "+cMuted)} style={fam.id===fm.id?{background:fm.color}:{}}><Icon n={fm.icon} s={13}/>{fm.family}</button>))}
        </div>
        {/* شركات العائلة */}
        <div className="flex flex-wrap gap-1.5 mt-2">
          <button type="button" onClick={()=>setComp(null)} className={"px-2.5 py-1 rounded-lg text-[11px] font-bold "+(!comp?cBtn:cTrack+" "+cMuted)}>الكل</button>
          {companies.map(c=>(<button type="button" key={c} onClick={()=>setComp(comp===c?null:c)} className="px-2.5 py-1 rounded-lg text-[11px] font-bold transition" style={comp===c?{background:companyColor(c),color:"#fff"}:{background:companyColor(c)+"18",color:companyColor(c)}}>{c}{c===OWN_COMPANY?" ★":""}</button>))}
        </div>
        {/* المنتجات كأزرار كبيرة قابلة للنقر */}
        <div className="grid grid-cols-2 sm:grid-cols-3 gap-1.5 mt-2 max-h-52 overflow-y-auto pr-1">
          {prods.map((it,k)=>{ const on_=findings.some(x=>x.c===it.c&&x.p===it.p); const col=companyColor(it.c);
            return (<button type="button" key={k} onClick={()=>add(it.c,it.p)} disabled={on_} className={"text-right rounded-xl px-2.5 py-2 text-xs font-bold leading-tight transition lift "+(on_?"opacity-50 cursor-default ":"")} style={{background:on_?col+"22":col+"12",color:col,border:"1px solid "+col+"40"}}>
              <span className="block opacity-70 text-[10px] font-extrabold">{it.c}</span>{it.p}{on_?" ✓":""}</button>);})}
          {prods.length===0&&<div className={"col-span-full text-center text-xs py-3 "+cMuted}>لا منتجات</div>}
        </div>
      </div>);
    }
    /* للحفاظ على التوافق مع الاستدعاءات القديمة */
    const ProductsField = FindingsField;
    /* حقل رفع الصور */
    function ImagesField({ label, v, on, folder }) {
      const imgs=toArr(v); const [busy,setBusy]=useState(false); const ref=useRef();
      async function pick(e){ const files=[...e.target.files]; if(!files.length)return; setBusy(true);
        const urls=await uploadImages(files, folder); on([...imgs,...urls]); setBusy(false); if(ref.current)ref.current.value=""; }
      return (<div className="sm:col-span-2"><span className={"text-xs font-medium "+cMuted}>{label}</span>
        <div className="flex flex-wrap gap-2 mt-1.5">
          {imgs.map((u,i)=>(<div key={i} className="relative w-16 h-16 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-700"><img src={u} className="w-full h-full object-cover"/><button type="button" onClick={()=>on(imgs.filter((_,j)=>j!==i))} className="absolute top-0 left-0 bg-red-600 text-white w-4 h-4 text-[10px] flex items-center justify-center rounded-br">×</button></div>))}
          <button type="button" onClick={()=>ref.current&&ref.current.click()} disabled={busy} className={"w-16 h-16 rounded-lg flex flex-col items-center justify-center text-xs gap-1 "+cTrack+" "+cMuted+" "+cHover+" disabled:opacity-50"}><Icon n="camera" s={18}/>{busy?"رفع...":"إضافة"}</button>
          <input ref={ref} type="file" accept="image/*" multiple className="hidden" onChange={pick}/>
        </div>
      </div>);
    }
    function Gallery({ imgs }) {
      const arr=toArr(imgs); if(!arr.length) return null;
      return (<div><div className="text-xs font-bold mb-2">معرض الصور ({arr.length})</div><div className="flex flex-wrap gap-2">{arr.map((u,i)=>(<a key={i} href={u} target="_blank" className="w-20 h-20 rounded-xl overflow-hidden border border-gray-200 dark:border-slate-700 block"><img src={u} className="w-full h-full object-cover"/></a>))}</div></div>);
    }

    function exportCSV(cfg, rows) {
      const headers=cfg.fields.map(f=>f.label);
      const lines=rows.map(r=>cfg.fields.map(f=>'"'+String(Array.isArray(r[f.key])?toArr(r[f.key]).length+" صورة":(r[f.key]??"")).replace(/"/g,'""')+'"').join(","));
      const csv="\uFEFF"+[headers.join(","),...lines].join("\n");
      const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=cfg.title+".csv"; a.click(); URL.revokeObjectURL(a.href);
    }

    /* ===== أدوات تصدير عامة لصفحات التقارير (CSV / Excel حقيقي عبر SheetJS) ===== */
    function exportRowsCSV(filename, headers, rows){
      const esc=v=>'"'+String(v??"—").replace(/"/g,'""')+'"';
      const csv="\uFEFF"+[headers.map(esc).join(","),...rows.map(r=>r.map(esc).join(","))].join("\n");
      const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename+".csv"; a.click(); URL.revokeObjectURL(a.href);

        const wb=XLSX.utils.book_new();

    /* ===== محاولة تحديث سجل الدهان بأمان (تتجاهل الأعمدة غير الموجودة) ===== */
    async function softUpdatePainter(name, patch){
      let body={...patch};
      for(let i=0;i<6;i++){
        const r=await db.from("painters").update(body).ilike("name",name);
        if(!r.error) return true;
        const m=(r.error.message||"")+" "+(r.error.details||"");
        const col=(m.match(/'([a-z_]+)' column/i)||m.match(/column "?([a-z_]+)"? of/i)||m.match(/column ([a-z_]+)/i)||[])[1];
        if(col && col in body){ delete body[col]; continue; }
        return false;
      }
      return false;
    }

          if(col && col in body){ delete body[col]; continue; }

                    <button onClick={()=>setVmode("list")} className={"p-1.5 "+(vmode==="list"?"bg-indigo-600 text-white":cMuted)} title="قائمة"><Icon n="list" s={16}/></button>

              {!loading&&!error&&filtered.length===0&&<div className={"text-center py-10 text-sm "+cMuted}>لا توجد نتائج مطابقة.</div>}

              {vmode==="cards"?(

                        <div className="min-w-0 flex-1"><div className="font-extrabold text-sm truncate">{r[cfg.fields[0].key]}</div>{cfg.table==="painters"&&Number(r.rating)>0?<div className="mt-0.5"><Stars n={Number(r.rating)}/></div>:null}</div>
                      </div>

                  {filtered.map(r=>{ const col=avatarBg(r);

                  {cfg.fields.map(f=>{

    /* ===== زيارة سريعة (أقل من دقيقة) ===== */
    const VISIT_ICON={"دهان":"brush","موقع":"building","مطور عقاري":"target","معرض":"home","استشاري":"star"};
    function QuickVisit({ open, onClose, onSaved }) {
      const [d,setD]=useState({target:"",type:"دهان",city:CITIES[0],results:"",next_followup:"",products:"[]",sites:""});
      const [saving,setSaving]=useState(false); const [geo,setGeo]=useState(null); const [imgs,setImgs]=useState([]);
      const [opts,setOpts]=useState({painters:[],projects:[],contractors:[]}); const [siteTxt,setSiteTxt]=useState("");
      useEffect(()=>{ if(open){ setD({target:"",type:"دهان",city:CITIES[0],results:"",next_followup:"",products:"[]",sites:""}); setGeo(null); setImgs([]); setSiteTxt(""); getGeo().then(setGeo);
        Promise.all([db.from("painters").select("name"),db.from("projects").select("name"),db.from("contractors").select("name")]).then(([a,b,c])=>setOpts({painters:(a.data||[]).map(x=>x.name).filter(Boolean),projects:(b.data||[]).map(x=>x.name).filter(Boolean),contractors:(c.data||[]).map(x=>x.name).filter(Boolean)})); } },[open]);
      if(!open) return null;
      const isSite=isSiteVisit(d.type);
      const suggestList = d.type==="دهان"?opts.painters : isDevVisit(d.type)?opts.contractors : isSite?opts.projects : [];
      const matches = d.target.trim()? suggestList.filter(n=>n.includes(d.target.trim())).slice(0,6) : suggestList.slice(0,6);
      const sites = String(d.sites||"").split(",").map(s=>s.trim()).filter(Boolean);
      const addSite=n=>{ const name=(n||siteTxt).trim(); if(!name)return; if(!sites.includes(name)) setD({...d,sites:[...sites,name].join(", ")}); setSiteTxt(""); };
      const siteSugg=siteTxt.trim()?opts.projects.filter(o=>o.includes(siteTxt.trim())&&!sites.includes(o)).slice(0,6):[];
      async function save(){ if(!d.target.trim()){alert("اكتب عنوان الزيارة");return;} setSaving(true);
        const payload={ target:d.target, type:d.type, date:TODAY(), location:d.city, results:d.results, next_followup:d.next_followup||null, images:imgs, products:encodeFindings(d.products) };
        if(geo){ payload.lat=geo.lat; payload.lng=geo.lng; }
        if(d.type==="دهان")payload.painter=d.target; if(isDevVisit(d.type))payload.contractor=d.target;
        if(isSite) payload.project = sites.length? sites.join(", ") : d.target;
        // حفظ مرن يتجاهل أي عمود غير موجود
        let body={...payload}; let ok=false, lastErr=null;
        for(let i=0;i<6;i++){ const r=await db.from("visits").insert([body]); if(!r.error){ok=true;break;} lastErr=r.error; const m=(r.error.message||"")+" "+(r.error.details||""); const col=(m.match(/'([a-z_]+)' column/i)||m.match(/column "?([a-z_]+)"? of/i)||m.match(/column ([a-z_]+)/i)||[])[1]; if(col&&col in body){delete body[col];continue;} break; }
        if(!ok){setSaving(false);alert("خطأ: "+(lastErr&&lastErr.message));return;}
        await syncVisit(payload, "add"); setSaving(false);
        logActivity("إضافة","visits","الزيارات",d.target); onSaved&&onSaved(); onClose();
      }
      return (<div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-3" onClick={onClose}>
        <div dir="rtl" onClick={e=>e.stopPropagation()} className={"w-full max-w-md max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-5 pop "+cCard}>
          <div className="flex items-center justify-between mb-4"><div className="flex items-center gap-2 font-extrabold"><span className="w-8 h-8 rounded-xl brand-grad text-white flex items-center justify-center"><Icon n="bolt" s={16}/></span> زيارة ميدانية سريعة</div><button onClick={onClose} className={cMuted}><Icon n="close" s={20}/></button></div>
          {/* المدينة */}
          <div className="mb-3"><div className={"text-xs font-bold mb-1.5 "+cMuted}>المدينة (تُحتسب حصتها السوقية)</div>
            <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">{CITIES.map(c=><button key={c} onClick={()=>setD({...d,city:c})} className={"shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold "+(d.city===c?cBtn:cTrack+" "+cMuted)}>{c}</button>)}</div></div>
          {/* نوع الزيارة كأزرار كبيرة */}
          <div className="grid grid-cols-5 gap-1.5 mb-3">
            {VISIT_TYPES.map(t=>{ const col=STATUS_COLORS[t]||"#4F46E5"; const on=d.type===t;
              return (<button key={t} onClick={()=>setD({...d,type:t,target:""})} className={"rounded-2xl py-2.5 flex flex-col items-center gap-1 text-[10px] font-bold transition lift "+(on?"text-white shadow-md":cTrack+" "+cMuted)} style={on?{background:col}:{}}><Icon n={VISIT_ICON[t]||"pin"} s={17}/>{t}</button>);})}
          </div>
          {/* العنوان مع اقتراحات سريعة */}
          <label className="block mb-2"><span className={"text-xs font-bold "+cMuted}>{d.type==="دهان"?"اسم الدهان":isDevVisit(d.type)?"اسم المطوّر":isSite?"عنوان الزيارة":"عنوان الزيارة"}</span>
            <input value={d.target} onChange={e=>setD({...d,target:e.target.value})} placeholder="اكتب أو اختر من الأسفل" className={"w-full rounded-xl px-3 py-2.5 text-sm outline-none mt-1 "+cInput}/></label>
          {matches.length>0&&<div className="flex flex-wrap gap-1.5 mb-3">{matches.map(n=><button key={n} onClick={()=>setD({...d,target:n})} className={"px-2.5 py-1 rounded-lg text-xs font-bold "+(d.target===n?cBtn:cTrack+" "+cMuted+" "+cHover)}>{n}</button>)}</div>}
          {/* المواقع المتعددة داخل المدينة (لزيارات المواقع) */}
          {isSite&&(<div className="mb-3"><div className={"text-xs font-bold mb-1.5 "+cMuted}>المواقع التي زرتها في هذه المدينة (يمكن أكثر من موقع)</div>
            {sites.length>0&&<div className="flex flex-wrap gap-1.5 mb-1.5">{sites.map((s,i)=>(<span key={i} className="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs font-bold" style={{background:"#D9770618",color:"#D97706",border:"1px solid #D9770644"}}>{s}<button onClick={()=>setD({...d,sites:sites.filter((_,j)=>j!==i).join(", ")})} className="w-4 h-4 rounded-full bg-amber-600 text-white text-[10px] flex items-center justify-center">×</button></span>))}</div>}
            <div className="flex gap-1.5"><input value={siteTxt} onChange={e=>setSiteTxt(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();addSite();}}} placeholder="اسم الموقع ثم +" className={"flex-1 rounded-lg px-3 py-2 text-sm outline-none "+cInput}/><button onClick={()=>addSite()} className={"rounded-lg px-3 text-sm font-bold "+cBtn}>+</button></div>
            {siteSugg.length>0&&<div className="flex flex-wrap gap-1.5 mt-1.5">{siteSugg.map(o=><button key={o} onClick={()=>addSite(o)} className={"px-2.5 py-1 rounded-lg text-xs font-bold "+cTrack+" "+cMuted+" "+cHover}>{o}</button>)}</div>}
          </div>)}
          {/* رصد المنتجات في الموقع */}
          <div className="rounded-2xl p-3 mb-3 border border-indigo-100 dark:border-slate-700 bg-indigo-50/40 dark:bg-slate-800/40">
            <FindingsField label="المنتجات المرصودة في الموقع" v={d.products} on={v=>setD({...d,products:v})}/>
          </div>
          <div className="grid grid-cols-1 gap-3">
            <Inp label="النتيجة باختصار" v={d.results} on={v=>setD({...d,results:v})}/>
            <Inp label="موعد المتابعة القادمة" type="date" v={d.next_followup} on={v=>setD({...d,next_followup:v})}/>
            <ImagesField label="صور سريعة" v={imgs} on={setImgs} folder="visits"/>
            <div className={"text-xs flex items-center gap-1 "+cMuted}><Icon n="pin" s={13}/> {geo?`GPS: ${geo.lat}, ${geo.lng}`:"جاري تحديد الموقع تلقائياً..."}</div>
          </div>
          <button onClick={save} disabled={saving} className={"w-full rounded-2xl py-3 text-sm font-extrabold mt-4 disabled:opacity-50 "+cBtn}>{saving?"جاري الحفظ والتزامن...":"حفظ الزيارة وتزامنها"}</button>
        </div>
      </div>);
    }

    /* ===== مهامي اليوم ===== */
    function TasksToday({ onGo }) {
      const [d,setD]=useState(null);
      async function load(){
        const [p,pr,c]=await Promise.all([db.from("painters").select("*"),db.from("projects").select("*"),db.from("contractors").select("*")]);
        setD({painters:p.data||[],projects:pr.data||[],contractors:c.data||[]});
      }
      useEffect(()=>{load()},[]);
      if(!d) return <div className={"text-center py-10 text-sm "+cMuted}>جاري تجهيز المهام...</div>;
      const today=TODAY();
      const tasks=[];
      const push=(tbl,r,label)=>{ if(r.next_followup && r.followup_status!=="تمت" && r.followup_status!=="ملغاة") tasks.push({tbl,id:r.id,name:r.name,date:r.next_followup,city:r.city,prio:r.priority,label}); };
      d.painters.forEach(r=>push("painters",r,"دهان")); d.projects.forEach(r=>push("projects",r,"موقع")); d.contractors.forEach(r=>push("contractors",r,"مطور عقاري"));
      const overdue=tasks.filter(t=>t.date<today).sort((a,b)=>a.date.localeCompare(b.date));
      const dueToday=tasks.filter(t=>t.date===today);
      const upcoming=tasks.filter(t=>t.date>today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,20);
      async function done(t){ await db.from(t.tbl).update({followup_status:"تمت",last_contact:today}).eq("id",t.id); logActivity("تعديل",t.tbl,"متابعة",t.name); load(); }

      const Group=({title,items,color,empty})=>(
        <div className={"rounded-2xl p-4 "+cCard}>
          <div className="text-sm font-bold mb-3" style={{color}}>{title} ({items.length})</div>
          {items.length?<div className="space-y-2">{items.map((t,i)=>(
            <div key={i} className={"flex items-center justify-between gap-2 border-b pb-2 "+cBorder}>
              <button onClick={()=>onGo&&onGo(t.tbl)} className="min-w-0 text-right flex-1"><div className="text-sm font-semibold truncate">{t.name}</div><div className={"text-xs truncate "+cMuted}>{t.label} · {t.city||"—"} · {t.date}</div></button>

    /* ===== سجل النشاط ===== */

      const recentInteractions=[...interactions].sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))).slice(0,5);

          </div>

            <Card title="المواقع حسب المدينة">{sitesCityDonut.length?<Donut data={sitesCityDonut} centerLabel="موقع"/>:empty}</Card>

          </div>

          {/* منحنى نشاط الزيارات */}

              <button onClick={()=>onGo&&onGo("painters")} className={"text-xs font-bold "+cAccent}>عرض الدهانين</button>
            </div>
            <div className="grid grid-cols-3 gap-2.5 mb-4">
              <Kpi label="إجمالي التفاعلات" value={totalInteractions} color="#4F46E5" icon="bolt"/>
              <Kpi label="عروض أسعار" value={quotesCount} color="#9333EA" icon="trophy" sub="مُقدَّمة للدهانين"/>
              <Kpi label="دهانون تم التواصل معهم" value={paintersReached} color="#16A34A" icon="brush"/>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <div className={"text-xs font-bold mb-2 "+cMuted}>توزيع التفاعلات حسب النوع</div>
                {interactionTypeDonut.length?<Donut data={interactionTypeDonut} size={140} centerLabel="تفاعل"/>:empty}
              </div>
              <div>
                <div className={"text-xs font-bold mb-2 "+cMuted}>نشاط التفاعلات — آخر 6 أشهر</div>
                {totalInteractions?<TrendArea points={interTrend} color="#9333EA"/>:empty}
              </div>
            </div>
            {recentInteractions.length>0&&(
              <div className={"mt-4 pt-4 border-t "+cBorder}>
                <div className={"text-xs font-bold mb-2 "+cMuted}>آخر التفاعلات</div>
                <div className="space-y-1.5">
                  {recentInteractions.map((x,i)=>(
                    <button key={i} onClick={()=>onGo&&onGo("painters")} className={"w-full flex items-center justify-between gap-2 rounded-xl px-3 py-2 text-xs text-right "+cTrack+" "+cHover}>

                      <span className="flex items-center gap-2 shrink-0"><Pill text={x.type} color={STATUS_COLORS[x.type]}/><span className={cMuted}>{x.date||""}</span></span>

    /* ===== حساب الحصة السوقية (يقرأ المنتجات المرصودة في المشاريع والزيارات بالتزامن) ===== */
    function computeMarketShare(projects, visits){
      const all=[...(projects||[]),...(visits||[])];
      const perFamily={};   // family -> {company -> count}
      const overall={};     // company -> count
      let total=0;
      CATALOG.forEach(f=>perFamily[f.family]={});
      all.forEach(rec=>{ parseFindings(rec.products).forEach(x=>{ const fam=x.f|| (PIDX[x.p]&&PIDX[x.p].family) ||"غير مصنّف"; const co=x.c||"أخرى (تجاري)";
        if(!perFamily[fam]) perFamily[fam]={}; perFamily[fam][co]=(perFamily[fam][co]||0)+1; overall[co]=(overall[co]||0)+1; total++; }); });
      return { perFamily, overall, total };
    }

    /* ===== تبويب المنتجات (كتالوج قابل للتعديل بالكامل) ===== */

      function saveProduct(){ const {famId,idx,c,p}=editor; if(!p.trim()||!c.trim()){alert("اكتب اسم المنتج والشركة");return;}
        const next=JSON.parse(JSON.stringify(CATALOG)); const fam=next.find(f=>f.id===famId);
        if(idx==null) fam.items.push({c:c.trim(),p:p.trim()}); else fam.items[idx]={c:c.trim(),p:p.trim()};
        persistCatalog(next); setEditor(null); rerender(); }
      function delProduct(famId,idx){ if(!confirm("حذف هذا المنتج؟"))return; const next=JSON.parse(JSON.stringify(CATALOG)); next.find(f=>f.id===famId).items.splice(idx,1); persistCatalog(next); rerender(); }
      function saveFam(){ const {idx,family,color,icon}=famEditor; if(!family.trim()){alert("اكتب اسم العائلة");return;}

        if(idx==null) next.push({id:"f"+Date.now(),family:family.trim(),color,icon:icon||"layers",items:[]}); else { next[idx].family=family.trim(); next[idx].color=color; next[idx].icon=icon||next[idx].icon; }
        persistCatalog(next); setFamEditor(null); rerender(); }
      function delFam(idx){ if(!confirm("حذف العائلة وكل منتجاتها؟"))return; const next=JSON.parse(JSON.stringify(CATALOG)); next.splice(idx,1); persistCatalog(next); rerender(); }

      const ICONS=["layers","shield","brush","home","drop","umbrella","building","star"];

          <div className={"flex items-center gap-2 rounded-2xl px-3 py-2 "+cInput}><Icon n="search" s={16} c={cMuted}/><input value={q} onChange={e=>setQ(e.target.value)} placeholder="ابحث عن منتج أو شركة..." className="bg-transparent outline-none text-sm w-full"/></div>

          {CATALOG.map((fam,fi)=>{ const items=fam.items.filter(it=>!q.trim()||(it.p+" "+it.c).includes(q.trim())); if(q.trim()&&items.length===0) return null; const open=openFam===fam.id||q.trim();

    /* ===== تبويب الحصة السوقية ===== */
    function MarketSharePage() {
      const [data,setData]=useState(null); const [famSel,setFamSel]=useState("الكل"); const [citySel,setCitySel]=useState("كل المدن");
      useEffect(()=>{(async()=>{ const [pr,v]=await Promise.all([db.from("projects").select("*"),db.from("visits").select("*")]); setData({projects:pr.data||[],visits:v.data||[]}); })()},[]);
      if(!data) return <div className={"text-center py-10 text-sm "+cMuted}>جاري حساب الحصة السوقية...</div>;
      const fProjects = citySel==="كل المدن"? data.projects : data.projects.filter(p=>p.city===citySel);
      const fVisits   = citySel==="كل المدن"? data.visits   : data.visits.filter(v=>v.location===citySel);
      const ms=computeMarketShare(fProjects,fVisits);
      const overallArr=Object.entries(ms.overall).map(([label,value])=>({label,value,color:companyColor(label)})).sort((a,b)=>b.value-a.value);
      const ownShare=ms.total?Math.round((ms.overall[OWN_COMPANY]||0)/ms.total*100):0;
      const rank=overallArr.findIndex(x=>x.label===OWN_COMPANY)+1;
      const fams=ms.total===0?[]:CATALOG.filter(f=>famSel==="الكل"||f.family===famSel);
      const Card=({children,cls=""})=>(<div className={"p-4 "+cCard+" "+cls}>{children}</div>);
      const famShare=fam=>{ const m=ms.perFamily[fam.family]||{}; const tot=Object.values(m).reduce((a,b)=>a+b,0);
        const arr=Object.entries(m).map(([label,value])=>({label,value,color:companyColor(label)})).sort((a,b)=>b.value-a.value); return {tot,arr}; };

      if(ms.total===0) return (<div className="space-y-4">
        <div className="p-5 text-white brand-grad rounded-2xl"><h2 className="font-extrabold text-lg">الحصة السوقية</h2><p className="text-xs text-white/85 mt-0.5">تُحسب آلياً من المنتجات المرصودة في زياراتك الميدانية</p></div>
        <div className={"rounded-2xl p-10 text-center "+cCard}><div className={"text-sm "+cMuted}>لا توجد منتجات مرصودة بعد.</div><p className={"text-xs mt-2 "+cMuted}>سجّل المنتجات التي تجدها في المشاريع أثناء الزيارات الميدانية (عبر زر الزيارة السريعة ⚡) وستُحتسب الحصة تلقائياً.</p></div>
      </div>);

      return (<div className="space-y-4">
        <div className="p-5 text-white brand-grad rounded-2xl relative overflow-hidden">
          <div className="absolute -left-6 -top-8 w-40 h-40 rounded-full bg-white/10"/>
          <div className="relative"><h2 className="font-extrabold text-lg">الحصة السوقية</h2><p className="text-xs text-white/85 mt-0.5">{citySel==="كل المدن"?"كل مدن إقليم جازان":("مدينة "+citySel)} · {ms.total} رصدة منتج</p>
            <div className="mt-3 flex items-center gap-4 flex-wrap">
              <div><div className="text-3xl font-black">{ownShare}%</div><div className="text-xs text-white/80">حصة الجزيرة</div></div>
              <div className="h-9 w-px bg-white/25"/>
              <div><div className="text-3xl font-black">#{rank||"-"}</div><div className="text-xs text-white/80">ترتيب الجزيرة</div></div>
            </div>
          </div>
        </div>

        <Card><div className="text-sm font-bold mb-3 flex items-center gap-1.5"><Icon n="trophy" s={16} c={cAccent}/> الحصة الإجمالية بين الشركات</div>
          <Donut data={overallArr} centerLabel="رصدة"/></Card>

        <Card><div className="text-sm font-bold mb-3">ترتيب الشركات</div>
          <div className="space-y-2.5">{overallArr.map((c,i)=>{ const pct=Math.round(c.value/ms.total*100); const own=c.label===OWN_COMPANY;
            return (<div key={c.label} className={own?"rounded-xl p-2 -m-2 bg-indigo-50/60 dark:bg-indigo-900/20":""}>
              <div className="flex justify-between mb-1 text-xs"><span className="font-bold flex items-center gap-1.5"><span className="w-5 h-5 rounded-md text-white text-[10px] flex items-center justify-center" style={{background:c.color}}>{i+1}</span>{c.label}{own?" ★":""}</span><span className="font-extrabold" style={{color:c.color}}>{pct}% · {c.value}</span></div>
              <div className={"h-2.5 rounded-full overflow-hidden "+cTrack}><div className="h-2.5 rounded-full" style={{width:pct+"%",background:c.color}}/></div></div>);})}</div></Card>

        <div><div className={"text-xs font-bold mb-1.5 "+cMuted}>تصفية حسب المدينة (كل مدينة لها حصتها)</div>
          <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
            {["كل المدن",...CITIES].map(c=>(<button key={c} onClick={()=>setCitySel(c)} className={"shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold "+(citySel===c?cBtn:cTrack+" "+cMuted)}>{c}</button>))}
          </div></div>
        <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
          {["الكل",...CATALOG.map(f=>f.family)].map(f=>(<button key={f} onClick={()=>setFamSel(f)} className={"shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold "+(famSel===f?cBtn:cTrack+" "+cMuted)}>{f}</button>))}
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          {fams.map(fam=>{ const {tot,arr}=famShare(fam); if(tot===0) return (<Card key={fam.id}><div className="flex items-center gap-2 mb-2"><span className="w-7 h-7 rounded-lg text-white flex items-center justify-center" style={{background:fam.color}}><Icon n={fam.icon} s={15}/></span><div className="text-sm font-bold">{fam.family}</div></div><div className={"text-xs py-3 text-center "+cMuted}>لا رصدات بعد</div></Card>);
            return (<Card key={fam.id}>
              <div className="flex items-center gap-2 mb-3"><span className="w-7 h-7 rounded-lg text-white flex items-center justify-center" style={{background:fam.color}}><Icon n={fam.icon} s={15}/></span><div><div className="text-sm font-bold">{fam.family}</div><div className={"text-[11px] "+cMuted}>{tot} رصدة</div></div></div>
              <div className="space-y-2">{arr.map(c=>{ const pct=Math.round(c.value/tot*100); const own=c.label===OWN_COMPANY;
                return (<div key={c.label}><div className="flex justify-between text-[11px] mb-0.5"><span className={own?"font-extrabold":"font-semibold"}>{c.label}{own?" ★":""}</span><span className="font-bold" style={{color:c.color}}>{pct}%</span></div><div className={"h-2 rounded-full overflow-hidden "+cTrack}><div className="h-2 rounded-full" style={{width:pct+"%",background:c.color}}/></div></div>);})}</div>
            </Card>);})}
        </div>
      </div>);
    }

    /* ===== رصد منتجات المنافسين في السوق ===== */
    function MarketMonitorPage() {
      const [data,setData]=useState(null); const [city,setCity]=useState("كل المدن"); const [fam,setFam]=useState("الكل");
      useEffect(()=>{(async()=>{ const [pr,v]=await Promise.all([db.from("projects").select("*"),db.from("visits").select("*")]); setData({projects:pr.data||[],visits:v.data||[]}); })()},[]);
      if(!data) return <div className={"text-center py-10 text-sm "+cMuted}>جاري تجهيز رصد السوق...</div>;
      // اجمع كل الرصدات مع سياق (مدينة/موقع)
      const recs=[];
      data.projects.forEach(p=>parseFindings(p.products).forEach(f=>recs.push({...f, where:p.name, city:p.city||"—", src:"موقع"})));
      data.visits.forEach(v=>parseFindings(v.products).forEach(f=>recs.push({...f, where:v.project||v.target, city:v.location||"—", src:"زيارة"})));
      const comp=recs.filter(r=>r.c&&r.c!==OWN_COMPANY);
      const fComp=comp.filter(r=>(city==="كل المدن"||r.city===city)&&(fam==="الكل"||r.f===fam));
      const byCompany={}; fComp.forEach(r=>byCompany[r.c]=(byCompany[r.c]||0)+1);
      const ranked=Object.entries(byCompany).map(([label,value])=>({label,value,color:companyColor(label)})).sort((a,b)=>b.value-a.value);
      const total=fComp.length;
      return (<div className="space-y-4">
        <div className="p-5 text-white rounded-2xl relative overflow-hidden" style={{background:"linear-gradient(135deg,#be123c,#9f1239)"}}>
          <div className="absolute -left-6 -top-8 w-40 h-40 rounded-full bg-white/10"/>
          <div className="relative"><h2 className="font-extrabold text-lg">رصد منتجات المنافسين في السوق</h2><p className="text-xs text-white/85 mt-0.5">{total} منتج منافس مرصود في {new Set(fComp.map(r=>r.where)).size} موقع</p></div>
        </div>
        <div><div className={"text-xs font-bold mb-1.5 "+cMuted}>المدينة</div><div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">{["كل المدن",...CITIES].map(c=>(<button key={c} onClick={()=>setCity(c)} className={"shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold "+(city===c?cBtn:cTrack+" "+cMuted)}>{c}</button>))}</div></div>
        <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">{["الكل",...CATALOG.map(f=>f.family)].map(f=>(<button key={f} onClick={()=>setFam(f)} className={"shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold "+(fam===f?cBtn:cTrack+" "+cMuted)}>{f}</button>))}</div>
        {total===0?<div className={"rounded-2xl p-10 text-center text-sm "+cCard+" "+cMuted}>لا توجد منتجات منافسين مرصودة بهذه التصفية. سجّل المنتجات التي تراها في المواقع أثناء الزيارات.</div>:(<>
          <div className={"p-4 "+cCard}><div className="text-sm font-bold mb-3">المنافسون الأكثر حضوراً</div>
            <div className="space-y-2.5">{ranked.map(c=>{ const pct=Math.round(c.value/total*100);
              return (<div key={c.label}><div className="flex justify-between text-xs mb-1"><span className="font-bold">{c.label}</span><span className="font-extrabold" style={{color:c.color}}>{pct}% · {c.value}</span></div><div className={"h-2.5 rounded-full overflow-hidden "+cTrack}><div className="h-2.5 rounded-full" style={{width:pct+"%",background:c.color}}/></div></div>);})}</div></div>
          <div className={"p-4 "+cCard}><div className="text-sm font-bold mb-3">سجلّ الرصدات ({fComp.length})</div>
            <div className="space-y-2 max-h-96 overflow-y-auto">{fComp.slice().reverse().map((r,i)=>(<div key={i} className="flex items-center justify-between gap-2 rounded-xl px-3 py-2" style={{background:companyColor(r.c)+"12"}}>
              <div className="min-w-0"><div className="text-xs font-extrabold truncate" style={{color:companyColor(r.c)}}>{r.c} · {r.p}</div><div className={"text-[11px] "+cMuted+" truncate"}>{r.f} · {r.where} · {r.city}</div></div>
              <span className="text-[10px] font-bold px-2 py-0.5 rounded-full shrink-0" style={{background:companyColor(r.c)+"22",color:companyColor(r.c)}}>{r.src}</span>
            </div>))}</div></div>
        </>)}
      </div>);
    }

    /* ===== الخطة الأسبوعية بالمدن ===== */
    const PLAN_KEY="jazeera_weekplan";
    function loadPlan(){ try{ return JSON.parse(localStorage.getItem(PLAN_KEY)||"{}"); }catch(e){ return {}; } }
    function savePlan(p){ try{ localStorage.setItem(PLAN_KEY, JSON.stringify(p)); }catch(e){} db.from("weekly_plan").upsert([{id:1,data:p}]).then(()=>{}).catch(()=>{}); }
    function nextDays(n){ const out=[]; const d=new Date(); for(let i=0;i<n;i++){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+i); out.push(x.toISOString().slice(0,10)); } return out; }
    function dayName(iso){ return new Date(iso+"T00:00:00").toLocaleDateString("ar",{weekday:"long"}); }
    function WeeklyPlanPage({ onGo }) {
      const [plan,setPlan]=useState(loadPlan()); const [data,setData]=useState(null); const [pick,setPick]=useState(null);
      useEffect(()=>{(async()=>{ const [p,c]=await Promise.all([db.from("painters").select("*"),db.from("contractors").select("*")]); setData({painters:p.data||[],contractors:c.data||[]});
        try{ const {data:wp}=await db.from("weekly_plan").select("data").eq("id",1).limit(1); if(wp&&wp[0]&&wp[0].data){ setPlan(wp[0].data); localStorage.setItem(PLAN_KEY,JSON.stringify(wp[0].data)); } }catch(e){} })()},[]);
      const days=nextDays(7); const today=TODAY();
      const setCity=(iso,city)=>{ const p={...plan}; if(city) p[iso]=city; else delete p[iso]; setPlan(p); savePlan(p); setPick(null); };
      const recoFor=city=>{ if(!data) return {painters:[],devs:[]};
        const score=p=>(Number(p.rating)||0)+( {"عالية":3,"متوسطة":2,"منخفضة":1}[p.priority]||0 )+(p.status==="نشط"?2:0)+(p.status==="مستقطب"?1:0);
        const painters=data.painters.filter(p=>p.city===city).sort((a,b)=>score(b)-score(a)).slice(0,5);
        const devs=data.contractors.filter(c=>c.city===city).sort((a,b)=>(Number(b.rating)||0)+({"عالية":3,"متوسطة":2,"منخفضة":1}[b.priority]||0)-((Number(a.rating)||0)+({"عالية":3,"متوسطة":2,"منخفضة":1}[a.priority]||0))).slice(0,5);
        return {painters,devs}; };
      return (<div className="space-y-4">
        <div className="p-5 text-white brand-grad rounded-2xl relative overflow-hidden">
          <div className="absolute -left-6 -top-8 w-40 h-40 rounded-full bg-white/10"/>
          <div className="relative"><h2 className="font-extrabold text-lg">الخطة الأسبوعية بالمدن</h2><p className="text-xs text-white/85 mt-0.5">حدّد مدينة كل يوم، وسيُذكّرك التطبيق ليلاً بزيارة الغد مع ترشيح أبرز الدهانين والمطوّرين</p></div>
        </div>
        {days.map(iso=>{ const city=plan[iso]; const isToday=iso===today; const reco=city?recoFor(city):null;
          return (<div key={iso} className={"overflow-hidden "+cCard+(isToday?" ring-2 ring-indigo-500":"")}>
            <div className="flex items-center justify-between gap-2 p-4">
              <div className="flex items-center gap-3"><div className={"w-12 h-12 rounded-xl flex flex-col items-center justify-center text-white shrink-0 "+(city?"":"opacity-40")} style={{background:city?"#4338CA":"#94A3B8"}}><span className="text-[10px] leading-none">{dayName(iso)}</span><span className="text-sm font-black leading-tight">{iso.slice(8)}/{iso.slice(5,7)}</span></div>
                <div><div className="font-extrabold text-sm flex items-center gap-1.5">{city||"بدون تخطيط"}{isToday&&<span className="text-[10px] bg-indigo-100 text-indigo-700 dark:bg-indigo-900/40 dark:text-indigo-300 px-1.5 py-0.5 rounded-full font-bold">اليوم</span>}</div>{city?<div className={"text-[11px] "+cMuted}>{reco.painters.length} دهان · {reco.devs.length} مطوّر مرشّح</div>:<div className={"text-[11px] "+cMuted}>اضغط لاختيار المدينة</div>}</div></div>
              <button onClick={()=>setPick(pick===iso?null:iso)} className={"rounded-xl px-3 py-2 text-xs font-bold "+(city?cTrack+" "+cAccent:cBtn)}>{city?"تغيير":"تحديد مدينة"}</button>
            </div>
            {pick===iso&&(<div className="px-4 pb-3 flex flex-wrap gap-1.5 fade">{CITIES.map(c=><button key={c} onClick={()=>setCity(iso,c)} className={"px-2.5 py-1 rounded-lg text-xs font-bold "+(city===c?cBtn:cTrack+" "+cMuted+" "+cHover)}>{c}</button>)}{city&&<button onClick={()=>setCity(iso,null)} className="px-2.5 py-1 rounded-lg text-xs font-bold bg-red-500/10 text-red-600">إزالة</button>}</div>)}
            {city&&reco&&(reco.painters.length+reco.devs.length>0)&&(<div className="px-4 pb-4 space-y-3 fade">
              {reco.painters.length>0&&<div><div className="text-[11px] font-bold mb-1.5 flex items-center gap-1" style={{color:"#4F46E5"}}><Icon n="brush" s={12}/> أبرز الدهانين في {city}</div><div className="space-y-1.5">{reco.painters.map(p=>(<button key={p.id} onClick={()=>onGo&&onGo("painters")} className={"w-full flex items-center justify-between gap-2 rounded-xl px-3 py-2 "+cTrack+" "+cHover}><span className="text-xs font-bold truncate">{p.name}</span><span className="shrink-0"><Stars n={Number(p.rating)||0}/></span></button>))}</div></div>}
              {reco.devs.length>0&&<div><div className="text-[11px] font-bold mb-1.5 flex items-center gap-1" style={{color:"#0891B2"}}><Icon n="target" s={12}/> مطوّرون للتواصل في {city}</div><div className="space-y-1.5">{reco.devs.map(c=>(<button key={c.id} onClick={()=>onGo&&onGo("contractors")} className={"w-full flex items-center justify-between gap-2 rounded-xl px-3 py-2 "+cTrack+" "+cHover}><span className="text-xs font-bold truncate">{c.name}</span>{c.phone?<a href={"tel:"+c.phone} onClick={e=>e.stopPropagation()} className="text-[11px] font-bold text-emerald-600 shrink-0">{c.phone}</a>:null}</button>))}</div></div>}
            </div>)}
          </div>);})}
      </div>);
    }

    /* ===== الرؤى الذكية ===== */
    function InsightsPage({ onGo }) {
      const [d,setD]=useState(null);
      useEffect(()=>{(async()=>{
        const [p,pr,v]=await Promise.all([db.from("painters").select("*"),db.from("projects").select("*"),db.from("visits").select("*")]);
        setD({painters:p.data||[],projects:pr.data||[],visits:v.data||[]});
      })()},[]);
      if(!d) return <div className={"text-center py-10 text-sm "+cMuted}>جاري تحليل البيانات...</div>;
      const today=TODAY();
      const withF=d.painters.filter(p=>p.next_followup&&p.followup_status!=="تمت");
      const overdue=withF.filter(p=>p.next_followup<today).sort((a,b)=>a.next_followup.localeCompare(b.next_followup));
      const competitorP=d.painters.filter(p=>p.status==="منافس");
      const notContacted=d.painters.filter(p=>p.status!=="متوقف"&&daysAgo(p.last_visit||p.last_contact)>45);
      const active=d.painters.filter(p=>p.status==="نشط").length;
      // مواقع بلا دهان مسؤول (فرصة ربط)
      const sitesNoPainter=d.projects.filter(p=>!p.painter||p.painter==="-"||p.painter==="");
      // المدن الأقل تغطية (دهانون + زيارات لكل مدينة)
      const cityScore={}; CITIES.forEach(c=>cityScore[c]=0);
      d.painters.forEach(p=>{if(cityScore[p.city]!=null)cityScore[p.city]+=1;});
      d.visits.forEach(v=>{if(cityScore[v.location]!=null)cityScore[v.location]+=1;});
      const leastCities=Object.entries(cityScore).map(([city,n])=>({city,n})).sort((a,b)=>a.n-b.n).slice(0,5);
      // حصة الجزيرة لكل مدينة من المنتجات المرصودة — المدن التي يتفوّق فيها المنافسون (فرص استرداد)
      const cityShare={}; CITIES.forEach(c=>cityShare[c]={own:0,tot:0});
      const addRec=(city,prods)=>{ if(cityShare[city]==null) return; parseFindings(prods).forEach(f=>{ if(!f.c) return; cityShare[city].tot++; if(f.c===OWN_COMPANY)cityShare[city].own++; }); };
      d.projects.forEach(p=>addRec(p.city,p.products));
      d.visits.forEach(v=>addRec(v.location,v.products));
      const competitorCities=Object.entries(cityShare).map(([city,o])=>({city,share:o.tot?Math.round(o.own/o.tot*100):null,tot:o.tot}))
        .filter(x=>x.tot>=3&&x.share!=null&&x.share<50).sort((a,b)=>a.share-b.share);
      // المنتجات (الجزيرة) الأقل رصداً
      const prodCount={};
      [...d.visits,...d.projects].forEach(x=>parseFindings(x.products).forEach(f=>{ if(f.c===OWN_COMPANY) prodCount[f.p]=(prodCount[f.p]||0)+1; }));
      Object.keys(PIDX||{}).forEach(()=>{});
      const leastProducts=Object.entries(prodCount).sort((a,b)=>a[1]-b[1]).slice(0,6);

      const card="rounded-2xl p-4 "+cCard;
      const Block=({title,color,items,render,empty,go})=>(
        <div className={card}><div className="flex items-center justify-between mb-3"><div className="text-sm font-bold" style={{color}}>{title} ({items.length})</div>{go&&<button onClick={()=>onGo&&onGo(go)} className={"text-xs font-bold "+cAccent}>عرض</button>}</div>
          {items.length?<div className="space-y-2">{items.slice(0,8).map((x,i)=>render(x,i))}</div>:<div className={"text-xs "+cMuted}>{empty}</div>}</div>
      );
      const line=(a,b,bc)=>(<div className={"flex items-center justify-between gap-2 border-b pb-2 "+cBorder}><div className="text-sm font-semibold truncate">{a}</div><div className="text-xs truncate font-bold" style={{color:bc||"#64748B"}}>{b}</div></div>);
      return (
        <div className="space-y-4">
          <div className={"rounded-2xl p-4 border-r-4 "+cCard} style={{borderRightColor:"#4F46E5"}}><h2 className="font-extrabold">الرؤى الذكية</h2><p className={"text-xs mt-0.5 "+cMuted}>تحليلات مستخرجة آلياً من بياناتك الفعلية لتوجيه أولويات العمل</p></div>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <Block title="دهانون غير متابَعين" color="#DC2626" items={notContacted} go="painters" empty="كل الدهانين تمت متابعتهم مؤخراً."
              render={(p,i)=><div key={i}>{line(p.name,`${p.city||"—"} · منذ ${daysAgo(p.last_visit||p.last_contact)} يوم`,"#DC2626")}</div>}/>
            <Block title="متابعات متأخرة" color="#DC2626" items={overdue} go="tasks" empty="لا متابعات متأخرة، أحسنت."
              render={(p,i)=><div key={i}>{line(p.name,`موعدها ${p.next_followup}`,"#DC2626")}</div>}/>
            <Block title="مدن يتفوّق فيها المنافسون" color="#9F1239" items={competitorCities} go="marketshare" empty="حصة الجزيرة جيدة في كل المدن المرصودة."
              render={(c,i)=><div key={i}>{line(c.city,`حصة الجزيرة ${c.share}% · ${c.tot} رصدة`,"#9F1239")}</div>}/>
            <Block title="مواقع بلا دهان مسؤول" color="#D97706" items={sitesNoPainter} go="projects" empty="كل المواقع مرتبطة بدهان."
              render={(p,i)=><div key={i}>{line(p.name,`${p.city||"—"} · ${p.type||"—"}`,"#D97706")}</div>}/>
            <Block title="المدن الأقل تغطية" color="#0891B2" items={leastCities} go="plan" empty="—"
              render={(c,i)=><div key={i}>{line(c.city,`نشاط: ${c.n}`,"#0891B2")}</div>}/>
            <Block title="منتجات الجزيرة الأقل رصداً" color="#7C3AED" items={leastProducts} go="products" empty="—"
              render={(x,i)=><div key={i}>{line(x[0],`رُصد ${x[1]} مرة`,"#7C3AED")}</div>}/>
          </div>
          <div className={card}><h4 className="font-bold text-sm mb-1.5" style={{color:"#16A34A"}}>صحة قاعدة الدهانين</h4><p className="text-xs leading-relaxed">{active} دهان نشط من أصل {d.painters.length}، و{competitorP.length} مصنّفون كمنافس يمثّلون فرص تحويل. لديك {sitesNoPainter.length} موقع دون دهان مسؤول.</p></div>
        </div>
      );
    }

    /* ===== التقارير الاحترافية ===== */
    function printReport(title, bodyHtml){
      const w=window.open("","_blank");
      const css=`*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}body{margin:0;padding:28px;color:#0f172a;direction:rtl}
        .h{display:flex;align-items:center;gap:12px;border-bottom:3px solid #4338CA;padding-bottom:14px;margin-bottom:18px}
        .logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#4f46e5,#4338ca);color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center}
        h1{font-size:20px;margin:0}.sub{color:#64748b;font-size:12px;margin-top:2px}
        h2{font-size:15px;color:#4338CA;margin:22px 0 8px;border-right:4px solid #4338CA;padding-right:8px}
        table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
        th,td{border:1px solid #e2e8f0;padding:7px 9px;text-align:right}th{background:#f1f5f9;font-weight:700}
        .kpis{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
        .kpi{flex:1;min-width:130px;border:1px solid #e2e8f0;border-radius:10px;padding:10px}
        .kpi .l{font-size:11px;color:#64748b}.kpi .v{font-size:18px;font-weight:800;color:#4338CA}
        .foot{margin-top:26px;border-top:1px solid #e2e8f0;padding-top:10px;color:#94a3b8;font-size:11px;text-align:center}
        @media print{.noprint{display:none}}`;
      w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${title}</title><style>${css}</style></head><body>
        <div class="h"><div class="logo">ج</div><div><h1>${title}</h1><div class="sub">نظام الجزيرة الميداني · ${new Date().toLocaleDateString("ar")}</div></div></div>
        ${bodyHtml}
        <div class="foot">تقرير مُنشأ آلياً من نظام الجزيرة الميداني</div>
        <div class="noprint" style="text-align:center;margin-top:18px"><button onclick="window.print()" style="background:#4338CA;color:#fff;border:0;padding:10px 22px;border-radius:8px;font-weight:700;cursor:pointer">طباعة / حفظ PDF</button></div>
        </body></html>`);
      w.document.close(); setTimeout(()=>{try{w.print();}catch(e){}}, 600);
    }
    function tableHtml(headers, rows){
      return `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
        rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c==null?"—":c}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${headers.length}" style="text-align:center;color:#94a3b8">لا توجد بيانات</td></tr>`
      }</tbody></table>`;
    }
    function kpisHtml(items){ return `<div class="kpis">${items.map(([l,v])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("")}</div>`; }

    /* ===== سكيليتون تحميل عام للتقارير ===== */
    function ReportSkeleton(){
      return (<div className="space-y-4 animate-pulse">
        <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">{Array.from({length:5}).map((_,i)=>(<div key={i} className={"h-20 rounded-2xl "+cTrack}/>))}</div>
        <div className={"h-64 rounded-2xl "+cTrack}/>
      </div>);
    }
    function ReportError({ msg, onRetry }){
      return (<div className={"rounded-2xl p-8 text-center "+cCard}>
        <div className="w-12 h-12 rounded-full bg-red-500/10 text-red-600 flex items-center justify-center mx-auto mb-3"><Icon n="close" s={20}/></div>
        <div className="font-bold text-sm mb-1">تعذّر تحميل التقرير</div>
        <div className={"text-xs mb-4 "+cMuted}>{msg}</div>
        <button onClick={onRetry} className={"inline-flex items-center gap-1.5 rounded-xl px-4 py-2 text-xs font-bold "+cBtn}><Icon n="refresh" s={14}/> إعادة المحاولة</button>
      </div>);
    }
    function ReportEmpty({ text }){
      return (<div className={"rounded-2xl p-10 text-center "+cTrack}>
        <div className={"w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3 bg-white dark:bg-slate-900"}><Icon n="doc" s={20} c={cMuted}/></div>
        <div className={"text-sm font-bold "+cMuted}>{text}</div>
      </div>);
    }

    /* ===== التقرير اليومي: ملخص كل ما حدث اليوم تلقائياً ===== */
    function DailyActivityReport({ onGo }) {
      const [data,setData]=useState(null);
      const [error,setError]=useState("");
      const [loading,setLoading]=useState(true);
      const today = TODAY();

      async function load(){
        setLoading(true); setError("");
        try{
          const [p,pr,it,vi] = await Promise.all([
            db.from("painters").select("id,name,city,created_at").gte("created_at", today),
            db.from("projects").select("id,name,city,created_at").gte("created_at", today),
            db.from("interactions").select("*").eq("date", today),
            db.from("visits").select("*").eq("date", today),
          ]);
          if(p.error) throw new Error(p.error.message);
          if(pr.error) throw new Error(pr.error.message);
          if(it.error) throw new Error("تأكد من إنشاء جدول interactions: "+it.error.message);
          if(vi.error) throw new Error(vi.error.message);
          let activity=[];
          try{ const al=await db.from("activity_log").select("*").gte("created_at", today).order("created_at",{ascending:false}).limit(500); activity=al.data||[]; }catch(e){ activity=[]; }
          setData({ painters:p.data||[], projects:pr.data||[], interactions:it.data||[], visits:vi.data||[], activity });
        }catch(e){ setError(e.message||"تعذّر تحميل نشاط اليوم"); }
        finally{ setLoading(false); }
      }
      useEffect(()=>{ load(); },[]);

      if(loading) return <ReportSkeleton/>;
      if(error) return <ReportError msg={error} onRetry={load}/>;
      if(!data) return null;

      const calls=data.interactions.filter(x=>x.type==="مكالمة");
      const wa=data.interactions.filter(x=>x.type==="واتساب");
      const quotes=data.interactions.filter(x=>x.type==="عرض سعر");
      const notesRows=data.interactions.filter(x=>x.notes&&String(x.notes).trim());
      const completedFollowups=data.activity.filter(a=>a.action==="تعديل"&&a.entity_label==="متابعة");
      const otherActivity=data.activity.filter(a=> a.action!=="تفاعل" && !(a.action==="إضافة"&&["painters","projects","visits"].includes(a.entity)) && !(a.action==="تعديل"&&a.entity_label==="متابعة") );
      const totalActivities = data.painters.length+data.projects.length+data.interactions.length+data.visits.length+completedFollowups.length+otherActivity.length;

      const kpis=[
        {label:"دهانون جدد",value:data.painters.length,color:"#16A34A",icon:"brush"},
        {label:"مواقع جديدة",value:data.projects.length,color:"#D97706",icon:"building"},
        {label:"تفاعلات مسجّلة",value:data.interactions.length,color:"#4F46E5",icon:"bolt"},
        {label:"عروض أسعار",value:quotes.length,color:"#9333EA",icon:"trophy"},
        {label:"متابعات مكتملة",value:completedFollowups.length,color:"#0891B2",icon:"check"},
        {label:"مكالمات هاتفية",value:calls.length,color:"#2563EB",icon:"target"},
        {label:"محادثات واتساب",value:wa.length,color:"#16A34A",icon:"whatsapp"},
        {label:"ملاحظات مضافة",value:notesRows.length,color:"#7C3AED",icon:"doc"},
        {label:"زيارات منجزة",value:data.visits.length,color:"#DC2626",icon:"pin"},
        {label:"أنشطة أخرى",value:otherActivity.length,color:"#64748B",icon:"layers"},
      ];

      // تجميع الأنشطة في أقسام واضحة بدل جدول زمني مسطّح — بدون أي عرض للتوقيت
      const groups=[
        {key:"painters",title:"دهانون جدد",color:"#16A34A",icon:"brush",go:"painters",
          items:data.painters.map(p=>({title:p.name,subtitle:p.city||"",user:null}))},
        {key:"projects",title:"مواقع جديدة",color:"#D97706",icon:"building",go:"projects",
          items:data.projects.map(p=>({title:p.name,subtitle:p.city||"",user:null}))},
        {key:"interactions",title:"تفاعلات مع الدهانين",color:"#4F46E5",icon:"bolt",go:"painters",
          items:data.interactions.map(x=>({title:x.painter||"—",subtitle:(x.notes?x.notes:"")+(x.quote_amount?(" · "+Number(x.quote_amount).toLocaleString()+" ر.س"):""),user:x.user_name,badge:x.type,badgeColor:STATUS_COLORS[x.type],badgeIcon:INTERACTION_ICON[x.type]}))},
        {key:"visits",title:"زيارات ميدانية",color:"#DC2626",icon:"pin",go:"visits",
          items:data.visits.map(v=>({title:v.target||v.type||"زيارة",subtitle:[v.location,[v.painter,v.contractor].filter(Boolean).join(" · ")].filter(Boolean).join(" · "),user:null}))},
        {key:"followups",title:"متابعات مكتملة",color:"#0891B2",icon:"check",go:null,
          items:completedFollowups.map(a=>({title:a.record_name||"—",subtitle:"تمّت متابعتها اليوم",user:a.user_name}))},
        {key:"other",title:"أنشطة أخرى",color:"#64748B",icon:"layers",go:null,
          items:otherActivity.map(a=>({title:(a.entity_label||a.entity||"—"),subtitle:(a.action||"—")+(a.record_name?(" · "+a.record_name):""),user:a.user_name}))},
      ].filter(g=>g.items.length>0);

      const donutData=groups.map(g=>({label:g.title,value:g.items.length,color:g.color}));

      // أكثر الدهانين تفاعلاً اليوم
      const byPainter={}; data.interactions.forEach(x=>{ if(x.painter) byPainter[x.painter]=(byPainter[x.painter]||0)+1; });
      const topPainters=Object.entries(byPainter).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([label,value])=>({label,value}));

      const exportHeaders=["التصنيف","العنصر","التفاصيل","المستخدم"];
      const exportRows=groups.flatMap(g=>g.items.map(it=>[g.title,it.title,it.subtitle||"—",it.user||"—"]));
      const doPrint=()=>{
        let body=kpisHtml(kpis.map(k=>[k.label,k.value]));
        groups.forEach(g=>{ body+=`<h2 style="border-right-color:${g.color};color:${g.color}">${g.title} (${g.items.length})</h2>`+tableHtml(["العنصر","التفاصيل","المستخدم"],g.items.map(it=>[it.title,it.subtitle||"—",it.user||"—"])); });
        printReport("التقرير اليومي — "+new Date().toLocaleDateString("ar"), body);
      };

      return (
        <div className="space-y-4">
          {/* بانر رئيسي بصري */}
          <div className="relative rounded-2xl p-6 overflow-hidden text-white lift" style={{background:"linear-gradient(135deg,#4f46e5 0%,#6d28d9 55%,#7c3aed 100%)"}}>
            <div className="absolute -left-10 -bottom-10 w-52 h-52 rounded-full bg-white/10"/>
            <div className="absolute left-16 -top-10 w-28 h-28 rounded-full bg-white/10"/>
            <div className="relative flex items-center justify-between flex-wrap gap-4">
              <div className="flex items-center gap-4">
                <div className="w-14 h-14 rounded-2xl bg-white/20 backdrop-blur flex items-center justify-center"><Icon n="bolt" s={26}/></div>
                <div>
                  <div className="text-xs font-bold text-white/80">التقرير اليومي</div>
                  <div className="text-xl font-black">{new Date().toLocaleDateString("ar-SA",{weekday:"long",day:"2-digit",month:"long",year:"numeric"})}</div>
                </div>
              </div>
              <div className="text-center">
                <div className="text-4xl font-black leading-none">{totalActivities}</div>
                <div className="text-[11px] font-bold text-white/80 mt-1">نشاط مُسجَّل اليوم</div>
              </div>
              <div className="flex items-center gap-2 flex-wrap">
                <button onClick={load} className="inline-flex items-center gap-1.5 rounded-lg px-3 py-2 text-xs font-bold bg-white/20 hover:bg-white/30 transition"><Icon n="refresh" s={13}/> تحديث</button>
                <button onClick={doPrint} className="inline-flex items-center gap-1.5 rounded-lg px-3 py-2 text-xs font-bold bg-white/20 hover:bg-white/30 transition"><Icon n="printer" s={13}/> طباعة / PDF</button>
                <button onClick={()=>exportRowsXLSX("التقرير اليومي","اليوم",exportHeaders,exportRows)} className="inline-flex items-center gap-1.5 rounded-lg px-3 py-2 text-xs font-bold bg-white/20 hover:bg-white/30 transition"><Icon n="download" s={13}/> Excel</button>
                <button onClick={()=>exportRowsCSV("التقرير_اليومي",exportHeaders,exportRows)} className="inline-flex items-center gap-1.5 rounded-lg px-3 py-2 text-xs font-bold bg-white/20 hover:bg-white/30 transition"><Icon n="download" s={13}/> CSV</button>
              </div>
            </div>
          </div>

          {/* كروت KPI */}
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
            {kpis.map((k,i)=>(<Kpi key={i} label={k.label} value={k.value} color={k.color} icon={k.icon}/>))}
          </div>

          {totalActivities===0?(
            <ReportEmpty text="لا توجد أنشطة مسجّلة اليوم بعد. أول نشاط يُسجَّل هيظهر هنا فورًا."/>
          ):(
            <>
              {/* توزيع الأنشطة + الأكثر تفاعلاً */}
              <div className="grid grid-cols-1 lg:grid-cols-5 gap-4">
                <div className={"lg:col-span-2 rounded-2xl p-5 "+cCard}>
                  <div className="flex items-center gap-2 mb-4"><Icon n="chart" s={16} c={cAccent}/><h3 className="font-bold text-sm">توزيع أنشطة اليوم</h3></div>
                  <Donut data={donutData} size={150} centerLabel="نشاط"/>
                </div>
                <div className={"lg:col-span-3 rounded-2xl p-5 "+cCard}>
                  <div className="flex items-center gap-2 mb-4"><Icon n="trophy" s={16} c={"#9333EA"}/><h3 className="font-bold text-sm">الأكثر تفاعلاً اليوم</h3></div>
                  {topPainters.length?<Bars data={topPainters}/>:<ReportEmpty text="لا توجد تفاعلات مرتبطة بدهانين بعد اليوم."/>}
                </div>
              </div>

              {/* أقسام الأنشطة */}
              <div className="grid grid-cols-1 xl:grid-cols-2 gap-4">
