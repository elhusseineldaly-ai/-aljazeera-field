<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام الجزيرة الميداني</title>
  <meta name="theme-color" content="#00804A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="الجزيرة الميداني" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2300804A'/%3E%3Ctext x='50' y='70' font-size='60' fill='white' text-anchor='middle' font-family='sans-serif' font-weight='bold'%3E%D8%AC%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f3f6f4; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    /* ===== إعدادات الربط بقاعدة البيانات ===== */
    const SUPABASE_URL = "https://pdjjlzmldrvhhurtulma.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6bwC9B-Q20VG09Bq6bUXow_6xq3qdGh";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const STATUS_COLORS = {
      "نشط": "#00804A", "جديد": "#1E6FD9", "متوقف": "#9A9A9A", "منافس": "#E2574C",
    };
    const CITIES = ["الرياض", "جدة", "مكة", "المدينة", "الدمام", "الخبر", "أبها"];
    const WORK_TYPES = ["فردي", "مؤسسة"];
    const STATUSES = ["نشط", "جديد", "متوقف", "منافس"];

    const EMPTY = { name: "", phone: "", nationality: "", city: "الرياض", work_type: "فردي", status: "نشط", rating: 3, monthly_consumption: 0 };

    function Stars({ n }) {
      return <span>{[1,2,3,4,5].map(i => <span key={i} style={{ color: i <= n ? "#D4A017" : "#d1d5db" }}>★</span>)}</span>;
    }

    function App() {
      const [painters, setPainters] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");
      const [q, setQ] = useState("");
      const [showForm, setShowForm] = useState(false);
      const [form, setForm] = useState(EMPTY);
      const [saving, setSaving] = useState(false);

      async function load() {
        setLoading(true); setError("");
        const { data, error } = await db.from("painters").select("*").order("created_at", { ascending: false });
        if (error) setError("تعذّر تحميل البيانات: " + error.message);
        else setPainters(data || []);
        setLoading(false);
      }

      useEffect(() => { load(); }, []);

      async function addPainter() {
        if (!form.name.trim()) { alert("اكتب اسم الدهان أولاً"); return; }
        setSaving(true);
        const { error } = await db.from("painters").insert([{
          ...form,
          rating: Number(form.rating),
          monthly_consumption: Number(form.monthly_consumption),
        }]);
        setSaving(false);
        if (error) { alert("خطأ في الحفظ: " + error.message); return; }
        setForm(EMPTY); setShowForm(false); load();
      }

      const list = painters.filter(p =>
        q === "" || (p.name || "").includes(q) || (p.phone || "").includes(q) || (p.city || "").includes(q)
      );
      const active = painters.filter(p => p.status === "نشط").length;
      const totalConsumption = painters.reduce((a, p) => a + (Number(p.monthly_consumption) || 0), 0);

      const field = (key, val) => setForm({ ...form, [key]: val });

      return (
        <div className="min-h-screen text-gray-800">
          {/* الهيدر */}
          <header className="text-white px-4 py-4 shadow-md" style={{ background: "linear-gradient(135deg,#00804A,#005c35)" }}>
            <div className="max-w-3xl mx-auto flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-white/15 border border-white/20 flex items-center justify-center font-extrabold text-lg">ج</div>
              <div>
                <div className="font-extrabold leading-tight">نظام الجزيرة الميداني</div>
                <div className="text-xs text-emerald-100">إدارة الدهانين</div>
              </div>
            </div>
          </header>

          <main className="max-w-3xl mx-auto p-4 space-y-4">
            {/* مؤشرات سريعة */}
            <div className="grid grid-cols-3 gap-3">
              {[["إجمالي الدهانين", painters.length, "#00804A"],
                ["النشطين", active, "#1E6FD9"],
                ["السحب الشهري", totalConsumption.toLocaleString(), "#D4A017"]].map(([label, val, c]) => (
                <div key={label} className="bg-white rounded-2xl p-3 shadow-sm border border-gray-100">
                  <div className="text-xs text-gray-500">{label}</div>
                  <div className="text-xl font-extrabold" style={{ color: c }}>{val}</div>
                </div>
              ))}
            </div>

            {/* بحث + إضافة */}
            <div className="flex gap-2">
              <input value={q} onChange={e => setQ(e.target.value)} placeholder="بحث بالاسم أو الجوال أو المدينة..."
                className="flex-1 bg-white border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-emerald-500" />
              <button onClick={() => setShowForm(!showForm)}
                className="bg-emerald-700 text-white rounded-xl px-4 py-2 text-sm font-bold hover:bg-emerald-800 transition whitespace-nowrap">
                {showForm ? "إغلاق" : "+ دهان جديد"}
              </button>
            </div>

            {/* نموذج الإضافة */}
            {showForm && (
              <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3">
                <div className="font-bold text-sm text-emerald-700">إضافة دهان جديد</div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <Inp label="الاسم" v={form.name} on={v => field("name", v)} />
                  <Inp label="رقم الجوال" v={form.phone} on={v => field("phone", v)} />
                  <Inp label="الجنسية" v={form.nationality} on={v => field("nationality", v)} />
                  <Sel label="المدينة" v={form.city} on={v => field("city", v)} opts={CITIES} />
                  <Sel label="نوع العمل" v={form.work_type} on={v => field("work_type", v)} opts={WORK_TYPES} />
                  <Sel label="الحالة" v={form.status} on={v => field("status", v)} opts={STATUSES} />
                  <Inp label="التقييم (1-5)" type="number" v={form.rating} on={v => field("rating", v)} />
                  <Inp label="السحب الشهري (ريال)" type="number" v={form.monthly_consumption} on={v => field("monthly_consumption", v)} />
                </div>
                <button onClick={addPainter} disabled={saving}
                  className="w-full bg-emerald-700 text-white rounded-xl py-2.5 text-sm font-bold hover:bg-emerald-800 transition disabled:opacity-50">
                  {saving ? "جاري الحفظ..." : "حفظ الدهان"}
                </button>
              </div>
            )}

            {/* الحالات */}
            {loading && <div className="text-center text-gray-500 py-10 text-sm">جاري تحميل البيانات من قاعدة البيانات...</div>}
            {error && <div className="bg-red-50 text-red-600 rounded-xl p-3 text-sm">{error}</div>}
            {!loading && !error && list.length === 0 && (
              <div className="text-center text-gray-500 py-10 text-sm">لا يوجد دهانون. اضغط "دهان جديد" لإضافة أول واحد.</div>
            )}

            {/* قائمة الدهانين */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              {list.map(p => (
                <div key={p.id} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                  <div className="flex items-start justify-between">
                    <div className="flex items-center gap-3">
                      <div className="w-11 h-11 rounded-full text-white font-extrabold flex items-center justify-center"
                        style={{ background: STATUS_COLORS[p.status] || "#00804A" }}>
                        {(p.name || "؟").trim()[0]}
                      </div>
                      <div>
                        <div className="font-bold text-sm">{p.name}</div>
                        <div className="text-xs text-gray-500">📞 {p.phone || "—"}</div>
                      </div>
                    </div>
                    <span className="text-xs font-bold px-2 py-0.5 rounded-full"
                      style={{ color: STATUS_COLORS[p.status] || "#666", background: (STATUS_COLORS[p.status] || "#666") + "18" }}>
                      {p.status}
                    </span>
                  </div>
                  <div className="flex flex-wrap gap-x-4 gap-y-1 text-xs text-gray-500 mt-3 border-t border-gray-100 pt-2">
                    <span>📍 {p.city}</span>
                    <span>{p.nationality}</span>
                    <span>{p.work_type}</span>
                    <span>💰 {Number(p.monthly_consumption || 0).toLocaleString()} ر.س</span>
                    <span><Stars n={p.rating || 0} /></span>
                  </div>
                </div>
              ))}
            </div>

            <div className="text-center text-xs text-gray-400 py-4">نظام الجزيرة الميداني • مربوط بقاعدة بيانات Supabase</div>
          </main>
        </div>
      );
    }

    function Inp({ label, v, on, type = "text" }) {
      return (
        <label className="block">
          <span className="text-xs text-gray-500">{label}</span>
          <input type={type} value={v} onChange={e => on(e.target.value)}
            className="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-emerald-500" />
        </label>
      );
    }

    function Sel({ label, v, on, opts }) {
      return (
        <label className="block">
          <span className="text-xs text-gray-500">{label}</span>
          <select value={v} onChange={e => on(e.target.value)}
            className="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-emerald-500">
            {opts.map(o => <option key={o} value={o}>{o}</option>)}
          </select>
        </label>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
