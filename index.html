<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام الجزيرة الميداني</title>
  <meta name="theme-color" content="#00804A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="الجزيرة الميداني" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2300804A'/%3E%3Ctext x='50' y='70' font-size='60' fill='white' text-anchor='middle' font-family='sans-serif' font-weight='bold'%3E%D8%AC%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style> body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f3f6f4; } </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    /* ===== إعدادات الربط بقاعدة البيانات ===== */
    const SUPABASE_URL = "https://pdjjlzmldrvhhurtulma.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6bwC9B-Q20VG09Bq6bUXow_6xq3qdGh";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const STATUS_COLORS = {
      "نشط":"#00804A","جديد":"#1E6FD9","متوقف":"#9A9A9A","منافس":"#E2574C",
      "فرصة":"#1E6FD9","قيد المتابعة":"#D4A017","تم الفوز":"#00804A","تمت الخسارة":"#E2574C","مؤجل":"#9A9A9A",
    };
    const CITIES = ["الرياض","جدة","مكة","المدينة","الدمام","الخبر","أبها"];
    const WORK_TYPES = ["فردي","مؤسسة"];
    const PAINTER_STATUSES = ["نشط","جديد","متوقف","منافس"];
    const PROJECT_TYPES = ["فيلا","عمارة","مدرسة","مستشفى","مجمع تجاري","فندق","مبنى حكومي","استراحة"];
    const PROJECT_STATUSES = ["فرصة","قيد المتابعة","تم الفوز","تمت الخسارة","مؤجل"];

    /* ===== إعدادات الأقسام ===== */
    const CONFIG = {
      painters: {
        table: "painters", title: "الدهانون", statusField: "status",
        fields: [
          { key:"name", label:"الاسم", type:"text" },
          { key:"phone", label:"رقم الجوال", type:"text" },
          { key:"nationality", label:"الجنسية", type:"text" },
          { key:"city", label:"المدينة", type:"select", opts:CITIES },
          { key:"work_type", label:"نوع العمل", type:"select", opts:WORK_TYPES },
          { key:"status", label:"الحالة", type:"select", opts:PAINTER_STATUSES },
          { key:"rating", label:"التقييم", type:"number" },
          { key:"monthly_consumption", label:"السحب الشهري", type:"number", suffix:" ر.س" },
        ],
        subtitle: r => `📞 ${r.phone || "—"} • 📍 ${r.city || "—"} • 💰 ${Number(r.monthly_consumption||0).toLocaleString()} ر.س`,
        kpis: rows => [
          ["إجمالي الدهانين", rows.length, "#00804A"],
          ["النشطين", rows.filter(r=>r.status==="نشط").length, "#1E6FD9"],
          ["السحب الشهري", rows.reduce((a,r)=>a+(Number(r.monthly_consumption)||0),0).toLocaleString(), "#D4A017"],
        ],
        addLabel: "+ دهان جديد",
      },
      projects: {
        table: "projects", title: "المشاريع", statusField: "status",
        fields: [
          { key:"name", label:"اسم المشروع", type:"text" },
          { key:"type", label:"النوع", type:"select", opts:PROJECT_TYPES },
          { key:"city", label:"المدينة", type:"select", opts:CITIES },
          { key:"owner", label:"المالك", type:"text" },
          { key:"contractor", label:"المقاول", type:"text" },
          { key:"painter", label:"الدهان المسؤول", type:"text" },
          { key:"stage", label:"المرحلة", type:"text" },
          { key:"status", label:"الحالة", type:"select", opts:PROJECT_STATUSES },
          { key:"value", label:"القيمة المتوقعة", type:"number", suffix:" ر.س" },
          { key:"win_prob", label:"نسبة الفوز %", type:"number", suffix:" %" },
          { key:"notes", label:"ملاحظات", type:"text" },
        ],
        subtitle: r => `${r.type || "—"} • 📍 ${r.city || "—"} • 👷 ${r.painter || "—"}`,
        kpis: rows => [
          ["إجمالي المشاريع", rows.length, "#00804A"],
          ["تم الفوز", rows.filter(r=>r.status==="تم الفوز").length, "#00804A"],
          ["قيمة المشاريع", rows.reduce((a,r)=>a+(Number(r.value)||0),0).toLocaleString(), "#D4A017"],
        ],
        addLabel: "+ مشروع جديد",
      },
    };

    function Stars({ n }) {
      return <span>{[1,2,3,4,5].map(i => <span key={i} style={{ color: i <= n ? "#D4A017" : "#d1d5db" }}>★</span>)}</span>;
    }
    function Badge({ status }) {
      if (!status) return null;
      const c = STATUS_COLORS[status] || "#666";
      return <span className="text-xs font-bold px-2 py-0.5 rounded-full" style={{ color: c, background: c + "18" }}>{status}</span>;
    }

    function Section({ cfg }) {
      const [rows, setRows] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");
      const [q, setQ] = useState("");
      const [view, setView] = useState("list");
      const [selId, setSelId] = useState(null);
      const [editor, setEditor] = useState(null);
      const [saving, setSaving] = useState(false);

      async function load() {
        setLoading(true); setError("");
        const { data, error } = await db.from(cfg.table).select("*").order("created_at", { ascending: false });
        if (error) setError("تعذّر تحميل البيانات: " + error.message);
        else setRows(data || []);
        setLoading(false);
      }
      useEffect(() => { load(); }, []);

      const selected = rows.find(r => r.id === selId) || null;

      function emptyData() {
        const d = {};
        cfg.fields.forEach(f => d[f.key] = f.type === "number" ? 0 : (f.type === "select" ? (f.opts[0] || "") : ""));
        return d;
      }
      function openAdd() { setEditor({ mode: "add", id: null, data: emptyData() }); }
      function openEdit(r) {
        const d = {};
        cfg.fields.forEach(f => d[f.key] = r[f.key] ?? (f.type === "number" ? 0 : ""));
        setEditor({ mode: "edit", id: r.id, data: d });
      }
      function setField(k, v) { setEditor(e => ({ ...e, data: { ...e.data, [k]: v } })); }

      async function save() {
        if (!String(editor.data[cfg.fields[0].key] || "").trim()) { alert("اكتب " + cfg.fields[0].label + " أولاً"); return; }
        setSaving(true);
        const payload = { ...editor.data };
        cfg.fields.forEach(f => { if (f.type === "number") payload[f.key] = Number(payload[f.key] || 0); });
        let res;
        if (editor.mode === "add") res = await db.from(cfg.table).insert([payload]);
        else res = await db.from(cfg.table).update(payload).eq("id", editor.id);
        setSaving(false);
        if (res.error) { alert("خطأ في الحفظ: " + res.error.message); return; }
        setEditor(null); await load();
      }
      async function remove(r) {
        if (!confirm("متأكد من الحذف؟")) return;
        const { error } = await db.from(cfg.table).delete().eq("id", r.id);
        if (error) { alert("خطأ في الحذف: " + error.message); return; }
        setView("list"); setSelId(null); load();
      }

      const list = rows.filter(r => q === "" || cfg.fields.some(f => String(r[f.key] || "").includes(q)));
      const kpis = cfg.kpis ? cfg.kpis(rows) : [];

      function fmt(f, v) {
        if (f.key === "rating") return <Stars n={Number(v) || 0} />;
        if (f.type === "number") return (Number(v) || 0).toLocaleString() + (f.suffix || "");
        return v || "—";
      }

      return (
        <div className="space-y-4">
          {/* تفاصيل */}
          {view === "detail" && selected && (
            <div className="space-y-4">
              <button onClick={() => { setView("list"); setSelId(null); }} className="text-sm font-bold text-emerald-700">→ رجوع للقائمة</button>
              <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                <div className="flex items-center gap-4">
                  <div className="w-16 h-16 rounded-2xl text-white font-extrabold text-2xl flex items-center justify-center" style={{ background: STATUS_COLORS[selected[cfg.statusField]] || "#00804A" }}>
                    {(selected[cfg.fields[0].key] || "؟").trim()[0]}
                  </div>
                  <div>
                    <h2 className="text-xl font-extrabold">{selected[cfg.fields[0].key]}</h2>
                    <div className="mt-1"><Badge status={selected[cfg.statusField]} /></div>
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-3 mt-4 text-sm">
                  {cfg.fields.slice(1).map(f => (
                    <div key={f.key} className="bg-gray-50 rounded-xl p-2.5">
                      <div className="text-xs text-gray-500">{f.label}</div>
                      <div className="font-bold">{fmt(f, selected[f.key])}</div>
                    </div>
                  ))}
                </div>
                <div className="flex gap-2 mt-4">
                  <button onClick={() => openEdit(selected)} className="flex-1 bg-emerald-700 text-white rounded-xl py-2.5 text-sm font-bold hover:bg-emerald-800">✏️ تعديل</button>
                  <button onClick={() => remove(selected)} className="flex-1 bg-red-50 text-red-600 rounded-xl py-2.5 text-sm font-bold hover:bg-red-100">🗑️ حذف</button>
                </div>
              </div>
            </div>
          )}

          {/* قائمة */}
          {view === "list" && (
            <>
              <div className="grid grid-cols-3 gap-3">
                {kpis.map(([label, val, c]) => (
                  <div key={label} className="bg-white rounded-2xl p-3 shadow-sm border border-gray-100">
                    <div className="text-xs text-gray-500">{label}</div>
                    <div className="text-lg font-extrabold" style={{ color: c }}>{val}</div>
                  </div>
                ))}
              </div>
              <div className="flex gap-2">
                <input value={q} onChange={e => setQ(e.target.value)} placeholder="بحث..."
                  className="flex-1 bg-white border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-emerald-500" />
                <button onClick={openAdd} className="bg-emerald-700 text-white rounded-xl px-4 py-2 text-sm font-bold hover:bg-emerald-800 whitespace-nowrap">{cfg.addLabel}</button>
              </div>
              {loading && <div className="text-center text-gray-500 py-10 text-sm">جاري التحميل...</div>}
              {error && <div className="bg-red-50 text-red-600 rounded-xl p-3 text-sm">{error}</div>}
              {!loading && !error && list.length === 0 && <div className="text-center text-gray-500 py-10 text-sm">لا توجد بيانات. اضغط زر الإضافة.</div>}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {list.map(r => (
                  <button key={r.id} onClick={() => { setSelId(r.id); setView("detail"); }}
                    className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-right hover:border-emerald-300 hover:shadow transition">
                    <div className="flex items-start justify-between">
                      <div className="flex items-center gap-3">
                        <div className="w-11 h-11 rounded-full text-white font-extrabold flex items-center justify-center" style={{ background: STATUS_COLORS[r[cfg.statusField]] || "#00804A" }}>
                          {(r[cfg.fields[0].key] || "؟").trim()[0]}
                        </div>
                        <div className="font-bold text-sm">{r[cfg.fields[0].key]}</div>
                      </div>
                      <Badge status={r[cfg.statusField]} />
                    </div>
                    <div className="text-xs text-gray-500 mt-3 border-t border-gray-100 pt-2">{cfg.subtitle(r)}</div>
                  </button>
                ))}
              </div>
            </>
          )}

          {/* نافذة الإضافة/التعديل */}
          {editor && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-3" onClick={() => setEditor(null)}>
              <div dir="rtl" onClick={e => e.stopPropagation()} className="bg-white rounded-2xl p-4 w-full max-w-md max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between mb-3">
                  <div className="font-bold text-emerald-700">{editor.mode === "add" ? "إضافة جديد" : "تعديل"}</div>
                  <button onClick={() => setEditor(null)} className="text-gray-400 text-xl leading-none">✕</button>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {cfg.fields.map(f => f.type === "select" ? (
                    <Sel key={f.key} label={f.label} v={editor.data[f.key]} on={v => setField(f.key, v)} opts={f.opts} />
                  ) : (
                    <Inp key={f.key} label={f.label} type={f.type === "number" ? "number" : "text"} v={editor.data[f.key]} on={v => setField(f.key, v)} />
                  ))}
                </div>
                <button onClick={save} disabled={saving} className="w-full bg-emerald-700 text-white rounded-xl py-2.5 text-sm font-bold hover:bg-emerald-800 mt-3 disabled:opacity-50">
                  {saving ? "جاري الحفظ..." : "حفظ"}
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function Inp({ label, v, on, type = "text" }) {
      return (
        <label className="block">
          <span className="text-xs text-gray-500">{label}</span>
          <input type={type} value={v} onChange={e => on(e.target.value)}
            className="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-emerald-500" />
        </label>
      );
    }
    function Sel({ label, v, on, opts }) {
      return (
        <label className="block">
          <span className="text-xs text-gray-500">{label}</span>
          <select value={v} onChange={e => on(e.target.value)}
            className="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-emerald-500">
            {opts.map(o => <option key={o} value={o}>{o}</option>)}
          </select>
        </label>
      );
    }

    function App() {
      const [tab, setTab] = useState("painters");
      return (
        <div className="min-h-screen text-gray-800">
          <header className="text-white px-4 pt-4 pb-2 shadow-md" style={{ background: "linear-gradient(135deg,#00804A,#005c35)" }}>
            <div className="max-w-3xl mx-auto">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-white/15 border border-white/20 flex items-center justify-center font-extrabold text-lg">ج</div>
                <div>
                  <div className="font-extrabold leading-tight">نظام الجزيرة الميداني</div>
                  <div className="text-xs text-emerald-100">{CONFIG[tab].title}</div>
                </div>
              </div>
              <div className="flex gap-2 mt-3">
                {Object.keys(CONFIG).map(k => (
                  <button key={k} onClick={() => setTab(k)}
                    className={"px-4 py-1.5 rounded-t-xl text-sm font-bold transition " + (tab === k ? "bg-[#f3f6f4] text-emerald-800" : "bg-white/10 text-white hover:bg-white/20")}>
                    {CONFIG[k].title}
                  </button>
                ))}
              </div>
            </div>
          </header>
          <main className="max-w-3xl mx-auto p-4">
            <Section key={tab} cfg={CONFIG[tab]} />
            <div className="text-center text-xs text-gray-400 py-4">نظام الجزيرة الميداني • مربوط بقاعدة بيانات Supabase</div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
