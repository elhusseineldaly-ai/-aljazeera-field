<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام الجزيرة الميداني</title>
  <meta name="theme-color" content="#00804A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="الجزيرة الميداني" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2300804A'/%3E%3Ctext x='50' y='70' font-size='60' fill='white' text-anchor='middle' font-family='sans-serif' font-weight='bold'%3E%D8%AC%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style> body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f3f6f4; } </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = "https://pdjjlzmldrvhhurtulma.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6bwC9B-Q20VG09Bq6bUXow_6xq3qdGh";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const STATUS_COLORS = {
      "نشط":"#00804A","جديد":"#1E6FD9","متوقف":"#9A9A9A","منافس":"#E2574C",
      "فرصة":"#1E6FD9","قيد المتابعة":"#D4A017","تم الفوز":"#00804A","تمت الخسارة":"#E2574C","مؤجل":"#9A9A9A",
      "دهان":"#00804A","مشروع":"#D4A017","معرض":"#7C5CBF","مقاول":"#5B8C5A","استشاري":"#1E6FD9",
    };
    const CITIES = ["الرياض","جدة","مكة","المدينة","الدمام","الخبر","أبها"];
    const WORK_TYPES = ["فردي","مؤسسة"];
    const PAINTER_STATUSES = ["نشط","جديد","متوقف","منافس"];
    const PROJECT_TYPES = ["فيلا","عمارة","مدرسة","مستشفى","مجمع تجاري","فندق","مبنى حكومي","استراحة"];
    const PROJECT_STATUSES = ["فرصة","قيد المتابعة","تم الفوز","تمت الخسارة","مؤجل"];
    const VISIT_TYPES = ["دهان","مشروع","معرض","مقاول","استشاري","منافس"];

    const CONFIG = {
      painters: {
        table:"painters", title:"الدهانون", statusField:"status",
        fields:[
          { key:"name", label:"الاسم", type:"text" },
          { key:"phone", label:"رقم الجوال", type:"text" },
          { key:"nationality", label:"الجنسية", type:"text" },
          { key:"city", label:"المدينة", type:"select", opts:CITIES },
          { key:"work_type", label:"نوع العمل", type:"select", opts:WORK_TYPES },
          { key:"status", label:"الحالة", type:"select", opts:PAINTER_STATUSES },
          { key:"rating", label:"التقييم", type:"number" },
          { key:"monthly_consumption", label:"السحب الشهري", type:"number", suffix:" ر.س" },
        ],
        subtitle: r => `📞 ${r.phone||"—"} • 📍 ${r.city||"—"} • 💰 ${Number(r.monthly_consumption||0).toLocaleString()} ر.س`,
        kpis: rows => [["إجمالي الدهانين",rows.length,"#00804A"],["النشطين",rows.filter(r=>r.status==="نشط").length,"#1E6FD9"],["السحب الشهري",rows.reduce((a,r)=>a+(Number(r.monthly_consumption)||0),0).toLocaleString(),"#D4A017"]],
        addLabel:"+ دهان جديد",
      },
      projects: {
        table:"projects", title:"المشاريع", statusField:"status",
        fields:[
          { key:"name", label:"اسم المشروع", type:"text" },
          { key:"type", label:"النوع", type:"select", opts:PROJECT_TYPES },
          { key:"city", label:"المدينة", type:"select", opts:CITIES },
          { key:"owner", label:"المالك", type:"text" },
          { key:"contractor", label:"المقاول", type:"text" },
          { key:"painter", label:"الدهان المسؤول", type:"text" },
          { key:"stage", label:"المرحلة", type:"text" },
          { key:"status", label:"الحالة", type:"select", opts:PROJECT_STATUSES },
          { key:"value", label:"القيمة المتوقعة", type:"number", suffix:" ر.س" },
          { key:"win_prob", label:"نسبة الفوز %", type:"number", suffix:" %" },
          { key:"notes", label:"ملاحظات", type:"text" },
        ],
        subtitle: r => `${r.type||"—"} • 📍 ${r.city||"—"} • 👷 ${r.painter||"—"}`,
        kpis: rows => [["إجمالي المشاريع",rows.length,"#00804A"],["تم الفوز",rows.filter(r=>r.status==="تم الفوز").length,"#00804A"],["قيمة المشاريع",rows.reduce((a,r)=>a+(Number(r.value)||0),0).toLocaleString(),"#D4A017"]],
        addLabel:"+ مشروع جديد",
      },
      contractors: {
        table:"contractors", title:"المقاولون", statusField:null,
        fields:[
          { key:"name", label:"اسم المقاول", type:"text" },
          { key:"contact", label:"الشخص المسؤول", type:"text" },
          { key:"phone", label:"رقم الجوال", type:"text" },
          { key:"city", label:"المدينة", type:"select", opts:CITIES },
          { key:"projects_count", label:"عدد المشاريع", type:"number" },
          { key:"fav_competitor", label:"المنافس المفضّل", type:"text" },
          { key:"rating", label:"التقييم", type:"number" },
          { key:"notes", label:"ملاحظات", type:"text" },
        ],
        subtitle: r => `👤 ${r.contact||"—"} • 📞 ${r.phone||"—"} • 📍 ${r.city||"—"}`,
        kpis: rows => [["إجمالي المقاولين",rows.length,"#5B8C5A"],["إجمالي المشاريع",rows.reduce((a,r)=>a+(Number(r.projects_count)||0),0),"#D4A017"],["يفضّل منافساً",rows.filter(r=>r.fav_competitor&&r.fav_competitor!=="-").length,"#E2574C"]],
        addLabel:"+ مقاول جديد",
      },
      visits: {
        table:"visits", title:"الزيارات", statusField:"type",
        fields:[
          { key:"target", label:"الجهة / الاسم", type:"text" },
          { key:"type", label:"نوع الزيارة", type:"select", opts:VISIT_TYPES },
          { key:"date", label:"التاريخ", type:"date" },
          { key:"location", label:"الموقع", type:"text" },
          { key:"goals", label:"الهدف", type:"text" },
          { key:"results", label:"النتيجة", type:"text" },
        ],
        subtitle: r => `${r.type||"—"} • 📅 ${r.date||"—"} • 📍 ${r.location||"—"}`,
        kpis: rows => [["إجمالي الزيارات",rows.length,"#7C5CBF"],["زيارات دهانين",rows.filter(r=>r.type==="دهان").length,"#00804A"],["زيارات مشاريع",rows.filter(r=>r.type==="مشروع").length,"#D4A017"]],
        addLabel:"+ زيارة جديدة",
      },
    };

    function Stars({ n }) { return <span>{[1,2,3,4,5].map(i => <span key={i} style={{ color: i <= n ? "#D4A017" : "#d1d5db" }}>★</span>)}</span>; }
    function Badge({ status }) {
      if (!status) return null;
      const c = STATUS_COLORS[status] || "#666";
      return <span className="text-xs font-bold px-2 py-0.5 rounded-full" style={{ color: c, background: c + "18" }}>{status}</span>;
    }
    function Bars({ data }) {
      const max = Math.max(1, ...data.map(d => d.value));
      return (<div className="space-y-2">{data.map(d => (
        <div key={d.label} className="text-xs">
          <div className="flex justify-between mb-0.5"><span>{d.label}</span><span className="font-bold">{Number(d.value).toLocaleString()}</span></div>
          <div className="h-2.5 bg-gray-100 rounded-full overflow-hidden"><div className="h-2.5 rounded-full" style={{ width: (d.value/max*100)+"%", background: d.color||"#00804A" }} /></div>
        </div>))}</div>);
    }
    function KpiCard({ label, value, color }) {
      return (<div className="bg-white rounded-2xl p-3 shadow-sm border border-gray-100"><div className="text-xs text-gray-500">{label}</div><div className="text-lg font-extrabold" style={{ color }}>{value}</div></div>);
    }

    function exportCSV(cfg, rows) {
      const headers = cfg.fields.map(f => f.label);
      const lines = rows.map(r => cfg.fields.map(f => '"' + String(r[f.key] ?? "").replace(/"/g, '""') + '"').join(","));
      const csv = "\uFEFF" + [headers.join(","), ...lines].join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = cfg.title + ".csv";
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function Dashboard() {
      const [d, setD] = useState({ painters: [], projects: [], contractors: [], visits: [] });
      const [loading, setLoading] = useState(true);
      useEffect(() => { (async () => {
        setLoading(true);
        const [p, pr, c, v] = await Promise.all([
          db.from("painters").select("*"), db.from("projects").select("*"),
          db.from("contractors").select("*"), db.from("visits").select("*"),
        ]);
        setD({ painters: p.data || [], projects: pr.data || [], contractors: c.data || [], visits: v.data || [] });
        setLoading(false);
      })(); }, []);
      if (loading) return <div className="text-center text-gray-500 py-10 text-sm">جاري تحميل اللوحة...</div>;

      const { painters, projects, contractors, visits } = d;
      const totalConsumption = painters.reduce((a, p) => a + (Number(p.monthly_consumption) || 0), 0);
      const totalValue = projects.reduce((a, p) => a + (Number(p.value) || 0), 0);
      const weighted = projects.reduce((a, p) => a + (Number(p.value) || 0) * (Number(p.win_prob) || 0) / 100, 0);
      const group = (arr, key) => { const m = {}; arr.forEach(x => { const k = x[key] || "غير محدد"; m[k] = (m[k] || 0) + 1; }); return Object.entries(m).map(([label, value]) => ({ label, value })); };
      const byCity = group(painters, "city").sort((a, b) => b.value - a.value);
      const byProjStatus = group(projects, "status").map(x => ({ ...x, color: STATUS_COLORS[x.label] || "#00804A" }));
      const topPainters = [...painters].sort((a, b) => (b.monthly_consumption || 0) - (a.monthly_consumption || 0)).slice(0, 5);

      return (
        <div className="space-y-4">
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <KpiCard label="الدهانون" value={painters.length} color="#00804A" />
            <KpiCard label="النشطين" value={painters.filter(p => p.status === "نشط").length} color="#1E6FD9" />
            <KpiCard label="المشاريع" value={projects.length} color="#D4A017" />
            <KpiCard label="مكتسبة" value={projects.filter(p => p.status === "تم الفوز").length} color="#16B3AC" />
            <KpiCard label="المقاولون" value={contractors.length} color="#5B8C5A" />
            <KpiCard label="الزيارات" value={visits.length} color="#7C5CBF" />
            <KpiCard label="السحب الشهري" value={totalConsumption.toLocaleString()} color="#D4A017" />
            <KpiCard label="قيمة المشاريع" value={totalValue.toLocaleString()} color="#7C5CBF" />
          </div>
          <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
            <div className="text-sm font-bold mb-1">💰 القيمة المرجّحة للفرص</div>
            <div className="text-2xl font-extrabold text-emerald-700">{Math.round(weighted).toLocaleString()} ر.س</div>
            <div className="text-xs text-gray-500">قيمة المشاريع × نسبة الفوز المتوقعة</div>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100"><div className="text-sm font-bold mb-3">الدهانون حسب المدينة</div>{byCity.length ? <Bars data={byCity} /> : <div className="text-xs text-gray-400">لا توجد بيانات</div>}</div>
            <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100"><div className="text-sm font-bold mb-3">المشاريع حسب الحالة</div>{byProjStatus.length ? <Bars data={byProjStatus} /> : <div className="text-xs text-gray-400">لا توجد بيانات</div>}</div>
          </div>
          <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
            <div className="text-sm font-bold mb-3">🏆 أعلى 5 دهانين في السحب الشهري</div>
            <div className="space-y-2">
              {topPainters.map((p, i) => (
                <div key={p.id} className="flex items-center justify-between text-sm border-b border-gray-50 pb-1.5">
                  <span className="flex items-center gap-2"><span className="w-6 h-6 rounded-full bg-emerald-700 text-white text-xs font-bold flex items-center justify-center">{i + 1}</span>{p.name}</span>
                  <span className="font-bold text-emerald-700">{Number(p.monthly_consumption || 0).toLocaleString()} ر.س</span>
                </div>
              ))}
              {topPainters.length === 0 && <div className="text-xs text-gray-400">لا توجد بيانات</div>}
            </div>
          </div>
        </div>
      );
    }

    function Section({ cfg }) {
      const [rows, setRows] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");
      const [q, setQ] = useState("");
      const [view, setView] = useState("list");
      const [selId, setSelId] = useState(null);
      const [editor, setEditor] = useState(null);
      const [saving, setSaving] = useState(false);

      async function load() {
        setLoading(true); setError("");
        const { data, error } = await db.from(cfg.table).select("*").order("created_at", { ascending: false });
        if (error) setError("تعذّر تحميل البيانات: " + error.message);
        else setRows(data || []);
        setLoading(false);
      }
      useEffect(() => { load(); }, []);

      const selected = rows.find(r => r.id === selId) || null;
      function emptyData() { const o = {}; cfg.fields.forEach(f => o[f.key] = f.type === "number" ? 0 : (f.type === "select" ? (f.opts[0] || "") : "")); return o; }
      function openAdd() { setEditor({ mode: "add", id: null, data: emptyData() }); }
      function openEdit(r) { const o = {}; cfg.fields.forEach(f => o[f.key] = r[f.key] ?? (f.type === "number" ? 0 : "")); setEditor({ mode: "edit", id: r.id, data: o }); }
      function setField(k, v) { setEditor(e => ({ ...e, data: { ...e.data, [k]: v } })); }

      async function save() {
        if (!String(editor.data[cfg.fields[0].key] || "").trim()) { alert("اكتب " + cfg.fields[0].label + " أولاً"); return; }
        setSaving(true);
        const payload = { ...editor.data };
        cfg.fields.forEach(f => {
          if (f.type === "number") payload[f.key] = Number(payload[f.key] || 0);
          if (f.type === "date" && !payload[f.key]) payload[f.key] = null;
        });
        let res;
        if (editor.mode === "add") res = await db.from(cfg.table).insert([payload]);
        else res = await db.from(cfg.table).update(payload).eq("id", editor.id);
        setSaving(false);
        if (res.error) { alert("خطأ في الحفظ: " + res.error.message); return; }
        setEditor(null); await load();
      }
      async function remove(r) {
        if (!confirm("متأكد من الحذف؟")) return;
        const { error } = await db.from(cfg.table).delete().eq("id", r.id);
        if (error) { alert("خطأ في الحذف: " + error.message); return; }
        setView("list"); setSelId(null); load();
      }

      const list = rows.filter(r => q === "" || cfg.fields.some(f => String(r[f.key] || "").includes(q)));
      const kpis = cfg.kpis ? cfg.kpis(rows) : [];
      const inputType = f => f.type === "number" ? "number" : f.type === "date" ? "date" : "text";
      function fmt(f, v) {
        if (f.key === "rating") return <Stars n={Number(v) || 0} />;
        if (f.type === "number") return (Number(v) || 0).toLocaleString() + (f.suffix || "");
        return v || "—";
      }

      return (
        <div className="space-y-4">
          {view === "detail" && selected && (
            <div className="space-y-4">
              <button onClick={() => { setView("list"); setSelId(null); }} className="text-sm font-bold text-emerald-700">→ رجوع للقائمة</button>
              <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                <div className="flex items-center gap-4">
                  <div className="w-16 h-16 rounded-2xl text-white font-extrabold text-2xl flex items-center justify-center" style={{ background: STATUS_COLORS[selected[cfg.statusField]] || "#00804A" }}>{(selected[cfg.fields[0].key] || "؟").trim()[0]}</div>
                  <div><h2 className="text-xl font-extrabold">{selected[cfg.fields[0].key]}</h2><div className="mt-1"><Badge status={cfg.statusField ? selected[cfg.statusField] : null} /></div></div>
                </div>
                <div className="grid grid-cols-2 gap-3 mt-4 text-sm">
                  {cfg.fields.slice(1).map(f => (<div key={f.key} className="bg-gray-50 rounded-xl p-2.5"><div className="text-xs text-gray-500">{f.label}</div><div className="font-bold break-words">{fmt(f, selected[f.key])}</div></div>))}
                </div>
                <div className="flex gap-2 mt-4">
                  <button onClick={() => openEdit(selected)} className="flex-1 bg-emerald-700 text-white rounded-xl py-2.5 text-sm font-bold hover:bg-emerald-800">✏️ تعديل</button>
                  <button onClick={() => remove(selected)} className="flex-1 bg-red-50 text-red-600 rounded-xl py-2.5 text-sm font-bold hover:bg-red-100">🗑️ حذف</button>
                </div>
              </div>
            </div>
          )}

          {view === "list" && (
            <>
              <div className="grid grid-cols-3 gap-3">{kpis.map(([label, val, c]) => <KpiCard key={label} label={label} value={val} color={c} />)}</div>
              <input value={q} onChange={e => setQ(e.target.value)} placeholder="بحث..." className="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-emerald-500" />
              <div className="flex gap-2">
                <button onClick={openAdd} className="flex-1 bg-emerald-700 text-white rounded-xl px-4 py-2 text-sm font-bold hover:bg-emerald-800">{cfg.addLabel}</button>
                <button onClick={() => exportCSV(cfg, rows)} className="px-3 py-2 bg-white border border-gray-200 rounded-xl text-sm font-bold text-emerald-700 hover:bg-emerald-50 whitespace-nowrap">⬇️ تصدير</button>
              </div>
              {loading && <div className="text-center text-gray-500 py-10 text-sm">جاري التحميل...</div>}
              {error && <div className="bg-red-50 text-red-600 rounded-xl p-3 text-sm">{error}</div>}
              {!loading && !error && list.length === 0 && <div className="text-center text-gray-500 py-10 text-sm">لا توجد بيانات. اضغط زر الإضافة.</div>}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {list.map(r => (
                  <button key={r.id} onClick={() => { setSelId(r.id); setView("detail"); }} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-right hover:border-emerald-300 hover:shadow transition">
                    <div className="flex items-start justify-between">
                      <div className="flex items-center gap-3">
                        <div className="w-11 h-11 rounded-full text-white font-extrabold flex items-center justify-center" style={{ background: STATUS_COLORS[r[cfg.statusField]] || "#00804A" }}>{(r[cfg.fields[0].key] || "؟").trim()[0]}</div>
                        <div className="font-bold text-sm">{r[cfg.fields[0].key]}</div>
                      </div>
                      <Badge status={cfg.statusField ? r[cfg.statusField] : null} />
                    </div>
                    <div className="text-xs text-gray-500 mt-3 border-t border-gray-100 pt-2 break-words">{cfg.subtitle(r)}</div>
                  </button>
                ))}
              </div>
            </>
          )}

          {editor && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-3" onClick={() => setEditor(null)}>
              <div dir="rtl" onClick={e => e.stopPropagation()} className="bg-white rounded-2xl p-4 w-full max-w-md max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between mb-3"><div className="font-bold text-emerald-700">{editor.mode === "add" ? "إضافة جديد" : "تعديل"}</div><button onClick={() => setEditor(null)} className="text-gray-400 text-xl leading-none">✕</button></div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {cfg.fields.map(f => f.type === "select"
                    ? <Sel key={f.key} label={f.label} v={editor.data[f.key]} on={v => setField(f.key, v)} opts={f.opts} />
                    : <Inp key={f.key} label={f.label} type={inputType(f)} v={editor.data[f.key]} on={v => setField(f.key, v)} />)}
                </div>
                <button onClick={save} disabled={saving} className="w-full bg-emerald-700 text-white rounded-xl py-2.5 text-sm font-bold hover:bg-emerald-800 mt-3 disabled:opacity-50">{saving ? "جاري الحفظ..." : "حفظ"}</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function Inp({ label, v, on, type = "text" }) {
      return (<label className="block"><span className="text-xs text-gray-500">{label}</span><input type={type} value={v} onChange={e => on(e.target.value)} className="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-emerald-500" /></label>);
    }
    function Sel({ label, v, on, opts }) {
      return (<label className="block"><span className="text-xs text-gray-500">{label}</span><select value={v} onChange={e => on(e.target.value)} className="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-emerald-500">{opts.map(o => <option key={o} value={o}>{o}</option>)}</select></label>);
    }

    const TABS = [["dashboard","اللوحة"],["painters","الدهانون"],["projects","المشاريع"],["contractors","المقاولون"],["visits","الزيارات"]];
    const TITLES = { dashboard:"اللوحة الرئيسية", painters:"الدهانون", projects:"المشاريع", contractors:"المقاولون", visits:"الزيارات" };

    function App() {
      const [tab, setTab] = useState("dashboard");
      return (
        <div className="min-h-screen text-gray-800">
          <header className="text-white px-4 pt-4 pb-2 shadow-md" style={{ background: "linear-gradient(135deg,#00804A,#005c35)" }}>
            <div className="max-w-3xl mx-auto">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-white/15 border border-white/20 flex items-center justify-center font-extrabold text-lg">ج</div>
                <div><div className="font-extrabold leading-tight">نظام الجزيرة الميداني</div><div className="text-xs text-emerald-100">{TITLES[tab]}</div></div>
              </div>
              <div className="flex gap-2 mt-3 overflow-x-auto">
                {TABS.map(([k, label]) => (
                  <button key={k} onClick={() => setTab(k)} className={"px-4 py-1.5 rounded-t-xl text-sm font-bold transition whitespace-nowrap shrink-0 " + (tab === k ? "bg-[#f3f6f4] text-emerald-800" : "bg-white/10 text-white hover:bg-white/20")}>{label}</button>
                ))}
              </div>
            </div>
          </header>
          <main className="max-w-3xl mx-auto p-4">
            {tab === "dashboard" ? <Dashboard key="dash" /> : <Section key={tab} cfg={CONFIG[tab]} />}
            <div className="text-center text-xs text-gray-400 py-4">نظام الجزيرة الميداني • مربوط بقاعدة بيانات Supabase</div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
