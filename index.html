      const removeAt=i=>on(encodeFindings(findings.filter((_,j)=>j!==i)));
      const companies=[...new Set((fam.items||[]).map(it=>it.c))];
      let prods=(fam.items||[]).filter(it=>(!comp||it.c===comp));
      if(qq.trim()) prods=prods.filter(it=>(it.p+" "+it.c).includes(qq.trim()));

        </div>

          <div className="inset p-2.5 mb-3">

        <div className="rail">
          {CATALOG.map(fm=>{ const on_=fam.id===fm.id; const fc=famColor(fm);
            return (<button type="button" key={fm.id} onClick={()=>{setFam(fm);setComp(null);}}
              aria-pressed={on_}
              className={"btn btn-sm "+(on_?"":"btn-ghost")}
              style={on_?{background:`color-mix(in srgb, ${fc} 13%, transparent)`,color:fc,borderColor:`color-mix(in srgb, ${fc} 32%, transparent)`}:{}}>
              <Icon n={fm.icon} s={13}/>{fm.family}</button>);})}

        {/* \u0627\u0644\u0634\u0631\u0643\u0627\u062a */}
        <div className="flex flex-wrap gap-1.5 mt-2.5">
          <button type="button" onClick={()=>setComp(null)} aria-pressed={!comp}
            className={"btn btn-sm "+(!comp?"btn-primary":"btn-ghost")}>\u0627\u0644\u0643\u0644</button>
          {companies.map(c=>{ const on_=comp===c, col=companyColor(c);
            return (<button type="button" key={c} onClick={()=>setComp(on_?null:c)} aria-pressed={on_}

              style={{color:col,background:`color-mix(in srgb, ${col} ${on_?20:9}%, transparent)`,
                      borderColor:`color-mix(in srgb, ${col} ${on_?55:20}%, transparent)`,
                      fontWeight:isOwn(c)?600:500}}>{c}</button>);})}
        </div>

        {/* \u0627\u0644\u0645\u0646\u062a\u062c\u0627\u062a */}
        <div className="grid grid-cols-2 lg:grid-cols-3 gap-1.5 mt-2.5 max-h-56 overflow-y-auto pl-1">
          {prods.map((it,k)=>{ const on_=findings.some(x=>x.c===it.c&&x.p===it.p); const col=companyColor(it.c);
            return (<button type="button" key={k} onClick={()=>add(it.c,it.p)} disabled={on_}
              className={"tap text-right rounded-[8px] px-2.5 py-2 t-2xs leading-snug border transition press "+(on_?"cursor-default":"")}
              style={{background:on_?`color-mix(in srgb, ${col} 14%, transparent)`:"var(--surface-2)",
                      color:on_?col:"var(--ink)",
                      borderColor:on_?`color-mix(in srgb, ${col} 34%, transparent)`:"var(--line)"}}>
              <span className="flex items-center justify-between gap-1">
                <span className="t-chip truncate" style={{color:col,opacity:on_?.8:.75}}>{it.c}</span>
                {on_&&<Icon n="check" s={11}/>}
              </span>
              <span className="block truncate">{it.p}</span></button>);})}
          {prods.length===0&&<div className="col-span-full text-center t-2xs txt-dim py-4">\u0644\u0627 \u0645\u0646\u062a\u062c\u0627\u062a \u0645\u0637\u0627\u0628\u0642\u0629</div>}
        </div>
      </div>);

    function exportCSV(cfg, rows) {
      const headers=cfg.fields.map(f=>f.label);
      const lines=rows.map(r=>cfg.fields.map(f=>'"'+String(Array.isArray(r[f.key])?toArr(r[f.key]).length+" صورة":(r[f.key]??"")).replace(/"/g,'""')+'"').join(","));
      const csv="\uFEFF"+[headers.join(","),...lines].join("\n");
      const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=cfg.title+".csv"; a.click(); URL.revokeObjectURL(a.href);
    }

    /* ===== أدوات تصدير عامة لصفحات التقارير (CSV / Excel حقيقي عبر SheetJS) ===== */
    function exportRowsCSV(filename, headers, rows){
      const esc=v=>'"'+String(v??"—").replace(/"/g,'""')+'"';
      const csv="\uFEFF"+[headers.map(esc).join(","),...rows.map(r=>r.map(esc).join(","))].join("\n");
      const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename+".csv"; a.click(); URL.revokeObjectURL(a.href);
    }
    function exportRowsXLSX(filename, sheetName, headers, rows){
      try{
        const ws=XLSX.utils.aoa_to_sheet([headers, ...rows.map(r=>r.map(c=>c==null?"—":c))]);
        ws["!cols"]=headers.map((h,i)=>({ wch: Math.min(40, Math.max(10, String(h).length+2, ...rows.map(r=>String(r[i]??"").length+2))) }));
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0,31));
        XLSX.writeFile(wb, filename+".xlsx");
      }catch(e){ toast("تعذّر إنشاء ملف Excel — جرّب تصدير CSV بدلاً منه","err"); }
    }
    /* تنسيق تاريخ/وقت موحّد للتقارير */
    function fmtDateTime(ts){ if(!ts) return "—"; const d=new Date(ts); if(isNaN(d.getTime())) return String(ts);
      return d.toLocaleDateString("ar-SA",{day:"2-digit",month:"2-digit",year:"numeric"})+" · "+d.toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"}); }
    function fmtTime(ts){ if(!ts) return "—"; const d=new Date(ts); if(isNaN(d.getTime())) return "—"; return d.toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"}); }

    /* «آخر ما دار بينكما» — أول ما يحتاجه المندوب وهو واقف أمام الدهان.
       كان مدفونًا أسفل الصفحة داخل سجل التفاعلات، فيبدأ كل لقاء من الصفر. */
    function LastTouch({ name, refreshKey }){
      const [x,setX]=useState(undefined);
      useEffect(()=>{ let dead=false;
        (async()=>{

      const gap = x ? daysAgo(x.date) : null;

      const cold = gap!=null && gap>14;

                <Icon n={INTERACTION_ICON[x.type]||"bolt"} s={15}/>

              <div className="min-w-0 flex-1">

                  <span className="t-2xs font-medium">{x.type}</span>
                  <span className="t-chip txt-dim tnum">{x.date}</span>

    /* ===== محاولة تحديث سجل الدهان بأمان (تتجاهل الأعمدة غير الموجودة) ===== */
    async function softUpdatePainter(name, patch){
      let body={...patch};
      for(let i=0;i<6;i++){
        const r=await db.from("painters").update(body).ilike("name",name);
        if(!r.error) return true;
        const m=(r.error.message||"")+" "+(r.error.details||"");
        const col=(m.match(/'([a-z_]+)' column/i)||m.match(/column "?([a-z_]+)"? of/i)||m.match(/column ([a-z_]+)/i)||[])[1];
        if(col && col in body){ delete body[col]; continue; }
        return false;
      }
      return false;
    }

    /* تحديث آمن بالمعرّف (id) لأي جدول — يتجاهل الأعمدة غير الموجودة ويعيد المحاولة بدل الفشل الصامت */
    async function softUpdateById(table, id, patch){
      let body={...patch};
      for(let i=0;i<6;i++){
        const r=await db.from(table).update(body).eq("id",id);
        if(!r.error) return { ok:true };
        const m=(r.error.message||"")+" "+(r.error.details||"");
        const col=(m.match(/'([a-z_]+)' column/i)||m.match(/column "?([a-z_]+)"? of/i)||m.match(/column ([a-z_]+)/i)||[])[1];
        if(col && col in body){ delete body[col]; continue; }
        return { ok:false, error:r.error };
      }
      return { ok:false, error:new Error("تعذّر التحديث بعد عدّة محاولات") };
    }

    /* ===== لوحة التفاعلات (مكالمات / واتساب / عروض أسعار / رسائل) لكل دهان ===== */
    function InteractionsPanel({ painterName, refreshKey }) {
      const [rows,setRows]=useState(null); const [error,setError]=useState("");
      async function load(){
        const { data, error } = await db.from("interactions").select("*").eq("painter",painterName).order("date",{ascending:false}).order("created_at",{ascending:false});
        if(error) setError("تعذّر تحميل التفاعلات: "+error.message); else setRows(data||[]);

      async function removeRow(r){ if(!await confirmDialog("سيُحذف هذا التفاعل من سجل الدهان نهائيًا.",{confirmLabel:"حذف التفاعل"})) return; await db.from("interactions").delete().eq("id",r.id); load(); }
      if(error) return <div className="t-2xs text-[color:var(--danger)]">{error}</div>;
      if(rows===null) return <div className={"t-2xs "+cMuted}>جاري تحميل التفاعلات...</div>;

      return (

          {rows.map(r=>(
            <div key={r.id} className={"flex items-start gap-3 rounded-xl p-3 "+cTrack}>
              <div className="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 text-white" style={{background:STATUS_COLORS[r.type]||tok("neutral")}}>
                <Icon n={INTERACTION_ICON[r.type]||"bolt"} s={15}/>
              </div>
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2 flex-wrap">
                  <Pill text={r.type} color={STATUS_COLORS[r.type]}/>
                  <span className={"t-chip "+cMuted}>{r.date||""}</span>
                  {r.quote_amount?<span className="t-chip font-bold" style={{color:tok("accent")}}>{Number(r.quote_amount).toLocaleString()} ر.س</span>:null}
                </div>
                {r.notes?<div className="t-2xs mt-1 leading-relaxed break-words">{r.notes}</div>:null}
                {r.user_name?<div className={"t-chip mt-1 "+cMuted}>بواسطة: {r.user_name}</div>:null}
              </div>
              <button onClick={()=>removeRow(r)} className="shrink-0 btn-icon" style={{color:"var(--danger)",width:28,height:28}} aria-label="حذف التفاعل"><Icon n="trash" s={14}/></button>
            </div>
          ))}
        </div>
      );
    }

    function InteractionModal({ open, onClose, painterName, painterCity, onSaved }) {
      const dlgRef=useModalBehaviour(open, onClose);
      const [d,setD]=useState({type:"مكالمة",notes:"",quote_amount:"",date:TODAY()});
      const [saving,setSaving]=useState(false);
      useEffect(()=>{ if(open) setD({type:"مكالمة",notes:"",quote_amount:"",date:TODAY()}); },[open]);
      if(!open) return null;
      async function save(){
        setSaving(true);
        const payload={ painter:painterName, type:d.type, notes:d.notes||null, date:d.date||TODAY(), user_name:currentUserName(),
          ...(d.type==="عرض سعر" && d.quote_amount ? { quote_amount:Number(d.quote_amount) } : {}) };
        const { error } = await db.from("interactions").insert([payload]);
        if(error){ setSaving(false); toast("تعذّر حفظ التفاعل: "+error.message,"err"); return; }
        const patch={ last_interaction_date:d.date, last_interaction_type:d.type, last_contact:d.date, contact_method:d.type };
        if(d.type==="عرض سعر"){ patch.has_quote=true; patch.last_quote_date=d.date; }
        if(d.type==="زيارة ميدانية"){ patch.last_visit=d.date; }
        await softUpdatePainter(painterName, patch);
        // تسجيل "زيارة ميدانية" من هنا يُنشئ أيضاً زيارة مقابلة في قسم الزيارات الرئيسي حتى تبقى مصدراً واحداً للحقيقة
        if(d.type==="زيارة ميدانية"){
          try{
            await db.from("visits").insert([{ target:"زيارة "+painterName, type:"دهان", location:painterCity||null, date:d.date||TODAY(), painter:painterName, goals:d.notes||null, results:d.notes||null }]);
          }catch(e){ /* الحقل قد لا يكون متاحاً بعد */ }
        }
        logActivity("تفاعل", "painters", "تفاعل ("+d.type+")", painterName);
        setSaving(false); onSaved&&onSaved(); onClose();
      }
      return (
        <div role="dialog" aria-modal="true" className="sheet-shell" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
          <div dir="rtl" ref={dlgRef} tabIndex={-1} className="sheet-body" style={{maxWidth:480}}>
            <div className="sheet-head"><div className="font-semibold t-sm">تسجيل تفاعل جديد</div><button onClick={onClose} aria-label="إغلاق" className="btn-icon tap shrink-0"><Icon n="close" s={17}/></button></div>
            <div className="space-y-3">
              <Sel label="نوع التفاعل" v={d.type} on={v=>setD({...d,type:v})} opts={INTERACTION_TYPES}/>
              {d.type==="زيارة ميدانية"&&<div className={"t-chip rounded-lg px-3 py-2 "+cTrack+" "+cMuted}>سيتم إنشاء زيارة مقابلة تلقائياً في قسم "الزيارات" لهذا الدهان.</div>}
              {d.type==="عرض سعر"&&<Inp label="قيمة العرض (اختياري)" type="number" v={d.quote_amount} on={v=>setD({...d,quote_amount:v})}/>}
              <Inp label="التاريخ" type="date" v={d.date} on={v=>setD({...d,date:v})}/>
              <Inp label="ملاحظات" type="text" v={d.notes} on={v=>setD({...d,notes:v})}/>
            </div>
            <button onClick={save} disabled={saving} className="btn btn-primary btn-lg btn-block mt-6 press">{saving?<><Icon n="refresh" s={15} c="spin"/> جاري الحفظ...</>:<><Icon n="save" s={15}/> حفظ التفاعل</>}</button>
          </div>
        </div>
      );
    }

    /* ===== قسم عام ===== */
    function Section({ cfg, onGo, prefill, clearPrefill }) {
      const [rows,setRows]=useState([]); const [loading,setLoading]=useState(true); const [error,setError]=useState("");
      const [q,setQ]=useState(""); const [filters,setFilters]=useState({}); const [vmode,setVmode]=useState("cards");
      const [view,setView]=useState("list"); const [selId,setSelId]=useState(null);
      const [editor,setEditor]=useState(null); const [saving,setSaving]=useState(false); const [geoMsg,setGeoMsg]=useState("");
      /* Esc يغلق نافذة الإضافة/التعديل */
      useEffect(()=>{ if(!editor) return;
        const h=e=>{ if(e.key==="Escape" && !saving) setEditor(null); };
        window.addEventListener("keydown",h); return ()=>window.removeEventListener("keydown",h);
      },[editor,saving]);
      const [refOpts,setRefOpts]=useState({});
      const [quoteFilter,setQuoteFilter]=useState("الكل");
      const [showFilters,setShowFilters]=useState(false);
      const [showInteraction,setShowInteraction]=useState(false); const [interactionsKey,setInteractionsKey]=useState(0);

      async function load(){ setLoading(true);setError("");
        const {data,error}=await db.from(cfg.table).select("*").order("created_at",{ascending:false});
        if(error)setError("تعذّر تحميل البيانات: "+error.message); else setRows(data||[]); setLoading(false);
      }
      useEffect(()=>{ load();
        const refTables=[...new Set(cfg.fields.filter(f=>f.type==="ref"||f.type==="refs").map(f=>f.refTable))];
        refTables.forEach(async t=>{ const {data}=await db.from(t).select("name"); setRefOpts(o=>({...o,[t]:(data||[]).map(x=>x.name).filter(Boolean)})); });
      },[cfg.table]);

      /* فتح محرر مسبق التعبئة (الربط المباشر) */
      useEffect(()=>{ if(prefill){ openAdd(prefill); clearPrefill&&clearPrefill(); } },[prefill]);

      const selected=rows.find(r=>r.id===selId)||null;

      function openAdd(extra){ setEditor({mode:"add",id:null,data:emptyData(extra)}); setGeoMsg(""); }
      function openEdit(r){ const o={}; cfg.fields.forEach(f=>o[f.key]=f.type==="images"?toArr(r[f.key]):(r[f.key]??(f.type==="number"?0:""))); setEditor({mode:"edit",id:r.id,data:o}); setGeoMsg(""); }
      function setField(k,v){ setEditor(e=>({...e,data:{...e.data,[k]:v}})); }

      async function captureGeo(){ setGeoMsg("جاري تحديد الموقع..."); const g=await getGeo(); if(g){ setEditor(e=>({...e,data:{...e.data,lat:g.lat,lng:g.lng}})); setGeoMsg("تم تحديد الموقع ✓"); } else setGeoMsg("تعذّر تحديد الموقع"); }

      async function safeWrite(mode, table, payload, id){
        // يحاول الكتابة؛ ولو فشل بسبب عمود غير موجود يحذفه ويعيد المحاولة (مرونة مع اختلاف المخطط)
        let body={...payload}; for(let i=0;i<6;i++){
          const res = mode==="add" ? await db.from(table).insert([body]) : await db.from(table).update(body).eq("id",id);
          if(!res.error) return {ok:true};
          const m=(res.error.message||"")+" "+(res.error.details||"");
          const col=(m.match(/'([a-z_]+)' column/i)||m.match(/column "?([a-z_]+)"? of/i)||m.match(/column ([a-z_]+)/i)||[])[1];
          if(col && col in body){ delete body[col]; continue; }
          return {ok:false, error:res.error};
        }
        return {ok:false, error:{message:"تعذّر الحفظ بعد عدة محاولات"}};
      }
      async function save(){ if(!String(editor.data[cfg.fields[0].key]||"").trim()){ setEditor(e=>({...e,touched:true})); toast("اكتب "+cfg.fields[0].label+" أولاً","warn"); return; }
        setSaving(true); const payload={...editor.data};
        cfg.fields.forEach(f=>{ if(f.type==="number")payload[f.key]=Number(payload[f.key]||0); if(f.type==="date"&&!payload[f.key])payload[f.key]=null; });
        // التقاط GPS تلقائياً عند الإضافة للأقسام الميدانية
        if(cfg.geo && editor.mode==="add" && payload.lat==null){ const g=await getGeo(); if(g){ payload.lat=g.lat; payload.lng=g.lng; } }
        const res=await safeWrite(editor.mode, cfg.table, payload, editor.id);
        setSaving(false); if(!res.ok){toast("تعذّر الحفظ: "+res.error.message,"err");return;}
        logActivity(editor.mode==="add"?"إضافة":"تعديل", cfg.table, cfg.title, payload[cfg.fields[0].key]);
        if(cfg.table==="visits") await syncVisit(payload, editor.mode);
        setEditor(null); await load();
      }
      async function remove(r){ if(!await confirmDialog("سيُحذف «"+(r[cfg.fields[0].key]||"هذا السجل")+"» نهائيًا، ولا يمكن التراجع.",{confirmLabel:"حذف"}))return; const {error}=await db.from(cfg.table).delete().eq("id",r.id); if(error){toast("تعذّر الحذف: "+error.message,"err");return;} logActivity("حذف",cfg.table,cfg.title,r[cfg.fields[0].key]); setView("list");setSelId(null);load(); }

      const filterDefs=(cfg.filterKeys||[]).map(key=>{ const f=cfg.fields.find(x=>x.key===key);
        const opts=[...new Set(rows.map(r=>r[key]).filter(v=>v!==null&&v!==undefined&&v!==""))].map(String).sort();
        return {key,label:f?f.label:key,opts}; });
      const filtered=rows.filter(r=> (q===""||cfg.fields.some(f=>String(r[f.key]||"").includes(q))) && filterDefs.every(fd=>!filters[fd.key]||filters[fd.key]==="الكل"||String(r[fd.key])===filters[fd.key])
        && (cfg.table!=="painters"||quoteFilter==="الكل"||(quoteFilter==="لديه عرض سعر"?!!r.has_quote:!r.has_quote)) );
      const kpis=cfg.kpis?cfg.kpis(rows):[];
      const activeFilterCount=Object.values(filters).filter(v=>v&&v!=="الكل").length+(quoteFilter!=="الكل"?1:0);
      const inputType=f=>f.type==="number"?"number":f.type==="date"?"date":"text";
      function fmt(f,v){ if(f.key==="rating")return <Stars n={Number(v)||0}/>; if(f.type==="images")return toArr(v).length+" صورة"; if(f.key==="risk_level")return <Pill text={v||"—"} color={RISK_COLORS[v]}/>; if(f.type==="number")return (Number(v)||0).toLocaleString()+(f.suffix||""); return v||"—"; }
      const initial=r=>(r[cfg.fields[0].key]||"؟").trim()[0];
      const avatarBg=r=>STATUS_COLORS[r[cfg.statusField]]||tok("info");

      return (
        <div className="space-y-4">
          {view==="detail"&&selected&&(
            <div className="space-y-4">
              <button onClick={()=>{setView("list");setSelId(null);}}
                className="btn btn-ghost btn-sm"><Icon n="chevron" s={14}/> رجوع إلى {cfg.title}</button>

              {/* الترويسة: طباعية على سطح البطاقة.
                  الرأس المتدرّج بلون الحالة كان يصبغ الشاشة كلها بمعلومة واحدة صغيرة. */}
              <div className="card p-5 sm:p-6">
                <div className="flex items-start gap-4">
                  <Avatar text={selected[cfg.fields[0].key]} color={avatarBg(selected)} size={52} dot={!!cfg.statusField}/>
                  <div className="min-w-0 flex-1">
                    <div className="min-w-0">
                      <div className="flex items-center gap-2.5 flex-wrap">
                        <h2 className="t-xl truncate">{selected[cfg.fields[0].key]}</h2>
                        {cfg.statusField&&selected[cfg.statusField]?<Badge status={selected[cfg.statusField]}/>:null}
                      </div>
                      <p className="lede mt-1 truncate">{cfg.subtitle(selected)}</p>
                    </div>

                    {/* الإجراءات السريعة — ما يحتاجه المندوب وهو واقف أمام العميل */}
                    <div className="mt-4 flex items-center gap-2 flex-wrap">
                      {selected.phone?<a href={"tel:"+selected.phone} className="btn btn-outline btn-sm tap"><Icon n="target" s={13}/> اتصال</a>:null}
                      {selected.phone?<WhatsAppButton phone={selected.phone} size={13}
                        btnClassName="btn btn-outline btn-sm tap"/>:null}
                      {(selected.lat&&selected.lng)?<a href={mapsUrl(selected.lat,selected.lng)} target="_blank" rel="noopener noreferrer"
                        className="btn btn-outline btn-sm tap"><Icon n="pin" s={13}/> الخرائط</a>:null}
                      <span className="flex-1"/>
                      <button onClick={()=>openEdit(selected)} className="btn btn-primary btn-sm press"><Icon n="edit" s={13}/> تعديل</button>
                      <button onClick={()=>remove(selected)} className="btn btn-danger btn-sm press" aria-label="حذف السجل"><Icon n="trash" s={13}/></button>
                    </div>
                  </div>
                </div>

                {/* الحقول: جدول تعريفات بخطوط شعرية، لا شبكة بطاقات ملوّنة عشوائيًا */}
                <dl className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-x-8 mt-6 pt-5"
                  style={{borderTop:"1px solid var(--line)"}}>
                  {cfg.fields.slice(1).filter(f=>f.type!=="images"&&f.type!=="products"&&f.key!=="notes").map(f=>(
                    <div key={f.key} className="flex items-baseline justify-between gap-4 py-2.5" style={{borderBottom:"1px solid var(--line)"}}>
                      <dt className="t-2xs txt-muted shrink-0">{f.label}</dt>
                      <dd className={"t-2xs font-medium text-left min-w-0 truncate "+(f.type==="number"||f.type==="date"?"tnum":"")}>

                {(()=>{const nf=cfg.fields.find(f=>f.key==="notes"); return nf&&selected.notes?(
                  <div className="mt-5">
                    <div className="eyebrow mb-2">ملاحظات</div>
                    <p className="t-2xs leading-relaxed break-words">{selected.notes}</p>

                    <button onClick={()=>onGo&&onGo("projects",{painter:selected.name})} className="btn btn-ghost btn-sm flex-1"><Icon n="plus" s={12}/> موقع لهذا الدهان</button>
                    <button onClick={()=>onGo&&onGo("visits",{painter:selected.name,target:selected.name,type:"دهان",date:TODAY()})} className="btn btn-ghost btn-sm flex-1"><Icon n="plus" s={12}/> زيارة لهذا الدهان</button>
                  </div>)}
              </div>

              {cfg.table==="painters" && <LastTouch name={selected.name} refreshKey={interactionsKey}/>}

              <section className="card p-4 sm:p-5">
                <h3 className="t-sm font-semibold mb-4">العلاقات والنشاط المرتبط</h3>
                <RelatedPanel cfg={cfg} record={selected} onGo={onGo}/>
              </section>

              {cfg.table==="painters"&&(
                <section className="card p-4 sm:p-5">
                  <header className="flex items-center justify-between gap-3 mb-4">
                    <h3 className="t-sm font-semibold">التفاعلات</h3>
                    <button onClick={()=>setShowInteraction(true)} className="btn btn-primary btn-sm press"><Icon n="plus" s={12}/> تفاعل جديد</button>

                actions={<>
                  <button onClick={()=>openAdd()} className="btn btn-primary btn-sm press"><Icon n="plus" s={13}/>{cfg.addLabel}</button>
                  <button onClick={()=>exportCSV(cfg,filtered)} title="تصدير النتائج المعروضة"
                    className="btn btn-ghost btn-sm press"><Icon n="download" s={13}/>تصدير</button>
                </>}/>

              <div className="grid grid-cols-3 gap-2.5 sm:gap-3">
                {kpis.map(([label,val],i)=><Kpi key={label} label={label} value={val}
                  color={[ "var(--ink-2)","var(--ok)","var(--warn)" ][i]||"var(--ink-2)"}/>)}
              </div>

              {/* شريط الأدوات — البحث دائمًا ظاهر، والتصفية تُطوى خلف زرّ يعرض عدد المفعّل منها.
                  سبع قوائم منسدلة مفروشة على الشاشة كانت تبتلع الصفحة قبل أن يصل المستخدم لأي سجل. */}

                    {q&&<button onClick={()=>setQ("")} aria-label="مسح البحث" className="btn-icon shrink-0" style={{width:24,height:24}}><Icon n="close" s={13}/></button>}

                      className="p-2 transition-colors" style={vmode==="cards"?{background:"var(--surface-3)",color:"var(--ink)"}:{color:"var(--ink-3)"}}><Icon n="grid" s={15}/></button>
                    <button onClick={()=>setVmode("list")} aria-pressed={vmode==="list"} title="قائمة"
                      className="p-2 transition-colors" style={vmode==="list"?{background:"var(--surface-3)",color:"var(--ink)"}:{color:"var(--ink-3)"}}><Icon n="list" s={15}/></button>
                  </div>
                </div>

                {showFilters&&(
                  <div className="rise pt-2.5" style={{borderTop:"1px solid var(--line)"}}>
                    <div className="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-2">
                      {filterDefs.map(fd=>{ const on_=filters[fd.key]&&filters[fd.key]!=="الكل";

                            onChange={e=>setFilters({...filters,[fd.key]:e.target.value})}
                            className="field w-full t-2xs"
                            style={on_?{borderColor:"var(--accent-line)",color:"var(--accent)"}:{}}>
                            <option value="الكل">{fd.label}: الكل</option>
                            {fd.opts.map(o=><option key={o} value={o}>{o}</option>)}
                          </select>);})}
                      {cfg.table==="painters"&&(
                        <select value={quoteFilter} onChange={e=>setQuoteFilter(e.target.value)} aria-label="عرض السعر"
                          className="field w-full t-2xs"
                          style={quoteFilter!=="الكل"?{borderColor:"var(--accent-line)",color:"var(--accent)"}:{}}>
                          <option value="الكل">عرض السعر: الكل</option>
                          <option value="لديه عرض سعر">لديه عرض سعر</option>
                          <option value="بدون عرض سعر">بدون عرض سعر</option>
                        </select>
                      )}
                    </div>
                    {activeFilterCount>0&&(
                      <button onClick={()=>{ setFilters({}); setQuoteFilter("الكل"); }}
                        className="btn btn-ghost btn-sm mt-2.5"><Icon n="close" s={12}/> مسح التصفية</button>)}
                  </div>
                )}
              </div>

              {loading&&(
                <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3">
                  {Array.from({length:6}).map((_,i)=>(
                    <div key={i} className="card p-4">
                      <div className="flex items-center gap-3 mb-3">
                        <div className="sk" style={{width:38,height:38,borderRadius:9}}/>
                        <div className="flex-1 space-y-1.5"><div className="sk h-3 w-2/3"/><div className="sk h-2.5 w-1/3"/></div>
                      </div>
                      <div className="flex gap-1.5"><div className="sk h-5 w-14"/><div className="sk h-5 w-16"/><div className="sk h-5 w-12"/></div>
                    </div>))}
                </div>)}
              {error&&<ReportError msg={error} onRetry={load}/>}
              {!loading&&!error&&filtered.length===0&&(
                <ReportEmpty
                  text={rows.length===0?("لم تضف أي سجل في "+cfg.title+" بعد"):"ما فيه نتيجة تطابق البحث والتصفية"}
                  action={()=>openAdd()} actionLabel={cfg.addLabel}
                  secondary={(q||activeFilterCount)?()=>{ setQ(""); setFilters({}); setQuoteFilter("الكل"); }:null}
                  secondaryLabel="مسح البحث والتصفية"
                  tips={rows.length===0?["استخدم زر البرق في الأعلى لتسجيل زيارة سريعة من الميدان","اضغط Ctrl+K للتنقّل والبحث من أي شاشة"]:null}/>
              )}

              {/* السكّة الملوّنة على حافة كل كرت أُزيلت: الحالة يحملها بالفعل نقطة الحرف والوسم،
                  وثلاثة ترميزات للشيء نفسه ضجيج لا وضوح. */}
              {!loading&&filtered.length>0&&(vmode==="cards"?(
                <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3 stagger">
                  {filtered.map(r=>{ const col=avatarBg(r);
                    return (<button key={r.id} onClick={()=>{setSelId(r.id);setView("detail");}}
                      className="card lift press p-4 text-right">
                      <div className="flex items-center gap-3 min-w-0 mb-3">
                        <Avatar text={r[cfg.fields[0].key]} color={col} size={38} dot={!!cfg.statusField}/>
                        <div className="min-w-0 flex-1">
                          <div className="t-sm font-medium truncate">{r[cfg.fields[0].key]}</div>
                          {cfg.table==="painters"&&Number(r.rating)>0
                            ? <div className="mt-1"><Stars n={Number(r.rating)}/></div>
                            : <div className="t-chip txt-dim truncate mt-0.5">{cfg.subtitle(r)}</div>}
                        </div>
                      </div>
                      <TagRow table={cfg.table} r={r} max={4}/>
                    </button>);})}
                </div>
              ):(
                <div className="card divide-hair overflow-hidden">
                  {filtered.map(r=>{ const col=avatarBg(r);
                    return (<button key={r.id} onClick={()=>{setSelId(r.id);setView("detail");}}
                      className="w-full flex items-center justify-between gap-3 px-3.5 py-3 text-right row-hover">
                      <div className="flex items-center gap-3 min-w-0 flex-1">
                        <Avatar text={r[cfg.fields[0].key]} color={col} size={34} dot={!!cfg.statusField}/>
                        <div className="min-w-0 flex-1">
                          <div className="t-sm font-medium truncate mb-1">{r[cfg.fields[0].key]}</div>
                          <TagRow table={cfg.table} r={r} max={4}/>
                        </div>
                      </div>
                      <Icon n="chevron" s={15} c="txt-dim shrink-0"/>
                    </button>);})}
                </div>
              ))}
            </>
          )}

          {editor&&(
            <Sheet open={!!editor} onClose={()=>{ if(!saving) setEditor(null); }}
              title={editor.mode==="add"?cfg.addLabel:("تعديل — "+(editor.data[cfg.fields[0].key]||cfg.title))}
              subtitle={cfg.title+" · الحقول المعلّمة بنجمة مطلوبة"}
              footer={<>
                <button onClick={()=>{ setEditor(e=>({...e,touched:true})); save(); }} disabled={saving}
                  className="btn btn-primary btn-lg flex-1 press">
                  {saving?<><Icon n="refresh" s={15} c="spin"/> جاري الحفظ…</>:<><Icon n="save" s={15}/> حفظ</>}
                </button>
                <button onClick={()=>setEditor(null)} disabled={saving} className="btn btn-ghost btn-lg px-5 press">إلغاء</button>
              </>}>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-3.5">
                {cfg.fields.map(f=>{
                  if(f.type==="select")return <Sel key={f.key} label={f.label} v={editor.data[f.key]} on={v=>setField(f.key,v)} opts={f.opts}/>;
                  if(f.type==="ref")return <RefField key={f.key} label={f.label} v={editor.data[f.key]} on={v=>setField(f.key,v)} options={refOpts[f.refTable]||[]}/>;
                  if(f.type==="refs")return <RefsField key={f.key} label={f.label} v={editor.data[f.key]} on={v=>setField(f.key,v)} options={refOpts[f.refTable]||[]}/>;
                  if(f.type==="products")return <ProductsField key={f.key} label={f.label} v={editor.data[f.key]} on={v=>setField(f.key,v)}/>;
                  if(f.type==="images")return <ImagesField key={f.key} label={f.label} v={editor.data[f.key]} on={v=>setField(f.key,v)} folder={cfg.table}/>;
                  return <Inp key={f.key} label={f.label} type={inputType(f)} v={editor.data[f.key]} on={v=>setField(f.key,v)}
                    required={f.key===cfg.fields[0].key} autoFocus={f.key===cfg.fields[0].key}
                    icon={f.key==="phone"?"link":(f.type==="date"?"clock":null)}
                    dir={f.key==="phone"?"ltr":undefined}
                    invalid={f.key===cfg.fields[0].key && editor.touched && !String(editor.data[f.key]||"").trim()}/>;
                })}
              </div>
              {cfg.geo&&(
                <div className="flex items-center gap-2.5 mt-4 flex-wrap">
                  <button type="button" onClick={captureGeo} className="btn btn-ghost btn-sm"><Icon n="pin" s={13}/> التقاط الموقع الحالي</button>
                  <span className="t-chip txt-dim">{geoMsg||(editor.data.lat?`${editor.data.lat}, ${editor.data.lng}`:"يُلتقط الموقع تلقائيًا عند الحفظ")}</span>
                </div>)}
            </Sheet>
          )}
          {cfg.table==="painters"&&selected&&(
            <InteractionModal open={showInteraction} onClose={()=>setShowInteraction(false)} painterName={selected.name} painterCity={selected.city}
              onSaved={()=>{ setInteractionsKey(k=>k+1); load(); }}/>
          )}
        </div>
      );
    }

    /* ===== زيارة سريعة (أقل من دقيقة) ===== */
    const VISIT_ICON={"دهان":"brush","موقع":"building","مطور عقاري":"target","معرض":"home","استشاري":"star"};
    function QuickVisit({ open, onClose, onSaved }) {
      const dlgRef=useModalBehaviour(open, onClose);
      const [d,setD]=useState({target:"",type:"دهان",city:CITIES[0],results:"",next_followup:"",products:"[]",sites:""});
      const [saving,setSaving]=useState(false); const [geo,setGeo]=useState(null); const [imgs,setImgs]=useState([]);
      const [opts,setOpts]=useState({painters:[],projects:[],contractors:[]}); const [siteTxt,setSiteTxt]=useState("");
      useEffect(()=>{ if(open){ setD({target:"",type:"دهان",city:CITIES[0],results:"",next_followup:"",products:"[]",sites:""}); setGeo(null); setImgs([]); setSiteTxt(""); getGeo().then(setGeo);
        Promise.all([db.from("painters").select("name"),db.from("projects").select("name"),db.from("contractors").select("name")]).then(([a,b,c])=>setOpts({painters:(a.data||[]).map(x=>x.name).filter(Boolean),projects:(b.data||[]).map(x=>x.name).filter(Boolean),contractors:(c.data||[]).map(x=>x.name).filter(Boolean)})); } },[open]);
      if(!open) return null;
      const isSite=isSiteVisit(d.type);
      const suggestList = d.type==="دهان"?opts.painters : isDevVisit(d.type)?opts.contractors : isSite?opts.projects : [];
      const matches = d.target.trim()? suggestList.filter(n=>n.includes(d.target.trim())).slice(0,6) : suggestList.slice(0,6);
      const sites = String(d.sites||"").split(",").map(s=>s.trim()).filter(Boolean);
      const addSite=n=>{ const name=(n||siteTxt).trim(); if(!name)return; if(!sites.includes(name)) setD({...d,sites:[...sites,name].join(", ")}); setSiteTxt(""); };
      const siteSugg=siteTxt.trim()?opts.projects.filter(o=>o.includes(siteTxt.trim())&&!sites.includes(o)).slice(0,6):[];
      async function save(){ if(!d.target.trim()){toast("اكتب عنوان الزيارة أولاً","warn");return;} setSaving(true);
        const payload={ target:d.target, type:d.type, date:TODAY(), location:d.city, results:d.results, next_followup:d.next_followup||null, images:imgs, products:encodeFindings(d.products) };
        if(geo){ payload.lat=geo.lat; payload.lng=geo.lng; }
        if(d.type==="دهان")payload.painter=d.target; if(isDevVisit(d.type))payload.contractor=d.target;
        if(isSite) payload.project = sites.length? sites.join(", ") : d.target;
        // حفظ مرن يتجاهل أي عمود غير موجود
        let body={...payload}; let ok=false, lastErr=null;
        for(let i=0;i<6;i++){ const r=await db.from("visits").insert([body]); if(!r.error){ok=true;break;} lastErr=r.error; const m=(r.error.message||"")+" "+(r.error.details||""); const col=(m.match(/'([a-z_]+)' column/i)||m.match(/column "?([a-z_]+)"? of/i)||m.match(/column ([a-z_]+)/i)||[])[1]; if(col&&col in body){delete body[col];continue;} break; }
        if(!ok){setSaving(false);toast("تعذّر حفظ الزيارة: "+(lastErr&&lastErr.message||""),"err");return;}
        await syncVisit(payload, "add"); setSaving(false);
        logActivity("إضافة","visits","الزيارات",d.target); onSaved&&onSaved(); onClose();
      }
      return (<div role="dialog" aria-modal="true" className="sheet-shell" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
        <div dir="rtl" onClick={e=>e.stopPropagation()} ref={dlgRef} tabIndex={-1} className="sheet-body" style={{maxWidth:520}}>
          <div className="sheet-head"><div className="flex items-center gap-2 font-semibold t-sm"><span className="w-8 h-8 rounded-[8px] flex items-center justify-center" style={{background:"var(--accent-soft)",color:"var(--accent)"}}><Icon n="bolt" s={16}/></span> زيارة ميدانية سريعة</div><button onClick={onClose} aria-label="إغلاق" className="btn-icon tap shrink-0"><Icon n="close" s={17}/></button></div>
          {/* المدينة */}
          <div className="mb-3"><div className={"t-2xs font-bold mb-1.5 "+cMuted}>المدينة (تُحتسب حصتها السوقية)</div>
            <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">{CITIES.map(c=><button key={c} onClick={()=>setD({...d,city:c})} className={"shrink-0 px-3 py-1.5 rounded-xl t-2xs font-bold "+(d.city===c?cBtn:cTrack+" "+cMuted)}>{c}</button>)}</div></div>
          {/* نوع الزيارة كأزرار كبيرة */}
          <div className="grid grid-cols-5 gap-1.5 mb-3">
            {VISIT_TYPES.map(t=>{ const col=STATUS_COLORS[t]||tok("info"); const on=d.type===t;
              return (<button key={t} onClick={()=>setD({...d,type:t,target:""})} className={"rounded-2xl py-2.5 flex flex-col items-center gap-1 t-chip font-bold transition lift "+(on?"text-white shadow-md":cTrack+" "+cMuted)} style={on?{background:col}:{}}><Icon n={VISIT_ICON[t]||"pin"} s={17}/>{t}</button>);})}
          </div>
          {/* العنوان مع اقتراحات سريعة */}
          <label className="block mb-2"><span className={"t-2xs font-bold "+cMuted}>{d.type==="دهان"?"اسم الدهان":isDevVisit(d.type)?"اسم المطوّر":isSite?"عنوان الزيارة":"عنوان الزيارة"}</span>
            <input value={d.target} onChange={e=>setD({...d,target:e.target.value})} placeholder="اكتب أو اختر من الأسفل" className={"w-full rounded-xl px-3 py-2.5 t-sm outline-none mt-1 "+cInput}/></label>
          {matches.length>0&&<div className="flex flex-wrap gap-1.5 mb-3">{matches.map(n=><button key={n} onClick={()=>setD({...d,target:n})} className={"px-2.5 py-1 rounded-lg t-2xs font-bold "+(d.target===n?cBtn:cTrack+" "+cMuted+" "+cHover)}>{n}</button>)}</div>}
          {/* المواقع المتعددة داخل المدينة (لزيارات المواقع) */}
          {isSite&&(<div className="mb-3"><div className={"t-2xs font-bold mb-1.5 "+cMuted}>المواقع التي زرتها في هذه المدينة (يمكن أكثر من موقع)</div>
            {sites.length>0&&<div className="flex flex-wrap gap-1.5 mb-1.5">{sites.map((s,i)=>(<span key={i} className="inline-flex items-center gap-1 rounded-full px-2.5 py-1 t-2xs font-bold" style={{background:"#D9770618",color:tok("warn"),border:"1px solid #D9770644"}}>{s}<button onClick={()=>setD({...d,sites:sites.filter((_,j)=>j!==i).join(", ")})} className="w-4 h-4 rounded-full bg-[color:var(--warn)] text-white t-chip flex items-center justify-center">×</button></span>))}</div>}
            <div className="flex gap-1.5"><input value={siteTxt} onChange={e=>setSiteTxt(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();addSite();}}} placeholder="اسم الموقع ثم +" className={"flex-1 rounded-lg px-3 py-2 t-sm outline-none "+cInput}/><button onClick={()=>addSite()} className={"rounded-lg px-3 t-sm font-bold "+cBtn}>+</button></div>
            {siteSugg.length>0&&<div className="flex flex-wrap gap-1.5 mt-1.5">{siteSugg.map(o=><button key={o} onClick={()=>addSite(o)} className={"px-2.5 py-1 rounded-lg t-2xs font-bold "+cTrack+" "+cMuted+" "+cHover}>{o}</button>)}</div>}
          </div>)}
          {/* رصد المنتجات في الموقع */}
          <div className="rounded-2xl p-3 mb-3 border border-[color:var(--line)] bg-[color:var(--surface-2)]">
            <FindingsField label="المنتجات المرصودة في الموقع" v={d.products} on={v=>setD({...d,products:v})}/>
          </div>
          <div className="grid grid-cols-1 gap-3">
            <Inp label="النتيجة باختصار" v={d.results} on={v=>setD({...d,results:v})}/>
            <Inp label="موعد المتابعة القادمة" type="date" v={d.next_followup} on={v=>setD({...d,next_followup:v})}/>
            <ImagesField label="صور سريعة" v={imgs} on={setImgs} folder="visits"/>
            <div className={"t-2xs flex items-center gap-1 "+cMuted}><Icon n="pin" s={13}/> {geo?`GPS: ${geo.lat}, ${geo.lng}`:"جاري تحديد الموقع تلقائياً..."}</div>
          </div>
          <button onClick={save} disabled={saving} className="btn btn-primary btn-lg btn-block mt-6 press">{saving?<><Icon n="refresh" s={15} c="spin"/> جاري الحفظ والتزامن...</>:<><Icon n="save" s={15}/> حفظ الزيارة وتزامنها</>}</button>
        </div>
      </div>);
    }

    /* ===== مهامي اليوم ===== */
    function TasksToday({ onGo }) {
      const [d,setD]=useState(null);
      async function load(){
        const [p,pr,c]=await Promise.all([db.from("painters").select("*"),db.from("projects").select("*"),db.from("contractors").select("*")]);
        setD({painters:p.data||[],projects:pr.data||[],contractors:c.data||[]});
      }
      useEffect(()=>{load()},[]);
      if(!d) return <div className={"text-center py-10 t-sm "+cMuted}>جاري تجهيز المهام...</div>;
      const today=TODAY();
      const tasks=[];
      const push=(tbl,r,label)=>{ if(r.next_followup && r.followup_status!=="تمت" && r.followup_status!=="ملغاة") tasks.push({tbl,id:r.id,name:r.name,phone:r.phone,date:r.next_followup,city:r.city,prio:r.priority,label}); };
      d.painters.forEach(r=>push("painters",r,"دهان")); d.projects.forEach(r=>push("projects",r,"موقع")); d.contractors.forEach(r=>push("contractors",r,"مطور عقاري"));
      const overdue=tasks.filter(t=>t.date<today).sort((a,b)=>a.date.localeCompare(b.date));
      const dueToday=tasks.filter(t=>t.date===today);
      const upcoming=tasks.filter(t=>t.date>today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,20);
      /* التأجيل هنا كما في شاشة اليوم — نفس المسار الذي يعمل بلا إنترنت */
      async function snoozeTask(t, days){
        const d=new Date(); d.setDate(d.getDate()+days);
        const nd=d.toISOString().slice(0,10);
        const r=await softUpdateById(t.tbl, t.id, { next_followup:nd, followup_status:"مجدولة" });
        if(!r.ok){ toast("تعذّر التأجيل","err"); return; }
        setD(prev=> prev ? { ...prev, [t.tbl]: prev[t.tbl].map(x=> x.id===t.id ? { ...x, next_followup:nd, followup_status:"مجدولة" } : x) } : prev);
        toast("أُجّلت متابعة "+t.name+" إلى "+nd,"info");
      }
      async function done(t){
        const r = await softUpdateById(t.tbl, t.id, { followup_status:"تمت", last_contact:today, next_followup:null });
        if(!r.ok){ toast("تعذّر تحديث المتابعة: "+(r.error&&r.error.message||""),"err"); return; }
        // تحديث فوري للحالة محليًا حتى تختفي المهمة من القائمة على طول بدل انتظار إعادة تحميل كل البيانات
        setD(prev=> prev ? { ...prev, [t.tbl]: prev[t.tbl].map(x=> x.id===t.id ? { ...x, followup_status:"تمت", last_contact:today, next_followup:null } : x) } : prev);
        logActivity("تعديل",t.tbl,"متابعة",t.name);
      }

      const Group=({title,items,color,empty})=>(
        <section className="card p-4 sm:p-5">
          <header className="flex items-center gap-2 mb-4">
            <h3 className="t-sm font-semibold">{title}</h3>
            <span className="chip tnum" style={{background:items.length?`color-mix(in srgb, ${color} 12%, transparent)`:"var(--surface-2)",
              color:items.length?color:"var(--ink-3)",borderColor:items.length?`color-mix(in srgb, ${color} 26%, transparent)`:"var(--line)"}}>{items.length}</span>
          </header>
          {items.length?<div className="divide-hair">{items.map((t,i)=>(
            <div key={i} className="flex items-center justify-between gap-3 py-2.5">
              <button onClick={()=>onGo&&onGo(t.tbl)} className="min-w-0 text-right flex-1 rounded-[6px]">
                <div className="t-2xs font-medium truncate">{t.name}</div>
                <div className="t-chip txt-dim truncate mt-0.5">{t.label} · {t.city||"—"} · <span className="tnum">{t.date}</span></div>
              </button>
              <div className="flex items-center gap-1.5 shrink-0">
                {t.prio&&t.prio!=="بدون"?<Pill text={t.prio} color={PRIORITY_COLORS[t.prio]}/>:null}
                {t.phone&&<a href={"tel:"+t.phone} title="اتصال" aria-label={"اتصال بـ"+t.name}
                  className="tap w-8 h-8 rounded-[7px] flex items-center justify-center"
                  style={{color:"var(--ink-2)",background:"var(--surface-2)"}}><Icon n="target" s={14}/></a>}
                <SnoozeMenu compact onSnooze={days=>snoozeTask(t,days)}/>
                <button onClick={()=>done(t)} title="تمّت المتابعة" aria-label={"وضع علامة تمّت على متابعة "+t.name}
                  className="tap w-8 h-8 rounded-[7px] flex items-center justify-center transition-colors"
                  style={{color:"var(--ok)",background:"var(--ok-soft)"}}><Icon n="check" s={15}/></button>
              </div>
            </div>))}</div>:<div className="t-2xs txt-dim py-4">{empty}</div>}
        </section>
      );
      return (<div className="space-y-4">
        <PageHeader title="مهامي اليوم"
          lede={"كل المتابعات المستحقّة عبر الدهانين والمواقع والمطوّرين · "+new Date().toLocaleDateString("ar-SA",{weekday:"long",day:"numeric",month:"long"})}/>
        <div className="grid grid-cols-3 gap-3">
          <Kpi label="متأخرة" value={overdue.length} color={tok("danger")}/>
          <Kpi label="مستحقة اليوم" value={dueToday.length} color={tok("warn")}/>
          <Kpi label="قادمة" value={upcoming.length} color={tok("ok")}/>
        </div>
        <Group title="متأخرة — تتطلب إجراءً فورياً" items={overdue} color={tok("danger")} empty="لا توجد متابعات متأخرة، أحسنت."/>
        <Group title="مستحقة اليوم" items={dueToday} color={tok("warn")} empty="لا مهام مجدولة لليوم."/>
        <Group title="المتابعات القادمة" items={upcoming} color={tok("ok")} empty="لا متابعات قادمة. أضف موعد متابعة من صفحة أي سجل."/>
      </div>);
    }

    /* ===== سجل النشاط ===== */
    function Timeline() {
      const [rows,setRows]=useState(null); const [err,setErr]=useState("");
      useEffect(()=>{(async()=>{ const {data,error}=await db.from("activity_log").select("*").order("created_at",{ascending:false}).limit(200);
        if(error)setErr("تأكد من إنشاء جدول activity_log عبر سكربت SQL."); setRows(data||[]); })()},[]);
      const actColor=a=>a==="إضافة"?tok("ok"):a==="حذف"?tok("danger"):tok("warn");
      if(rows===null) return <div className={"text-center py-10 t-sm "+cMuted}>جاري تحميل السجل...</div>;
      return (<div className="space-y-4">
        <PageHeader title="سجل النشاط" lede="كل عمليات الإضافة والتعديل والحذف عبر النظام، بترتيب زمني."/>
        {err&&<div className="bg-[color:var(--warn-soft)] text-[color:var(--warn)] rounded-xl p-3 t-sm">{err}</div>}
        {rows.length===0?<div className={"rounded-2xl p-10 text-center t-sm "+cCard+" "+cMuted}>لا يوجد نشاط مسجّل بعد. ستظهر العمليات هنا تلقائياً.</div>:(
          <div className={"rounded-2xl p-4 "+cCard}><div className="space-y-3">{rows.map((r,i)=>(
            <div key={i} className={"flex items-start gap-3 border-b pb-3 last:border-b-0 "+cBorder}>
              <span className="w-2.5 h-2.5 rounded-full mt-1.5 shrink-0" style={{background:actColor(r.action)}}/>
              <div className="min-w-0 flex-1"><div className="t-sm font-semibold"><span style={{color:actColor(r.action)}}>{r.action}</span> · {r.entity_label} <span className="font-semibold">{r.record_name}</span></div><div className={"t-2xs mt-0.5 "+cMuted}>{r.user_name} · {r.created_at?new Date(r.created_at).toLocaleString("ar"):""}</div></div>
            </div>))}</div></div>
        )}
      </div>);
    }

    /* ===== اللوحة الرئيسية ===== */
    function Dashboard({ onGo, preloaded }) {
      const [d,setD]=useState(preloaded||null);
      useEffect(()=>{
        if(preloaded){ setD(preloaded); return; }
        (async()=>{
          const [p,pr,c,v,t,i]=await Promise.all([db.from("painters").select("*"),db.from("projects").select("*"),db.from("contractors").select("*"),db.from("visits").select("*"),db.from("trainings").select("*"),db.from("interactions").select("*")]);
          setD({painters:p.data||[],projects:pr.data||[],contractors:c.data||[],visits:v.data||[],trainings:t.data||[],interactions:i.data||[]});
        })();
      },[preloaded]);
      if(!d) return <ReportSkeleton/>;
      const {painters,projects,contractors,visits,trainings,interactions}=d;
      const group=(arr,key)=>{const m={};arr.forEach(x=>{const k=x[key]||"غير محدد";m[k]=(m[k]||0)+1;});return Object.entries(m).map(([label,value])=>({label,value}));};
      const sortTop=(arr,n=6)=>arr.sort((a,b)=>b.value-a.value).slice(0,n);

      // أداء المعارض والمدن
      const byShowroom=sortTop(group(painters,"showroom"));
      const byCity=sortTop(group(painters,"city"));
      // المواقع والزيارات حسب المدينة
      const sitesByCity=sortTop(group(projects,"city"));
      const visitsByCity=sortTop(group(visits,"location"));
      const citiesCovered=new Set([
        ...visits.map(v=>v.location),
        ...projects.map(p=>p.city),
      ].filter(c=>c&&CITIES.includes(c))).size;
      // أفضل الدهانين (مواقع + تقييم)
      const projByPainter={}; projects.forEach(p=>{if(p.painter)projByPainter[p.painter]=(projByPainter[p.painter]||0)+1;});
      const topPainters=sortTop(painters.map(p=>({label:p.name,value:(projByPainter[p.name]||0)*2+(Number(p.rating)||0)})).filter(x=>x.value>0),6);
      // أفضل المطوّرين
      const topContractors=sortTop(contractors.map(c=>({label:c.name,value:Number(c.projects_count)||0})).filter(x=>x.value>0),6);
      // الرصدات: منتجات الجزيرة مقابل المنافسين
      let ownFind=0, compTot=0; const prodCount={}; const compFind={};
      [...visits,...projects].forEach(x=>parseFindings(x.products).forEach(f=>{ if(!f.c) return; if(f.c===OWN_COMPANY){prodCount[f.p]=(prodCount[f.p]||0)+1; ownFind++;} else {compFind[f.c]=(compFind[f.c]||0)+1; compTot++;} }));
      const topProducts=sortTop(Object.entries(prodCount).map(([label,value])=>({label,value})),8);
      const compCount=sortTop(Object.entries(compFind).map(([label,value])=>({label,value,color:companyColor(label)})),8);
      const totalFindings=ownFind+compTot;
      const ownShare=totalFindings?Math.round(ownFind/totalFindings*100):0;
      /* الجزيرة بالأحمر الكامل، والمنافسون رماديّون: التباين وحده يحكي من يكسب */
      const marketDonut=totalFindings?[{label:"الجزيرة",value:ownFind,color:companyColor(OWN_COMPANY)},
                                       {label:"المنافسون",value:compTot,color:tok("faint")}]:[];
      // متابعات الدهانين حسب الطريقة
      const cmCount=group(painters.filter(p=>p.contact_method),"contact_method").map(x=>({...x,color:STATUS_COLORS[x.label]||tok("neutral")})).sort((a,b)=>b.value-a.value);
      const followedPainters=painters.filter(p=>p.contact_method).length;
      // توزيع الدهانين حسب الحالة (Donut)
      const painterStatusData=group(painters,"status").map(x=>({label:x.label,value:x.value,color:STATUS_COLORS[x.label]||tok("neutral")})).sort((a,b)=>b.value-a.value);
      // المواقع حسب المدينة (Donut)
      const sitesCityDonut=sitesByCity.slice(0,6).map((x,i)=>({...x,color:COLORS[i%COLORS.length]}));
      // نشاط الزيارات آخر 6 أشهر (Trend)
      const months=[]; const now=new Date();
      for(let i=5;i>=0;i--){ const dt=new Date(now.getFullYear(),now.getMonth()-i,1); months.push({key:dt.toISOString().slice(0,7),label:dt.toLocaleDateString("ar",{month:"short"})}); }
      const visTrend=months.map(m=>({label:m.label,value:visits.filter(v=>String(v.date||"").slice(0,7)===m.key).length}));

      // التفاعلات مع الدهانين (مكالمات / واتساب / رسائل / عروض أسعار / زيارات)
      const totalInteractions=interactions.length;
      const quotesCount=interactions.filter(x=>x.type==="عرض سعر").length;
      const paintersReached=new Set(interactions.map(x=>x.painter).filter(Boolean)).size;
      const interactionTypeDonut=group(interactions,"type").map(x=>({...x,color:STATUS_COLORS[x.label]||tok("neutral")})).sort((a,b)=>b.value-a.value);
      const interTrend=months.map(m=>({label:m.label,value:interactions.filter(x=>String(x.date||"").slice(0,7)===m.key).length}));
      const recentInteractions=[...interactions].sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))).slice(0,5);

      const recentVisits=[...visits].sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))).slice(0,5);
      const activePainters=painters.filter(p=>p.status==="نشط").length;
      const empty=<div className="t-2xs txt-dim py-8 text-center">لا بيانات كافية بعد</div>;
      const Card=({title,children,sub})=>(
        <section className="card p-4 sm:p-5">
          <header className="flex items-baseline justify-between gap-3 mb-4">
            <h3 className="t-sm font-semibold">{title}</h3>
            {sub?<span className="t-chip txt-dim shrink-0">{sub}</span>:null}
          </header>
          {children}
        </section>);

      return (
        <div className="space-y-5">
          {/* الصف الأول: حجم القاعدة — الأرقام التي لا تتغيّر كل يوم */}
          <section>
            <div className="flex items-baseline justify-between gap-3 mb-2.5">
              <h2 className="eyebrow">القاعدة</h2>
              <span className="t-chip txt-dim">إجمالي ما في النظام</span>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 sm:gap-3">
              <Kpi label="الدهانين"   value={painters.length}    icon="brush"    color="var(--info)"   onClick={()=>onGo&&onGo("painters")}/>
              <Kpi label="النشطون"    value={activePainters}     icon="check"    color="var(--ok)"     sub={painters.length?Math.round(activePainters/painters.length*100)+"٪ من القاعدة":null} onClick={()=>onGo&&onGo("painters")}/>
              <Kpi label="المواقع"    value={projects.length}    icon="building" color="var(--warn)"   onClick={()=>onGo&&onGo("projects")}/>
              <Kpi label="المطوّرون"  value={contractors.length} icon="layers"   color="var(--ink-2)"  onClick={()=>onGo&&onGo("contractors")}/>
            </div>
          </section>

          {/* الصف الثاني: الأداء — الأرقام التي يتحرّك عليها المندوب */}
          <section>
            <div className="flex items-baseline justify-between gap-3 mb-2.5">
              <h2 className="eyebrow">الأداء الميداني</h2>
              <span className="t-chip txt-dim">نشاطك وتغطيتك</span>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 sm:gap-3">
              <Kpi label="الزيارات"  value={visits.length} icon="pin" color="var(--ink-2)"
                spark={visTrend.map(v=>v.value)} onClick={()=>onGo&&onGo("visits")}/>
              <Kpi label="المدن المغطّاة" value={citiesCovered} icon="pin" color="var(--info)"
                sub={"من أصل "+CITIES.length+" مدينة"} onClick={()=>onGo&&onGo("plan")}/>
              <Kpi label="دهانون متابَعون" value={followedPainters} icon="link" color="var(--ink-2)"
                sub="سُجّلت لهم طريقة متابعة"/>
              {/* حصة الجزيرة: المؤشّر الوحيد الذي يستحقّ لون العلامة */}
              <Kpi label="حصة الجزيرة" value={ownShare+"%"} icon="trophy" color="var(--accent)"
                tone={"var(--accent)"} sub={totalFindings+" رصدة منتج"} onClick={()=>onGo&&onGo("marketshare")}/>
            </div>
          </section>

          {/* التوزيعات */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <Card title="المواقع حسب المدينة" sub={projects.length+" موقع"}>
              {sitesCityDonut.length?<Donut data={sitesCityDonut} centerLabel="موقع"/>:empty}
            </Card>
            <Card title="الدهانون حسب الحالة" sub={painters.length+" دهان"}>
              {painterStatusData.length?<Donut data={painterStatusData} centerLabel="دهان"/>:empty}
            </Card>
          </div>

          <Card title="نشاط الزيارات" sub="آخر ٦ أشهر">
            {visits.length?<TrendArea points={visTrend} color="var(--ink-2)" height={140}/>:empty}
          </Card>

          {/* التفاعلات مع الدهانين */}
          <section className="card p-4 sm:p-5">
            <header className="flex items-start justify-between gap-3 mb-4">
              <div>
                <h2 className="t-md font-semibold">التفاعلات مع الدهانين</h2>
                <p className="t-2xs txt-muted mt-0.5">مكالمات وواتساب ورسائل وعروض أسعار مسجّلة</p>
              </div>
              <button onClick={()=>onGo&&onGo("painters")} className="btn btn-ghost btn-sm shrink-0">عرض الدهانين</button>
            </header>
            <div className="grid grid-cols-3 gap-2.5 mb-5">
              <Kpi label="إجمالي التفاعلات" value={totalInteractions} icon="bolt" color="var(--ink-2)"/>
              <Kpi label="عروض أسعار" value={quotesCount} icon="doc" color="var(--accent)" sub="مُقدَّمة للدهانين"/>
              <Kpi label="دهانون تم التواصل معهم" value={paintersReached} icon="brush" color="var(--ok)"/>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <div>
                <div className="eyebrow mb-3">التفاعلات حسب النوع</div>
                {interactionTypeDonut.length?<Donut data={interactionTypeDonut} size={130} centerLabel="تفاعل"/>:empty}
              </div>
              <div>
                <div className="eyebrow mb-3">نشاط التفاعلات — آخر ٦ أشهر</div>
                {totalInteractions?<TrendArea points={interTrend} color="var(--ink-2)" height={130}/>:empty}
              </div>
            </div>
            {recentInteractions.length>0&&(
              <div className="mt-5 pt-4 border-t hairline">
                <div className="eyebrow mb-2">آخر التفاعلات</div>
                <div className="divide-hair">
                  {recentInteractions.map((x,i)=>(
                    <button key={i} onClick={()=>onGo&&onGo("painters")}
                      className="w-full flex items-center justify-between gap-3 py-2 px-1 -mx-1 rounded-[6px] text-right row-hover">
                      <span className="flex items-center gap-2.5 min-w-0">
                        <span className="w-6 h-6 rounded-[6px] flex items-center justify-center shrink-0"
                          style={{color:STATUS_COLORS[x.type],background:`color-mix(in srgb, ${STATUS_COLORS[x.type]} 12%, transparent)`}}>
                          <Icon n={INTERACTION_ICON[x.type]||"bolt"} s={12}/></span>
                        <span className="t-2xs truncate">{x.painter}</span>
                      </span>
                      <span className="flex items-center gap-2.5 shrink-0">
                        <Pill text={x.type} color={STATUS_COLORS[x.type]}/>
                        <span className="t-chip txt-dim tnum">{x.date||""}</span>
                      </span>
                    </button>
                  ))}
                </div>
              </div>
            )}
          </section>

          {/* الحصة السوقية + تغطية المدن */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <Card title="الجزيرة مقابل المنافسين" sub="من المنتجات المرصودة">
              {marketDonut.length?(<>
                <Donut data={marketDonut} centerLabel="رصدة"/>
                <div className="mt-4 pt-3 border-t hairline flex items-center justify-between gap-3">
                  <span className="t-2xs txt-muted">حصة الجزيرة من {totalFindings} رصدة</span>
                  <span className="t-lg tnum" style={{color:ownShare>=50?"var(--ok)":"var(--accent)"}}>{ownShare}%</span>
                </div></>):empty}
            </Card>
            <Card title="تغطية المدن بالزيارات" sub="زيارة لكل مدينة">
              {visitsByCity.length?<Bars data={visitsByCity} unit="زيارة"/>:empty}
            </Card>
          </div>

          {/* لوحات الأداء */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <Card title="أداء المعارض" sub="دهانون لكل معرض">{byShowroom.length?<Bars data={byShowroom}/>:empty}</Card>
            <Card title="أداء المدن" sub="دهانون لكل مدينة">{byCity.length?<Bars data={byCity}/>:empty}</Card>
            <Card title="أفضل الدهانين" sub="حسب النشاط">{topPainters.length?<Bars data={topPainters}/>:empty}</Card>
            <Card title="أفضل المطوّرين العقاريين" sub="عدد المواقع">{topContractors.length?<Bars data={topContractors}/>:empty}</Card>
            <Card title="المتابعات حسب الطريقة" sub="كيف تتواصل مع الدهانين">
              {cmCount.length?<Bars data={cmCount}/>:<div className="t-2xs txt-dim py-6 text-center">سجّل طريقة المتابعة في بطاقة الدهان لتظهر هنا</div>}</Card>
            {/* منتجاتنا بالأحمر، والمنافسون بلونهم — التباين وحده يحكي القصة */}
            <Card title="أكثر منتجات الجزيرة رصدًا" sub="في المواقع والزيارات">
              {topProducts.length?<Bars data={topProducts.map(x=>({...x,color:companyColor(OWN_COMPANY)}))}/>:<div className="t-2xs txt-dim py-6 text-center">سجّل المنتجات في الزيارات والمواقع لتظهر هنا</div>}</Card>
            <Card title="أكثر المنافسين حضورًا" sub="من المنتجات المرصودة">
              {compCount.length?<Bars data={compCount}/>:<div className="t-2xs txt-dim py-6 text-center">لم تُرصد منتجات منافسين بعد</div>}</Card>
          </div>

          <Card title="أحدث الزيارات" sub={visits.length+" زيارة"}>
            {recentVisits.length?(
              <div className="divide-hair">{recentVisits.map(v=>(
                <button key={v.id} onClick={()=>onGo&&onGo("visits")}
                  className="w-full flex items-center justify-between gap-3 py-2.5 px-1 -mx-1 rounded-[6px] text-right row-hover">
                  <span className="min-w-0">
                    <span className="block t-2xs font-medium truncate">{v.target}</span>
                    <span className="block t-chip txt-dim truncate">{v.location} · <span className="tnum">{v.date}</span></span>
                  </span>
                  <Badge status={v.type}/>
                </button>))}</div>
            ):<div className="t-2xs txt-dim py-6 text-center">لا توجد زيارات مسجّلة</div>}
          </Card>
        </div>
      );
    }

    /* ═══════════ خريطة الحصة بالمدن ═══════════
       السؤال المركزي للشركة ليس «كم نسبتنا إجمالًا» بل «أين نكسب وأين نخسر».
       الحلقة الواحدة لا تجيب على ذلك؛ صفّ لكل مدينة يجيب عليه في نظرة:
       الأحمر لنا، والرمادي لهم، والمدن مرتّبة من الأضعف إلى الأقوى
       لأن الأضعف هي التي تستحق زيارة الأسبوع القادم. */
    function CityShareMap({ rows, onPick, selected }){
      if(!rows.length) return <div className="t-2xs txt-dim py-6 text-center">لا رصدات كافية لحساب الحصة بالمدن بعد.</div>;
      const own=companyColor(OWN_COMPANY);
      /* الأحمر الفاتح في الوضع الليلي يجعل النص الأبيض تحت ٣:١ — فيُقلب الحبر بدل اللون */
      const onOwn = THEME==="dark" ? "#131315" : "#FFFFFF";
      const avg=Math.round(rows.reduce((a,r)=>a+r.share,0)/rows.length);
      return (
        <div>
          <div className="space-y-1">
            {rows.map(r=>{
              const on_=selected===r.city;
              const weak=r.share<avg;
              return (
                <button key={r.city} onClick={()=>onPick&&onPick(on_?"كل المدن":r.city)}
                  aria-pressed={on_}
                  className="w-full flex items-center gap-3 py-2 px-2 -mx-2 rounded-[7px] text-right row-hover transition-colors"
                  style={on_?{background:"var(--surface-2)"}:undefined}>
                  <span className="t-2xs w-20 sm:w-24 shrink-0 truncate" style={{fontWeight:on_?600:450}}>{r.city}</span>

                  {/* الشريط: نحن ثم هم، بلا فواصل — النسبة تُقرأ من المساحة مباشرة */}
                  <span className="flex-1 h-6 rounded-[5px] overflow-hidden flex min-w-0" style={{background:"var(--surface-2)"}}>
                    <span className="h-full flex items-center justify-end px-1.5 transition-all"
                      style={{width:r.share+"%",background:own}}>
                      {r.share>=16 && <span className="t-chip tnum" style={{color:onOwn,fontWeight:600}}>{r.share}%</span>}
                    </span>
                    <span className="h-full flex-1" style={{background:"var(--surface-3)"}}/>
                  </span>

                  <span className="t-chip tnum shrink-0 w-16 text-left"
                    style={{color:weak?"var(--warn)":"var(--ink-3)"}}>
                    {r.share<16?r.share+"% · ":""}{r.tot} رصدة
                  </span>
                </button>);
            })}
          </div>

          {/* خط المتوسط كمرجع — يحوّل الأرقام إلى حكم: فوق أو تحت */}
          <div className="flex items-center gap-3 mt-4 pt-3 t-chip txt-dim" style={{borderTop:"1px solid var(--line)"}}>
            <span className="flex items-center gap-1.5">
              <span className="w-2.5 h-2.5 rounded-[2px]" style={{background:own}}/> الجزيرة
            </span>
            <span className="flex items-center gap-1.5">
              <span className="w-2.5 h-2.5 rounded-[2px]" style={{background:"var(--surface-3)"}}/> المنافسون
            </span>
            <span className="mr-auto tnum">متوسط حصّتك عبر المدن {avg}%</span>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════
       شاشة «اليوم»
       ───────────────────────────────────────────────────────────────────
       المندوب الساعة الثامنة صباحًا لا يسأل «كم دهانًا عندنا؟» — يسأل
       «وين أروح، ومين لازم أكلّمه، وإيش تأخّر عليّ». فالشاشة تفتح على العمل،
       والأرقام الإجمالية نزلت تحت في قسم «الأداء» لأنها سؤال المدير لا المندوب.
       ═══════════════════════════════════════════════════════════════════ */

    const addDays=(n)=>{ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
    const weekAgo=(n)=>{ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); };

    /* تأجيل المتابعة — أكثر إجراء يتكرّر في الميدان، ولم يكن له زر.
       بدونه يضطر المندوب إما لتعليم المهمة «تمت» كذبًا أو تركها متأخرة للأبد. */
    function SnoozeMenu({ onSnooze, compact }){
      const [open,setOpen]=useState(false);
      const ref=useRef(null);
      useEffect(()=>{ if(!open) return;
        const h=e=>{ if(ref.current&&!ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener("mousedown",h); return ()=>document.removeEventListener("mousedown",h);
      },[open]);
      const opts=[["غدًا",1],["بعد ٣ أيام",3],["بعد أسبوع",7],["بعد أسبوعين",14]];
      return (
        <span className="relative" ref={ref}>
          <button onClick={()=>setOpen(o=>!o)} aria-haspopup="menu" aria-expanded={open}
            title="تأجيل المتابعة" aria-label="تأجيل المتابعة"
            className={"tap flex items-center justify-center rounded-[7px] transition-colors "+(compact?"w-8 h-8":"btn btn-ghost btn-sm")}
            style={compact?{color:"var(--ink-2)",background:"var(--surface-2)"}:undefined}>
            <Icon n="clock" s={compact?15:13}/>{!compact&&<span>تأجيل</span>}
          </button>
          {open&&(
            <div role="menu" className="card card-raised absolute z-40 top-full left-0 mt-1.5 w-40 overflow-hidden pop">
              {opts.map(([label,d])=>(
                <button key={d} role="menuitem" onClick={()=>{ setOpen(false); onSnooze(d); }}
                  className="w-full px-3.5 py-2.5 text-right t-2xs row-hover flex items-center justify-between">
                  <span>{label}</span><span className="t-chip txt-dim tnum">{addDays(d).slice(5)}</span>
                </button>))}
            </div>)}
        </span>
      );
    }

    /* وضع الاتصال المتتابع — للمندوب وهو في السيارة:
       اسم واحد بملء الشاشة، اتصال أو واتساب، ثم النتيجة بضغطة وينتقل تلقائيًا. */
    function CallMode({ open, tasks, onClose, onDone, onSnooze }){
      const ref=useModalBehaviour(open, onClose);
      const [i,setI]=useState(0);
      const [log,setLog]=useState([]);
      useEffect(()=>{ if(open){ setI(0); setLog([]); } },[open]);
      if(!open) return null;
      const list=tasks.filter(t=>t.phone);
      const t=list[i];
      const advance=(outcome)=>{ setLog(l=>[...l,outcome]); setI(x=>x+1); };

      if(!t){
        return (
          <div className="sheet-shell" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
            <div dir="rtl" ref={ref} tabIndex={-1} role="dialog" aria-modal="true" aria-label="انتهت الجولة"
              className="sheet-body flex flex-col items-center justify-center text-center gap-4" style={{maxWidth:460}}>
              <span className="w-14 h-14 rounded-[12px] flex items-center justify-center"
                style={{background:"var(--ok-soft)",color:"var(--ok)"}}><Icon n="check" s={26}/></span>
              <h2 className="t-xl">{list.length?"خلّصت الجولة":"ما فيه أرقام للاتصال"}</h2>
              <p className="t-2xs txt-muted max-w-xs">
                {list.length
                  ? `${log.filter(x=>x==="done").length} تواصل ناجح · ${log.filter(x=>x==="snooze").length} مؤجّل · ${log.filter(x=>x==="skip").length} لم يردّ`
                  : "المتابعات المستحقّة اليوم ما فيها أرقام جوال مسجّلة."}
              </p>
              <button onClick={onClose} className="btn btn-primary btn-lg mt-2">إغلاق</button>
            </div>
          </div>);
      }

      const wa=waLink(t.phone);
      return (
        <div className="sheet-shell" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
          <div dir="rtl" ref={ref} tabIndex={-1} role="dialog" aria-modal="true" aria-label="وضع الاتصال"
            className="sheet-body flex flex-col" style={{maxWidth:460}}>

            <div className="flex items-center justify-between gap-3 mb-6">
              <span className="t-2xs txt-dim tnum">{i+1} من {list.length}</span>
              <button onClick={onClose} aria-label="إنهاء الجولة" className="btn-icon tap"><Icon n="close" s={17}/></button>
            </div>

            {/* شريط التقدّم */}
            <div className="h-1 rounded-full overflow-hidden mb-8" style={{background:"var(--surface-2)"}}>
              <div className="h-full rounded-full transition-all" style={{width:(i/list.length*100)+"%",background:"var(--accent)"}}/>
            </div>

            <div className="flex-1 flex flex-col items-center justify-center text-center gap-3 py-4">
              <Avatar text={t.name} size={64}/>
              <h2 className="t-2xl mt-2">{t.name}</h2>
              <p className="t-2xs txt-muted">{t.label} · {t.city||"—"}</p>
              {t.prio&&t.prio!=="بدون"?<Pill text={"أولوية "+t.prio} color={PRIORITY_COLORS[t.prio]}/>:null}
              <p className="t-chip txt-dim tnum mt-1">
                {t.overdue ? `متأخرة منذ ${daysAgo(t.date)} يوم` : "مستحقّة اليوم"}
              </p>
              {t.lastNote && (
                <div className="inset p-3 mt-3 w-full text-right">
                  <div className="eyebrow mb-1.5">آخر ما دار بينكما</div>
                  <p className="t-2xs">{t.lastNote}</p>
                </div>)}
            </div>

            {/* الاتصال */}
            <div className="grid grid-cols-2 gap-2 mt-6">
              <a href={"tel:"+t.phone} className="btn btn-primary btn-lg tap justify-center"><Icon n="target" s={16}/> اتصال</a>
              {wa
                ? <a href={wa} target="_blank" rel="noopener noreferrer" className="btn btn-lg tap justify-center"
                    style={{background:"var(--ok)",color:THEME==="dark"?"#0B0B0C":"#fff",borderColor:"var(--ok)"}}><Icon n="whatsapp" s={16}/> واتساب</a>
                : <span className="btn btn-ghost btn-lg justify-center opacity-50">لا يوجد واتساب</span>}
            </div>

            {/* النتيجة */}
            <div className="mt-3 pt-3" style={{borderTop:"1px solid var(--line)"}}>
              <div className="eyebrow mb-2.5">سجّل النتيجة وانتقل</div>
              <div className="grid grid-cols-3 gap-2">
                <button onClick={()=>{ onDone(t); advance("done"); }} className="btn btn-outline tap flex-col gap-1 py-3 h-auto">
                  <Icon n="check" s={16}/><span className="t-chip">تمّت</span></button>
                <button onClick={()=>{ onSnooze(t,3); advance("snooze"); }} className="btn btn-outline tap flex-col gap-1 py-3 h-auto">
                  <Icon n="clock" s={16}/><span className="t-chip">أجّل ٣ أيام</span></button>
                <button onClick={()=>advance("skip")} className="btn btn-outline tap flex-col gap-1 py-3 h-auto">
                  <Icon n="chevron" s={16}/><span className="t-chip">لم يردّ</span></button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function TodayPage({ onGo }){
      const [d,setD]=useState(null);
      const [callOpen,setCallOpen]=useState(false);
      const [busy,setBusy]=useState(null);

      async function load(){
        const [p,pr,c,v,t,i,sr]=await Promise.all([
          db.from("painters").select("*"), db.from("projects").select("*"),
          db.from("contractors").select("*"), db.from("visits").select("*"),
          db.from("trainings").select("*"), db.from("interactions").select("*"),
          db.from(SR_TABLE).select("*"),
        ]);
        setD({ painters:p.data||[], projects:pr.data||[], contractors:c.data||[],
               visits:v.data||[], trainings:t.data||[], interactions:i.data||[], showroom:sr.data||[] });
      }
      useEffect(()=>{ load(); },[]);
      if(!d) return <ReportSkeleton/>;

      const today=TODAY();
      const { painters, projects, contractors, visits, interactions, showroom } = d;

      /* آخر ملاحظة لكل جهة — تُعرض عند الاتصال حتى لا يبدأ المندوب من الصفر */
      const lastNoteBy={};
      [...interactions].sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")))
        .forEach(x=>{ if(x.painter&&x.notes) lastNoteBy[x.painter]=x.notes; });

      /* المتابعات المستحقّة */
      const tasks=[];
      const push=(tbl,label,r)=>{
        if(!r.next_followup || r.followup_status==="تمت" || r.followup_status==="ملغاة") return;
        if(r.next_followup>today) return;
        tasks.push({ tbl, label, id:r.id, name:r.name, phone:r.phone, city:r.city,
          prio:r.priority, date:r.next_followup, overdue:r.next_followup<today,
          lastNote:lastNoteBy[r.name]||"" });
      };
      painters.forEach(r=>push("painters","دهان",r));
      projects.forEach(r=>push("projects","موقع",r));
      contractors.forEach(r=>push("contractors","مطوّر",r));
      const prioRank={"عالية":0,"متوسطة":1,"منخفضة":2,"بدون":3};
      tasks.sort((a,b)=> (b.overdue-a.overdue) || ((prioRank[a.prio]??3)-(prioRank[b.prio]??3)) || String(a.date).localeCompare(String(b.date)));
      const overdue=tasks.filter(t=>t.overdue);
      const dueToday=tasks.filter(t=>!t.overdue);

      /* عملاء المعرض الأقرب للإغلاق */
      const hot=(showroom||[])
        .filter(c=>SR_OPEN_STAGES.includes(c.stage))
        .map(c=>({ c, s:srScore(c) }))
        .sort((a,b)=>b.s.score-a.s.score).slice(0,4);

      /* مدينة اليوم من الخطة الأسبوعية */
      let planCity=null, tomorrowCity=null;
      try{ const plan=JSON.parse(localStorage.getItem(PLAN_KEY)||"{}");
        planCity=plan[today]||null; tomorrowCity=plan[addDays(1)]||null; }catch(e){}

      /* الزخم: هذا الأسبوع مقابل الماضي — دافع ذاتي بلا ضغط إداري */
      const inRange=(dt,from,to)=> dt && dt>=from && dt<=to;
      const wStart=weekAgo(6), pStart=weekAgo(13), pEnd=weekAgo(7);
      const thisWeekVisits=visits.filter(v=>inRange(v.date,wStart,today)).length;
      const lastWeekVisits=visits.filter(v=>inRange(v.date,pStart,pEnd)).length;
      const thisWeekInter=interactions.filter(x=>inRange(x.date,wStart,today)).length;
      const lastWeekInter=interactions.filter(x=>inRange(x.date,pStart,pEnd)).length;
      const delta=(a,b)=> b===0 ? (a>0?100:0) : Math.round((a-b)/b*100);
      const daySeries=Array.from({length:7},(_,k)=>{
        const day=weekAgo(6-k);
        return { label:new Date(day+"T00:00:00").toLocaleDateString("ar-SA",{weekday:"narrow"}),
                 value:visits.filter(v=>v.date===day).length };
      });

      /* الإجراءات */
      async function markDone(t){
        setBusy(t.tbl+t.id);
        const r=await softUpdateById(t.tbl,t.id,{ followup_status:"تمت", last_contact:today, next_followup:null });
        setBusy(null);
        if(!r.ok){ toast("تعذّر التحديث","err"); return; }
        setD(prev=>({ ...prev, [t.tbl]: prev[t.tbl].map(x=>x.id===t.id?{...x,followup_status:"تمت",next_followup:null,last_contact:today}:x) }));
        logActivity("تعديل",t.tbl,"متابعة",t.name);
        toast("تمّت متابعة "+t.name,"ok");
      }
      async function snooze(t,days){
        const nd=addDays(days);
        setBusy(t.tbl+t.id);
        const r=await softUpdateById(t.tbl,t.id,{ next_followup:nd, followup_status:"مجدولة" });
        setBusy(null);
        if(!r.ok){ toast("تعذّر التأجيل","err"); return; }
        setD(prev=>({ ...prev, [t.tbl]: prev[t.tbl].map(x=>x.id===t.id?{...x,next_followup:nd,followup_status:"مجدولة"}:x) }));
        toast("أُجّلت متابعة "+t.name+" إلى "+nd,"info");
      }

      const dateLabel=new Date().toLocaleDateString("ar-SA",{weekday:"long",day:"numeric",month:"long"});

      return (
        <div className="space-y-5">

          {/* ═══ الترويسة: التاريخ، مدينة اليوم، والفعل الأساسي ═══ */}
          <section className="card p-5 sm:p-6 relative overflow-hidden">
            <div className="flex items-start justify-between gap-5 flex-wrap">
              <div className="min-w-0">
                <div className="eyebrow">{dateLabel}</div>
                <h1 className="t-3xl mt-2">
                  {overdue.length
                    ? <><span style={{color:"var(--danger)"}} className="tnum">{overdue.length}</span> متابعة متأخرة
                        {dueToday.length>0 && <span className="txt-muted" style={{fontWeight:400}}> و<span className="tnum">{dueToday.length}</span> مستحقّة اليوم</span>}</>
                    : dueToday.length
                      ? <><span className="tnum">{dueToday.length}</span> متابعة مستحقّة اليوم</>
                      : <>يومك صافٍ من المتابعات</>}
                </h1>
                <p className="lede mt-2 max-w-lg">
                  {planCity
                    ? <>خطّة اليوم: <b style={{color:"var(--ink)"}}>{planCity}</b>{tomorrowCity?<> · وغدًا {tomorrowCity}</>:null}</>
                    : <>ما حدّدت مدينة اليوم بعد — <button onClick={()=>onGo&&onGo("plan")} className="tap underline underline-offset-4 py-1 px-0.5 rounded-[4px]" style={{color:"var(--ink)",fontWeight:500}}>حدّدها من الخطة الأسبوعية</button>.</>}
                </p>
              </div>

              <div className="flex items-center gap-2 flex-wrap shrink-0">
                {tasks.some(t=>t.phone) && (
                  <button onClick={()=>setCallOpen(true)} className="btn btn-outline press tap">
                    <Icon n="target" s={14}/> ابدأ جولة اتصال
                  </button>)}
              </div>
            </div>

            {/* شريط تغطية مدن جازان — يجعل الفراغ الجغرافي مرئيًا بدل أن يظل رقمًا */}
            <div className="mt-6 pt-5" style={{borderTop:"1px solid var(--line)"}}>
              <div className="flex items-baseline justify-between gap-3 mb-3">
                <span className="eyebrow">تغطية مدن جازان</span>
                <span className="t-chip txt-dim">آخر ٣٠ يومًا</span>
              </div>
              <div className="flex flex-wrap gap-1.5">
                {CITIES.map(city=>{
                  const n=visits.filter(v=>v.location===city && v.date>=weekAgo(30)).length;
                  const planned=planCity===city;
                  return (
                    <button key={city} onClick={()=>onGo&&onGo("plan")}
                      title={n?`${n} زيارة خلال ٣٠ يومًا`:"لا زيارات خلال ٣٠ يومًا"}
