    /* ===== تقرير متابعة الدهانين: سجل تفاعل كامل لكل دهان مع فلاتر وبحث وفرز وتصدير ===== */
    const FOLLOWUP_TYPES=[...INTERACTION_TYPES,"تحديث بيانات"];
    function PainterFollowupReport() {
      const cutDate=days=>{ const d=new Date(); d.setDate(d.getDate()-days); return d.toISOString().slice(0,10); };
      const [range,setRange]=useState({from:cutDate(180),to:TODAY()});
      const [painters,setPainters]=useState(null);
      const [rows,setRows]=useState(null);
      const [error,setError]=useState("");
      const [loading,setLoading]=useState(true);
      const [f,setF]=useState({painter:"الكل",city:"الكل",employee:"الكل",type:"الكل",status:"الكل"});
      const [q,setQ]=useState("");
      const [sortBy,setSortBy]=useState("date_desc");
      const [page,setPage]=useState(1);
      const PAGE_SIZE=25;

      async function load(){
        setLoading(true); setError("");
        try{
          const [p,it]=await Promise.all([
            db.from("painters").select("name,city,status,priority"),
            db.from("interactions").select("*").gte("date",range.from).lte("date",range.to).order("date",{ascending:false}).limit(4000),
          ]);
          if(p.error) throw new Error(p.error.message);
          if(it.error) throw new Error("تأكد من إنشاء جدول interactions: "+it.error.message);
          let al=[];
          try{ const r=await db.from("activity_log").select("*").eq("entity","painters").eq("action","تعديل").gte("created_at",range.from).lte("created_at",range.to+"T23:59:59").order("created_at",{ascending:false}).limit(1500); al=r.data||[]; }catch(e){ al=[]; }
          const merged=[
            ...(it.data||[]).map(x=>({ id:"it_"+x.id, date:x.date||"", ts:x.created_at||x.date, painter:x.painter||"—", type:x.type||"—", summary:x.notes||"", result:x.quote_amount?("قيمة العرض: "+Number(x.quote_amount).toLocaleString()+" ر.س"):"", next_followup:null, user:x.user_name||"—" })),
            ...al.filter(x=>x.entity_label!=="متابعة").map(x=>({ id:"al_"+x.id, date:String(x.created_at||"").slice(0,10), ts:x.created_at, painter:x.record_name||"—", type:"تحديث بيانات", summary:x.entity_label||"تعديل بيانات الدهان", result:"", next_followup:null, user:x.user_name||"—" })),
          ];
          setPainters(p.data||[]); setRows(merged);
        }catch(e){ setError(e.message||"تعذّر تحميل تقرير المتابعة"); }
        finally{ setLoading(false); }
      }
      useEffect(()=>{ load(); },[range.from,range.to]);
      useEffect(()=>{ setPage(1); },[f,q,sortBy]);

      const painterInfo=useMemo(()=>{ const m={}; (painters||[]).forEach(p=>m[p.name]={city:p.city,status:p.status}); return m; },[painters]);
      const employees=useMemo(()=>Array.from(new Set((rows||[]).map(r=>r.user).filter(x=>x&&x!=="—"))).sort((a,b)=>a.localeCompare(b,"ar")),[rows]);
      const painterNames=useMemo(()=>Array.from(new Set((painters||[]).map(p=>p.name).filter(Boolean))).sort((a,b)=>a.localeCompare(b,"ar")),[painters]);

      const filtered=useMemo(()=>{
        if(!rows) return [];
        const ql=q.trim().toLowerCase();
        let out=rows.filter(r=>{
          if(f.painter!=="الكل"&&r.painter!==f.painter) return false;
          if(f.employee!=="الكل"&&r.user!==f.employee) return false;
          if(f.type!=="الكل"&&r.type!==f.type) return false;
          if(f.city!=="الكل"&&(painterInfo[r.painter]?.city!==f.city)) return false;
          if(f.status!=="الكل"&&(painterInfo[r.painter]?.status!==f.status)) return false;
          if(ql&&!(r.painter+" "+r.summary+" "+r.type+" "+r.user).toLowerCase().includes(ql)) return false;
          return true;
        });
        out=[...out].sort((a,b)=>{
          if(sortBy==="date_asc") return String(a.date).localeCompare(String(b.date))||String(a.ts||"").localeCompare(String(b.ts||""));
          if(sortBy==="painter") return String(a.painter).localeCompare(String(b.painter),"ar");
          if(sortBy==="type") return String(a.type).localeCompare(String(b.type),"ar");
          return String(b.date).localeCompare(String(a.date))||String(b.ts||"").localeCompare(String(a.ts||""));
        });
        return out;
      },[rows,f,q,sortBy,painterInfo]);

      const totalPages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));
      const pageRows=filtered.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);

      const kQuotes=filtered.filter(r=>r.type==="عرض سعر").length;
      const kCalls=filtered.filter(r=>r.type==="مكالمة").length;
      const kWa=filtered.filter(r=>r.type==="واتساب").length;
      const kPainters=new Set(filtered.map(r=>r.painter)).size;
      const typeDonut=Object.entries(filtered.reduce((m,r)=>{m[r.type]=(m[r.type]||0)+1;return m;},{})).map(([label,value])=>({label,value,color:STATUS_COLORS[label]||"#64748B"})).sort((a,b)=>b.value-a.value);

      const exportHeaders=["التاريخ","الوقت","الدهان","المدينة","الحالة","نوع التفاعل","الملخص","النتيجة","الموظف"];
      const exportRows=filtered.map(r=>[r.date||"—",fmtTime(r.ts),r.painter,painterInfo[r.painter]?.city||"—",painterInfo[r.painter]?.status||"—",r.type,r.summary||"—",r.result||"—",r.user]);
      const doPrint=()=>{
        let body=kpisHtml([["سجلات مطابقة",filtered.length],["دهانون مشمولون",kPainters],["مكالمات",kCalls],["محادثات واتساب",kWa],["عروض أسعار",kQuotes]]);
        body+="<h2>سجل التفاعلات</h2>"+tableHtml(exportHeaders,exportRows);
        printReport("تقرير متابعة الدهانين", body);
      };

      const selCls="rounded-lg px-2.5 py-2 text-xs font-semibold outline-none "+cInput;

      return (
        <div className="space-y-4">
          <div className={"rounded-2xl p-5 "+cCard}>
            <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-xl flex items-center justify-center text-white" style={{background:"linear-gradient(135deg,#9333EA,#7C3AED)"}}><Icon n="user" s={20}/></div>
                <div><h2 className="font-extrabold">تقرير متابعة الدهانين</h2><p className={"text-xs "+cMuted}>سجل تفاعل كامل لكل دهان — مكالمات، واتساب، عروض أسعار، زيارات وملاحظات</p></div>
              </div>
              <div className="flex items-center gap-2 flex-wrap">
                <button onClick={load} className={"inline-flex items-center gap-1.5 rounded-lg px-3 py-2 text-xs font-bold "+cTrack+" "+cHover}><Icon n="refresh" s={13}/> تحديث</button>
                <button onClick={doPrint} disabled={!rows} className={"inline-flex items-center gap-1.5 rounded-lg px-3 py-2 text-xs font-bold disabled:opacity-40 "+cTrack+" "+cHover}><Icon n="printer" s={13}/> طباعة / PDF</button>
                <button onClick={()=>exportRowsXLSX("تقرير متابعة الدهانين","المتابعة",exportHeaders,exportRows)} disabled={!rows} className={"inline-flex items-center gap-1.5 rounded-lg px-3 py-2 text-xs font-bold disabled:opacity-40 "+cTrack+" "+cHover}><Icon n="download" s={13}/> Excel</button>
                <button onClick={()=>exportRowsCSV("تقرير_متابعة_الدهانين",exportHeaders,exportRows)} disabled={!rows} className={"inline-flex items-center gap-1.5 rounded-lg px-3 py-2 text-xs font-bold disabled:opacity-40 "+cTrack+" "+cHover}><Icon n="download" s={13}/> CSV</button>
              </div>
            </div>

            {/* الفلاتر */}
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 gap-2 mb-2">
              <label className="block col-span-1"><span className={"text-[10px] font-bold "+cMuted}>من تاريخ</span><input type="date" value={range.from} onChange={e=>setRange({...range,from:e.target.value})} className={"w-full "+selCls}/></label>
              <label className="block col-span-1"><span className={"text-[10px] font-bold "+cMuted}>إلى تاريخ</span><input type="date" value={range.to} onChange={e=>setRange({...range,to:e.target.value})} className={"w-full "+selCls}/></label>
              <label className="block"><span className={"text-[10px] font-bold "+cMuted}>الدهان</span><select value={f.painter} onChange={e=>setF({...f,painter:e.target.value})} className={"w-full "+selCls}><option value="الكل">الكل</option>{painterNames.map(n=><option key={n} value={n}>{n}</option>)}</select></label>
              <label className="block"><span className={"text-[10px] font-bold "+cMuted}>المدينة</span><select value={f.city} onChange={e=>setF({...f,city:e.target.value})} className={"w-full "+selCls}><option value="الكل">الكل</option>{CITIES.map(n=><option key={n} value={n}>{n}</option>)}</select></label>
              <label className="block"><span className={"text-[10px] font-bold "+cMuted}>الموظف</span><select value={f.employee} onChange={e=>setF({...f,employee:e.target.value})} className={"w-full "+selCls}><option value="الكل">الكل</option>{employees.map(n=><option key={n} value={n}>{n}</option>)}</select></label>
              <label className="block"><span className={"text-[10px] font-bold "+cMuted}>نوع التفاعل</span><select value={f.type} onChange={e=>setF({...f,type:e.target.value})} className={"w-full "+selCls}><option value="الكل">الكل</option>{FOLLOWUP_TYPES.map(n=><option key={n} value={n}>{n}</option>)}</select></label>
              <label className="block"><span className={"text-[10px] font-bold "+cMuted}>حالة الدهان</span><select value={f.status} onChange={e=>setF({...f,status:e.target.value})} className={"w-full "+selCls}><option value="الكل">الكل</option>{PAINTER_STATUSES.map(n=><option key={n} value={n}>{n}</option>)}</select></label>
            </div>
            <div className="flex items-center gap-2 flex-wrap">
              <div className="relative flex-1 min-w-[180px]">
                <Icon n="search" s={14} c={"absolute top-1/2 -translate-y-1/2 right-3 "+cMuted}/>
                <input value={q} onChange={e=>setQ(e.target.value)} placeholder="بحث بالاسم أو الملخص..." className={"w-full rounded-lg pr-9 pl-3 py-2 text-xs outline-none "+cInput}/>
              </div>
              <select value={sortBy} onChange={e=>setSortBy(e.target.value)} className={selCls}>
                <option value="date_desc">الأحدث أولاً</option>
                <option value="date_asc">الأقدم أولاً</option>
                <option value="painter">حسب اسم الدهان</option>
                <option value="type">حسب نوع التفاعل</option>
              </select>
              {(f.painter!=="الكل"||f.city!=="الكل"||f.employee!=="الكل"||f.type!=="الكل"||f.status!=="الكل"||q)&&(
                <button onClick={()=>{setF({painter:"الكل",city:"الكل",employee:"الكل",type:"الكل",status:"الكل"});setQ("");}} className={"text-xs font-bold px-3 py-2 rounded-lg "+cTrack+" "+cHover}>مسح الفلاتر</button>
              )}
            </div>
          </div>

          {loading?<ReportSkeleton/>:error?<ReportError msg={error} onRetry={load}/>:(
            <>
              <div className={"rounded-2xl p-5 "+cCard}>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
                  <Kpi label="سجلات مطابقة" value={filtered.length} color="#7C3AED" icon="doc"/>
                  <Kpi label="دهانون مشمولون" value={kPainters} color="#16A34A" icon="brush"/>
                  <Kpi label="مكالمات" value={kCalls} color="#2563EB" icon="target"/>
                  <Kpi label="عروض أسعار" value={kQuotes} color="#9333EA" icon="trophy"/>
                </div>
                {typeDonut.length>0&&(<div className="max-w-xs mx-auto sm:mx-0"><div className={"text-xs font-bold mb-2 "+cMuted}>توزيع التفاعلات حسب النوع</div><Donut data={typeDonut} size={130} centerLabel="سجل"/></div>)}
              </div>

              <div className={"rounded-2xl p-5 "+cCard}>
                <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
                  <h3 className="font-bold text-sm">سجل التفاعلات</h3>
                  <span className={"text-xs "+cMuted}>{filtered.length?`عرض ${(page-1)*PAGE_SIZE+1}–${Math.min(page*PAGE_SIZE,filtered.length)} من ${filtered.length}`:""}</span>
                </div>
                {filtered.length===0?<ReportEmpty text="لا توجد سجلات مطابقة لهذه الفلاتر."/>:(
                  <>
                    <div className="overflow-x-auto -mx-1">
                      <table className="w-full text-xs min-w-[860px]">
                        <thead><tr className={"text-right "+cMuted}>
                          <th className="px-2 py-2 font-bold">التاريخ / الوقت</th>
                          <th className="px-2 py-2 font-bold">الدهان</th>
                          <th className="px-2 py-2 font-bold">المدينة</th>
                          <th className="px-2 py-2 font-bold">الحالة</th>
                          <th className="px-2 py-2 font-bold">النوع</th>
                          <th className="px-2 py-2 font-bold">الملخص</th>
                          <th className="px-2 py-2 font-bold">النتيجة</th>
                          <th className="px-2 py-2 font-bold">الموظف</th>
                        </tr></thead>
                        <tbody>
                          {pageRows.map(r=>(
                            <tr key={r.id} className={"border-t "+cBorder+" "+cHover}>
                              <td className="px-2 py-2.5 whitespace-nowrap"><div className="font-semibold">{r.date||"—"}</div><div className={cMuted}>{fmtTime(r.ts)}</div></td>
                              <td className="px-2 py-2.5 font-bold whitespace-nowrap">{r.painter}</td>
                              <td className="px-2 py-2.5 whitespace-nowrap">{painterInfo[r.painter]?.city||"—"}</td>
                              <td className="px-2 py-2.5 whitespace-nowrap">{painterInfo[r.painter]?.status?<Badge status={painterInfo[r.painter].status}/>:"—"}</td>
                              <td className="px-2 py-2.5 whitespace-nowrap"><Pill text={r.type} color={STATUS_COLORS[r.type]}/></td>
                              <td className="px-2 py-2.5 max-w-[220px] truncate" title={r.summary}>{r.summary||"—"}</td>
                              <td className="px-2 py-2.5 max-w-[180px] truncate" title={r.result}>{r.result||"—"}</td>
                              <td className="px-2 py-2.5 whitespace-nowrap">{r.user}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                    {totalPages>1&&(
                      <div className="flex items-center justify-center gap-2 mt-4">
                        <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1} className={"px-3 py-1.5 rounded-lg text-xs font-bold disabled:opacity-30 "+cTrack+" "+cHover}>السابق</button>
                        <span className={"text-xs font-bold "+cMuted}>صفحة {page} من {totalPages}</span>
                        <button onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={page===totalPages} className={"px-3 py-1.5 rounded-lg text-xs font-bold disabled:opacity-30 "+cTrack+" "+cHover}>التالي</button>
                      </div>
                    )}
                  </>
                )}
              </div>
            </>
          )}
        </div>
      );
    }

    function LegacyReportsOverview() {
      const [data,setData]=useState(null);
      useEffect(()=>{(async()=>{
        const [p,pr,c,v,t]=await Promise.all([db.from("painters").select("*"),db.from("projects").select("*"),db.from("contractors").select("*"),db.from("visits").select("*"),db.from("trainings").select("*")]);
        setData({painters:p.data||[],projects:pr.data||[],contractors:c.data||[],visits:v.data||[],trainings:t.data||[]});
      })()},[]);
      const cut=days=>{ const dt=new Date(); dt.setDate(dt.getDate()-days); return dt.toISOString().slice(0,10); };
      // كل الرصدات (منتجات) مع سياق المدينة/الموقع
      function allFindings(){ const recs=[];
        (data.projects||[]).forEach(p=>parseFindings(p.products).forEach(f=>recs.push({...f,where:p.name,city:p.city||"—",src:"موقع"})));
        (data.visits||[]).forEach(v=>parseFindings(v.products).forEach(f=>recs.push({...f,where:v.project||v.target,city:v.location||"—",src:"زيارة"})));
        return recs; }

      function periodReport(label,days){ if(!data)return; const since=cut(days);
        const v=data.visits.filter(x=>String(x.date||"")>=since);
        const pr=data.projects.filter(x=>String(x.created_at||"").slice(0,10)>=since);
        const recs=allFindings(); const comp=recs.filter(r=>r.c&&r.c!==OWN_COMPANY);
        const cities=new Set(v.map(x=>x.location).filter(Boolean));
        let body=kpisHtml([["زيارات الفترة",v.length],["مواقع جديدة",pr.length],["مدن تمّت تغطيتها",cities.size],["منتجات منافسين مرصودة",comp.length]]);
        body+="<h2>زيارات الفترة</h2>"+tableHtml(["عنوان الزيارة","النوع","المدينة","التاريخ","النتيجة"],v.map(x=>[x.target,x.type,x.location,x.date,x.results]));
        body+="<h2>مواقع جديدة في الفترة</h2>"+tableHtml(["الموقع","المدينة","النوع","الدهان","المطوّر"],pr.map(x=>[x.name,x.city,x.type,x.painter,x.contractor]));
        printReport(label, body);
      }
      function paintersReport(){ if(!data)return;
        const projByPainter={}; data.projects.forEach(p=>{if(p.painter)projByPainter[p.painter]=(projByPainter[p.painter]||0)+1;});
        const visByPainter={}; data.visits.forEach(v=>{const k=v.painter||v.target; if(k)visByPainter[k]=(visByPainter[k]||0)+1;});
        const rows=data.painters.map(p=>[p.name,p.city,p.status,p.contact_method||"—",projByPainter[p.name]||0,visByPainter[p.name]||0,p.rating||0,p.last_visit||p.last_contact||"—"]);
        let body=kpisHtml([["الدهانين",data.painters.length],["النشطون",data.painters.filter(p=>p.status==="نشط").length],["تمّت متابعتهم",data.painters.filter(p=>p.contact_method).length],["منافسون",data.painters.filter(p=>p.status==="منافس").length]]);
        body+="<h2>نشاط الدهانين</h2>"+tableHtml(["الاسم","المدينة","الحالة","طريقة المتابعة","المواقع","الزيارات","التقييم","آخر تواصل"],rows);
        printReport("تقرير نشاط الدهانين", body);
      }
      function sitesReport(){ if(!data)return;
        const rows=data.projects.map(p=>[p.name,p.type,p.city,p.owner||"—",p.contractor||"—",p.painter||"—",p.stage||"—"]);
        const byCity={}; data.projects.forEach(p=>{const k=p.city||"غير محدد"; byCity[k]=(byCity[k]||0)+1;});
        let body=kpisHtml([["المواقع",data.projects.length],["مرتبطة بدهان",data.projects.filter(p=>p.painter&&p.painter!=="-").length],["مرتبطة بمطوّر",data.projects.filter(p=>p.contractor&&p.contractor!=="-").length],["مدن",Object.keys(byCity).length]]);
        body+="<h2>المواقع حسب المدينة</h2>"+tableHtml(["المدينة","عدد المواقع"],Object.entries(byCity).sort((a,b)=>b[1]-a[1]));
        body+="<h2>تفاصيل المواقع</h2>"+tableHtml(["الموقع","النوع","المدينة","المالك","المطوّر","الدهان","المرحلة"],rows);
        printReport("تقرير المواقع", body);
      }
      function developersReport(){ if(!data)return;
        const rows=data.contractors.map(c=>[c.name,c.city||"—",c.phone||"—",c.contact||"—",c.projects_count||0,c.priority||"—",c.followup_status||"—"]);
        const byCity={}; data.contractors.forEach(c=>{const k=c.city||"غير محدد"; byCity[k]=(byCity[k]||0)+1;});
        let body=kpisHtml([["المطوّرون العقاريون",data.contractors.length],["مدن",Object.keys(byCity).length],["أولوية عالية",data.contractors.filter(c=>c.priority==="عالية").length]]);
        body+="<h2>التوزيع حسب المدينة</h2>"+tableHtml(["المدينة","العدد"],Object.entries(byCity).sort((a,b)=>b[1]-a[1]));
        body+="<h2>تفاصيل المطوّرين العقاريين</h2>"+tableHtml(["الاسم","المدينة","الجوال","المسؤول","عدد المواقع","الأولوية","حالة المتابعة"],rows);
        printReport("تقرير المطوّرين العقاريين", body);
      }
      function marketMonitorReport(){ if(!data)return;
        const comp=allFindings().filter(r=>r.c&&r.c!==OWN_COMPANY);
        if(comp.length===0){ alert("لا توجد منتجات منافسين مرصودة بعد."); return; }
        const byCompany={}; comp.forEach(r=>byCompany[r.c]=(byCompany[r.c]||0)+1);
        const ranked=Object.entries(byCompany).sort((a,b)=>b[1]-a[1]);
        const total=comp.length;
        const barRow=(label,val)=>{ const pct=Math.round(val/total*100); const col=companyColor(label);
          return `<div style="margin:7px 0"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><b>${label}</b><b style="color:${col}">${pct}% · ${val}</b></div><div style="height:12px;border-radius:7px;background:#eef2f7;overflow:hidden"><div style="height:12px;width:${pct}%;background:${col};border-radius:7px"></div></div></div>`; };
        let body=kpisHtml([["رصدات المنافسين",total],["عدد المنافسين",ranked.length],["مواقع مرصودة",new Set(comp.map(r=>r.where)).size],["مدن",new Set(comp.map(r=>r.city)).size]]);
        body+="<h2>المنافسون الأكثر حضوراً</h2>"+ranked.map(([l,v])=>barRow(l,v)).join("");
        body+="<h2>سجلّ الرصدات</h2>"+tableHtml(["المنافس","المنتج","العائلة","الموقع","المدينة","المصدر"],comp.map(r=>[r.c,r.p,r.f,r.where,r.city,r.src]));
        printReport("تقرير رصد السوق", body);
      }
      function marketReport(){ if(!data)return; const ms=computeMarketShare(data.projects,data.visits);
        if(ms.total===0){ alert("لا توجد منتجات مرصودة بعد لحساب الحصة السوقية."); return; }
        const overall=Object.entries(ms.overall).sort((a,b)=>b[1]-a[1]);
        const ownPct=Math.round((ms.overall[OWN_COMPANY]||0)/ms.total*100);
        const rank=overall.findIndex(x=>x[0]===OWN_COMPANY)+1;
        const barRow=(label,val)=>{ const pct=Math.round(val/ms.total*100); const col=companyColor(label); const own=label===OWN_COMPANY;
          return `<div style="margin:7px 0"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><b style="${own?'color:'+col:''}">${label}${own?' ★':''}</b><b style="color:${col}">${pct}% · ${val}</b></div><div style="height:12px;border-radius:7px;background:#eef2f7;overflow:hidden"><div style="height:12px;width:${pct}%;background:${col};border-radius:7px"></div></div></div>`; };
        // حصة الجزيرة لكل مدينة
        const cityAgg={}; CITIES.forEach(c=>cityAgg[c]={own:0,tot:0});
        const addC=(city,prods)=>{ if(cityAgg[city]==null)return; parseFindings(prods).forEach(f=>{ if(!f.c)return; cityAgg[city].tot++; if(f.c===OWN_COMPANY)cityAgg[city].own++; }); };
        data.projects.forEach(p=>addC(p.city,p.products)); data.visits.forEach(v=>addC(v.location,v.products));
        const cityRows=Object.entries(cityAgg).filter(([,o])=>o.tot>0).map(([c,o])=>[c,o.tot,Math.round(o.own/o.tot*100)+"%"]).sort((a,b)=>b[1]-a[1]);
        let body=kpisHtml([["حصة الجزيرة",ownPct+"%"],["ترتيب الجزيرة","#"+(rank||"-")],["إجمالي الرصدات",ms.total],["عدد الشركات",overall.length]]);
        body+="<h2>الحصة الإجمالية بين الشركات</h2>"+overall.map(([l,v])=>barRow(l,v)).join("");
        body+="<h2>حصة الجزيرة حسب المدينة</h2>"+tableHtml(["المدينة","إجمالي الرصدات","حصة الجزيرة"],cityRows);
        CATALOG.forEach(fam=>{ const m=ms.perFamily[fam.family]||{}; const tot=Object.values(m).reduce((a,b)=>a+b,0); if(!tot) return;
          const rows=Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([c,v])=>[c+(c===OWN_COMPANY?" ★":""),v,Math.round(v/tot*100)+"%"]);
          body+=`<h2 style="border-right-color:${fam.color};color:${fam.color}">${fam.family} (${tot} رصدة)</h2>`+tableHtml(["الشركة","عدد الرصدات","الحصة"],rows); });
        printReport("تقرير الحصة السوقية", body);
      }

      async function dl(id){ const {data:d}=await db.from(CONFIG[id].table).select("*"); exportCSV(CONFIG[id],d||[]); }
      const counts=data?Object.fromEntries(Object.keys(CONFIG).map(id=>[id,(data[CONFIG[id].table]||[]).length])):null;
      const repBtn="flex items-center justify-center gap-1.5 rounded-xl px-3 py-3 text-xs font-bold "+cTrack+" "+cAccent+" "+cHover;

      return (
        <div className="space-y-4">
          <div className={"rounded-2xl p-5 "+cCard}>
            <div className="flex items-center gap-3 pb-3 mb-4 border-b border-gray-200 dark:border-slate-800"><div className="w-11 h-11 rounded-xl flex items-center justify-center text-white font-extrabold" style={{background:"linear-gradient(135deg,#4f46e5,#4338ca)"}}>ج</div><div><h2 className="font-extrabold">تقارير دورية وتصدير عام</h2><p className={"text-xs "+cMuted}>{new Date().toLocaleDateString("ar")}</p></div></div>
            {!counts?<div className={"text-sm "+cMuted}>جاري التحضير...</div>:(
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">{Object.keys(CONFIG).map(id=>(<div key={id} className={"rounded-xl p-3 "+cTrack}><div className={"text-xs "+cMuted}>{CONFIG[id].title}</div><div className={"text-xl font-extrabold "+cAccent}>{counts[id]??"—"}</div></div>))}</div>
            )}
          </div>

          <div className={"rounded-2xl p-4 "+cCard}>
            <div className="flex items-center gap-2 mb-3"><Icon n="printer" s={16} c={cAccent}/><h3 className="font-bold text-sm">تقارير احترافية جاهزة للطباعة (PDF)</h3></div>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
              <button onClick={()=>periodReport("التقرير الأسبوعي",7)} className={repBtn}><Icon n="clock" s={14}/> تقرير أسبوعي</button>
              <button onClick={()=>periodReport("التقرير الشهري",30)} className={repBtn}><Icon n="clock" s={14}/> تقرير شهري</button>
              <button onClick={paintersReport} className={repBtn}>نشاط الدهانين</button>
              <button onClick={sitesReport} className={repBtn}>تقرير المواقع</button>
              <button onClick={developersReport} className={repBtn}>المطوّرون العقاريون</button>
              <button onClick={marketMonitorReport} className={repBtn}>رصد السوق (المنافسون)</button>
              <button onClick={marketReport} className={repBtn+" !text-white"} style={{background:"linear-gradient(135deg,#4f46e5,#7c3aed)"}}><Icon n="trophy" s={14}/> الحصة السوقية</button>
            </div>
            <p className={"text-xs mt-3 "+cMuted}>يفتح التقرير في نافذة جديدة منسّقة، استخدم "طباعة / حفظ PDF" لحفظه.</p>
          </div>

          <div className={"rounded-2xl p-4 "+cCard}>
            <h3 className="font-bold text-sm mb-3">تصدير البيانات (Excel/CSV)</h3>
            <div className="flex flex-wrap gap-2">{Object.keys(CONFIG).map(id=>(<button key={id} onClick={()=>dl(id)} className={"px-3 py-2 rounded-lg text-xs font-bold "+cAccent+" "+cTrack+" "+cHover}>{CONFIG[id].title}</button>))}</div>
          </div>
        </div>
      );
    }

    /* ===== مركز التقارير: غلاف يجمع التقرير اليومي، تقرير متابعة الدهانين، والتقارير الدورية ===== */

        const today=TODAY();

        const list=[];
        // خطة الغد
        try{ const plan=JSON.parse(localStorage.getItem("jazeera_weekplan")||"{}"); const tm=new Date(); tm.setDate(tm.getDate()+1); const tIso=tm.toISOString().slice(0,10);
          if(plan[tIso]) list.push({level:"high",title:"📍 زيارة الغد",text:`غداً مخطّط لزيارة مدينة ${plan[tIso]}`,go:"plan"}); }catch(e){}
        const allF=[...(p.data||[]),...(pr.data||[]),...(c.data||[])].filter(x=>x.next_followup&&x.next_followup<today&&x.followup_status!=="تمت"&&x.followup_status!=="ملغاة");
        allF.forEach(x=>list.push({level:"high",title:"متابعة متأخرة",text:`${x.name} — كان موعدها ${x.next_followup}`,go:"tasks"}));
        (t.data||[]).filter(x=>x.date&&x.date>=today).forEach(x=>list.push({level:"mid",title:"تدريب قادم",text:`${x.name} — ${x.date}`,go:"trainings"}));
        setNotifs(list);
      }
      // إطلاق إشعارات الجوال للمهام المستحقّة + فحص دوري
      function pushPhoneNotifications(){ if(!notifEnabled()) return;
        const today=TODAY();
        // تذكير خطة الغد بالمدينة
        try{ const plan=JSON.parse(localStorage.getItem("jazeera_weekplan")||"{}"); const tm=new Date(); tm.setDate(tm.getDate()+1); const tIso=tm.toISOString().slice(0,10);
          if(plan[tIso]) fireNotification("📍 زيارة الغد", `غداً مخطّط لزيارة مدينة ${plan[tIso]} — راجع أبرز الدهانين والمطوّرين هناك.`, "plan-tomorrow"); }catch(e){}
        Promise.all([db.from("painters").select("name,next_followup,followup_status"),db.from("projects").select("name,next_followup,followup_status"),db.from("contractors").select("name,next_followup,followup_status"),db.from("trainings").select("name,date")]).then(([p,pr,c,t])=>{
          const due=[...(p.data||[]),...(pr.data||[]),...(c.data||[])].filter(x=>x.next_followup&&x.next_followup<=today&&x.followup_status!=="تمت"&&x.followup_status!=="ملغاة");
          if(due.length){ const overdue=due.filter(x=>x.next_followup<today).length;
            fireNotification("📋 مهامك الميدانية اليوم", `لديك ${due.length} متابعة مستحقّة${overdue?` · منها ${overdue} متأخرة` : ""}.`, "tasks-due"); }
          (t.data||[]).filter(x=>x.date===today).forEach(x=>fireNotification("🎓 تدريب اليوم", x.name, "training-"+x.name));
        }).catch(()=>{});
      }
      useEffect(()=>{ loadNotifs(); cloudLoadCatalog();
        const run=()=>pushPhoneNotifications();
        const t=setTimeout(run,3000);                       // عند الفتح
        const iv=setInterval(run, 30*60*1000);               // كل نصف ساعة أثناء فتح التطبيق
        const onVis=()=>{ if(document.visibilityState==="visible") run(); };
        document.addEventListener("visibilitychange",onVis);
        return ()=>{ clearTimeout(t); clearInterval(iv); document.removeEventListener("visibilitychange",onVis); };
      },[]);
      useEffect(()=>{ if(gq.trim().length<2){setResults([]);return;} const tm=setTimeout(async()=>{
        const [p,pr,c]=await Promise.all([db.from("painters").select("id,name").ilike("name","%"+gq+"%").limit(5),db.from("projects").select("id,name").ilike("name","%"+gq+"%").limit(5),db.from("contractors").select("id,name").ilike("name","%"+gq+"%").limit(5)]);
        const r=[]; (p.data||[]).forEach(x=>r.push({t:"دهان",n:x.name,go:"painters"})); (pr.data||[]).forEach(x=>r.push({t:"موقع",n:x.name,go:"projects"})); (c.data||[]).forEach(x=>r.push({t:"مطور عقاري",n:x.name,go:"contractors"})); setResults(r);
      },300); return ()=>clearTimeout(tm); },[gq]);

      const go=(id,pre)=>{ setTab(id); setSideOpen(false); setNotifOpen(false); setGq(""); setResults([]); if(pre)setPrefill({tab:id,data:pre}); window.scrollTo(0,0); };

            <div className="p-5 flex items-center gap-3" style={{background:"linear-gradient(135deg,#4f46e5,#4338ca)"}}>

              <div><div className="text-white font-extrabold text-sm">نظام الجزيرة الميداني</div><div className="text-indigo-200 text-xs mt-0.5">Jazeera Field System</div></div>
            </div>
            <nav className="flex-1 overflow-y-auto p-3 space-y-1">
              {NAV.map(([k,label])=>(<button key={k} onClick={()=>go(k)} className={"w-full flex items-center px-3 py-2.5 rounded-xl text-sm font-semibold transition text-right "+(tab===k?"bg-indigo-600 text-white shadow-sm":cMuted+" "+cHover)}>{label}</button>))}
            </nav>
            <div className={"p-4 border-t "+cBorder}>
              <div className={"text-xs mb-2 "+cMuted}>المستخدم: <span className="font-bold">{currentUserName()}</span></div>
              <button onClick={()=>{ if(confirm("تسجيل الخروج من النظام؟")){ setSession(null); window.location.reload(); } }} className="w-full flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold text-red-600 dark:text-red-400 border border-red-200 dark:border-red-900/50 hover:bg-red-50 dark:hover:bg-red-900/20 transition"><Icon n="close" s={14}/> تسجيل الخروج</button>
            </div>
          </aside>
          {sideOpen&&<div className="fixed inset-0 bg-black/40 z-30 lg:hidden" onClick={()=>setSideOpen(false)}/>}

          <div className="lg:mr-64">

              <button onClick={()=>setSideOpen(true)} className="lg:hidden p-2 rounded-xl hover:bg-white/10"><Icon n="menu"/></button>

              <div className="relative flex-1 max-w-md">
                <div className="flex items-center gap-2 rounded-xl px-3 py-2 bg-white/10 text-white"><Icon n="search" s={16} c="text-white/70"/><input value={gq} onChange={e=>setGq(e.target.value)} placeholder="بحث شامل..." className="bg-transparent outline-none text-xs w-full placeholder-white/50"/>{gq&&<button onClick={()=>setGq("")} className="text-white/70"><Icon n="close" s={14}/></button>}</div>
                {results.length>0&&(<div className={"absolute top-full mt-1 w-full rounded-xl shadow-xl overflow-hidden z-30 text-gray-800 dark:text-slate-100 "+cCard}>{results.map((r,i)=>(<button key={i} onClick={()=>go(r.go)} className={"w-full flex items-center justify-between px-3 py-2.5 text-xs text-right "+cHover}><span className="font-bold">{r.n}</span><Badge status={r.t}/></button>))}</div>)}
              </div>
              <div className="mr-auto flex items-center gap-1">
                <button onClick={()=>setQuickOpen(true)} title="زيارة سريعة" className="p-2 rounded-xl bg-white/10 hover:bg-white/20"><Icon n="bolt"/></button>
                <div className="relative">
                  <button onClick={()=>setNotifOpen(o=>{ const nv=!o; if(nv) setAck(highCount); return nv; })} className="p-2 rounded-xl hover:bg-white/10 relative"><Icon n="bell"/>{unseen>0&&<span className="absolute top-0.5 left-0.5 min-w-4 h-4 px-0.5 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center">{unseen}</span>}</button>

                    <div className={"p-2.5 border-b "+cBorder}>{notifOn?<div className="flex items-center gap-1.5 text-xs font-bold text-emerald-600"><Icon n="check" s={14}/> تنبيهات الجوال مفعّلة</div>:<button onClick={async()=>{ if(await enableNotifications()){ setNotifOn(true); pushPhoneNotifications(); } }} className={"w-full rounded-xl py-2 text-xs font-bold flex items-center justify-center gap-1.5 "+cBtn}><Icon n="bell" s={14}/> تفعيل تنبيهات الجوال</button>}</div>
                    <div className="max-h-72 overflow-y-auto">{notifs.length===0?<div className={"p-3 text-xs "+cMuted}>لا توجد تنبيهات</div>:notifs.map((n,i)=>(<button key={i} onClick={()=>{ if(n.go) go(n.go); }} className={"w-full p-3 border-b flex gap-2 text-right "+cBorder+" "+cHover}><span className="w-2 h-2 rounded-full mt-1.5 shrink-0" style={{background:n.level==="high"?"#DC2626":"#D97706"}}/><div className="min-w-0"><div className="text-xs font-bold">{n.title}</div><div className={"text-xs "+cMuted}>{n.text}</div></div></button>))}</div></div>)}
                </div>
                <button onClick={()=>setDark(!dark)} className="p-2 rounded-xl hover:bg-white/10"><Icon n={dark?"sun":"moon"}/></button>

              <div className={"text-center text-xs py-4 "+cMuted}>نظام الجزيرة الميداني — مربوط بقاعدة بيانات Supabase</div>
            </main>
          </div>

          <QuickVisit open={quickOpen} onClose={()=>setQuickOpen(false)} onSaved={()=>{ loadNotifs(); if(tab==="visits")go("visits"); }}/>
        </div>
      );
    }

    /* ===== شاشة تسجيل الدخول ===== */
    function Login({ onSuccess }){
      const [username,setUsername]=useState(""); const [password,setPassword]=useState("");
      const [show,setShow]=useState(false); const [busy,setBusy]=useState(false); const [err,setErr]=useState("");

      async function submit(e){
        if(e) e.preventDefault();
        const u=username.trim();
        if(!u || !password){ setErr("اكتب اسم المستخدم وكلمة المرور"); return; }
        setBusy(true); setErr("");
        try{
          const { data, error } = await db.rpc("app_login", { p_username: u, p_password: password });
          if(error){ setErr("تعذّر الاتصال: "+error.message); setBusy(false); return; }
          const row = Array.isArray(data) ? data[0] : data;
          if(!row || !row.id){ setErr("اسم المستخدم أو كلمة المرور غير صحيحة"); setBusy(false); return; }
          const s={ id:row.id, username:row.username, name:row.name||row.username };
          setSession(s); onSuccess(s);
        }catch(ex){ setErr("حدث خطأ غير متوقع. حاول مرة أخرى."); setBusy(false); }
      }

      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-gray-50 dark:bg-slate-950" style={{background:"linear-gradient(135deg,#312e81,#1e1b4b 60%,#0f172a)"}}>
          <div className="w-full max-w-sm">
            <div className="flex flex-col items-center mb-6">
              <div className="w-16 h-16 rounded-2xl bg-white/15 border border-white/25 flex items-center justify-center text-white font-extrabold text-3xl mb-3">ج</div>
              <div className="text-white font-extrabold text-lg">نظام الجزيرة الميداني</div>
              <div className="text-indigo-200 text-xs mt-1">Jazeera Field System</div>
            </div>
            <form onSubmit={submit} className="bg-white dark:bg-slate-900 rounded-2xl shadow-xl p-6 space-y-4">
              <div className="text-center font-extrabold text-gray-800 dark:text-slate-100">تسجيل الدخول</div>
              <div>
                <label className={"block text-xs font-bold mb-1.5 "+cMuted}>اسم المستخدم</label>
                <input value={username} onChange={e=>setUsername(e.target.value)} autoFocus autoComplete="username"
                  autoCapitalize="off" autoCorrect="off" spellCheck={false} dir="ltr"
                  className={"w-full rounded-xl px-3 py-2.5 text-sm outline-none text-right "+cInput} placeholder="اكتب اسم المستخدم"/>
              </div>
              <div>
                <label className={"block text-xs font-bold mb-1.5 "+cMuted}>كلمة المرور</label>
                <div className="relative">
                  <input value={password} onChange={e=>setPassword(e.target.value)} type={show?"text":"password"} autoComplete="current-password"
                    className={"w-full rounded-xl px-3 py-2.5 text-sm outline-none "+cInput} placeholder="••••••••"/>
                  <button type="button" onClick={()=>setShow(!show)} className={"absolute left-2 top-1/2 -translate-y-1/2 text-xs font-bold "+cAccent}>{show?"إخفاء":"إظهار"}</button>
                </div>
              </div>
              {err&&<div className="text-xs text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/20 rounded-xl px-3 py-2 text-center font-bold">{err}</div>}
              <button type="submit" disabled={busy} className={"w-full rounded-xl py-2.5 text-sm font-bold transition disabled:opacity-60 "+cBtn}>{busy?"جارٍ التحقق...":"دخول"}</button>
            </form>
            <div className="text-center text-indigo-200/70 text-xs mt-4">للحصول على حساب تواصل مع مسؤول النظام</div>
          </div>
        </div>
      );
    }

    /* ===== الجذر: يقرر عرض الدخول أو التطبيق ===== */
    function Root(){
      const [authed,setAuthed]=useState(!!(SESSION && SESSION.id));
      if(!authed) return <Login onSuccess={()=>setAuthed(true)}/>;
      return <App/>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
  </script>
</body>
</html>
