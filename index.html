    function exportCSV(cfg, rows) {
      const headers=cfg.fields.map(f=>f.label);
      const lines=rows.map(r=>cfg.fields.map(f=>'"'+String(r[f.key]??"").replace(/"/g,'""')+'"').join(","));
      const csv="\uFEFF"+[headers.join(","),...lines].join("\n");
      const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=cfg.title+".csv"; a.click(); URL.revokeObjectURL(a.href);
    }

      const [rows,setRows]=useState([]); const [loading,setLoading]=useState(true); const [error,setError]=useState("");
      const [q,setQ]=useState(""); const [filters,setFilters]=useState({}); const [vmode,setVmode]=useState("cards");
      const [view,setView]=useState("list"); const [selId,setSelId]=useState(null);
      const [editor,setEditor]=useState(null); const [saving,setSaving]=useState(false);
      async function load(){ setLoading(true);setError("");
        const {data,error}=await db.from(cfg.table).select("*").order("created_at",{ascending:false});
        if(error)setError("تعذّر تحميل البيانات: "+error.message); else setRows(data||[]); setLoading(false);
      }
      useEffect(()=>{load()},[]);
      const selected=rows.find(r=>r.id===selId)||null;
      function emptyData(){ const o={}; cfg.fields.forEach(f=>o[f.key]=f.type==="number"?0:(f.type==="select"?(f.opts[0]||""):"")); return o; }
      function openAdd(){ setEditor({mode:"add",id:null,data:emptyData()}); }
      function openEdit(r){ const o={}; cfg.fields.forEach(f=>o[f.key]=r[f.key]??(f.type==="number"?0:"")); setEditor({mode:"edit",id:r.id,data:o}); }
      function setField(k,v){ setEditor(e=>({...e,data:{...e.data,[k]:v}})); }
      async function save(){ if(!String(editor.data[cfg.fields[0].key]||"").trim()){alert("اكتب "+cfg.fields[0].label+" أولاً");return;}
        setSaving(true); const payload={...editor.data};
        cfg.fields.forEach(f=>{ if(f.type==="number")payload[f.key]=Number(payload[f.key]||0); if(f.type==="date"&&!payload[f.key])payload[f.key]=null; });
        let res; if(editor.mode==="add")res=await db.from(cfg.table).insert([payload]); else res=await db.from(cfg.table).update(payload).eq("id",editor.id);
        setSaving(false); if(res.error){alert("خطأ في الحفظ: "+res.error.message);return;} setEditor(null); await load();
      }
      async function remove(r){ if(!confirm("متأكد من الحذف؟"))return; const {error}=await db.from(cfg.table).delete().eq("id",r.id); if(error){alert("خطأ: "+error.message);return;} setView("list");setSelId(null);load(); }

      const filterDefs=(cfg.filterKeys||[]).map(key=>{ const f=cfg.fields.find(x=>x.key===key);
        const opts=[...new Set(rows.map(r=>r[key]).filter(v=>v!==null&&v!==undefined&&v!==""))].map(String).sort();
        return {key,label:f?f.label:key,opts}; });
      const filtered=rows.filter(r=> (q===""||cfg.fields.some(f=>String(r[f.key]||"").includes(q))) && filterDefs.every(fd=>!filters[fd.key]||filters[fd.key]==="الكل"||String(r[fd.key])===filters[fd.key]) );
      const kpis=cfg.kpis?cfg.kpis(rows):[];
      const inputType=f=>f.type==="number"?"number":f.type==="date"?"date":"text";

                    <select key={fd.key} value={filters[fd.key]||"الكل"} onChange={e=>setFilters({...filters,[fd.key]:e.target.value})} className={"rounded-lg px-2.5 py-1.5 text-xs font-semibold outline-none "+cInput}>

                  <div className="flex-1"/>
                  <div className={"flex rounded-lg overflow-hidden border border-gray-200 dark:border-slate-700"}>
                    <button onClick={()=>setVmode("cards")} className={"p-1.5 "+(vmode==="cards"?"bg-indigo-600 text-white":cMuted)} title="كروت"><Icon n="grid" s={16}/></button>
                    <button onClick={()=>setVmode("list")} className={"p-1.5 "+(vmode==="list"?"bg-indigo-600 text-white":cMuted)} title="قائمة"><Icon n="list" s={16}/></button>

                  <button onClick={openAdd} className={"rounded-lg px-3 py-1.5 text-xs font-bold "+cBtn}>{cfg.addLabel}</button>
                  <button onClick={()=>exportCSV(cfg,filtered)} className={"rounded-lg px-3 py-1.5 text-xs font-bold "+cAccent+" "+cTrack+" "+cHover}>تصدير</button>

              </div>

              {loading&&<div className={"text-center py-10 text-sm "+cMuted}>جاري التحميل...</div>}
              {error&&<div className="bg-red-500/10 text-red-600 rounded-xl p-3 text-sm">{error}</div>}
              {!loading&&!error&&filtered.length===0&&<div className={"text-center py-10 text-sm "+cMuted}>لا توجد نتائج مطابقة.</div>}

              {vmode==="cards"?(
                <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3">
                  {filtered.map(r=>(
                    <button key={r.id} onClick={()=>{setSelId(r.id);setView("detail");}} className={"rounded-2xl p-4 text-right transition "+cCard+" "+cHover}>
                      <div className="flex items-start justify-between gap-2">
                        <div className="flex items-center gap-3 min-w-0">
                          <div className="w-11 h-11 rounded-xl text-white font-extrabold flex items-center justify-center shrink-0" style={{background:avatarBg(r)}}>{initial(r)}</div>
                          <div className="font-bold text-sm truncate">{r[cfg.fields[0].key]}</div>
                        </div>
                        <Badge status={cfg.statusField?r[cfg.statusField]:null}/>
                      </div>
                      <div className={"text-xs mt-3 border-t pt-2 truncate "+cMuted+" "+cBorder}>{cfg.subtitle(r)}</div>

                  ))}

                <div className={"rounded-2xl overflow-hidden "+cCard}>
                  {filtered.map(r=>(
                    <button key={r.id} onClick={()=>{setSelId(r.id);setView("detail");}} className={"w-full flex items-center justify-between gap-3 px-4 py-3 text-right border-b last:border-b-0 transition "+cBorder+" "+cHover}>
                      <div className="flex items-center gap-3 min-w-0">
                        <div className="w-9 h-9 rounded-lg text-white font-bold text-sm flex items-center justify-center shrink-0" style={{background:avatarBg(r)}}>{initial(r)}</div>
                        <div className="min-w-0"><div className="font-bold text-sm truncate">{r[cfg.fields[0].key]}</div><div className={"text-xs truncate "+cMuted}>{cfg.subtitle(r)}</div></div>
                      </div>
                      <div className="flex items-center gap-2 shrink-0"><Badge status={cfg.statusField?r[cfg.statusField]:null}/><Icon n="chevron" s={16} c={cMuted}/></div>
                    </button>
                  ))}
                </div>
              )}
            </>
          )}

          {editor&&(
            <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-3" onClick={()=>setEditor(null)}>
              <div dir="rtl" onClick={e=>e.stopPropagation()} className={"rounded-2xl p-5 w-full max-w-lg max-h-[90vh] overflow-y-auto "+cCard}>
                <div className="flex items-center justify-between mb-4"><div className="font-bold">{editor.mode==="add"?"إضافة سجل جديد":"تعديل السجل"}</div><button onClick={()=>setEditor(null)} className={cMuted}><Icon n="close" s={18}/></button></div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {cfg.fields.map(f=>f.type==="select"?<Sel key={f.key} label={f.label} v={editor.data[f.key]} on={v=>setField(f.key,v)} opts={f.opts}/>:<Inp key={f.key} label={f.label} type={inputType(f)} v={editor.data[f.key]} on={v=>setField(f.key,v)}/>)}
                </div>
                <button onClick={save} disabled={saving} className={"w-full rounded-xl py-2.5 text-sm font-bold mt-4 disabled:opacity-50 "+cBtn}>{saving?"جاري الحفظ...":"حفظ"}</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ===== اللوحة الرئيسية ===== */

      useEffect(()=>{(async()=>{
        const [p,pr,c,v,t]=await Promise.all([db.from("painters").select("*"),db.from("projects").select("*"),db.from("contractors").select("*"),db.from("visits").select("*"),db.from("trainings").select("*")]);
        setD({painters:p.data||[],projects:pr.data||[],contractors:c.data||[],visits:v.data||[],trainings:t.data||[]});

      const byCity=group(painters,"city").sort((a,b)=>b.value-a.value);

      const byProjType=group(projects,"type");

      return (
        <div className="space-y-4">
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">

            <Kpi label="المشاريع" value={projects.length} color="#D97706"/>

            <Kpi label="المقاولون" value={contractors.length} color="#7C3AED"/>
            <Kpi label="الزيارات" value={visits.length} color="#2563EB"/>
            <Kpi label="التدريبات" value={trainings.length} color="#0EA5E9"/>
            <Kpi label="قيمة المشاريع" value={projects.reduce((a,p)=>a+(Number(p.value)||0),0).toLocaleString()} color="#16A34A"/>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div className={"rounded-2xl p-4 "+cCard}><div className="text-sm font-bold mb-3">الدهانون حسب المدينة</div>{byCity.length?<Bars data={byCity}/>:<div className={"text-xs "+cMuted}>لا بيانات</div>}</div>
            <div className={"rounded-2xl p-4 "+cCard}><div className="text-sm font-bold mb-3">الدهانون حسب الجنسية</div>{byNat.length?<Bars data={byNat}/>:<div className={"text-xs "+cMuted}>لا بيانات</div>}</div>
            <div className={"rounded-2xl p-4 "+cCard}><div className="text-sm font-bold mb-3">المشاريع حسب الحالة</div>{byProjStatus.length?<Bars data={byProjStatus}/>:<div className={"text-xs "+cMuted}>لا بيانات</div>}</div>
            <div className={"rounded-2xl p-4 "+cCard}><div className="text-sm font-bold mb-3">المشاريع حسب النوع</div>{byProjType.length?<Bars data={byProjType}/>:<div className={"text-xs "+cMuted}>لا بيانات</div>}</div>
          </div>
          <div className={"rounded-2xl p-4 "+cCard}>
            <div className="text-sm font-bold mb-3">أحدث الزيارات</div>
            <div className="space-y-2">{recentVisits.map(v=>(<div key={v.id} className={"flex items-center justify-between text-sm border-b pb-2 "+cBorder}><div className="min-w-0"><div className="font-semibold truncate">{v.target}</div><div className={"text-xs truncate "+cMuted}>{v.location} · {v.date}</div></div><Badge status={v.type}/></div>))}{recentVisits.length===0&&<div className={"text-xs "+cMuted}>لا توجد زيارات مسجّلة</div>}</div>

    /* ===== الرؤى الذكية ===== */
    function InsightsPage() {
      const [d,setD]=useState(null);
      useEffect(()=>{(async()=>{
        const [p,pr]=await Promise.all([db.from("painters").select("*"),db.from("projects").select("*")]);
        setD({painters:p.data||[],projects:pr.data||[]});
      })()},[]);
      if(!d) return <div className={"text-center py-10 text-sm "+cMuted}>جاري تحليل البيانات...</div>;
      const today=new Date().toISOString().slice(0,10);
      const daysAgo=s=>s?Math.round((Date.now()-new Date(s).getTime())/86400000):9999;
      const withF=d.painters.filter(p=>p.next_followup);
      const overdue=withF.filter(p=>p.next_followup<today).sort((a,b)=>a.next_followup.localeCompare(b.next_followup));
      const upcoming=withF.filter(p=>p.next_followup>=today).sort((a,b)=>a.next_followup.localeCompare(b.next_followup)).slice(0,15);
      const atRisk=d.projects.filter(p=>p.status==="قيد المتابعة"&&(Number(p.win_prob)||0)<50);
      const competitorP=d.painters.filter(p=>p.status==="منافس");
      const notContacted=d.painters.filter(p=>p.status!=="متوقف"&&daysAgo(p.last_visit)>45);
      const active=d.painters.filter(p=>p.status==="نشط").length;
      const prio=p=>p.priority==="عالية"?0:p.priority==="متوسطة"?1:2;
      const priorities=[
        ...overdue.map(p=>({k:"متابعة متأخرة",n:p.name,extra:`${p.city||""} · موعدها ${p.next_followup}`,c:"#DC2626",rank:prio(p)})),
        ...atRisk.slice().sort((a,b)=>(Number(b.value)||0)-(Number(a.value)||0)).map(p=>({k:"مشروع معرّض للخسارة",n:p.name,extra:`${Number(p.value||0).toLocaleString()} ر.س · ${p.win_prob||0}%`,c:"#D97706",rank:1})),
      ].sort((a,b)=>a.rank-b.rank).slice(0,6);
      const insights=[
        {c:"#DC2626",t:"متابعات متأخرة",x:overdue.length?`${overdue.length} دهان فات موعد متابعتهم. ابدأ بأصحاب الأولوية العالية.`:"لا توجد متابعات متأخرة، أحسنت."},
        {c:"#D97706",t:"دهانون بحاجة لتواصل",x:notContacted.length?`${notContacted.length} دهان لم تتم زيارتهم منذ أكثر من 45 يوماً، أبرزهم: ${notContacted.slice(0,3).map(p=>p.name).join("، ")}.`:"كل الدهانين تمت متابعتهم مؤخراً."},
        {c:"#4F46E5",t:"مشاريع معرّضة للخسارة",x:atRisk.length?`${atRisk.length} مشاريع باحتمالية فوز أقل من 50%، أبرزها: ${atRisk.map(p=>p.name).slice(0,2).join("، ")}.`:"لا توجد مشاريع عالية الخطورة."},
        {c:"#16A34A",t:"صحة قاعدة الدهانين",x:`${active} دهان نشط من أصل ${d.painters.length}، و${competitorP.length} مصنّفون كمنافس (فرص تحويل).`},
      ];
      const card="rounded-2xl p-4 "+cCard;
      const pBadge=v=>(<span className="text-xs font-bold px-2 py-0.5 rounded-full whitespace-nowrap" style={{color:PRIORITY_COLORS[v]||"#64748B",background:(PRIORITY_COLORS[v]||"#64748B")+"1f"}}>{v||"بدون"}</span>);
      return (
        <div className="space-y-4">
          <div className={"rounded-2xl p-4 border-r-4 "+cCard} style={{borderRightColor:"#4F46E5"}}><h2 className="font-extrabold">الرؤى والمهام</h2><p className={"text-xs mt-0.5 "+cMuted}>أولويات العمل والمتابعات مستخرجة آلياً من بياناتك</p></div>
          <div className={card}>
            <div className="text-sm font-bold mb-3">أولويات اليوم</div>
            {priorities.length?<div className="space-y-2">{priorities.map((p,i)=>(<div key={i} className={"flex items-center gap-3 border-b pb-2 "+cBorder}><span className="w-6 h-6 rounded-full text-white text-xs font-bold flex items-center justify-center shrink-0" style={{background:p.c}}>{i+1}</span><div className="min-w-0"><div className="text-sm font-semibold truncate">{p.n}</div><div className={"text-xs truncate "+cMuted}>{p.k} · {p.extra}</div></div></div>))}</div>:<div className={"text-xs "+cMuted}>لا توجد أولويات عاجلة اليوم.</div>}
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div className={card}>
              <div className="text-sm font-bold mb-3" style={{color:"#DC2626"}}>المتابعات المتأخرة ({overdue.length})</div>
              {overdue.length?<div className="space-y-2">{overdue.map(p=>(<div key={p.id} className={"flex items-center justify-between gap-2 border-b pb-2 "+cBorder}><div className="min-w-0"><div className="text-sm font-semibold truncate">{p.name}</div><div className={"text-xs truncate "+cMuted}>{p.city||"—"} · {p.next_followup}</div></div>{pBadge(p.priority)}</div>))}</div>:<div className={"text-xs "+cMuted}>لا يوجد متأخر.</div>}
            </div>
            <div className={card}>
              <div className="text-sm font-bold mb-3" style={{color:"#16A34A"}}>المهام القادمة ({upcoming.length})</div>
              {upcoming.length?<div className="space-y-2">{upcoming.map(p=>(<div key={p.id} className={"flex items-center justify-between gap-2 border-b pb-2 "+cBorder}><div className="min-w-0"><div className="text-sm font-semibold truncate">{p.name}</div><div className={"text-xs truncate "+cMuted}>{p.city||"—"} · {p.next_followup}</div></div>{pBadge(p.priority)}</div>))}</div>:<div className={"text-xs "+cMuted}>لا توجد مهام مجدولة. أضف "المتابعة القادمة" لأي دهان من صفحته.</div>}
            </div>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">{insights.map((ins,i)=>(<div key={i} className={card}><h4 className="font-bold text-sm mb-1.5" style={{color:ins.c}}>{ins.t}</h4><p className="text-xs leading-relaxed">{ins.x}</p></div>))}</div>
        </div>
      );
    }

        <div className="space-y-4">
          <div className={"rounded-2xl p-5 "+cCard}>
            <div className="flex items-center gap-3 pb-3 mb-4 border-b border-gray-200 dark:border-slate-800"><div className="w-11 h-11 rounded-xl flex items-center justify-center text-white font-extrabold" style={{background:"linear-gradient(135deg,#4f46e5,#4338ca)"}}>ج</div><div><h2 className="font-extrabold">تقرير ملخّص النظام</h2><p className={"text-xs "+cMuted}>{new Date().toLocaleDateString("ar")}</p></div></div>
            {!counts?<div className={"text-sm "+cMuted}>جاري التحضير...</div>:(
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">{Object.keys(CONFIG).map(id=>(<div key={id} className={"rounded-xl p-3 "+cTrack}><div className={"text-xs "+cMuted}>{CONFIG[id].title}</div><div className={"text-xl font-extrabold "+cAccent}>{counts[id]??"—"}</div></div>))}</div>
            )}
          </div>
          <div className={"rounded-2xl p-4 "+cCard}>
            <h3 className="font-bold text-sm mb-3">تصدير البيانات (Excel)</h3>
            <div className="flex flex-wrap gap-2">{Object.keys(CONFIG).map(id=>(<button key={id} onClick={()=>dl(id)} className={"px-3 py-2 rounded-lg text-xs font-bold "+cAccent+" "+cTrack+" "+cHover}>{CONFIG[id].title}</button>))}</div>
          </div>
        </div>
      );
    }

    /* ===== إحصائية المنافسين في منطقة جازان (الربع الأول 2026) ===== */
    const MARKET_BRANDS = [
      {name:"دهانات الجزيرة", total:16, own:true},
      {name:"جوتن", total:15},
      {name:"اوسكار", total:13},
      {name:"همبل", total:8},
      {name:"الشبح", total:8},
      {name:"اسكادا", total:6},
      {name:"تكنو", total:5},
      {name:"تايم", total:4},
      {name:"روز", total:3},
      {name:"العالمية", total:3},
      {name:"دايروب", total:2},
      {name:"المملكة", total:2},
      {name:"اليكوم", total:2},
      {name:"سايت", total:2},
      {name:"سيجما", total:2},
      {name:"سايبس", total:2},
      {name:"ارت", total:2},
      {name:"بينتكو", total:2},
      {name:"مركز الجزيرة", total:2, own:true},
      {name:"ناشونال", total:1},
      {name:"شيروين ويليامز", total:1},
      {name:"دهانات تجارية أخرى", total:24, other:true},
    ];
    const MARKET_JAZEERA_CITY = [
      {city:"جيزان", n:4},{city:"صبيا", n:2},{city:"أبو عريش", n:2},{city:"صامطة", n:2},
      {city:"بيش", n:1},{city:"ضمد", n:1},{city:"العارضة", n:1},{city:"العيدابي", n:1},
      {city:"الداير", n:1},{city:"أحد المسارحة", n:1},
    ];

    function CompetitorStats() {
      const comp = MARKET_BRANDS.filter(b=>!b.own && !b.other);
      const compActive = comp.filter(b=>b.total>0);
      const top = comp[0];
      const totalComp = comp.reduce((a,b)=>a+b.total,0);
      const chart = MARKET_BRANDS.filter(b=>b.total>0 && !b.other).map(b=>({label:b.name, value:b.total, color:b.own?"#4F46E5":"#DC2626"}));
      return (
        <div className="space-y-4 mb-4">
          <div className={"rounded-2xl p-4 border-r-4 "+cCard} style={{borderRightColor:"#4F46E5"}}>
            <h2 className="font-extrabold">إحصائية المنافسين — منطقة جازان</h2>
            <p className={"text-xs mt-0.5 "+cMuted}>توزيع فروع العلامات في مدن المنطقة · بيانات الربع الأول 2026</p>
          </div>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <Kpi label="معارض الجزيرة" value={16} color="#4F46E5"/>
            <Kpi label="أقوى منافس" value={top.name+" — "+top.total} color="#DC2626"/>
            <Kpi label="العلامات المنافسة" value={compActive.length} color="#D97706"/>
            <Kpi label="إجمالي فروع المنافسين" value={totalComp} color="#0891B2"/>
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div className={"rounded-2xl p-4 "+cCard}><div className="text-sm font-bold mb-3">فروع العلامات في المنطقة (الجزيرة باللون النيلي)</div><Bars data={chart}/></div>
            <div className={"rounded-2xl p-4 "+cCard}><div className="text-sm font-bold mb-3">معارض الجزيرة حسب المدينة</div><Bars data={MARKET_JAZEERA_CITY.map(c=>({label:c.city,value:c.n,color:"#4F46E5"}))}/></div>
          </div>
          <div className={"rounded-2xl p-3 text-xs "+cCard+" "+cMuted}>ملاحظة: تشمل "دهانات تجارية أخرى" 24 فرعاً لعلامات متفرقة، ولم تُدرج في الرسم لتركيزه على العلامات الرئيسية.</div>
        </div>
      );
    }

    /* ===== التطبيق ===== */
    const NAV=[["dashboard","اللوحة الرئيسية"],["painters","الدهانون"],["projects","المشاريع"],["contractors","المقاولون"],["visits","الزيارات"],["trainings","التدريبات"],["competitors","المنافسون"],["products","المنتجات"],["insights","رؤى ذكية"],["reports","التقارير"]];
    const TITLES=Object.fromEntries(NAV);

    function App() {
      const [tab,setTab]=useState("dashboard"); const [dark,setDark]=useState(false);
      const [sideOpen,setSideOpen]=useState(false); const [notifOpen,setNotifOpen]=useState(false);
      const [gq,setGq]=useState(""); const [results,setResults]=useState([]); const [notifs,setNotifs]=useState([]);

      useEffect(()=>{ document.documentElement.classList.toggle("dark",dark); },[dark]);
      useEffect(()=>{(async()=>{
        const [pr,t]=await Promise.all([db.from("projects").select("*"),db.from("trainings").select("*")]);
        const list=[];
        (pr.data||[]).filter(p=>p.status==="قيد المتابعة"&&(Number(p.win_prob)||0)<50).forEach(p=>list.push({level:"high",title:"مشروع معرّض للخسارة",text:`${p.name} — احتمالية ${p.win_prob||0}%`}));
        const today=new Date().toISOString().slice(0,10);
        (t.data||[]).filter(x=>x.date&&x.date>=today).forEach(x=>list.push({level:"mid",title:"تدريب قادم",text:`${x.name} — ${x.date}`}));
        setNotifs(list);
      })()},[]);
      useEffect(()=>{ if(gq.trim().length<2){setResults([]);return;} const tm=setTimeout(async()=>{
        const [p,pr,c]=await Promise.all([db.from("painters").select("id,name").ilike("name","%"+gq+"%").limit(5),db.from("projects").select("id,name").ilike("name","%"+gq+"%").limit(5),db.from("contractors").select("id,name").ilike("name","%"+gq+"%").limit(5)]);
        const r=[]; (p.data||[]).forEach(x=>r.push({t:"دهان",n:x.name,go:"painters"})); (pr.data||[]).forEach(x=>r.push({t:"مشروع",n:x.name,go:"projects"})); (c.data||[]).forEach(x=>r.push({t:"مقاول",n:x.name,go:"contractors"})); setResults(r);
      },300); return ()=>clearTimeout(tm); },[gq]);

      const go=id=>{ setTab(id); setSideOpen(false); setNotifOpen(false); setGq(""); setResults([]); window.scrollTo(0,0); };
      const highCount=notifs.filter(n=>n.level==="high").length;

      return (
        <div className="min-h-screen bg-gray-50 dark:bg-slate-950 text-gray-800 dark:text-slate-100">
          <aside className={"fixed top-0 right-0 h-full w-64 z-40 flex flex-col transition-transform lg:translate-x-0 bg-white dark:bg-slate-900 border-l border-gray-200 dark:border-slate-800 "+(sideOpen?"translate-x-0":"translate-x-full")}>
            <div className="p-5 flex items-center gap-3" style={{background:"linear-gradient(135deg,#4f46e5,#4338ca)"}}>
              <div className="w-11 h-11 rounded-xl bg-white/15 border border-white/25 flex items-center justify-center text-white font-extrabold text-xl">ج</div>
              <div><div className="text-white font-extrabold text-sm">نظام الجزيرة الميداني</div><div className="text-indigo-200 text-xs mt-0.5">Jazeera Field System</div></div>
            </div>
            <nav className="flex-1 overflow-y-auto p-3 space-y-1">
              {NAV.map(([k,label])=>(<button key={k} onClick={()=>go(k)} className={"w-full flex items-center px-3 py-2.5 rounded-xl text-sm font-semibold transition text-right "+(tab===k?"bg-indigo-600 text-white shadow-sm":cMuted+" "+cHover)}>{label}</button>))}
            </nav>
            <div className={"p-4 border-t text-xs "+cBorder+" "+cMuted}>المستخدم: أبو فيصل</div>
          </aside>
          {sideOpen&&<div className="fixed inset-0 bg-black/40 z-30 lg:hidden" onClick={()=>setSideOpen(false)}/>}

          <div className="lg:mr-64">
            <header className="sticky top-0 z-20 px-4 py-3 flex items-center gap-3 text-white" style={{background:"linear-gradient(135deg,#1e293b,#0f172a)"}}>
              <button onClick={()=>setSideOpen(true)} className="lg:hidden p-2 rounded-xl hover:bg-white/10"><Icon n="menu"/></button>
              <h1 className="font-extrabold text-sm whitespace-nowrap hidden sm:block">{TITLES[tab]}</h1>
              <div className="relative flex-1 max-w-md">
                <div className="flex items-center gap-2 rounded-xl px-3 py-2 bg-white/10 text-white"><Icon n="search" s={16} c="text-white/70"/><input value={gq} onChange={e=>setGq(e.target.value)} placeholder="بحث شامل..." className="bg-transparent outline-none text-xs w-full placeholder-white/50"/>{gq&&<button onClick={()=>setGq("")} className="text-white/70"><Icon n="close" s={14}/></button>}</div>
                {results.length>0&&(<div className={"absolute top-full mt-1 w-full rounded-xl shadow-xl overflow-hidden z-30 text-gray-800 dark:text-slate-100 "+cCard}>{results.map((r,i)=>(<button key={i} onClick={()=>go(r.go)} className={"w-full flex items-center justify-between px-3 py-2.5 text-xs text-right "+cHover}><span className="font-bold">{r.n}</span><Badge status={r.t}/></button>))}</div>)}
              </div>
              <div className="mr-auto flex items-center gap-1">
                <div className="relative">
                  <button onClick={()=>setNotifOpen(!notifOpen)} className="p-2 rounded-xl hover:bg-white/10 relative"><Icon n="bell"/>{highCount>0&&<span className="absolute top-0.5 left-0.5 w-4 h-4 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center">{highCount}</span>}</button>
                  {notifOpen&&(<div className={"absolute top-full left-0 mt-1 w-72 rounded-2xl shadow-xl overflow-hidden z-30 text-gray-800 dark:text-slate-100 "+cCard}><div className={"p-3 font-bold text-xs border-b "+cBorder}>الإشعارات الذكية</div><div className="max-h-72 overflow-y-auto">{notifs.length===0?<div className={"p-3 text-xs "+cMuted}>لا توجد تنبيهات</div>:notifs.map((n,i)=>(<div key={i} className={"p-3 border-b flex gap-2 "+cBorder}><span className="w-2 h-2 rounded-full mt-1.5 shrink-0" style={{background:n.level==="high"?"#DC2626":"#D97706"}}/><div><div className="text-xs font-bold">{n.title}</div><div className={"text-xs "+cMuted}>{n.text}</div></div></div>))}</div></div>)}
                </div>
                <button onClick={()=>setDark(!dark)} className="p-2 rounded-xl hover:bg-white/10"><Icon n={dark?"sun":"moon"}/></button>
              </div>
            </header>
            <main className="p-4 max-w-5xl mx-auto">
              {tab==="dashboard"&&<Dashboard key="dash"/>}
              {tab==="products"&&<ProductsPage/>}
              {tab==="insights"&&<InsightsPage key="ins"/>}
              {tab==="reports"&&<ReportsPage key="rep"/>}
              {CONFIG[tab]&&<Section key={tab} cfg={CONFIG[tab]}/>}
              <div className={"text-center text-xs py-4 "+cMuted}>نظام الجزيرة الميداني — مربوط بقاعدة بيانات Supabase</div>
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
